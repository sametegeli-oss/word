let db, state={completed:{},attempts:{},settings:{nativeMode:false},stats:{xp:0,streak:0,lastDay:null}};
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e.target.error);});}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function get(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})}
function put(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error);})}
async function seed(){const seeded=await get('settings','seeded');if(seeded)return;for(const n of NODES)await put('nodes',n);for(const w of WORDS)await put('words',w);for(const t of TASKS)await put('tasks',t);await put('settings',{id:'seeded',value:true,createdAt:Date.now()});await put('progress',{id:'state',...state});}
async function loadState(){const saved=await get('progress','state');if(saved){state.completed=saved.completed||{};state.attempts=saved.attempts||{};state.settings=saved.settings||{nativeMode:false};state.stats=saved.stats||{xp:0,streak:0,lastDay:null};}else await saveState();}
async function saveState(){await put('progress',{id:'state',...state,updatedAt:Date.now()});}
function isDone(id){return !!state.completed[id]}
function isUnlocked(node){return !node.requires || node.requires.every(id=>isDone(id))}
function activeNode(){return NODES.find(n=>isUnlocked(n)&&!isDone(n))||NODES[NODES.length-1]}
function completionPct(){return Math.round(Object.keys(state.completed).length/NODES.length*100)}
function unlockedCount(){return NODES.filter(isUnlocked).length}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function updateHeader(){const pct=completionPct(), act=activeNode();document.getElementById('overallBar').style.width=pct+'%';document.getElementById('levelPill').textContent=(act?.level||'A0')+' • '+pct+'%';document.getElementById('xpPill').textContent=(state.stats.xp||0)+' XP';document.getElementById('streakPill').textContent='🔥 '+(state.stats.streak||0)+' gün'}
async function completeNode(id){if(state.completed[id]){toast('Bu yapı zaten tamamlandı.');return;}const node=NODES.find(n=>n.id===id);if(!node)return;if(!isUnlocked(node)){toast('Önce önkoşulları tamamlamalısın.');return;}state.completed[id]={doneAt:Date.now(),mastery:100};state.stats.xp=(state.stats.xp||0)+20;const today=new Date().toISOString().slice(0,10);if(state.stats.lastDay!==today){state.stats.streak=(state.stats.streak||0)+1;state.stats.lastDay=today;}await saveState();renderAll();toast('✅ Tamamlandı: '+node.title+' (+20 XP)');}
function nodeStatus(n){if(isDone(n.id))return 'done'; if(isUnlocked(n))return 'activeNode'; return 'locked'}
function statusIcon(n){if(isDone(n.id))return '✅'; if(isUnlocked(n))return '🔵'; return '🔒'}
function openNode(id){const n=NODES.find(x=>x.id===id);if(!n)return;const req=(n.requires||[]).map(r=>NODES.find(x=>x.id===r)?.title||r);const unlocks=(n.unlocks||[]).map(r=>NODES.find(x=>x.id===r)?.title||r);const words=WORDS.filter(w=>(w.related_nodes||[]).includes(n.id));document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">Kapat</button><h2>${n.title}</h2><p class="muted">${n.level} • ${n.type}</p><div class="pathLine"></div><p><b>Anlam:</b> ${n.meaning_tr||''}</p><div class="scene"><div class="scene-visual">${n.visualHint||'Görsel ipucu yok'}</div><div class="audio-line">🔊 ${n.ambienceDescription||'Ortam sesi tanımlanmadı'}${n.soundTriggers?'<br>Ses tetikleyicileri: '+n.soundTriggers.join(', '):''}</div><div class="small muted" style="margin-top:6px">Duygu: ${n.emotion||'nötr'}</div></div><h3 style="margin-top:14px">Örnekler</h3>${(n.examples||[]).map(e=>`<div class="list-item"><b>${e.en}</b><br><span class="muted">${e.tr}</span></div>`).join('')}<h3>Önkoşullar</h3><p>${req.length?req.join(' → '):'Yok'}</p><h3>Açtığı yapılar</h3><p>${unlocks.length?unlocks.join(', '):'Şimdilik yok'}</p><h3>Bağlı kelimeler</h3>${words.length?words.map(w=>`<span class="pill">${w.word}</span>`).join(' '):'<p class="muted">Kelime bağlantısı yok.</p>'}<div class="row" style="margin-top:16px"><button class="btn green" onclick="completeNode('${n.id}')">Tamamlandı İşaretle</button><button class="btn secondary" onclick="startForced('${n.id}')">Forced Output</button></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function startForced(id){const n=NODES.find(x=>x.id===id);const ex=n?.examples?.[0];document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">Kapat</button><h2>⚡ Forced Output</h2><p class="muted">Türkçeyi gör, İngilizceyi yaz. Kopyalamadan üret.</p><div class="card" style="margin-top:12px"><div class="small muted">Türkçe</div><h3>${ex?.tr||n.meaning_tr}</h3></div><input class="input" id="forcedInput" placeholder="İngilizce yaz..."><div class="row" style="margin-top:10px"><button class="btn" onclick="checkForced('${id}')">Kontrol Et</button><button class="btn secondary" onclick="openNode('${id}')">Derse Dön</button></div><div id="forcedResult" style="margin-top:12px"></div>`}
function norm(s){return (s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
function checkForced(id){const n=NODES.find(x=>x.id===id);const correct=norm(n?.examples?.[0]?.en||n.title.replace(/\.\.\./,''));const ans=norm(document.getElementById('forcedInput').value);const ok=ans && (ans===correct || correct.includes(ans) || ans.includes(correct));document.getElementById('forcedResult').innerHTML=ok?`<div class="task done"><div class="check">✓</div><div><b>Doğru üretim.</b><br><span class="muted">${n.examples[0].en}</span></div></div>`:`<div class="task"><div class="check">!</div><div><b>Yaklaştın, tekrar üret.</b><br><span class="muted">Beklenen: ${n.examples[0].en}</span></div></div>`;if(ok)completeNode(id)}
function renderHome(){const act=activeNode();const tasks=[act, ...NODES.filter(n=>isUnlocked(n)&&!isDone(n)&&n.id!==act.id).slice(0,3)];document.getElementById('screen-home').innerHTML=`<div class="card"><h2>🎯 Bugünkü Ana Hedef</h2><div class="quote">Bugün <span class="kbd">${act.title}</span> yapısını otomatikleştiriyoruz.</div><div class="scene"><div class="scene-visual">${act.visualHint||'Sahne yok'}</div><div class="audio-line">🔊 ${act.ambienceDescription||'Ortam sesi altyapısı hazır'}</div></div><div class="row" style="margin-top:12px"><button class="btn green" onclick="openNode('${act.id}')">Derse Başla</button><button class="btn secondary" onclick="showScreen('map')">Haritayı Gör</button></div></div><div class="grid"><div class="metric"><div class="num">${Object.keys(state.completed).length}</div><div class="label">Tamamlanan yapı</div></div><div class="metric"><div class="num">${unlockedCount()}</div><div class="label">Açık konu</div></div></div><div class="card"><h2>📋 Günlük Yol</h2>${tasks.map((n,i)=>`<div class="task ${isDone(n.id)?'done':''}" onclick="openNode('${n.id}')"><div class="check">${isDone(n.id)?'✓':i+1}</div><div class="grow"><div class="task-title">${n.title}</div><div class="task-desc">${n.level} • ${n.meaning_tr}</div></div><span class="tag ${isUnlocked(n)?'ok':'lock'}">${statusIcon(n)}</span></div>`).join('')}</div><div class="card"><h2>🧠 Sistem Mantığı</h2><p class="sub">Bu program kelimeyi tek başına ezberletmez. Kelime + yapı + sahne + duygu + ortam sesi bağlantısıyla beyinde gerçek kullanım ağı kurar.</p></div>`}
function renderMap(){const by={};LEVELS.forEach(l=>by[l]=NODES.filter(n=>n.level===l));document.getElementById('screen-map').innerHTML=`<div class="card"><h2>🧭 Dil Haritası</h2><p class="muted">Yeşil tamamlandı, mavi çalışılabilir, kilitli node için önkoşul gerekir.</p></div>${LEVELS.map(l=>by[l].length?`<div class="level-title">${l}</div>${by[l].map(n=>`<div class="node ${nodeStatus(n)}" onclick="openNode('${n.id}')"><div class="status">${statusIcon(n)}</div><div class="grow"><b>${n.title}</b><div class="small muted">${n.meaning_tr}</div><div class="small sub">Önkoşul: ${n.requires.length?n.requires.map(r=>NODES.find(x=>x.id===r)?.title||r).join(', '):'yok'}</div></div><span class="tag">${n.type}</span></div>`).join('')}`:'').join('')}`}
function renderStructures(filter='all'){let nodes=NODES.filter(n=>['chunk','grammar','question','negative','connector','foundation'].includes(n.type));if(filter!=='all')nodes=nodes.filter(n=>n.level===filter||n.type===filter);document.getElementById('screen-structures').innerHTML=`<div class="section-head"><h2>🧱 Yapılar</h2></div><div class="filter"><button class="chip ${filter==='all'?'active':''}" onclick="renderStructures('all')">Tümü</button>${LEVELS.map(l=>`<button class="chip ${filter===l?'active':''}" onclick="renderStructures('${l}')">${l}</button>`).join('')}<button class="chip ${filter==='chunk'?'active':''}" onclick="renderStructures('chunk')">Chunk</button><button class="chip ${filter==='question'?'active':''}" onclick="renderStructures('question')">Soru</button></div>${nodes.map(n=>`<div class="list-item" onclick="openNode('${n.id}')"><div class="word"><div><b>${n.title}</b><div class="muted small">${n.meaning_tr}</div></div><span class="tag ${isDone(n.id)?'ok':isUnlocked(n)?'':'lock'}">${statusIcon(n)} ${n.level}</span></div><div class="examples">${(n.examples||[]).slice(0,1).map(e=>`<b>${e.en}</b><br><span class="muted">${e.tr}</span>`).join('')}</div></div>`).join('')}`}
function renderWords(filter='all'){let ws=WORDS;if(filter!=='all')ws=ws.filter(w=>w.level===filter||w.type===filter);document.getElementById('screen-words').innerHTML=`<div class="section-head"><h2>📚 Kelime Yolu</h2></div><div class="filter"><button class="chip ${filter==='all'?'active':''}" onclick="renderWords('all')">Tümü</button>${LEVELS.map(l=>`<button class="chip ${filter===l?'active':''}" onclick="renderWords('${l}')">${l}</button>`).join('')}<button class="chip ${filter==='verb'?'active':''}" onclick="renderWords('verb')">Fiil</button><button class="chip ${filter==='noun'?'active':''}" onclick="renderWords('noun')">İsim</button></div>${ws.map(w=>`<div class="list-item"><div class="word"><div><b>${w.word}</b> <span class="muted">${w.tr}</span><div class="small muted">${w.type} • priority ${w.priority}</div></div><span class="tag">${w.level}</span></div><div class="examples"><b>${w.example}</b><br><span class="muted">Görsel: ${w.visualHint||'yok'}</span><br><span class="muted">Bağlı yapı: ${(w.related_nodes||[]).map(id=>NODES.find(n=>n.id===id)?.title||id).join(', ')}</span></div></div>`).join('')}`}
function taskUnlocked(t){return (t.required_structures||[]).every(id=>isDone(id)||isUnlocked(NODES.find(n=>n.id===id)||{}))}
function renderSpeak(){document.getElementById('screen-speak').innerHTML=`<div class="card"><h2>🗣️ Konuşma Görevleri</h2><p class="muted">Görevler, açılan yapılara göre çalışılabilir hale gelir. İlk sürümde mikrofon yerine yazılı forced output ve görev tamamlama var.</p></div>${TASKS.map(t=>`<div class="list-item"><div class="word"><div><b>${t.title}</b><div class="muted small">${t.prompt_tr}</div></div><span class="tag ${taskUnlocked(t)?'ok':'lock'}">${taskUnlocked(t)?'Açık':'Kilitli'}</span></div><div class="scene"><div class="scene-visual">${t.scene}</div><div class="audio-line">🔊 ${t.ambience}</div></div><div class="examples"><b>Örnek:</b> ${t.sample_answer}<br><span class="muted">Gerekli yapılar: ${t.required_structures.map(id=>NODES.find(n=>n.id===id)?.title||id).join(', ')}</span></div><div class="row" style="margin-top:10px"><button class="btn ${taskUnlocked(t)?'green':'secondary'}" onclick="completeTask('${t.id}')">Görevi Tamamla</button></div></div>`).join('')}`}
async function completeTask(id){const t=TASKS.find(x=>x.id===id);if(!taskUnlocked(t)){toast('Bu görev için önce gerekli yapıları açmalısın.');return;}if(state.completed[id]){toast('Görev zaten tamamlandı.');return;}state.completed[id]={doneAt:Date.now(),type:'task'};state.stats.xp=(state.stats.xp||0)+(t.xp||30);await saveState();renderAll();toast('🎉 Görev tamamlandı: '+t.title+' +'+t.xp+' XP')}
function renderProgress(){const done=Object.keys(state.completed).length;const byLevel=LEVELS.map(l=>({l,total:NODES.filter(n=>n.level===l).length,done:NODES.filter(n=>n.level===l&&isDone(n.id)).length}));const locked=NODES.filter(n=>!isUnlocked(n)&&!isDone(n)).slice(0,6);document.getElementById('screen-progress').innerHTML=`<div class="grid"><div class="metric"><div class="num">${completionPct()}%</div><div class="label">Genel ilerleme</div></div><div class="metric"><div class="num">${state.stats.xp||0}</div><div class="label">XP</div></div></div><div class="card"><h2>📊 Seviye İlerlemesi</h2>${byLevel.map(x=>`<div style="margin:10px 0"><div class="word"><b>${x.l}</b><span class="muted small">${x.done}/${x.total}</span></div><div class="progress"><div class="bar" style="width:${x.total?Math.round(x.done/x.total*100):0}%"></div></div></div>`).join('')}</div><div class="card"><h2>🔒 Sıradaki Kilitler</h2>${locked.length?locked.map(n=>`<div class="task"><div class="check">🔒</div><div><b>${n.title}</b><div class="task-desc">Gereken: ${n.requires.filter(r=>!isDone(r)).map(r=>NODES.find(n=>n.id===r)?.title||r).join(', ')}</div></div></div>`).join(''):'<div class="empty">Kilitli konu kalmadı.</div>'}</div><div class="card"><h2>💾 Veri</h2><div class="row"><button class="btn secondary" onclick="exportData()">JSON Dışa Aktar</button><button class="btn warn" onclick="resetData()">Sıfırla</button></div></div>`}
async function exportData(){const data={state,nodes:NODES,words:WORDS,tasks:TASKS,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dil_haritasi_yedek.json';a.click();URL.revokeObjectURL(a.href)}
async function resetData(){if(!confirm('Tüm ilerleme silinsin mi?'))return;state={completed:{},attempts:{},settings:{nativeMode:false},stats:{xp:0,streak:0,lastDay:null}};await saveState();renderAll();toast('Veri sıfırlandı.')}
function renderAll(){updateHeader();renderHome();renderMap();renderStructures();renderWords();renderSpeak();renderProgress()}
function showScreen(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+s).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.screen===s));window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showScreen(t.dataset.screen));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

  home:{img:'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1280&q=80',audio:'https://commons.wikimedia.org/wiki/Special:FilePath/Sound_of_light_rainfall.ogg',label:'ev ortamı, sakin arka plan',credit:'Image: Unsplash home • Audio: Wikimedia Commons'}
}
let currentAmbience=null;
function mediaKeyFromText(txt=''){
  const t=(txt||'').toLowerCase();
  // En belirgin gerçek mekanları önce yakala. Böylece 'water' gibi kelimeler
  // istasyon/kafe sahnesini yanlışlıkla su bardağına çevirmesin.
  if(t.includes('havaalan')||t.includes('airport')||t.includes('flight')||t.includes('uçak')||t.includes('check-in')||t.includes('terminal')) return 'airport';
  if(t.includes('istasyon')||t.includes('station')||t.includes('tren')||t.includes('valiz')||t.includes('luggage')||t.includes('passenger')||t.includes('yolcu')) return 'station';
  if(t.includes('hotel')||t.includes('otel')||t.includes('lobi')||t.includes('lobby')||t.includes('resepsiyon')||t.includes('reservation')||t.includes('oda')||t.includes('room')) return 'hotel';
  if(t.includes('kafe')||t.includes('kahve')||t.includes('coffee')||t.includes('cafe')||t.includes('tea')||t.includes('sipariş')||t.includes('order')) return 'cafe';
  if(t.includes('market')||t.includes('supermarket')||t.includes('mağaza')||t.includes('store')||t.includes('kasada')||t.includes('ödeme')||t.includes('money')) return 'supermarket';
  if(t.includes('ofis')||t.includes('office')||t.includes('toplantı')||t.includes('meeting')||t.includes('çalışan')||t.includes('work')) return 'office';
  if(t.includes('yağmur')||t.includes('rain')) return 'rain';
  if(t.includes('telefon')||t.includes('phone')) return 'phone';
  if(t.includes('ev')||t.includes('home')) return 'home';
  if(t.includes('su')||t.includes('water')) return 'water';
  return 'classroom';
}
function sceneMediaHTML(text='', description=''){
  const key=mediaKeyFromText(text+' '+description);
  const m=REAL_MEDIA[key]||REAL_MEDIA.classroom;
  const safe=(text||'Gerçek hayat sahnesi').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
  return `<div class="scene-visual with-photo"><img class="scene-photo" loading="lazy" referrerpolicy="no-referrer" src="${m.img}" alt="${safe}" onerror="this.closest('.scene-visual').classList.remove('with-photo');this.closest('.scene-visual').innerHTML='${safe}'"></div><div class="audio-line">🔊 ${m.label || description || 'Gerçek ortam sesi'}<div class="small muted" style="margin-top:3px">Sahne ipucu: ${safe}</div><div class="media-actions"><button class="btn secondary" type="button" onclick="playAmbience('${key}')">Sesi Çal / Durdur</button><span class="audio-state" id="audioState-${key}"></span></div><div class="media-credit">${m.credit}</div></div>`;
}
function playAmbience(key){
  const m=REAL_MEDIA[key]||REAL_MEDIA.classroom;
  document.querySelectorAll('.audio-state').forEach(x=>x.textContent='');
  if(currentAmbience && currentAmbience.key===key && !currentAmbience.audio.paused){currentAmbience.audio.pause();currentAmbience.audio.currentTime=0;return;}
  if(currentAmbience){currentAmbience.audio.pause();currentAmbience.audio.currentTime=0;}
  const audio=new Audio(m.audio); audio.loop=true; audio.volume=.55; currentAmbience={key,audio};
  audio.play().then(()=>{const el=document.getElementById('audioState-'+key); if(el)el.textContent='çalıyor';}).catch(()=>toast('Tarayıcı sesi engelledi. Butona tekrar dokun.'));
}
const oldOpenNode = openNode;

};

  document.getElementById('screen-speak').innerHTML=`<div class="card"><h2>🗣️ Konuşma Görevleri</h2><p class="muted">Görevler, açılan yapılara göre çalışılabilir hale gelir. İlk sürümde mikrofon yerine yazılı forced output ve görev tamamlama var.</p></div>${TASKS.map(t=>`<div class="list-item"><div class="word"><div><b>${t.title}</b><div class="muted small">${t.prompt_tr}</div></div><span class="tag ${taskUnlocked(t)?'ok':'lock'}">${taskUnlocked(t)?'Açık':'Kilitli'}</span></div><div class="scene">${sceneMediaHTML(t.scene,t.ambience)}</div><div class="examples"><b>Örnek:</b> ${t.sample_answer}<br><span class="muted">Gerekli yapılar: ${t.required_structures.map(id=>NODES.find(n=>n.id===id)?.title||id).join(', ')}</span></div><div class="row" style="margin-top:10px"><button class="btn ${taskUnlocked(t)?'green':'secondary'}" onclick="completeTask('${t.id}')">Görevi Tamamla</button></div></div>`).join('')}`;

  document.getElementById('modal').classList.add('show');
};

/* SENTENCE_LEVEL_MEDIA_PATCH_START: her cümle için ayrı görsel + ayrı ses */
function hashCode(str){let h=0; for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i); h|=0;} return Math.abs(h);}
function esc(s=''){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}
function sentenceQuery(en='', tr='', node={}){
  const t=(en+' '+tr+' '+(node.visualHint||'')+' '+(node.title||'')).toLowerCase();
  if(t.includes('reservation')||t.includes('rezervasyon')||t.includes('hotel')||t.includes('room')||t.includes('oda')) return 'hotel reception guest luggage';
  if(t.includes('flight')||t.includes('check-in')||t.includes('airport')||t.includes('uçak')) return 'airport check in passenger suitcase';
  if(t.includes('train')||t.includes('station')||t.includes('tren')||t.includes('istasyon')||t.includes('luggage')||t.includes('valiz')) return 'train station passenger luggage';
  if(t.includes('coffee')||t.includes('cafe')||t.includes('kafe')||t.includes('order')||t.includes('sipariş')||t.includes('wait')) return 'coffee shop customer waiter';
  if(t.includes('market')||t.includes('store')||t.includes('money')||t.includes('pay')||t.includes('supermarket')) return 'supermarket checkout customer';
  if(t.includes('phone')||t.includes('telefon')||t.includes('show')||t.includes('this is')) return 'person showing smartphone';
  if(t.includes('meeting')||t.includes('office')||t.includes('work')||t.includes('toplantı')) return 'office meeting professional';
  if(t.includes('rain')||t.includes('yağmur')) return 'rainy street person umbrella';
  if(t.includes('help')||t.includes('yardım')) return 'person asking for help real life';
  if(t.includes('happy')||t.includes('ready')||t.includes('tired')) return 'person expressing emotion portrait';
  return 'real life english conversation people';
}
function sentenceAudioKind(en='', tr='', node={}){
  const t=(en+' '+tr+' '+(node.visualHint||'')+' '+(node.ambienceDescription||'')).toLowerCase();
  if(t.includes('flight')||t.includes('airport')||t.includes('uçak')||t.includes('check-in')) return 'airport';
  if(t.includes('train')||t.includes('station')||t.includes('tren')||t.includes('istasyon')||t.includes('luggage')||t.includes('valiz')) return 'station';
  if(t.includes('hotel')||t.includes('reservation')||t.includes('room')||t.includes('otel')||t.includes('oda')) return 'hotel';
  if(t.includes('coffee')||t.includes('cafe')||t.includes('kafe')||t.includes('order')||t.includes('sipariş')||t.includes('wait')) return 'cafe';
  if(t.includes('market')||t.includes('store')||t.includes('supermarket')||t.includes('pay')||t.includes('money')) return 'supermarket';
  if(t.includes('office')||t.includes('meeting')||t.includes('work')||t.includes('toplantı')) return 'office';
  if(t.includes('rain')||t.includes('yağmur')) return 'rain';
  if(t.includes('phone')||t.includes('telefon')) return 'room';
  return mediaKeyFromText((node.visualHint||'')+' '+(node.ambienceDescription||''));
}
function getSentenceMedia(ex={}, node={}, idx=0){
  const en=ex.en||node.title||'English sentence'; const tr=ex.tr||node.meaning_tr||'';
  const query=sentenceQuery(en,tr,node);
  const sig=hashCode((node.id||'')+'-'+idx+'-'+en+'-'+tr)%100000;
  const audioKey=sentenceAudioKind(en,tr,node);
  const ambience=REAL_MEDIA[audioKey]||REAL_MEDIA.classroom;
  return {
    img:`https://loremflickr.com/1280/720/${encodeURIComponent(query.replace(/\s+/g,','))}/all?lock=${sig}`, fallbackImg:(REAL_MEDIA[audioKey]||REAL_MEDIA.classroom).img,
    audioKey,
    audio:ambience.audio,
    label:`${tr || node.meaning_tr || 'Bu cümle'} — özel cümle sahnesi / ${ambience.label}`,
    query,
    credit:'Image: LoremFlickr real photo stream • Ambience: Wikimedia Commons • Cümle sesi: tarayıcı TTS'
  };
}
function speakSentence(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.86; u.pitch=1; u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){toast('Tarayıcı cümle sesini başlatamadı.');}
}
function sentenceMediaHTML(ex={}, node={}, idx=0){
  const m=getSentenceMedia(ex,node,idx); const en=esc(ex.en||node.title||''); const tr=esc(ex.tr||node.meaning_tr||'');
  const audioId='sentAudio-'+hashCode((node.id||'')+'-'+idx+'-'+(ex.en||''));
  return `<div class="scene sentence-scene" style="margin-top:10px">
    <div class="scene-visual with-photo"><img class="scene-photo" loading="lazy" referrerpolicy="no-referrer" src="${m.img}" alt="${en}" onerror="this.onerror=null;this.src='${m.fallbackImg}'"></div>
    <div class="audio-line">🔊 ${esc(m.label)}<div class="small muted" style="margin-top:3px">Bu cümleye özel internetten gerçek fotoğraf + ayrı cümle sesi</div>
      <div class="media-actions">
        <button class="btn secondary" type="button" onclick="speakSentence('${en}')">Cümleyi Dinle</button>
        <button class="btn secondary" type="button" onclick="playAmbience('${m.audioKey}')">Ortam Sesi</button>
        <span class="audio-state" id="${audioId}"></span>
      </div>
      <div class="media-credit">${m.credit}</div>
    </div>
  </div>`;
}
function exampleBlockHTML(ex,node,idx){
  return `<div class="list-item"><b>${esc(ex.en)}</b><br><span class="muted">${esc(ex.tr)}</span>${sentenceMediaHTML(ex,node,idx)}</div>`;
}
openNode = function(id){
  const n=NODES.find(x=>x.id===id); if(!n)return;
  const req=(n.requires||[]).map(r=>NODES.find(x=>x.id===r)?.title||r);
  const unlocks=(n.unlocks||[]).map(r=>NODES.find(x=>x.id===r)?.title||r);
  const words=WORDS.filter(w=>(w.related_nodes||[]).includes(n.id));
  document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">Kapat</button><h2>${esc(n.title)}</h2><p class="muted">${n.level} • ${n.type}</p><div class="pathLine"></div><p><b>Anlam:</b> ${esc(n.meaning_tr||'')}</p><h3 style="margin-top:14px">Örnekler</h3>${(n.examples||[]).map((e,i)=>exampleBlockHTML(e,n,i)).join('')}<h3>Önkoşullar</h3><p>${req.length?req.map(esc).join(' → '):'Yok'}</p><h3>Açtığı yapılar</h3><p>${unlocks.length?unlocks.map(esc).join(', '):'Şimdilik yok'}</p><h3>Bağlı kelimeler</h3>${words.length?words.map(w=>`<span class="pill">${esc(w.word)}</span>`).join(' '):'<p class="muted">Kelime bağlantısı yok.</p>'}<div class="row" style="margin-top:16px"><button class="btn green" onclick="completeNode('${n.id}')">Tamamlandı İşaretle</button><button class="btn secondary" onclick="startForced('${n.id}',0)">Forced Output</button></div>`;
  document.getElementById('modal').classList.add('show');
};
startForced = function(id, exIndex=0){
  const n=NODES.find(x=>x.id===id); if(!n)return;
  const ex=(n.examples||[])[exIndex] || (n.examples||[])[0] || {};
  const choices=(n.examples||[]).map((e,i)=>`<button class="chip ${i===exIndex?'active':''}" onclick="startForced('${id}',${i})">${i+1}. cümle</button>`).join('');
  document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">Kapat</button><h2>⚡ Forced Output</h2><p class="muted">Her cümle kendi görseli ve kendi sesiyle gelir.</p>${choices?`<div class="filter" style="margin-top:10px">${choices}</div>`:''}${sentenceMediaHTML(ex,n,exIndex)}<div class="card" style="margin-top:12px"><div class="small muted">Türkçe</div><h3>${esc(ex?.tr||n.meaning_tr)}</h3></div><input class="input" id="forcedInput" placeholder="İngilizce yaz..."><div class="row" style="margin-top:10px"><button class="btn" onclick="checkForcedSentence('${id}',${exIndex})">Kontrol Et</button><button class="btn secondary" onclick="openNode('${id}')">Derse Dön</button></div><div id="forcedResult" style="margin-top:12px"></div>`;
  document.getElementById('modal').classList.add('show');
};
function checkForcedSentence(id, exIndex=0){
  const n=NODES.find(x=>x.id===id); const ex=(n.examples||[])[exIndex] || (n.examples||[])[0] || {};
  const correct=norm(ex.en||n.title.replace(/\.\.\./,''));
  const ans=norm(document.getElementById('forcedInput').value);
  const ok=ans && (ans===correct || correct.includes(ans) || ans.includes(correct));
  document.getElementById('forcedResult').innerHTML=ok?`<div class="task done"><div class="check">✓</div><div><b>Doğru üretim.</b><br><span class="muted">${esc(ex.en)}</span></div></div>`:`<div class="task"><div class="check">!</div><div><b>Yaklaştın, tekrar üret.</b><br><span class="muted">Beklenen: ${esc(ex.en)}</span></div></div>`;
  if(ok)completeNode(id);
}
