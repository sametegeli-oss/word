  }
  function active(){try{return typeof activeRow==='function'?activeRow():null}catch(e){return null}}
  function isTR(s){return /[çğıöşüÇĞİÖŞÜ]|\b(ben|sen|biz|bir|ve|için|değil|miyim|musun|türkçe|cevap|neden|boşluk|görev|kitabım|arabası|evimiz|telefonu)\b/i.test(clean(s))}
  function isEN(s){return /[A-Za-z]/.test(clean(s))&&!isTR(s)}
  function enOf(r){let en=clean(r?.SentenceEN||r?.EN||r?.English||''), tr=clean(r?.SentenceTR||r?.TR||r?.Turkish||''); if(isTR(en)&&isEN(tr))return tr; return en}
  function trOf(r){let en=clean(r?.SentenceEN||r?.EN||r?.English||''), tr=clean(r?.SentenceTR||r?.TR||r?.Turkish||''); if(isTR(en)&&isEN(tr))return en; return tr}
  function grammarOf(r){return clean(r?.GrammarStructure||r?.Pattern||r?.LearningStage||'')}
  async function savePromptValue(v){
    try{ if(typeof dbPut==='function') await dbPut('settings',{id:PROMPT_ID,value:String(v||''),updatedAt:Date.now()}); }catch(e){}
    try{ localStorage.setItem(PROMPT_ID,String(v||'')); }catch(e){}
  }
  async function loadPromptValue(){
    try{ if(typeof dbGet==='function'){ const x=await dbGet('settings',PROMPT_ID); if(x&&typeof x.value==='string'&&x.value.trim()) return x.value; } }catch(e){}
    try{ return localStorage.getItem(PROMPT_ID)||''; }catch(e){ return ''; }
  }
  function ensureQuickLessonButton(){
    if($('yolQuickLessonBtn')) return;
    const btn=document.createElement('button');
    btn.id='yolQuickLessonBtn';
    btn.className='btn secondary';
    btn.textContent='☰ Ders Seç';
    btn.onclick=function(){ if(window.yolToggleLessonPanel) yolToggleLessonPanel(); else document.body.classList.toggle('yol-lesson-panel-open'); };
    document.body.appendChild(btn);
  }
  async function preparePromptEditor(){
    const ed=document.querySelector('.ai-prompt-editor');
    if(!ed) return;
    if(!$('aiPromptToggleBar')){
      ed.insertAdjacentHTML('beforebegin','<div id="aiPromptToggleBar" class="ai-prompt-togglebar"><button class="btn warn" onclick="yolAskGroqForPractice()">🤖 AI Pekiştirme Üret</button><button class="btn secondary" onclick="yolTogglePromptEditor()">📝 Prompt Ayarlarını Aç</button><span id="aiPromptSaveNote" class="ai-prompt-saved-note"></span></div>');
    }
    ed.classList.add('yol-prompt-collapsed');
    const ta=$('aiPracticePrompt');
    if(ta && !ta.dataset.yolPromptReady){
      ta.dataset.yolPromptReady='1';
      const saved=await loadPromptValue();
      if(saved.trim()) ta.value=saved;
      ta.addEventListener('input',()=>{
        clearTimeout(window.__yolPromptSaveTimer);
        window.__yolPromptSaveTimer=setTimeout(async()=>{await savePromptValue(ta.value); const n=$('aiPromptSaveNote'); if(n){n.textContent='Kaydedildi'; setTimeout(()=>{n.textContent=''},1400)}},350);
      });
      ta.addEventListener('change',()=>savePromptValue(ta.value));
    }
  }
  window.yolTogglePromptEditor=function(){
    const ed=document.querySelector('.ai-prompt-editor');
    const btn=document.querySelector('#aiPromptToggleBar .btn.secondary');
    if(!ed) return;
    const closed=ed.classList.toggle('yol-prompt-collapsed');
    if(btn) btn.textContent=closed?'📝 Prompt Ayarlarını Aç':'📝 Prompt Ayarlarını Kapat';
    if(!closed){ const ta=$('aiPracticePrompt'); if(ta) setTimeout(()=>ta.focus(),80); }
  };
  window.yolResetAIPrompt=async function(){
    const ta=$('aiPracticePrompt');
    const r=active();
    const def='Şu İngilizce cümle için Türkçe açıklamalı mini öğretmen pekiştirmesi üret.\n\nCümle: {{EN}}\nTürkçe: {{TR}}\nYapı: {{GRAMMAR}}\n\n1) İngilizce+Türkçe 7 benzer cümle yaz. Her satır: English sentence - Türkçe anlam\n2) Cevapları ve nedenleriyle 6 boşluk doldurma yaz.\n3) Mini sohbet yaz. İngilizce cümlelerin Türkçesini hemen altına ekle.\n4) 30 saniyelik İngilizce podcast metni yaz.\n5) Gerçek hayat yazma görevi ver.\n\nKurallar: İngilizce cümleler kısa ve doğal olsun. Türkçe yönergeler kullan. Cevapları açıkça belirt.';
    if(ta){ta.value=def; await savePromptValue(def);}
    try{toast('Prompt sıfırlandı ve kaydedildi.')}catch(e){}
  };
  function resolvePrompt(r){
    const ta=$('aiPracticePrompt');
    let p=ta&&ta.value.trim()?ta.value:'';
    if(!p) p='Şu cümle için pekiştirme üret:\nCümle: {{EN}}\nTürkçe: {{TR}}\nYapı: {{GRAMMAR}}';
    return p.replaceAll('{{EN}}',enOf(r)).replaceAll('{{TR}}',trOf(r)).replaceAll('{{GRAMMAR}}',grammarOf(r));
  }
  function clickable(txt){
    txt=decodeEntities(txt);
    return String(txt||'').split(/\n/).map(raw=>{
      let line=decodeEntities(raw).trimEnd();
      if(!line.trim()) return '<br>';
      if(/^\s*(#{1,4}\s+)?\*\*.*\*\*\s*$/.test(line)){
        line=line.replace(/^\s*#{1,4}\s+/,'').replace(/^\s*\*\*|\*\*\s*$/g,'');
        return '<h4>'+esc(line)+'</h4>';
      }
      const green=isEN(line)||/^\s*\d+[.)]\s*[A-Za-z]/.test(line);
      const html=esc(line).replace(/[A-Za-z][A-Za-z'’\-]*/g,m=>'<span class="ai-word '+(green?'ai-en-sentence':'')+'" onclick="openWord(\''+jsq(m)+'\')">'+esc(m)+'</span>');
      return '<span class="ai-line">'+html+'</span>';
    }).join('');
  }
  window.yolAskGroqForPractice=async function(){
    const r=active(), out=$('labGroqInline')||$('aiLabOut');
    if(!r||!out) return;
    await preparePromptEditor();
    const ta=$('aiPracticePrompt'); if(ta) await savePromptValue(ta.value);
    const target=$('aiPracticeResult')||document.createElement('div');
    target.id='aiPracticeResult'; if(!target.parentNode) out.appendChild(target);
    target.innerHTML='<div class="dict-box">AI hazırlanıyor...</div>';
    const prompt=resolvePrompt(r);
    try{
      const fn=window.callGroq||window.callGrok||window.callAI;
      if(!fn) throw new Error('AI fonksiyonu bulunamadı.');
      const txt=await fn(prompt,{max_tokens:1800});
      target.innerHTML='<div class="dict-box groq-big-text"><h3>🤖 AI Pekiştirme</h3><div class="ai-clickable-output">'+clickable(txt)+'</div></div>';
    }catch(e){
      target.innerHTML='<div class="badline">AI bağlantısı kurulamadı: '+esc(e.message||e)+'</div>';
    }
  };
  function run(){ensureQuickLessonButton();preparePromptEditor();}
  if(!window.__yolUserFixObserver){
    window.__yolUserFixObserver=new MutationObserver(()=>setTimeout(run,80));
    window.__yolUserFixObserver.observe(document.body,{childList:true,subtree:true});
  }
  setTimeout(run,100);setTimeout(run,700);setTimeout(run,1600);
})();
</script>

<script id="yol-v35-module-map-final-script">
(function(){
  'use strict';
  console.log('✅ yol.html v35 MODULE_MAP_FINAL yüklendi');

  function esc(s){
    return String(s??'').replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clean(s){
    try{return cleanText(s)}catch(e){return String(s??'').replace(/\s+/g,' ').trim();}
  }
  function levelOf(m){
    var x=clean(m && m.level);
    if(!x && m && m.name){
      var mm=String(m.name).match(/[A-C][12]/i);
      if(mm) x=mm[0];
    }
    return (x||'Seviye Yok').toUpperCase();
  }
  function known(id){
    try{return typeof isKnown==='function' && isKnown(id)}catch(e){return false;}
  }
  function partDone(p){
    try{return !!(p && p.rows && p.rows.length && p.rows.every(function(r){return known(r._id)}));}catch(e){return false;}
  }
  function ensureModules(){
    try{
      if(typeof state==='undefined') return false;
      if((!state.modules || !state.modules.length) && state.rows && state.rows.length && typeof buildModules==='function'){
        buildModules();
      }
      return !!(state.modules && state.modules.length);
    }catch(e){return false;}
  }
  function ensureMapBox(){
    var box=document.getElementById('yolV35Map');
    if(box) return box;
    box=document.createElement('section');
    box.id='yolV35Map';
    var hero=document.querySelector('.hero');
    if(hero && hero.parentNode) hero.parentNode.insertBefore(box, hero.nextSibling);
    else document.body.insertBefore(box, document.body.firstChild);
    return box;
  }
  function ensureToggle(){
    if(document.getElementById('yolV35Toggle')) return;
    var btn=document.createElement('button');
    btn.id='yolV35Toggle';
    btn.className='yol-v35-toggle';
    btn.textContent='🧭 Modüller';
    btn.onclick=function(){
      var box=ensureMapBox();
      box.scrollIntoView({behavior:'smooth',block:'start'});
      renderMap();
    };
    document.body.appendChild(btn);
  }
  function renderMap(){
    try{
      ensureToggle();
      var box=ensureMapBox();
      var h=document.querySelector('.hero h1');
      if(h) h.textContent='Dil Haritası PRO v35';

      if(!ensureModules()){
        box.innerHTML='<div class="yol-v35-card"><div class="yol-v35-head"><h2>🧭 Modül Haritası</h2></div><div class="muted small">Modül verisi yükleniyor. Excel yüklendiğinde burada görünecek.</div></div>';
        return;
      }

      if(!window.__yolV35Level) window.__yolV35Level='ALL';
      var active=window.__yolV35Level;
      var modules=state.modules || [];
      var levels=[...new Set(modules.map(levelOf))].filter(Boolean).sort(function(a,b){return String(a).localeCompare(String(b),'tr',{numeric:true})});
      var visible=active==='ALL' ? modules : modules.filter(function(m){return levelOf(m)===active});
      var total=visible.reduce(function(s,m){return s+(m.parts||[]).reduce(function(a,p){return a+(p.rows?p.rows.length:0)},0)},0);
      var done=visible.reduce(function(s,m){return s+(m.parts||[]).reduce(function(a,p){return a+(p.rows||[]).filter(function(r){return known(r._id)}).length},0)},0);

      var levelBtns='<button class="'+(active==='ALL'?'active':'')+'" onclick="window.__yolV35Level=\'ALL\';window.yolV35RenderMap()">Tümü</button>'+
        levels.map(function(l){
          var safe=String(l).replace(/'/g,"\\'");
          return '<button class="'+(active===l?'active':'')+'" onclick="window.__yolV35Level=\''+safe+'\';window.yolV35RenderMap()">'+esc(l)+'</button>';
        }).join('');

      box.innerHTML='<div class="yol-v35-card">'+
        '<div class="yol-v35-head"><h2>🧭 Modül Haritası</h2><span class="pill">'+done+'/'+total+'</span></div>'+
        '<div class="yol-v35-levels">'+levelBtns+'</div>'+
        '<div class="yol-v35-grid">'+
        visible.map(function(m){
          var mi=modules.indexOf(m);
          var pd=(m.parts||[]).filter(partDone).length;
          return '<div class="yol-v35-module">'+
            '<div class="yol-v35-module-head"><div><b>'+esc(m.name)+'</b><div class="yol-v35-small">'+esc(levelOf(m))+'</div></div><span class="pill">'+pd+'/'+(m.parts||[]).length+'</span></div>'+
            '<div class="yol-v35-parts">'+
            (m.parts||[]).map(function(p,pi){
              var d=partDone(p);
              var act=state.activePart && state.activePart.p===p;
              var k=(p.rows||[]).filter(function(r){return known(r._id)}).length;
              return '<div class="yol-v35-part '+(d?'done ':'')+(act?'active':'')+'" onclick="selectPart('+mi+','+pi+');setTimeout(window.yolV35RenderMap,80)">'+
                '<div class="yol-v35-dot">'+(d?'✓':act?'●':'○')+'</div>'+
                '<div><b>'+esc(p.name)+'</b><div class="yol-v35-small">'+esc(p.stage||'Seçilebilir')+' • '+k+'/'+(p.rows?p.rows.length:0)+'</div></div>'+
              '</div>';
            }).join('')+
            '</div></div>';
        }).join('')+
        '</div></div>';
    }catch(e){
      console.warn('v35 module map render hata:', e);
    }
  }

  window.yolV35RenderMap=renderMap;

  function patchRenderAll(){
    try{
      if(typeof renderAll==='function' && !window.__yolV35RenderAllPatched){
        window.__yolV35RenderAllPatched=true;
        var old=renderAll;
        renderAll=function(){
          var r=old.apply(this,arguments);
          setTimeout(renderMap,0);
          return r;
        };
        window.renderAll=renderAll;
      }
    }catch(e){}
  }

  function boot(){
    patchRenderAll();
    renderMap();
  }

  window.addEventListener('load',function(){
    setTimeout(boot,200);
    setTimeout(boot,900);
    setTimeout(boot,2000);
    setTimeout(boot,4000);
  });
  setTimeout(boot,300);
  setTimeout(boot,1500);
})();
</script>

<script id="yol-v36-separate-modules-script">
/* ============================================================
   v36: Modül haritası ayrı ekran.
   - Ders ekranında modül haritası görünmez.
   - Sağdaki/üstteki "🧭 Modüller" düğmesi modül ekranını açar.
   - Modül seçince otomatik ders ekranına döner.
   ============================================================ */
(function(){
  console.log('✅ yol.html v36 SEPARATE_MODULE_SCREEN yüklendi');

  function ensureBackBar(){
    var bar=document.getElementById('yolV36BackToLesson');
    if(bar) return bar;
    bar=document.createElement('div');
    bar.id='yolV36BackToLesson';
    bar.innerHTML='<button class="yol-v36-back-btn" onclick="window.yolV36ShowLesson()">← Derse Dön</button><span class="yol-v36-hint">Modül seçince çalışma ekranı otomatik açılır.</span>';
    var map=document.getElementById('yolV35Map');
    if(map && map.parentNode) map.parentNode.insertBefore(bar,map);
    else document.body.insertBefore(bar,document.body.firstChild);
    return bar;
  }

  window.yolV36ShowModules=function(){
    ensureBackBar();
    document.body.classList.add('yol-show-modules');
    if(typeof window.yolV35RenderMap==='function') window.yolV35RenderMap();
    setTimeout(function(){
      var map=document.getElementById('yolV35Map');
      if(map) map.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  };

  window.yolV36ShowLesson=function(){
    document.body.classList.remove('yol-show-modules');
    try{
      if(typeof screen==='function') screen('lesson');
      document.querySelector('.grid')?.scrollIntoView({behavior:'smooth',block:'start'});
    }catch(e){}
  };

  function patchToggle(){
    var btn=document.getElementById('yolV35Toggle');
    if(btn){
      btn.onclick=function(){
        window.yolV36ShowModules();
      };
      btn.textContent='🧭 Modüller';
    }
  }

  function patchSelectPart(){
    try{
      if(typeof selectPart==='function' && !window.__yolV36SelectPatched){
        window.__yolV36SelectPatched=true;
        var old=selectPart;
        selectPart=function(mi,pi){
          var r=old.apply(this,arguments);
          setTimeout(function(){
            document.body.classList.remove('yol-show-modules');
            try{
              if(typeof screen==='function') screen('lesson');
              document.querySelector('.grid')?.scrollIntoView({behavior:'smooth',block:'start'});
            }catch(e){}
          },120);
          return r;
        };
        window.selectPart=selectPart;
      }
    }catch(e){}
  }

  function boot(){
    ensureBackBar();
    patchToggle();
    patchSelectPart();
    document.body.classList.remove('yol-show-modules');
  }

  window.addEventListener('load',function(){
    setTimeout(boot,300);
    setTimeout(boot,1200);
    setTimeout(boot,2500);
  });
  setTimeout(boot,500);
})();
</script>

(function(){

  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function clean(s){try{return cleanText(s)}catch(e){return String(s??'').trim();}}
  function levelOf(m){
    var x=clean(m&&m.level);
    if(!x && m&&m.name){var mm=String(m.name).match(/[A-C][12]/i); if(mm)x=mm[0];}
    return (x||'Seviye Yok').toUpperCase();
  }
  function known(id){try{return typeof isKnown==='function' && isKnown(id)}catch(e){return false;}}
  function donePart(p){try{return p&&p.rows&&p.rows.length&&p.rows.every(r=>known(r._id))}catch(e){return false;}}
  function ensureModules(){
    try{
      if(typeof state==='undefined') return false;
      if((!state.modules||!state.modules.length)&&state.rows&&state.rows.length&&typeof buildModules==='function') buildModules();
      return !!(state.modules&&state.modules.length);
    }catch(e){return false;}
  }
  function ensureScreen(){
    var s=document.getElementById('yolV37ModuleScreen');
    if(s)return s;

    b.className='yol-v37-tab';
    b.innerHTML='<span>🧭</span>Modüller';
    b.onclick=function(){window.yolV37OpenModules();};
    tabs.insertBefore(b, tabs.firstChild);
  }
  function render(){
    ensureBottomButton();
    var s=ensureScreen();
    if(!ensureModules()){
      s.innerHTML='<div class="yol-v37-card"><div class="yol-v37-head"><h2>🧭 Modüller</h2><button class="yol-v37-back" onclick="window.yolV37CloseModules()">← Derse Dön</button></div><div class="muted small">Modül verisi yükleniyor.</div></div>';
      return;

    if(!window.__yolV37Level) window.__yolV37Level='ALL';
    var active=window.__yolV37Level;
    var modules=state.modules||[];
    var levels=[...new Set(modules.map(levelOf))].sort((a,b)=>String(a).localeCompare(String(b),'tr',{numeric:true}));
    var visible=active==='ALL'?modules:modules.filter(m=>levelOf(m)===active);
    var total=visible.reduce((s,m)=>s+(m.parts||[]).reduce((a,p)=>a+(p.rows?p.rows.length:0),0),0);
    var done=visible.reduce((s,m)=>s+(m.parts||[]).reduce((a,p)=>a+(p.rows||[]).filter(r=>known(r._id)).length,0),0);

      '<div class="yol-v37-levels">'+levelsHtml+'</div>'+

        return '<div class="yol-v37-module"><div class="yol-v37-module-head"><div><b>'+esc(m.name)+'</b><div class="yol-v37-small">'+esc(levelOf(m))+'</div></div><span class="pill">'+pd+'/'+(m.parts||[]).length+'</span></div>'+

})();

<script id="yol-v40-standalone-modules-script">
(function(){
  'use strict';
  console.log('✅ yol.html v40 STANDALONE_MODULE_BUTTON yüklendi');

  function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function clean(s){try{return cleanText(s)}catch(e){return String(s??'').trim();}}
  function levelOf(m){
    var x=clean(m&&m.level);
    if(!x && m&&m.name){var mm=String(m.name).match(/[A-C][12]/i); if(mm)x=mm[0];}
    return (x||'Seviye Yok').toUpperCase();
  }
  function known(id){try{return typeof isKnown==='function' && isKnown(id)}catch(e){return false;}}
  function donePart(p){try{return p&&p.rows&&p.rows.length&&p.rows.every(function(r){return known(r._id)})}catch(e){return false;}}
  function ensureModules(){
    try{
      if(typeof state==='undefined') return false;
      if((!state.modules||!state.modules.length)&&state.rows&&state.rows.length&&typeof buildModules==='function') buildModules();
      return !!(state.modules&&state.modules.length);
    }catch(e){return false;}
  }
  function ensureOverlay(){
    var o=document.getElementById('yolV40Overlay');
    if(o) return o;
    o=document.createElement('section');
    o.id='yolV40Overlay';
    o.innerHTML='<div class="yol-v40-wrap" id="yolV40Content"></div>';
    document.body.appendChild(o);
    return o;
  }
  function ensureBtn(){
    var b=document.getElementById('yolV40ModulesBtn');
    if(b) return b;
    b=document.createElement('button');
    b.id='yolV40ModulesBtn';
    b.type='button';
    b.innerHTML='🧭 <span>Modüller</span>';
    b.addEventListener('click',function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      openOverlay();
      return false;
    }, true);
    document.body.appendChild(b);
    return b;
  }
  function render(){
    var o=ensureOverlay();
    var c=document.getElementById('yolV40Content') || o;
    if(!ensureModules()){
      c.innerHTML='<div class="yol-v40-card"><div class="yol-v40-head"><h2>🧭 Modüller</h2><button class="yol-v40-close" id="yolV40CloseA">← Derse Dön</button></div><div class="muted small">Modül verisi yükleniyor. Birkaç saniye sonra tekrar dene.</div></div>';
      setTimeout(bindClose,0);
      return;
    }
    if(!window.__yolV40Level) window.__yolV40Level='ALL';
    var active=window.__yolV40Level;
    var modules=state.modules||[];
    var levels=[...new Set(modules.map(levelOf))].sort(function(a,b){return String(a).localeCompare(String(b),'tr',{numeric:true})});
    var visible=active==='ALL'?modules:modules.filter(function(m){return levelOf(m)===active});
    var total=visible.reduce(function(s,m){return s+(m.parts||[]).reduce(function(a,p){return a+(p.rows?p.rows.length:0)},0)},0);
    var done=visible.reduce(function(s,m){return s+(m.parts||[]).reduce(function(a,p){return a+(p.rows||[]).filter(function(r){return known(r._id)}).length},0)},0);
    var levelsHtml='<button class="'+(active==='ALL'?'active':'')+'" data-level="ALL">Tümü</button>'+
      levels.map(function(l){return '<button class="'+(active===l?'active':'')+'" data-level="'+esc(l)+'">'+esc(l)+'</button>';}).join('');
    c.innerHTML='<div class="yol-v40-card">'+
      '<div class="yol-v40-head"><h2>🧭 Modüller</h2><div style="display:flex;gap:8px;align-items:center"><span class="pill">'+done+'/'+total+'</span><button class="yol-v40-close" id="yolV40CloseB">← Derse Dön</button></div></div>'+
      '<div class="yol-v40-levels">'+levelsHtml+'</div>'+
      '<div class="yol-v40-grid">'+visible.map(function(m){
        var mi=modules.indexOf(m);
        var pd=(m.parts||[]).filter(donePart).length;
        return '<div class="yol-v40-module"><div class="yol-v40-module-head"><div><b>'+esc(m.name)+'</b><div class="yol-v40-small">'+esc(levelOf(m))+'</div></div><span class="pill">'+pd+'/'+(m.parts||[]).length+'</span></div>'+
          '<div class="yol-v40-parts">'+(m.parts||[]).map(function(p,pi){
            var d=donePart(p), act=state.activePart&&state.activePart.p===p;
            var k=(p.rows||[]).filter(function(r){return known(r._id)}).length;
            return '<div class="yol-v40-part '+(d?'done ':'')+(act?'active':'')+'" data-mi="'+mi+'" data-pi="'+pi+'">'+
              '<div class="yol-v40-dot">'+(d?'✓':act?'●':'○')+'</div><div><b>'+esc(p.name)+'</b><div class="yol-v40-small">'+esc(p.stage||'Seçilebilir')+' • '+k+'/'+(p.rows?p.rows.length:0)+'</div></div></div>';
          }).join('')+'</div></div>';
      }).join('')+'</div></div>';
    bindEvents();
  }
  function bindClose(){
    ['yolV40CloseA','yolV40CloseB'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.onclick=closeOverlay;
    });
  }
  function bindEvents(){
    bindClose();
    document.querySelectorAll('.yol-v40-levels button').forEach(function(btn){
      btn.onclick=function(){
        window.__yolV40Level=btn.getAttribute('data-level')||'ALL';
        render();
      };
    });
    document.querySelectorAll('.yol-v40-part').forEach(function(el){
      el.onclick=function(){
        var mi=Number(el.getAttribute('data-mi'));
        var pi=Number(el.getAttribute('data-pi'));
        try{ if(typeof selectPart==='function') selectPart(mi,pi); }catch(e){}
        setTimeout(closeOverlay,120);
      };
    });
  }
  function openOverlay(){
    console.log('🧭 v40 Modüller tıklandı');
    render();
    ensureOverlay().classList.add('show');
  }
  function closeOverlay(){
    ensureOverlay().classList.remove('show');
    try{if(typeof screen==='function') screen('lesson')}catch(e){}
  }
  window.yolV40OpenModules=openOverlay;
  window.yolV40CloseModules=closeOverlay;
  window.yolV40RenderModules=render;

  function boot(){
    ensureBtn();
    ensureOverlay();
    // Eski bozuk düğmeler varsa temizle
    ['yolV39FixedModulesBtn','yolV38ModuleTab','yolV37ModuleTab','yolV35Toggle'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.remove();
    });
  }
  window.addEventListener('load',function(){setTimeout(boot,200);setTimeout(boot,900);setTimeout(boot,2000);});
  setTimeout(boot,300);
})();
</script>

<script id="yol-v41-header-module-button-script">
(function(){
  'use strict';
  console.log('✅ yol.html v41 HEADER_MODULE_BUTTON yüklendi');

  function forceOpenModules(){
    console.log('🧭 v41 Modüller tıklandı');
    if(typeof window.yolV40OpenModules==='function'){
      window.yolV40OpenModules();
      return;
    }
    if(typeof window.yolV38OpenModules==='function'){
      window.yolV38OpenModules();
      return;
    }
    alert('Modül ekranı henüz hazır değil. Sayfayı yenileyip tekrar dene.');
  }

  function addHeaderButton(){
    var existing=document.getElementById('yolV41HeaderModulesBtn');
    if(existing) return existing;

    var btn=document.createElement('button');
    btn.id='yolV41HeaderModulesBtn';
    btn.type='button';
    btn.innerHTML='🧭 Modüller';
    btn.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      forceOpenModules();
      return false;
    };

    // Üst sağdaki Excel Yükle / index.html / Ayarlar satırına ekle
    var hero=document.querySelector('.hero');
    var rows=hero ? hero.querySelectorAll('.row') : [];
    var target=null;

    for(var i=0;i<rows.length;i++){
      if(rows[i].textContent && rows[i].textContent.includes('Excel Yükle')){
        target=rows[i];
        break;
      }
    }

    if(!target){
      target=document.querySelector('.hero .row') || document.querySelector('.app') || document.body;
    }

    if(target.firstChild) target.insertBefore(btn,target.firstChild);
    else target.appendChild(btn);

    return btn;
  }

  function addBottomFallback(){
    var tabs=document.querySelector('.tabs');
    if(!tabs) return;
    var old=document.getElementById('yolV41BottomModulesBtn');
    if(old) return;
    var b=document.createElement('button');
    b.id='yolV41BottomModulesBtn';
    b.className='tab';
    b.innerHTML='<span>🧭</span>Modüller';
    b.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      forceOpenModules();
      return false;
    };
    tabs.insertBefore(b,tabs.firstChild);
  }

  function boot(){
    addHeaderButton();
    addBottomFallback();

    // Eski sağ sabit düğme devtools altında kalıyordu; gizle.
    var old=document.getElementById('yolV40ModulesBtn');
    if(old) old.style.display='none';
  }

  window.addEventListener('load',function(){
    setTimeout(boot,100);
    setTimeout(boot,600);
    setTimeout(boot,1500);
  });
  setTimeout(boot,200);
})();
</script>

      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
      hardOpen();
      return false;
    }

})();
