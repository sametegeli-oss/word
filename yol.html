<script>
'use strict';
const DB='dil_haritasi_pro_indexeddb_v3', VERSION=3;
const state={ rows:[], modules:[], dict:new Map(), progress:new Map(), stats:{xp:0,streak:0,lastDay:null}, settings:{provider:'openrouter',model:'openai/gpt-4o-mini',apiKey:''}, activePart:null, activeIndex:0, lessonQueue:[], heardText:'', media:null, recorder:null, chunks:[] };
const exactHeaders=['ID','Module','Part','LearningStage','OrderIndex','Level','SentenceLevel','DifficultyScore','CEFRWordLevel','Topic','Scenario','GrammarStructure','Highlights','Pattern','SentenceEN','SentenceTR','IPA','TRPronunciation','Frequency','ErrorFocus','CommonMistakeTR','PronunciationDifficulty','SentenceType','Tense','Collocations','WordFamily','Synonyms','Antonyms','Dependency','ReviewWeight','SpeakingPriority','ListeningPriority','WritingPriority','Register','Emotion','AIExplanation','ImageKeywords','AudioKeywords','GrammarTags'];
const H={};
function normKey(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9ğüşıöç]/gi,'');}
function cleanText(s){return String(s??'').replace(/\s+/g,' ').trim();}
function looksIPA(s){s=cleanText(s); return /^\//.test(s)||/[ɑæəɪʊɔːɛʃθðŋʒʌˈˌ]/.test(s);}
function hasTurkish(s){return /[çğıöşüÇĞİÖŞÜ]|\b(ben|bir|ve|için|zorunda|değil|var|yok|mı|mi|dün|onun|sen|biz)\b/i.test(cleanText(s));}
function looksEnglishSentence(s){s=cleanText(s); return /[a-zA-Z]/.test(s)&&/[.!?']/.test(s)&&!hasTurkish(s)&&!looksIPA(s);}
function looksTRPron(s){s=cleanText(s); return s && !looksIPA(s) && /\b(ay|yu|vi|hev|gat|tu|dıt|did|şiz|vey|fayn|long|minit|fon|bikoz|ğ|ı|ş|ö|ü|ç)\b/i.test(s);}

function isProbablyTurkishText(s){
  s=cleanText(s);
  if(!s) return false;
  if(looksIPA(s)||looksTRPron(s)) return false;
  return hasTurkish(s) || /\b(ben|sen|biz|siz|onlar|bir|daha|miyim|misin|mısın|musun|müsün|değil|için|ile|var|yok|lütfen|alabilir|edebilir|gerekir|zorunda|odada|havlu)\b/i.test(s);
}
function isProbablyEnglishSentence(s){
  s=cleanText(s);
  if(!s || looksIPA(s) || looksTRPron(s) || isProbablyTurkishText(s)) return false;
  if(!/[A-Za-z]/.test(s)) return false;
  if(/\b(subject|noun|verb|article|object|auxiliary|modal|prep|preposition|adjective|adverb|complement)\b/i.test(s) && /\+|>/.test(s)) return false;
  return /[.!?]$/.test(s) || /\b(am|is|are|was|were|do|does|did|have|has|had|can|could|would|should|will|want|need|there|please|the|a|an|you|i|we|they|he|she|it)\b/i.test(s);
}
function repairSentenceColumns(obj,arr){
  let en=cleanText(obj.SentenceEN), tr=cleanText(obj.SentenceTR);
  // En sık hata: SentenceEN ve SentenceTR sütunları yer değiştirmiş oluyor.
  if(isProbablyTurkishText(en) && isProbablyEnglishSentence(tr)){
    obj.SentenceEN=tr; obj.SentenceTR=en; return obj;
  }
  // SentenceEN Türkçe geldiyse, aynı satırdaki gerçek İngilizce cümleyi bul.
  if(isProbablyTurkishText(en)){
    const cand=(arr||[]).map(cleanText).find(v=>v!==en && v!==tr && isProbablyEnglishSentence(v));
    if(cand){ obj.SentenceEN=cand; if(!tr || isProbablyEnglishSentence(tr)) obj.SentenceTR=en; }
  }
  // SentenceTR İngilizce geldiyse ama SentenceEN boş/kalıp ise değiştir.
  if((!obj.SentenceEN || !isProbablyEnglishSentence(obj.SentenceEN)) && isProbablyEnglishSentence(tr)){
    obj.SentenceEN=tr;
  }
  return obj;
}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function escapeHTML(s){return cleanText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tokenize(s){return cleanText(s).match(/[A-Za-z][A-Za-z'’-]*/g)||[];}
function baseWord(w){return cleanText(w).toLowerCase().replace(/[’']/g,"'").replace(/^[^a-z]+|[^a-z]+$/g,'').replace(/(ing|ed|s)$/,'');}
function idOfRow(r,i){return cleanText(r.ID)||`${cleanText(r.Level)||'L'}_${cleanText(r.Module)||'M'}_${cleanText(r.Part)||'P'}_${i}`.replace(/\W+/g,'_');}

let db;
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open(DB,VERSION);req.onupgradeneeded=e=>{const d=e.target.result;['progress','stats','settings','dictCache'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};req.onsuccess=e=>res(e.target.result);req.onerror=e=>rej(e.target.error);});}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function dbPut(name,obj){return new Promise((res,rej)=>{const r=store(name,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error);});}
function dbGetAll(name){return new Promise((res,rej)=>{const r=store(name).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function dbGet(name,id){return new Promise((res,rej)=>{const r=store(name).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbClear(name){return new Promise((res,rej)=>{const r=store(name,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
async function loadProgress(){db=await openDB();state.progress=new Map((await dbGetAll('progress')).map(x=>[x.id,x]));const st=(await dbGetAll('stats'))[0];if(st)state.stats=st;const set=await dbGet('settings','ai');if(set)state.settings={...state.settings,...set};
  /* ORTAK İLERLEME KÖPRÜSÜ: index.html'in Modül Yolu'yla aynı ilerlemeyi paylaş.
     wmPathProgress.known[id] (localStorage) ← → yol.html progress store.
     İki taraf da aynı ID (Excel ID sütunu) kullandığı için eşleşir. */
  try{
    var shared = JSON.parse(localStorage.getItem('wmPathProgress')||'{}');
    var sk = (shared && shared.known) || {};
    Object.keys(sk).forEach(function(id){
      if(sk[id] && !(state.progress.get(id)||{}).known){
        var old = state.progress.get(id)||{id:id};
        state.progress.set(id, Object.assign({}, old, {known:true, updatedAt:Date.now()}));
      }
    });
    if(shared && typeof shared.xp==='number'){ state.stats.xp = Math.max(state.stats.xp||0, shared.xp); }
  }catch(e){}
}
/* Bir ID'yi ortak depoya (wmPathProgress) yaz — index.html tarafı da görsün */
function __wmSyncToShared(id, known){
  try{
    var s = JSON.parse(localStorage.getItem('wmPathProgress')||'{}');
    if(!s.known) s.known={};
    if(known){ if(!s.known[id]){ s.known[id]=true; s.xp=(s.xp||0)+5; } }
    else { delete s.known[id]; }
    localStorage.setItem('wmPathProgress', JSON.stringify(s));
  }catch(e){}
}
async function saveProgress(id,patch){const old=state.progress.get(id)||{id};const item={...old,...patch,updatedAt:Date.now()};state.progress.set(id,item);await dbPut('progress',item);
  /* ortak depoya da yaz (index.html Modül Yolu görsün) */
  try{ if('known' in patch) __wmSyncToShared(id, !!patch.known); }catch(e){}
  await updateStats();}
async function updateStats(addXp=0){const today=new Date().toISOString().slice(0,10);if(addXp)state.stats.xp=(state.stats.xp||0)+addXp;if(state.stats.lastDay!==today && addXp){state.stats.streak=(state.stats.streak||0)+1;state.stats.lastDay=today;}await dbPut('stats',{id:'main',...state.stats});renderHeader();}
function isKnown(id){const p=state.progress.get(id);return !!(p&&p.known);}
function nextReviewDate(weight=3,level=1){
  const n=parseInt(String(level??'1'),10);
  const lv=Number.isFinite(n)?Math.min(6,Math.max(0,n-1)):0;
  const w=parseFloat(String(weight??'3').replace(',', '.'));
  const extra=Math.max(0,Math.min(10,6-(Number.isFinite(w)?w:3)));
  const days=([1,2,4,7,14,30,60][lv]||1)+extra;
  const dt=new Date(Date.now()+Math.round(days)*86400000);
  return (Number.isNaN(dt.getTime())?new Date(Date.now()+86400000):dt).toISOString().slice(0,10);
}

async function readWorkbook(buf,name){try{const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(!matrix.length)throw new Error('Boş dosya');parseMatrix(matrix);await loadDictionaries();buildModules();selectFirstAvailable();renderAll();

function parseMatrix(matrix){const headers=matrix[0].map(h=>cleanText(h));Object.keys(H).forEach(k=>delete H[k]);headers.forEach((h,i)=>H[normKey(h)]=i);state.rows=[];for(let r=1;r<matrix.length;r++){const arr=matrix[r];if(!arr||arr.every(x=>!cleanText(x)))continue;let obj={_raw:arr,_row:r+1};headers.forEach((h,i)=>obj[h]=cleanText(arr[i]));obj=routeFields(obj,arr);obj._id=idOfRow(obj,state.rows.length+1);if(obj.SentenceEN || obj.Word)state.rows.push(obj);}document.getElementById('dataPill').textContent=state.rows.length+' cümle';}
function cell(arr,h){const i=H[normKey(h)];return i==null?'':cleanText(arr[i]);}
function routeFields(obj,arr){
  // v17: Excel'in İLK SATIR BAŞLIKLARI ESAS ALINIR.
  // Cümle kesinlikle GrammarStructure/Pattern/Topic gibi alanlardan alınmaz.
  const get=(h)=>cell(arr,h);
  const exactEN=get('SentenceEN'), exactTR=get('SentenceTR'), exactIPA=get('IPA'), exactTRP=get('TRPronunciation');
  obj.ID=get('ID')||obj.ID;
  obj.Module=get('Module')||obj.Module;
  obj.Part=get('Part')||obj.Part;
  obj.LearningStage=get('LearningStage')||obj.LearningStage;
  obj.OrderIndex=get('OrderIndex')||obj.OrderIndex;
  obj.Level=get('Level')||obj.Level;
  obj.SentenceLevel=get('SentenceLevel')||obj.SentenceLevel;
  obj.DifficultyScore=get('DifficultyScore')||obj.DifficultyScore;
  obj.Topic=get('Topic')||obj.Topic;
  obj.SentenceEN=exactEN||obj.SentenceEN||'';
  obj.SentenceTR=exactTR||obj.SentenceTR||'';
  obj.IPA=exactIPA||obj.IPA||'';
  obj.TRPronunciation=exactTRP||obj.TRPronunciation||'';
  obj.GrammarStructure=get('GrammarStructure')||obj.GrammarStructure||'';
  obj.ImageKeywords=get('ImageKeywords')||obj.ImageKeywords||'';
  obj.AudioKeywords=get('AudioKeywords')||obj.AudioKeywords||'';
  // Sadece başlık yoksa/boşsa güvenli fallback uygula; GrammarStructure/Pattern kesinlikle cümle adayı değildir.
  if(!obj.SentenceEN){
    const banned=new Set(['grammarstructure','pattern','topic','scenario','imagekeywords','audiokeywords','ipa','trpronunciation','sentencetr']);
    const vals=[];
    Object.keys(H).forEach(k=>{ if(!banned.has(k)){ const i=H[k]; const v=cleanText(arr[i]); if(v) vals.push(v); }});
    const cand=vals.find(v=>looksEnglishSentence(v));
    if(cand) obj.SentenceEN=cand;
  }
  if(!obj.SentenceTR){
    const cand=arr.map(cleanText).find(v=>hasTurkish(v)&&!looksTRPron(v)&&!looksIPA(v)&&v!==obj.SentenceEN);
    if(cand) obj.SentenceTR=cand;
  }
  obj=repairSentenceColumns(obj,arr);
  obj.Word=extractFocusWord(obj);
  obj.Context=[obj.Topic,obj.Scenario,obj.GrammarStructure,obj.Pattern].filter(Boolean).join(' • ');
  return obj;
}
function extractFocusWord(r){let h=cleanText(r.Highlights); if(h&&!looksEnglishSentence(h)&&!hasTurkish(h)&&!looksIPA(h))return h.split(/[;,|]/)[0].trim(); const toks=tokenize(r.SentenceEN).filter(w=>w.length>2); return toks[0]||'';}

async function loadDictionaries(){state.dict.clear(); for(const u of DICTIONARY_PATHS){try{const res=await fetch(u,{cache:'no-store'});if(res.ok){const json=await res.json();ingestDict(json,u);}}catch(e){}}
  // Excel'deki satırlardan da sözlük indeksini güçlendir.
  state.rows.forEach(r=>{tokenize(r.SentenceEN).forEach(w=>{const k=baseWord(w); if(!k)return; const old=state.dict.get(k)||{word:w,examples:[],contexts:[]}; old.examples.push({en:r.SentenceEN,tr:r.SentenceTR,id:r._id}); old.contexts.push(r.Context); if(r.WordFamily)old.wordFamily=r.WordFamily; if(r.Synonyms)old.synonyms=r.Synonyms; if(r.Antonyms)old.antonyms=r.Antonyms; if(r.CEFRWordLevel)old.cefr=old.cefr||r.CEFRWordLevel; state.dict.set(k,old);});});}
function ingestDict(json,src){
  let arr=[];
  if(Array.isArray(json)) arr=json;
  else if(json&&typeof json==='object') arr=Object.values(json);
  arr.forEach(x=>{
    if(!x||typeof x!=='object')return;
    const word=x.word||x.Word||x.english||x.English||x.en||x.EN||x.Kelime||x.ingilizce||x['İngilizce']||x.term||x.Term;
    if(!word)return;
    const k=baseWord(word);
    const old=state.dict.get(k)||{word,examples:[],contexts:[]};
    const trMulti=[x.anlam1,x.anlam2,x.anlam3,x.anlam4,x.Anlam1,x.Anlam2,x.Anlam3].filter(Boolean).join('; ');
    const tr=x.tr||x.TR||x.turkish||x.Turkish||x.meaning_tr||x.meaningTR||x.anlam||x.Anlam||x.Turkce||x.Türkçe||x['Türkçe Anlam']||x.turkceAnlam||trMulti||old.tr;
    const trPron=x.trPronunciation||x.TRPronunciation||x.tr_pronunciation||x.okunus||x.okunuş||x.Okunuş||x['Türkçe Okunuş']||x['türkçe_okunuş']||x.turkce_okunus||x.pron_tr||x.TRPron||old.trPron;
    const ipa=x.ipa||x.IPA||x.phonetic||x.Phonetic||old.ipa;
    const example=x.example||x.Example||x.exampleEN||x.ExampleEN||x['Example EN']||old.example;
    state.dict.set(k,{...old, word:word, tr, trPron, ipa, cefr:x.level||x.Level||x.CEFR||x.cefr||old.cefr, example, wordFamily:x.wordFamily||x.WordFamily||x['Word Family']||old.wordFamily, synonyms:x.synonyms||x.Synonyms||old.synonyms, antonyms:x.antonyms||x.Antonyms||old.antonyms, source:src, examples:old.examples||[], contexts:old.contexts||[]});
  });
}

function buildModules(){const map=new Map();state.rows.forEach(r=>{const mod=r.Module||'Modül Yok'; const part=r.Part||'P1'; if(!map.has(mod))map.set(mod,{name:mod,level:r.Level,parts:new Map()});const m=map.get(mod); if(!m.parts.has(part))m.parts.set(part,{name:part,stage:r.LearningStage,rows:[]});m.parts.get(part).rows.push(r);});state.modules=[...map.values()].map(m=>({...m,parts:[...m.parts.values()].sort((a,b)=>partNo(a.name)-partNo(b.name))}));}
function partNo(p){const m=String(p).match(/P\s*(\d+)/i);return m?+m[1]:999;}
function partKey(m,p){return (m.name+'__'+p.name).replace(/\W+/g,'_');}
function partComplete(p){return p.rows.length>0 && p.rows.every(r=>isKnown(r._id));}
function partUnlocked(m,p){return true;}
function selectFirstAvailable(){for(const m of state.modules){for(const p of m.parts){if(partUnlocked(m,p)&&!partComplete(p)){state.activePart={m,p};buildLessonQueue();return;}}} if(state.modules[0]){state.activePart={m:state.modules[0],p:state.modules[0].parts[0]};buildLessonQueue();}}
function selectPart(mi,pi){const m=state.modules[mi],p=m&&m.parts?m.parts[pi]:null; if(!m||!p){toast('Ders bulunamadı.');return;} state.activePart={m,p}; state.activeIndex=0; buildLessonQueue(); if(typeof screen==='function') screen('lesson'); renderAll(); setTimeout(()=>{try{document.getElementById('screen-lesson')?.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}},60);}

ndan aynı ritimle tekrar et.</div></div><div class="practice"><h3>2) Forced Output</h3><p class="muted">Türkçeye bakıp İngilizce cümleyi yaz.</p><input class="input" id="answerInput" placeholder="İngilizce yaz..." onkeydown="if(event.key==='Enter')checkAnswer()"><div class="row" style="margin-top:10px"><button class="btn green" onclick="checkAnswer()">Kontrol Et</button><button class="btn secondary" onclick="showHint()">İpucu</button></div><div id="answerResult" style="margin-top:10px"></div></div><div class="practice"><h3>3) Kontekst ve kelime ağı</h3><p class="muted small">Cümledeki kelimelere tıkla. Yerel sözlük, kelime ağacı ve aynı kontekstteki örnekler açılır.</p><div class="row">${tokenize(r.SentenceEN).map(w=>`<button class="word-chip" onclick="openWord('${escapeHTML(w)}')">${escapeHTML(w)}</button>`).join('')}</div></div>`;}
async function markKnown(score=100){
  const r=activeRow();if(!r)return;
  const prev=state.progress.get(r._id)||{};
  const level=(parseInt(prev.srsLevel,10)||0)+1;
  const review=nextReviewDate(r.ReviewWeight,level);
  await saveProgress(r._id,{known:true,completedAt:Date.now(),score,srsLevel:level,nextReview:review,module:r.Module,part:r.Part,sentence:r.SentenceEN});
  await updateStats(Math.max(5,Math.round((parseFloat(r.DifficultyScore)||50)/5)));
  state.activeIndex++;buildLessonQueue();renderAll();toast('Kaydedildi. Bu cümle tekrar sorulmayacak.');
}
function goNextPart(){const mi=state.modules.indexOf(state.activePart.m), pi=state.activePart.m.parts.indexOf(state.activePart.p); if(state.activePart.m.parts[pi+1])selectPart(mi,pi+1);else{for(let m=mi+1;m<state.modules.length;m++){if(state.modules[m].parts[0]){selectPart(m,0);return;}}toast('Tüm ders yolu bitti.');}}
function showHint(){const r=activeRow();document.getElementById('answerResult').innerHTML=`<div class="dict-box"><b>İpucu:</b> ${escapeHTML(r.Pattern||r.GrammarStructure||'')}<br><span class="muted">Okunuş: ${escapeHTML(r.TRPronunciation||'')}</span></div>`;}
function normAnswer(s){return cleanText(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();}
function sim(a,b){a=normAnswer(a);b=normAnswer(b);if(!a||!b)return 0;const A=a.split(' '),B=b.split(' ');let hit=0;A.forEach(x=>{if(B.includes(x))hit++});return Math.round(hit/Math.max(A.length,B.length)*100);}
function checkAnswer(){const r=activeRow();const ans=document.getElementById('answerInput').value;const sc=sim(ans,r.SentenceEN);const out=document.getElementById('answerResult');if(sc>=82){out.innerHTML=`<div class="okline">✅ Doğruya çok yakın. Skor: ${sc}</div>`;setTimeout(()=>markKnown(sc),400);}else out.innerHTML=`<div class="badline">Tekrar dene. Skor: ${sc}<br><span class="muted">Beklenen: ${escapeHTML(r.SentenceEN)}</span></div>`;}
function speakSentence(){const r=activeRow();if(!r)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r.SentenceEN);u.lang='en-US';u.rate=.86;u.pitch=1;window.speechSynthesis.speak(u);}
async function startShadow(){try{state.chunks=[];state.media=await navigator.mediaDevices.getUserMedia({audio:true});state.recorder=new MediaRecorder(state.media);state.recorder.ondataavailable=e=>state.chunks.push(e.data);state.recorder.onstop=()=>{state.blob=new Blob(state.chunks,{type:'audio/webm'});};state.recorder.start();startRecognition();document.getElementById('shadowResult').textContent='Kayıt başladı. Cümleyi oku.';}catch(e){toast('Mikrofon açılamadı: '+e.message);}}

function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.heardText='';return;}const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{state.heardText=e.results[0][0].transcript||'';};rec.onerror=()=>{};try{rec.start();state.recognition=rec;}catch(e){}}
function scoreShadow(){const r=activeRow();let sc=state.heardText?sim(state.heardText,r.SentenceEN):0;const target=tokenize(r.SentenceEN).map(baseWord);const heard=tokenize(state.heardText).map(baseWord);const marks=target.map(w=>heard.includes(w)?`<span style="color:#86efac">${escapeHTML(w)}</span>`:`<span style="color:#fca5a5">${escapeHTML(w)}</span>`).join(' ');document.getElementById('shadowResult').innerHTML=`<div class="dict-box"><b>Shadow skor:</b> ${sc||'—'}<br><b>Duyulan:</b> ${escapeHTML(state.heardText||'Tarayıcı konuşma tanımayı desteklemedi / algılamadı.')}<br><b>Harita:</b> ${marks}</div>`; if(sc>=80) markKnown(sc);}

function openWord(w){const key=baseWord(w);const d=state.dict.get(key)||{word:w};const contexts=[...new Set((d.contexts||[]).filter(Boolean))].slice(0,8);const examples=(d.examples||[]).slice(0,7);const tree=wordTree(d,w);document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeDrawer()">Kapat</button><div class="dict-word">${escapeHTML(d.word||w)}</div><div class="row"><span class="pill good">${escapeHTML(d.cefr||'CEFR yok')}</span><span class="pill">Kaynak: ${escapeHTML(d.source||'Excel + yerel indeks')}</span></div><div class="two"><div class="dict-box"><h3>📖 Sözlük</h3><p><b>Türkçe:</b> ${escapeHTML(d.tr||'Yerel sözlükte net anlam yok')}</p><p><b>Türkçe okunuş:</b> ${escapeHTML(d.trPron||'—')}</p><p><b>IPA:</b> ${escapeHTML(d.ipa||'—')}</p><p><b>Örnek:</b> ${escapeHTML(d.example||examples[0]?.en||'—')}</p></div><div class="dict-box"><h3>🌳 Kelime Ağacı</h3><div class="tree">${tree}</div></div></div><div class="dict-box"><h3>🧩 Kontekst</h3>${contexts.length?contexts.map(c=>`<span class="pill">${escapeHTML(c)}</span>`).join(' '):'<p class="muted">Bu kelime için kontekst bulunamadı.</p>'}</div><div class="dict-box"><h3>🔎 Bu kelimenin geçtiği cümleler</h3>${examples.length?examples.map(e=>`<div class="list-item"><b>${renderSentence(e.en)}</b><br><span class="muted">${escapeHTML(e.tr||'')}</span></div>`).join(''):'<p class="muted">Örnek bulunamadı.</p>'}</div><div class="row"><button class="btn green" onclick="saveWord('${escapeHTML(key)}')">Kelimeyi Öğrendim</button><button class="btn secondary" onclick="speakText('${escapeHTML(d.word||w)}')">Telaffuz Et</button><button class="btn warn" onclick="explainWordAI('${escapeHTML(key)}')">AI Genişlet</button></div><div id="wordAIBox"></div>`;document.getElementById('drawer').classList.add('show');}
function wordTree(d,w){const fam=splitList(d.wordFamily), syn=splitList(d.synonyms), ant=splitList(d.antonyms);let out=escapeHTML(d.word||w);fam.forEach(x=>out+=`\n ├─ ${escapeHTML(x)}`);if(syn.length)out+=`\n ├─ synonyms: ${syn.map(escapeHTML).join(', ')}`;if(ant.length)out+=`\n └─ antonyms: ${ant.map(escapeHTML).join(', ')}`;return out;}

async function saveWord(k){await dbPut('progress',{id:'word_'+k,type:'word',known:true,completedAt:Date.now()});toast('Kelime kaydedildi.');}
function renderDict(){const el=document.getElementById('screen-dict');const words=[...state.dict.keys()].slice(0,300);el.innerHTML=`<div class="card"><h2>📚 Yerel Sözlük</h2><input class="input" id="dictSearch" placeholder="Kelime ara..." oninput="searchDict(this.value)"><div id="dictList" class="row" style="margin-top:12px">${words.slice(0,80).map(k=>`<button class="word-chip" onclick="openWord('${escapeHTML(k)}')">${escapeHTML(state.dict.get(k).word||k)}</button>`).join('')}</div></div>`;}

function renderTools(){document.getElementById('screen-tools').innerHTML=`<div class="card"><h2>🧰 Araçlar</h2><div class="row"><button class="btn" onclick="exportProgress()">Yedek Al</button><button class="btn secondary" onclick="bootLoad()">Excel Değiştir</button><button class="btn secondary" onclick="location.href='index.html'">index.html Aç</button><button class="btn red" onclick="resetProgress()">İlerlemeyi Sıfırla</button></div><p class="muted small" style="margin-top:12px">Veri bankası Excel’den, kişisel ilerleme IndexedDB’den gelir. HTML içine veri gömülmez.</p></div><div class="card"><h2>🤖 Yapay Zeka Ayarları</h2><p class="muted">AI ana motor değildir. Önce Excel + <span class="kbd">data/sozluk.json</span> kullanılır; sadece ek açıklama, benzer cümle ve koçluk için AI çağrılır.</p><input class="input" id="aiKey" type="password" placeholder="OpenRouter API anahtarı" value="${escapeHTML(state.settings.apiKey||'')}" style="margin-bottom:8px"><input class="input" id="aiModel" placeholder="Model" value="${escapeHTML(state.settings.model||'openai/gpt-4o-mini')}"><div class="row" style="margin-top:10px"><button class="btn green" onclick="saveAISettings()">AI Ayarlarını Kaydet</button></div></div>`;}
function openSettings(){screen('tools')}
async function saveAISettings(){state.settings.apiKey=document.getElementById('aiKey').value.trim();state.settings.model=document.getElementById('aiModel').value.trim()||'openai/gpt-4o-mini';await dbPut('settings',{id:'ai',...state.settings});toast('AI ayarları IndexedDB’ye kaydedildi.');}
async function callAI(kind,payload){
  if(!state.settings.apiKey){return localAI(kind,payload);}
  const system='Sen Türkçe konuşan bir İngilizce öğretmenisin. Kısa, net, uygulanabilir cevap ver. Excel ve yerel sözlük verisini esas al; uydurma yapma.';
  const user=buildAIPrompt(kind,payload);
  try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.settings.apiKey,'HTTP-Referer':location.href,'X-Title':'Dil Haritası Yol'},body:JSON.stringify({model:state.settings.model||'openai/gpt-4o-mini',messages:[{role:'system',content:system},{role:'user',content:user}],temperature:.35,max_tokens:550})});

}
function buildAIPrompt(kind,p){if(kind==='grammar')return `Şu cümleyi öğret:\nCümle: ${p.SentenceEN}\nTürkçe: ${p.SentenceTR}\nYapı: ${p.GrammarStructure||p.Pattern}\nHata odağı: ${p.ErrorFocus||p.CommonMistakeTR}\nKontekst: ${p.Topic} / ${p.Scenario}\nKısa gramer açıklaması, Türklerin yapacağı hata ve 3 benzer cümle ver.`; if(kind==='word')return `Şu kelimeyi açıkla: ${p.word}\nTürkçe: ${p.tr||''}\nIPA: ${p.ipa||''}\nTürkçe okunuş: ${p.trPron||''}\nKontekstler: ${(p.contexts||[]).join(', ')}\nKelime ağacı, kullanım bağlamı ve 4 örnek cümle ver.`; return JSON.stringify(p);}
function localAI(kind,p){if(kind==='grammar')return `Yerel açıklama:\nBu cümlede ana yapı: ${p.GrammarStructure||p.Pattern||'belirtilmemiş'}.\nTürkçesi: ${p.SentenceTR||'—'}\nDikkat: ${p.ErrorFocus||p.CommonMistakeTR||'Kelime sırası ve yardımcı fiil doğru kullanılmalı.'}\nKontekst: ${p.Topic||''} ${p.Scenario||''}`; if(kind==='word')return `Yerel sözlük açıklaması:\n${p.word}: ${p.tr||'anlam bulunamadı'}\nOkunuş: ${p.trPron||'—'}\nIPA: ${p.ipa||'—'}\nBu kelime şu kontekstlerde geçiyor: ${(p.contexts||[]).slice(0,5).join(', ')||'—'}.`;return '';}
async function explainGrammar(){const r=activeRow();if(!r)return;document.getElementById('aiBox').innerHTML='<div class="dict-box">AI açıklaması hazırlanıyor...</div>';document.getElementById('aiBox').innerHTML='<div class="dict-box"><h3>🤖 AI Öğretmen</h3><pre style="white-space:pre-wrap;margin:0">'+escapeHTML(await callAI('grammar',r))+'</pre></div>';}
async function explainWordAI(word){const k=baseWord(word);const d=state.dict.get(k)||{word};const el=document.getElementById('wordAIBox');if(el)el.innerHTML='<div class="dict-box">AI kelime açıklaması hazırlanıyor...</div>';const txt=await callAI('word',d);if(el)el.innerHTML='<div class="dict-box"><h3>🤖 AI Kelime Koçu</h3><pre style="white-space:pre-wrap;margin:0">'+escapeHTML(txt)+'</pre></div>';}
function exportProgress(){const data={stats:state.stats,progress:[...state.progress.values()]};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='dil-haritasi-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
async function resetProgress(){if(!confirm('Tüm IndexedDB ilerlemesi silinsin mi?'))return;await dbClear('progress');state.progress.clear();state.stats={xp:0,streak:0,lastDay:null};await dbPut('stats',{id:'main',...state.stats});buildLessonQueue();renderAll();toast('İlerleme sıfırlandı.');}

(async function init(){await loadProgress();
  /* ORTAK VERİ: index.html'in indirdiği TumData'yı (wmStore IDB) paylaş.
     Varsa tekrar indirme YOK — yol.html ↔ index.html aynı veriyi kullanır. */
  var usedShared=false;
  try{
    var sdb = await new Promise(function(res,rej){
      var rq=indexedDB.open('wmStore',1);
      rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess=function(){ res(rq.result); }; rq.onerror=function(){ rej(rq.error); };
    });
    var rows = await new Promise(function(res){
      try{ var tx=sdb.transaction('kv','readonly'); var g=tx.objectStore('kv').get('wmPathData');
        g.onsuccess=function(){ res(g.result); }; g.onerror=function(){ res(null); }; }
      catch(e){ res(null); }
    });
    if(Array.isArray(rows) && rows.length){
      // bizim satır formatını yol.html formatına çevir (alan adları farklı)
      state.rows = rows.map(function(r,i){
        return { _id:(r.id||r.ID||('S'+i)), _row:i+2,
          ID:r.id||r.ID, Module:r.module||r.Module, Part:r.part||r.Part,
          LearningStage:r.stage||r.LearningStage, OrderIndex:r.order||r.OrderIndex||i,
          Level:r.level||r.Level, SentenceEN:r.sentence||r.SentenceEN,
          SentenceTR:r.sentenceTr||r.SentenceTR, GrammarStructure:r.grammar||r.GrammarStructure||'',
          Pattern:r.pattern||r.Pattern||'', Word:r.word||r.Word||'' };
      }).filter(function(r){ return r.SentenceEN; });
      if(state.rows.length){
        document.getElementById('dataPill').textContent=state.rows.length+' cümle';
        await loadDictionaries(); buildModules(); selectFirstAvailable(); renderAll();
        toast('Ortak veri yüklendi (index.html ile paylaşımlı)');
        usedShared=true;
      }
    }
  }catch(e){}
  if(!usedShared){
    if(!(await tryAutoLoad())){renderAll();toast('data/TumData_Temiz.xlsx bulunamadı. Manuel Excel seçebilirsin.');}
  }
})();

<script>
/* ============================================================
   YOL.HTML v8 WORD-REPO BRIDGE OVERRIDES
   - Renkler: GitHub WordMode formatındaki Excel colors alanı (word:#hex) varsa aynen kullanılır.
   - Görsel: fixes.js içindeki WM_getImageFor / WM_openAltSelector kullanılır. Yoksa uydurma resim basılmaz.
   - Sözlük: önce fixes.js WM_lookupDict + data/sozluk.json map, sonra yol.html indeksleri.
   ============================================================ */
(function(){
  'use strict';
  // v8: Review tarihi tamamen güvenli. setDate kullanılmaz; NaN/sonsuz/bozuk değer asla Invalid Date üretmez.
  function safeNum(v, fallback){
    const n = Number.parseFloat(String(v ?? '').replace(',', '.'));
    return Number.isFinite(n) ? n : fallback;
  }
  function safeISODateFromDays(days){
    let d = Math.round(safeNum(days, 1));
    if(!Number.isFinite(d) || d < 1) d = 1;
    if(d > 3650) d = 3650;
    const ts = Date.now() + d * 86400000;
    const dt = new Date(ts);
    if(Number.isNaN(dt.getTime())) return new Date(Date.now()+86400000).toISOString().slice(0,10);
    return dt.toISOString().slice(0,10);
  }
  window.nextReviewDate=function(weight=3,level=1){
    const lvRaw = Number.parseInt(String(level ?? '1'),10);
    const lv = Number.isFinite(lvRaw) ? Math.min(6, Math.max(0, lvRaw-1)) : 0;
    const baseDays = [1,2,4,7,14,30,60][lv] || 1;
    const w = safeNum(weight, 3);
    const extra = Math.max(0, Math.min(10, 6 - w));
    return safeISODateFromDays(baseDays + extra);
  };
  try{ nextReviewDate=window.nextReviewDate; }catch(e){}

  function firstVal(obj, keys){for(const k of keys){if(obj && obj[k]!=null && String(obj[k]).trim()) return String(obj[k]).trim();}return '';}
  function rowMeanings(row){
    if(!row) return [];
    const out=[];
    if(Array.isArray(row.meanings)) out.push(...row.meanings);
    ['tr','translation','meaning','anlam','anlam1','anlam2','anlam3','turkish','Türkçe','turkce','TurkishMeaning','turkishMeaning'].forEach(k=>{if(row[k]) out.push(String(row[k]));});
    return [...new Set(out.map(x=>String(x).trim()).filter(Boolean))];
  }
  function rowIPA(row){return firstVal(row,['ipa','IPA','Ipa','phoneme','phonetic_ipa']);}
  function rowPron(row){return firstVal(row,['tr_pron','pron','türkçe_okunuş','turkce_okunus','turkishPronunciation','TRPronunciation','TurkishPronunciation','phonetic']);}
  function rowLevel(row){return firstVal(row,['cefr','CEFR','level','Level','seviye','SentenceLevel']);}

  function roleOfToken(word, r, index){
    const w=String(word||'').toLowerCase().replace(/[’']/g,"'");
    const pat=String((r&&r.GrammarStructure)||'').toLowerCase();
    if(['i','you','he','she','it','we','they'].includes(w)) return 'subject';
    if(['am','is','are','was','were','be','been','being'].includes(w)) return 'be';
    if(['a','an','the'].includes(w)) return 'article';
    if(['in','on','at','to','for','from','with','by','of','about','into','over','under','after','before'].includes(w)) return 'prep';
    if(['and','but','or','because','although','however','therefore','so'].includes(w)) return 'conn';
    if(/ly$/.test(w)) return 'adv';
    if(pat.includes('verb') && index>0 && !['a','an','the','to'].includes(w)){
      if(['want','make','go','come','need','have','has','like','work','study','learn','speak','do','does','did','get','take','book','meet','call','help'].includes(w)) return 'verb';
    }
    const rec=(typeof window.WM_lookupDict==='function')?window.WM_lookupDict(w):null;
    const ms=rec?rowMeanings(rec).join(' '):'';
    if(/\[i\.\]/.test(ms)) return 'noun';
    if(/\[f\.\]/.test(ms)) return 'verb';
    if(/\[s\.\]/.test(ms)) return 'adj';
    return '';
  }

  function esc2(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
  function getColorString(r){return r && (r.colors||r.Colors||r.color||r.Color||r.Renkler||r.renkler||'')}
  function parseWordModeColors(r){
    const raw=String(getColorString(r)||'').trim(); const m={};
    if(!raw) return m;
    raw.split(/[,;|]/).forEach(x=>{let a=x.split(':'); if(a.length>=2){let k=baseWord(a[0]); let v=a.slice(1).join(':').trim(); if(k && /^#?[0-9a-f]{3,8}$/i.test(v)){ if(v[0]!=='#')v='#'+v; m[k]=v; } }});
    return m;
  }
  window.parseWordModeColors=parseWordModeColors;
  window.renderSentence=function(s,r){
    const colors=parseWordModeColors(r||{});
    const parts=String(s||'').match(/[A-Za-z][A-Za-z'’\-]*|[^A-Za-z]+/g)||[];
    return parts.map(part=>{
      if(!/^[A-Za-z]/.test(part)) return esc2(part);
      const key=baseWord(part); const col=colors[key];
      const st=col ? ` style="color:${esc2(col)}"` : '';
      return `<span class="tok"${st} onclick="openWord('${jsq(part)}')">${esc2(part)}</span>`;
    }).join('');
  };
  try{ renderSentence=window.renderSentence; }catch(e){}

  window.loadYolSentenceImage=async function(r){
    const wrap=document.getElementById('yolSentImgWrap'), img=document.getElementById('yolSentImg'), ph=document.getElementById('wm-s-imgph'), credit=document.getElementById('yolImgCredit');
    if(!wrap||!img||!r) return;
    wrap.style.display='none'; img.removeAttribute('src'); if(ph) ph.style.display='block'; if(credit) credit.textContent='';
    const word=(r.Word||r.Highlights||'').split(/[;,|]/)[0].trim();
    if(typeof window.WM_getImageFor!=='function') return;
    try{
      const url=await window.WM_getImageFor(r.SentenceEN||'', word||'');
      if(!url) return;
      img.onload=function(){wrap.style.display='block'; if(ph) ph.style.display='none';};
      img.onerror=function(){wrap.style.display='none';};
      img.src=url;
      if(credit) credit.textContent='Openverse / Commons / Wikipedia';
    }catch(e){ wrap.style.display='none'; }
  };

  window.renderLesson=function(){
    const el=document.getElementById('screen-lesson');
    if(!state.rows.length){el.innerHTML=`<div class="card"><h2>Başla</h2><p>Açılışta <span class="kbd">data/TumData_Temiz.xlsx</span> otomatik yüklenir. Manuel dosya seçmek için aşağıdaki düğmeyi kullan.</p><button class="btn" onclick="bootLoad()">Manuel Excel Seç</button></div>`;return;}

/* v9 HARD FIX: hiçbir eski markKnown/nextReviewDate RangeError üretemez.
   Butonlar window.markKnownSafe() çağırır. */
(function(){
  function n(v, fb){ const x=Number.parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(x) ? x : fb; }
  window.nextReviewDateSafe = function(weight, level){
    const lv = Math.min(6, Math.max(0, (Number.parseInt(String(level ?? '1'),10) || 1) - 1));
    const base = [1,2,4,7,14,30,60][lv] || 1;
    const extra = Math.max(0, Math.min(10, 6 - n(weight,3)));
    let days = Math.round(base + extra);
    if(!Number.isFinite(days) || days < 1) days = 1;
    if(days > 3650) days = 3650;
    return new Date(Date.now() + days * 86400000).toISOString().slice(0,10);
  };
  window.nextReviewDate = window.nextReviewDateSafe;
  window.markKnownSafe = async function(score=100){
    try{
      const r = (typeof activeRow === 'function') ? activeRow() : null;
      if(!r){ if(typeof toast==='function') toast('Aktif cümle yok.'); return; }
      const prev = state.progress.get(r._id) || {};
      const level = (parseInt(prev.srsLevel,10) || 0) + 1;
      const review = window.nextReviewDateSafe(r.ReviewWeight, level);
      await saveProgress(r._id, {
        known:true,
        completedAt:Date.now(),
        score,
        srsLevel:level,
        nextReview:review,
        module:r.Module,
        part:r.Part,
        sentence:r.SentenceEN
      });
      const diff = n(r.DifficultyScore, 50);
      await updateStats(Math.max(5, Math.round(diff/5)));
      state.activeIndex++;
      buildLessonQueue();
      renderAll();
      if(typeof toast==='function') toast('Kaydedildi. Bu cümle tekrar sorulmayacak.');
    }catch(err){
      console.error('markKnownSafe hata:', err);
      if(typeof toast==='function') toast('Kaydetme hatası: '+(err && err.message ? err.message : err));
    }
  };
  window.markKnown = window.markKnownSafe;
})();
</script>

    var d = (window.state && state.dict && state.dict.get(k)) || (window.state && state.dict && state.dict.get(String(k||'').toLowerCase())) || {word:k};
    var out = $('wordPanelResult');
    if(!out){ toast2('Kelime panel sonucu bulunamadı.'); return; }
    var ctx = (d.contexts||[]).slice(0,8).map(esc).join(', ') || 'Kontekst bulunamadı';
    var ex = (d.examples||[]).slice(0,4).map(function(e){return '<li>'+esc(e.en||'')+'<br><span class="muted">'+esc(e.tr||'')+'</span></li>'}).join('');
    out.innerHTML = '<div class="dict-box"><h3>🤖 Kelime Açıklama</h3>'+
      '<p><b>'+esc(d.word||k)+'</b>: '+esc(d.tr || (Array.isArray(d.meanings)?d.meanings.join(', '):'Yerel sözlükte anlam bulunamadı'))+'</p>'+
      '<p><b>IPA:</b> '+esc(d.ipa||'—')+' &nbsp; <b>Okunuş:</b> '+esc(d.trPron||'—')+'</p>'+
      '<p><b>Kontekst:</b> '+ctx+'</p>'+(ex?'<ol>'+ex+'</ol>':'')+'</div>';
  };

  window.yolWordRelations = function(k){
    var d = (window.state && state.dict && state.dict.get(k)) || (window.state && state.dict && state.dict.get(String(k||'').toLowerCase())) || {word:k};
    var out = $('wordPanelResult');
    if(!out){ toast2('Kelime panel sonucu bulunamadı.'); return; }
    var fam = d.family || d.wordFamily || d.WordFamily || '';
    var rel = [];
    if(Array.isArray(d.related)) rel = d.related;
    if(d.synonyms) rel = rel.concat(String(d.synonyms).split(/[;,|]/));
    if(d.collocations) rel = rel.concat(String(d.collocations).split(/[;,|]/));
    rel = rel.map(function(x){return String(x).trim()}).filter(Boolean).slice(0,30);
    out.innerHTML = '<div class="dict-box"><h3>🔗 Kelime İlişkileri</h3>'+
      '<p><b>Kök:</b> '+esc(d.word||k)+'</p>'+
      '<p><b>Kelime ailesi:</b> '+esc(fam || 'Sözlükte kayıt yok')+'</p>'+
      '<div class="row">'+(rel.length?rel.map(function(x){return '<button class="word-chip" onclick="openWord(\''+q(x)+'\')">'+esc(x)+'</button>'}).join(''):'<span class="muted">İlişki bulunamadı.</span>')+'</div></div>';
  };

  // Kelime kayıt: izin yoksa hata verme, kullanıcıya net bilgi ver.
  window.startWordRecord = function(word){
    var out = $('wordRecordResult');
    if(out) out.innerHTML='<div class="dict-box">🎙️ Mikrofon hazırlanıyor...</div>';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      if(out) out.innerHTML='<div class="badline">Bu tarayıcıda mikrofon erişimi yok.</div>';
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(out) out.innerHTML='<div class="okline">Kayıt başladı. 3 saniye oku: <b>'+esc(word)+'</b></div>';
      var rec = new MediaRecorder(stream), chunks=[];
      rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
      rec.onstop=function(){
        stream.getTracks().forEach(function(t){t.stop()});
        var blob=new Blob(chunks,{type:'audio/webm'}); var url=URL.createObjectURL(blob);
        if(out) out.innerHTML='<div class="okline">Kayıt tamamlandı.</div><audio controls src="'+url+'" style="width:100%;margin-top:8px"></audio>';
      };
      rec.start(); setTimeout(function(){try{rec.stop()}catch(e){}},3000);
    }).catch(function(err){ if(out) out.innerHTML='<div class="badline">Mikrofon izni alınamadı: '+esc(err.message||err)+'</div>'; });
  };

  // Render içindeki Word Shadow butonu kesin olarak bizim panele bağlansın.
  var oldRenderLesson = window.renderLesson;

<script>
/* ============================================================
   YOL.HTML v14 GROQ + WORD RELATIONS FIX
   - Kelime İlişkileri düğmesi artık hem yerel sözlük/Excel ilişki verisini gösterir
     hem de Groq ile kelime ağı üretir.
   - Groq key önce index.html/WordMode ayarlarındaki localStorage kayıtlarından okunur.
   - Bulunamazsa Araçlar ekranındaki Groq alanına girilebilir.
   ============================================================ */
(function(){
  'use strict';
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clean = (s)=>String(s ?? '').trim();
  const norm = (s)=>clean(s).toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');
  const uniq = (arr)=>[...new Set(arr.map(x=>clean(x)).filter(Boolean))];
  function toast(msg){ if(typeof window.toast==='function') window.toast(msg); else console.log(msg); }

  function parseMaybeJSON(v){ try{return JSON.parse(v)}catch(e){return null} }
  function deepFindGroqKeys(obj, out=[]){
    if(!obj) return out;
    if(typeof obj==='string'){
      const ms = obj.match(/gsk_[A-Za-z0-9_\-]{20,}/g);
      if(ms) out.push(...ms);
      return out;
    }
    if(Array.isArray(obj)){ obj.forEach(x=>deepFindGroqKeys(x,out)); return out; }
    if(typeof obj==='object'){
      Object.entries(obj).forEach(([k,v])=>{
        if(/groq|api/i.test(k)) deepFindGroqKeys(v,out);
        else if(typeof v==='string' && /gsk_/.test(v)) deepFindGroqKeys(v,out);
        else if(typeof v==='object') deepFindGroqKeys(v,out);
      });
    }
    return out;
  }
  window.yolGetGroqKeys = function(){
    const keys=[];
    const direct=['groqApiKey','groq_api_key','GROQ_API_KEY','groqKey','groq_key','apiKeyGroq','apiKey_groq','wm_groq_key','wordmode_groq_key'];
    direct.forEach(k=>{try{const v=localStorage.getItem(k); if(v) deepFindGroqKeys(v,keys)}catch(e){}});
    // WordMode index.html ayarları farklı isimle tutuyorsa tüm localStorage içinde ara.
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i); const v=localStorage.getItem(k)||'';
        if(/groq|api|key|settings|ayar/i.test(k) || /gsk_/.test(v)){
          deepFindGroqKeys(v,keys);
          const j=parseMaybeJSON(v); if(j) deepFindGroqKeys(j,keys);
        }
      }
    }catch(e){}
    if(window.state && state.settings){
      ['groqApiKey','groqKey','apiKey','apiKey1','apiKey2','apiKey3'].forEach(k=>deepFindGroqKeys(state.settings[k],keys));
    }
    return uniq(keys);
  };
  window.yolGetGroqModel = function(){
    const candidates=[];
    try{
      const s = window.state && state.settings ? state.settings : {};
      candidates.push(s.groqModel, s.model);
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i); const v=localStorage.getItem(k)||'';
        if(/model|settings|ayar/i.test(k)) candidates.push(v);
      }
    }catch(e){}
    const joined=candidates.filter(Boolean).join(' ');
    const m=joined.match(/llama[-\w.]*70b[-\w.]*|llama[-\w.]*8b[-\w.]*|mixtral[-\w.]*|gemma[-\w.]*/i);
    return (m && m[0]) || 'llama-3.3-70b-versatile';
  };

  async function callGroq(prompt, opt={}){
    const keys=window.yolGetGroqKeys();
    if(!keys.length) throw new Error('Groq API key bulunamadı. Index.html Ayarlarındaki Groq key aynı tarayıcıda kayıtlı olmalı ya da Araçlar’dan girilmeli.');
    const model=opt.model || window.yolGetGroqModel();
    let lastErr='';
    for(const key of keys){
      try{
        const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
          body:JSON.stringify({
            model,
            messages:[
              {role:'system',content:'Sen Türkçe konuşan İngilizce öğretmenisin. Kısa, net ve tablo gibi düzenli cevap ver. Uydurma yapma; verilen sözlük/Excel verisini esas al.'},
              {role:'user',content:prompt}
            ],
            temperature:0.25,
            max_tokens:opt.max_tokens||700
          })
        });
        if(!res.ok){ lastErr='Groq '+res.status+': '+(await res.text()).slice(0,220); continue; }
        const data=await res.json();
        return data?.choices?.[0]?.message?.content || '';
      }catch(e){ lastErr=e.message||String(e); }
    }
    throw new Error(lastErr||'Groq çağrısı başarısız.');
  }
  window.yolCallGroq = callGroq;

  function getDict(word){
    const k=norm(word);
    if(window.state && state.dict){
      return state.dict.get(k) || state.dict.get(clean(word)) || {word};
    }
    return {word};
  }
  function splitList(v){
    if(!v) return [];
    if(Array.isArray(v)) return v;
    return String(v).split(/[;,|\n]+/).map(x=>x.trim()).filter(Boolean);
  }
  function localRelations(d,k){
    const rel=[];
    ['related','relations','synonyms','Synonyms','antonyms','Antonyms','collocations','Collocations','wordFamily','WordFamily','family'].forEach(f=>rel.push(...splitList(d[f])));
    const examples=Array.isArray(d.examples)?d.examples:[];
    const contexts=splitList(d.contexts || d.context || d.Topic || d.Scenario);
    return {rel:uniq(rel).slice(0,40), examples, contexts};
  }
  function relationPrompt(d,k){
    const lr=localRelations(d,k);
    return `Kelime: ${d.word||k}
Türkçe anlam: ${d.tr||d.meaning||''}
IPA: ${d.ipa||''}
Türkçe okunuş: ${d.trPron||''}
CEFR: ${d.cefr||''}
Yerel ilişkiler: ${lr.rel.join(', ')}
Kontekstler: ${lr.contexts.join(', ')}
Örnekler: ${lr.examples.slice(0,5).map(e=>(e.en||'')+' = '+(e.tr||'')).join(' | ')}

Bu kelime için Türkçe açıklamalı bir kelime ilişkileri paneli üret.
Şu başlıkları kullan:
1) Kelime ailesi / türevler
2) Eş anlam - yakın anlam
3) Zıt anlam
4) Collocation / birlikte kullanılan kelimeler
5) Gerçek hayat kontekstleri
6) 5 kısa örnek cümle.
Cevabı kısa ve düzenli ver.`;
  }

  window.yolWordRelations = async function(k){
    const d=getDict(k); const out=$('wordPanelResult');
    if(!out){ toast('Kelime panel sonucu bulunamadı.'); return; }
    const lr=localRelations(d,k);
    const localHtml = '<div class="dict-box"><h3>🔗 Yerel Kelime İlişkileri</h3>'+
      '<p><b>Kök:</b> '+esc(d.word||k)+'</p>'+
      '<p><b>Kelime ailesi:</b> '+esc(d.wordFamily||d.WordFamily||d.family||'Yerel sözlükte kayıt yok')+'</p>'+
      '<div class="row">'+(lr.rel.length?lr.rel.map(x=>'<button class="word-chip" onclick="openWord(\''+String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+esc(x)+'</button>').join(''):'<span class="muted">Yerel ilişkiler sınırlı; Groq ile genişletiliyor.</span>')+'</div>'+
      (lr.contexts.length?'<h4>Kontekst</h4>'+lr.contexts.map(c=>'<span class="pill">'+esc(c)+'</span>').join(' '):'')+
      '</div><div class="dict-box" id="groqRelationsBox">🤖 Groq kelime ağı hazırlanıyor...</div>';
    out.innerHTML=localHtml;
    const box=$('groqRelationsBox');
    try{
      const txt=await callGroq(relationPrompt(d,k),{max_tokens:900});
      if(box) box.innerHTML='<h3>🤖 Groq Kelime Ağı</h3><pre style="white-space:pre-wrap;margin:0">'+esc(txt)+'</pre>';
    }catch(e){
      if(box) box.innerHTML='<h3>🤖 Groq bağlantısı yok</h3><p class="badline">'+esc(e.message||e)+'</p><p class="muted small">Index.html Ayarlar’daki Groq key aynı domain localStorage içinde bulunamazsa buradan key girmen gerekir.</p>';
    }
  };

  // callAI artık Groq öncelikli. Gramer/kelime açıklamalarında da OpenRouter yerine Groq kullanılır.
  const oldLocalAI = window.localAI;
  window.callAI = async function(kind,payload){
    const prompt = (typeof window.buildAIPrompt==='function') ? window.buildAIPrompt(kind,payload) : JSON.stringify(payload,null,2);
    try{ return await callGroq(prompt,{max_tokens:700}); }
    catch(e){ return (typeof oldLocalAI==='function'?oldLocalAI(kind,payload):'Yerel açıklama üretilemedi.')+'\n\n(Groq çalışmadı: '+(e.message||e)+')'; }
  };

  // Araçlar ekranına Groq durumu ve manuel key alanı ekle.
  const oldRenderTools=window.renderTools;
  window.renderTools=function(){
    if(typeof oldRenderTools==='function') oldRenderTools();
    const screen=$('screen-tools'); if(!screen) return;
    const found=window.yolGetGroqKeys().length;
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML='<h2>🤖 Groq Ayarları</h2><p class="muted">Index.html Ayarlar bölümündeki Groq key otomatik okunur. Bulunan key sayısı: <b>'+found+'</b></p><input class="input" id="yolGroqKey" type="password" placeholder="Groq API key gsk_..."><input class="input" id="yolGroqModel" placeholder="Groq model" value="'+esc(window.yolGetGroqModel())+'"><div class="row" style="margin-top:10px"><button class="btn green" onclick="yolSaveGroqSettings()">Groq Ayarını Kaydet</button></div>';
    screen.appendChild(div);
  };
  window.yolSaveGroqSettings=function(){
    const key=($('yolGroqKey')?.value||'').trim(); const model=($('yolGroqModel')?.value||'').trim();
    if(key) localStorage.setItem('groqApiKey',key);
    if(model) localStorage.setItem('groqModel',model);
    if(window.state && state.settings){ state.settings.groqApiKey=key||state.settings.groqApiKey; state.settings.groqModel=model||state.settings.groqModel; }
    toast('Groq ayarı kaydedildi.');
  };

  console.log('✅ yol.html v14 GROQ_RELATIONS_FIX yüklendi | Groq key sayısı:', window.yolGetGroqKeys().length);
})();
</script>

<script>
/* ============================================================
   YOL.HTML v15 CLICKABLE WORDS + ROLE COLORING
   - Cümle içindeki her kelime popup açar.
   - Renk önceliği: Excel colors/renk alanı > GrammarStructure sıralaması > sozluk.json POS.
   - Kelime ağı düğmeleri popup ile devam eder.
   ============================================================ */
(function(){
  'use strict';
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jsq=(s)=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
  const norm=(s)=>String(s??'').toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');
  const base=(w)=>{try{return typeof baseWord==='function'?baseWord(w):norm(w)}catch(e){return norm(w)}};
  const tokenize2=(s)=>String(s||'').match(/[A-Za-z][A-Za-z'’\-]*|[^A-Za-z]+/g)||[];

  function roleFromGrammarAt(r,idx,w){
    const gs=String((r&&r.GrammarStructure)||'').toLowerCase();
    if(!gs) return '';
    const pieces=gs.split(/\s*\+\s*|\s*>\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean);
    const p=pieces[idx]||'';
    if(/subject|pronoun/.test(p)) return 'subject';
    if(/be verb|\bbe\b|am\/is\/are/.test(p)) return 'be';
    if(/article|a\/an|determiner/.test(p)) return 'article';
    if(/preposition|prep/.test(p)) return 'prep';
    if(/connector|conjunction|because|although/.test(p)) return 'conn';
    if(/adjective|adj/.test(p)) return 'adj';
    if(/adverb|adv/.test(p)) return 'adv';
    if(/noun|object|complement/.test(p)) return 'noun';
    if(/verb|modal|auxiliary/.test(p)) return 'verb';
    return '';
  }
  function roleFromWordRepo(w){
    const lw=base(w);
    if(['i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','our','their'].includes(lw)) return 'subject';
    if(['am','is','are','was','were','be','been','being'].includes(lw)) return 'be';
    if(['a','an','the'].includes(lw)) return 'article';
    if(['in','on','at','to','for','from','with','by','of','about','into','over','under','after','before','between','near'].includes(lw)) return 'prep';
    if(['and','but','or','because','although','however','therefore','so','while','when','if'].includes(lw)) return 'conn';
    let rec=null; try{ if(typeof window.WM_lookupDict==='function') rec=window.WM_lookupDict(w); }catch(e){}
    const m=rec ? (Array.isArray(rec.meanings)?rec.meanings.join(' '):JSON.stringify(rec)).toLowerCase() : '';
    if(/\[f\.\]|verb|fiil/.test(m)) return 'verb';
    if(/\[i\.\]|noun|isim/.test(m)) return 'noun';
    if(/\[s\.\]|adjective|sıfat|sifat/.test(m)) return 'adj';
    if(/\[z\.\]|adverb|zarf/.test(m)) return 'adv';
    if(/ly$/.test(lw)) return 'adv';
    return '';
  }
  function roleOf(w,r,idx){
    let role=roleFromGrammarAt(r,idx,w);
    if(role) return role;
    try{ if(typeof roleOfToken==='function') role=roleOfToken(w,r,idx); }catch(e){}
    return role || roleFromWordRepo(w);
  }
  function parseColors(r){
    try{ if(typeof parseWordModeColors==='function') return parseWordModeColors(r||{}); }catch(e){}
    const raw=String((r&&(r.colors||r.Colors||r.Renkler||r.renkler))||''); const out={};
    raw.split(/[,;|]/).forEach(x=>{const a=x.split(':'); if(a.length>=2){const k=base(a[0]); let v=a.slice(1).join(':').trim(); if(k&&/^#?[0-9a-f]{3,8}$/i.test(v)){if(v[0]!=='#')v='#'+v; out[k]=v;}}});
    return out;
  }
  window.renderSentence=function(sentence,row){
    const r=row||{}; const colors=parseColors(r); let wordIndex=0;
    return tokenize2(sentence).map(part=>{
      if(!/^[A-Za-z]/.test(part)) return esc(part);
      const k=base(part), col=colors[k];
      const role=roleOf(part,r,wordIndex++);
      const cls='tok '+(role?('pos-'+role):'');
      const title=role ? (' title="'+esc(role)+'"') : '';
      const style=col ? (' style="color:'+esc(col)+'"') : '';
      return '<span class="'+cls+'"'+style+title+' onclick="openWord(\''+jsq(part)+'\')">'+esc(part)+'</span>';
    }).join('');
  };
  try{ renderSentence=window.renderSentence; }catch(e){}

  function legendHtml(){
    return '<div class="role-legend">'+
      '<span class="role-dot pos-subject">Subject</span>'+
      '<span class="role-dot pos-be">Be</span>'+
      '<span class="role-dot pos-verb">Verb</span>'+
      '<span class="role-dot pos-article">Article</span>'+
      '<span class="role-dot pos-noun">Noun</span>'+
      '<span class="role-dot pos-prep">Prep</span>'+
      '</div>';
  }

  const oldRender=window.renderLesson;
  window.renderLesson=function(){
    if(typeof oldRender==='function') oldRender();
    setTimeout(()=>{
      const card=document.querySelector('#screen-lesson .lesson-main-card, #screen-lesson .card');
      if(card && !card.querySelector('.role-legend')){
        const meta=card.querySelector('.meta');
        if(meta) meta.insertAdjacentHTML('afterend',legendHtml());
      }
      document.querySelectorAll('#screen-lesson .word-chip').forEach(btn=>{
        if(!btn.classList.contains('role-chip')) btn.classList.add('role-chip');
      });
    },0);
  };
  try{renderLesson=window.renderLesson;}catch(e){}
  if(typeof renderAll==='function') setTimeout(()=>{try{renderAll()}catch(e){console.error(e)}},100);
  console.log('✅ yol.html v15 CLICKABLE_WORDS_ROLE_COLOR yüklendi');
})();
</script>


<script>
/* ============================================================
   YOL.HTML v22 PART CLICK START FIX
   - SentenceEN başlığı esas alınır.
   - SentenceEN gramer kalıbıysa kullanıcıya kalıp gösterilmez; somut cümleye çevrilir.
   - GrammarStructure yalnızca Yapı etiketi olur.
   - Pekiştirme aktiviteleri her cümlenin altında açılır.
   ============================================================ */
(function(){
  'use strict';
  const esc = (s)=>String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jsq = (s)=>String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
  const clean = (s)=>String(s ?? '').replace(/\s+/g,' ').trim();
  const low = (s)=>clean(s).toLowerCase();

  document.title='Yol Haritası v22 • Part Click Start Fix';
  setTimeout(()=>{ const h=document.querySelector('.hero h1'); if(h) h.textContent='Dil Haritası PRO v30'; },0);

  function isGrammarPattern(s){
    s=clean(s);

<script>

      '<div class="practice"><h3>3) Kontekst ve kelime ağı</h3><p class="muted small">Cümledeki kelimelere tıkla. Ana lookup Word repo sozluk.json mapinden gelir.</p><div class="row">'+chips+'</div></div>'+
      inlineLabHtml(r);
    setTimeout(()=>{ if(window.yolEnsureImage) window.yolEnsureImage(Object.assign({},r,{SentenceEN:sentence,ImageKeywords:imgQuery})); },0);
  }
  window.renderLesson = renderLessonStable;

  window.selectPart = function(mi,pi){

  const oldRenderAll = window.renderAll || (typeof renderAll==='function'?renderAll:null);

    if(typeof renderProgress==='function') renderProgress();
    if(typeof renderTools==='function') renderTools();
  };
  try{ renderAll=window.renderAll; }catch(e){}

  setTimeout(()=>{ try{ window.state=state; renderAll(); }catch(e){ console.error('v30 patch render hata:',e); } },250);

<script id="sukran-focus-practice-script">
(function(){
  'use strict';
  document.body.classList.add('yol-focus-mode');
  window.__activePracticePanel = 0;
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
  function clean(s){return String(s??'').replace(/\s+/g,' ').trim()}
  function toks(s){return (clean(s).match(/[A-Za-z][A-Za-z'’\-]*/g)||[])}
  function row(){try{return (typeof activeRow==='function')?activeRow():null}catch(e){return null}}
  function sentenceOf(r){
    if(!r) return '';
    var en=clean(r.SentenceEN || r.EN || r.sentence || r.CumleEN || '');
    var tr=clean(r.SentenceTR || r.TR || r.SentenceTr || r.Turkce || r.Türkçe || '');
    if(typeof isProbablyTurkishText==='function' && typeof isProbablyEnglishSentence==='function' && isProbablyTurkishText(en) && isProbablyEnglishSentence(tr)) return tr;
    return en;
  }
  function trOf(r){
    if(!r) return '';
    var en=clean(r.SentenceEN || r.EN || r.sentence || r.CumleEN || '');
    var tr=clean(r.SentenceTR || r.TR || r.SentenceTr || r.Turkce || r.Türkçe || '');
    if(typeof isProbablyTurkishText==='function' && typeof isProbablyEnglishSentence==='function' && isProbablyTurkishText(en) && isProbablyEnglishSentence(tr)) return en;
    return tr;
  }
  function similarRows(r,limit){
    var s=sentenceOf(r), out=[];
    try{
      out=(state.rows||[]).filter(function(x){return x&&x._id!==r._id&&x.SentenceEN&&((x.GrammarStructure&&r.GrammarStructure&&x.GrammarStructure===r.GrammarStructure)||(x.Module&&r.Module&&x.Module===r.Module)||(x.Topic&&r.Topic&&x.Topic===r.Topic));}).slice(0,limit||7).map(sentenceOf).filter(Boolean);
    }catch(e){}
    if(out.length) return Array.from(new Set(out)).slice(0,limit||7);
    if(/\b(am|is|are)\b/i.test(s)) return ['I am ready.','She is at home.','They are happy.','We are late.'];
    if(/\b(have|has)\b/i.test(s)) return ['I have a phone.','She has a sister.','We have a lesson.','Do you have time?'];
    return [s,'Can you say it again?','I want to practice this sentence.','I use this sentence every day.'];
  }
  function familyRows(r){
    var s=sentenceOf(r), arr=[s];
    if(/^I\s+/i.test(s)){arr.push(s.replace(/^I\s+/i,'She '),s.replace(/^I\s+/i,'They '));}
    if(/\.$/.test(s)) arr.push(s.replace(/\.$/,'?'));
    return Array.from(new Set(arr.concat(similarRows(r,3)))).slice(0,7);
  }
  function quizText(r){return sentenceOf(r).replace(/\b(am|is|are|have|has|had|do|does|did|don\'t|a|an|the|to|in|on|at)\b/i,'_____')}
  function currentPracticeHtml(n){
    var r=row(); if(!r) return '<div class="badline">Aktif cümle bulunamadı.</div>';
    var s=sentenceOf(r), tr=trOf(r), sim=similarRows(r,7), fam=familyRows(r), pod='Hello. Today we practice this sentence. '+sim.slice(0,3).join(' ');
    if(n===1) return '<h2>1) Dinle ve Shadow Yap</h2><div class="practice"><p class="muted">Cümleyi dinle, sonra aynı ritimle oku.</p><div class="row"><button class="btn" onclick="speakSentence()">🔊 Cümleyi Oku</button><button class="btn secondary" onclick="startShadow()">🎙️ Kaydet</button><button class="btn secondary" onclick="stopShadow()">⏹️ Durdur</button><button class="btn secondary" onclick="playRecording()">▶️ Kendi Sesim</button></div><div id="shadowResult" class="muted small" style="margin-top:10px">Hazır.</div></div>';
    if(n===2) return '<h2>2) Türkçeden İngilizceye Yaz</h2><div class="practice"><p class="muted">Türkçe: '+esc(tr)+'</p><input class="input" id="answerInput" placeholder="İngilizce cümleyi yaz..." onkeydown="if(event.key===\'Enter\')checkAnswer()"><div class="row" style="margin-top:10px"><button class="btn green" onclick="checkAnswer()">Kontrol Et</button><button class="btn secondary" onclick="showHint()">İpucu</button></div><div id="answerResult" style="margin-top:10px"></div></div>';
    if(n===3) return '<h2>3) Kelime ve Kontekst</h2><div class="practice"><p class="muted">Kelimelere dokun; sözlük ve kelime ağı açılsın.</p><div class="row">'+toks(s).map(function(w){return '<button class="word-chip" onclick="openWord(\''+jsq(w)+'\')">'+esc(w)+'</button>'}).join('')+'</div></div>';
    if(n===4) return '<h2>4) Benzer Cümleler</h2><div class="practice"><div class="row">'+sim.map(function(x){return '<button class="word-chip" onclick="speakText(\''+jsq(x)+'\')">🔊 '+esc(x)+'</button>'}).join('')+'</div></div>';
    if(n===5) return '<h2>5) Cümle Ailesi</h2><div class="practice">'+fam.map(function(x){return '<div class="list-item"><b>'+esc(x)+'</b></div>'}).join('')+'</div>';
    if(n===6) return '<h2>6) Mini Quiz</h2><div class="practice"><p class="sentence" style="font-size:24px">'+esc(quizText(r))+'</p><div class="row"><button class="btn green" onclick="toast(\'Cevap: '+jsq(s)+'\')">Cevabı Göster</button><button class="btn secondary" onclick="speakText(\''+jsq(s)+'\')">🔊 Oku</button></div><div class="dict-box"><b>Karıştır-Düzelt:</b><br>'+esc(toks(s).reverse().join(' '))+'</div></div>';
    if(n===7) return '<h2>7) Mikro Podcast / AI Sohbet</h2><div class="practice"><p>'+esc(pod)+'</p><div class="row"><button class="btn" onclick="speakText(\''+jsq(pod)+'\')">🎧 Podcast Oku</button><button class="btn warn" onclick="yolAskGroqForPractice&&yolAskGroqForPractice()">🤖 AI Pekiştirme Üret</button></div><div id="labGroqInline" style="margin-top:10px"></div></div>';
    return '';
  }
  window.toggleLeftPanel=function(force){
    var p=$('leftPanel'), sh=$('leftPanelShade'); if(!p) return;
    var open=(force===undefined)?!p.classList.contains('show'):!!force;
    p.classList.toggle('show',open); if(sh) sh.classList.toggle('show',open);
  };
  window.togglePracticeScreen=function(n){
    var stage=$('practiceStage'), main=$('mainFocusArea'); if(!stage||!main) return;
    var same=window.__activePracticePanel===n && stage.classList.contains('show');
    if(same){window.__activePracticePanel=0;stage.classList.remove('show');stage.innerHTML='';main.style.display='block';document.querySelectorAll('.practice-toggle-btn').forEach(function(b){b.classList.remove('active')});return;}
    window.__activePracticePanel=n; main.style.display='none';
    stage.innerHTML='<button class="btn secondary practice-back" onclick="togglePracticeScreen('+n+')">← Ana Ekrana Dön</button>'+currentPracticeHtml(n);
    stage.classList.add('show');
    document.querySelectorAll('.practice-toggle-btn').forEach(function(b){b.classList.toggle('active',String(b.getAttribute('data-p'))===String(n))});

  };
  function practiceButtons(){
    var labels=['Shadow','Yaz','Kelimeler','Benzer','Aile','Quiz','Podcast/AI'];
    return '<div class="practice-menu-card"><div class="practice-menu-grid">'+labels.map(function(l,i){var n=i+1;return '<button class="practice-toggle-btn" data-p="'+n+'" onclick="togglePracticeScreen('+n+')">'+n+'<br>'+esc(l)+'</button>'}).join('')+'</div></div><div id="practiceStage" class="practice-screen"></div>';
  }
  function renderFocusLesson(){
    var el=$('screen-lesson'); if(!el) return;
    if(!state || !Array.isArray(state.rows) || !state.rows.length){el.innerHTML='<div class="card"><h2>Başla</h2><p>Açılışta <span class="kbd">data/TumData_Temiz.xlsx</span> otomatik yüklenir. Manuel dosya seçmek için aşağıdaki düğmeyi kullan.</p><button class="btn" onclick="bootLoad()">Manuel Excel Seç</button></div>';return;}
    var r=row(); if(!r){el.innerHTML='<div class="card"><h2>🎉 Bu parça bitti</h2><p class="muted">Bu parçadaki açık cümle kalmadı.</p><button class="btn green" onclick="goNextPart()">Sonraki Parçaya Geç</button></div>';return;}
    window.__activePracticePanel=0;
    var s=sentenceOf(r), tr=trOf(r), word=String(r.Word||r.Highlights||'').split(/[;,|]/)[0].trim(), imgQuery=clean(r.ImageKeywords||r.Scenario||r.Topic||s);
    var rendered=(typeof window.renderSentence==='function')?window.renderSentence(s,r):esc(s);
    var alt='onclick="if(window.WM_openAltSelector){WM_openAltSelector(\''+jsq(imgQuery)+'\',\''+jsq(word)+'\',\'yolSentImg\')}else{toast(\'Word repo görsel seçici yüklenmedi.\')}"';
    el.innerHTML='<div id="mainFocusArea"><div class="card lesson-main-card focus-card">'+
      '<div class="row lesson-top" style="justify-content:space-between;align-items:flex-start"><div><div class="muted small">'+esc(state.activePart?.m?.name||'')+' • '+esc(state.activePart?.p?.name||'')+' • '+(state.activeIndex+1)+'/'+(state.lessonQueue?.length||1)+'</div><div class="lesson-title">'+esc(r.LearningStage||'Ders')+'</div></div><button class="btn secondary know-btn" onclick="window.markKnownSafe?window.markKnownSafe():markKnown()">Biliyorum / Geç</button></div>'+
      '<div class="context-img-wrap" id="yolSentImgWrap" style="display:block"><img id="yolSentImg" alt=""><div id="wm-s-imgph" class="muted small" style="padding:14px;text-align:center">Görsel Word repo motorundan aranıyor...</div><div class="context-img-footer"><button class="btn secondary" '+alt+'>🔄 Alternatif Seç</button> <span id="yolImgCredit"></span></div></div>'+
      '<div class="sentence">'+rendered+'</div><div class="tr">'+esc(tr)+'</div>'+
      '<div class="meta"><span class="pill">IPA: '+esc(r.IPA||'—')+'</span><span class="pill">Okunuş: '+esc(r.TRPronunciation||'—')+'</span><span class="pill">Seviye: '+esc(r.SentenceLevel||r.Level||'')+'</span><span class="pill">Zorluk: '+esc(r.DifficultyScore||'')+'</span><span class="pill">Yapı: '+esc(r.GrammarStructure||'')+'</span></div></div></div>'+practiceButtons();
    setTimeout(function(){ if(window.yolEnsureImage) window.yolEnsureImage(Object.assign({},r,{SentenceEN:s,ImageKeywords:imgQuery})); },0);
  }
  window.renderLesson=renderFocusLesson;
  try{renderLesson=window.renderLesson}catch(e){}
  var oldRenderAll=window.renderAll || (typeof renderAll==='function'?renderAll:null);
  window.renderAll=function(){
    try{if(typeof renderHeader==='function')renderHeader(); if(typeof renderLeft==='function')renderLeft(); renderFocusLesson(); if(typeof renderDict==='function')renderDict(); if(typeof renderReview==='function')renderReview(); if(typeof renderProgress==='function')renderProgress(); if(typeof renderTools==='function')renderTools();}catch(e){console.error('Şükran focus render hata:',e); if(oldRenderAll) oldRenderAll();}
  };
  try{renderAll=window.renderAll}catch(e){}
  var oldSelectPart=window.selectPart || (typeof selectPart==='function'?selectPart:null);
  window.selectPart=function(mi,pi){
    if(oldSelectPart) oldSelectPart(mi,pi);
    toggleLeftPanel(false);
    setTimeout(function(){try{renderFocusLesson()}catch(e){}},30);
  };
  try{selectPart=window.selectPart}catch(e){}
  setTimeout(function(){try{renderAll()}catch(e){}},350);
})();
</script>

  window.yolUseSimilarAsMain=function(en,tr){

    const missing=B.filter(x=>!A.includes(x)).slice(0,8), extra=A.filter(x=>!B.includes(x)).slice(0,8);

  window.yolAskGroqForPractice=async function(){

<script id="ai-prompt-edit-clickable-v3-script">
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jsq=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
  const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
  function active(){try{return typeof activeRow==='function'?activeRow():null}catch(e){return null}}
  function isTR(s){return /[çğıöşüÇĞİÖŞÜ]|\b(ben|sen|biz|bir|ve|için|değil|miyim|musun|sonuç|çalışma|olabilir|alabilir|tutarlar|türkçe|cevap|neden|boşluk|görev)\b/i.test(clean(s))}
  function isEN(s){return /[A-Za-z]/.test(clean(s))&&!isTR(s)}
  function enOf(r){let en=clean(r?.SentenceEN||r?.EN||r?.English||''), tr=clean(r?.SentenceTR||r?.TR||r?.Turkish||''); if(isTR(en)&&isEN(tr))return tr; return en}
  function trOf(r){let en=clean(r?.SentenceEN||r?.EN||r?.English||''), tr=clean(r?.SentenceTR||r?.TR||r?.Turkish||''); if(isTR(en)&&isEN(tr))return en; return tr}
  function grammar(r){return clean(r?.GrammarStructure||r?.Pattern||r?.LearningStage||'')}
  function toks(s){return clean(s).match(/[A-Za-z][A-Za-z'’\-]*/g)||[]}
  function norm(s){return clean(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
  function similarObjects(r,limit=6){
    const out=[], seen=new Set();
    try{(state.rows||[]).forEach(x=>{if(!x||x._id===r._id)return; const en=enOf(x), tr=trOf(x); if(!en||seen.has(norm(en)))return; const ok=(x.GrammarStructure&&r.GrammarStructure&&x.GrammarStructure===r.GrammarStructure)||(x.Module&&r.Module&&x.Module===r.Module)||(x.Topic&&r.Topic&&x.Topic===r.Topic); if(ok){seen.add(norm(en));out.push({en,tr})}})}catch(e){}
    [['Can you say it again?','Bunu tekrar söyleyebilir misin?'],['I want to practice this sentence.','Bu cümleyi çalışmak istiyorum.'],['We need more information.','Daha fazla bilgiye ihtiyacımız var.'],['This may indicate a problem.','Bu bir soruna işaret edebilir.']].forEach(a=>{if(out.length<limit&&!seen.has(norm(a[0]))){seen.add(norm(a[0]));out.push({en:a[0],tr:a[1]})}});
    return out.slice(0,limit);
  }
  function defaultPrompt(r){
    return 'Şu İngilizce cümle için Türkçe açıklamalı mini öğretmen pekiştirmesi üret.\n\n'+
      'Cümle: {{EN}}\nTürkçe: {{TR}}\nYapı: {{GRAMMAR}}\n\n'+
      'Zorunlu format:\n'+
      '1) İngilizce+Türkçe 6 benzer cümle yaz. Her satır: English sentence - Türkçe anlam\n'+
      '2) Cevapları ve nedenleriyle 6 boşluk doldurma yaz.\n'+
      '3) Mini sohbet yaz. İngilizce cümlelerin Türkçesini hemen altına ekle.\n'+
      '4) 30 saniyelik podcast metni yaz.\n'+
      '5) Gerçek hayat yazma görevi ver.\n\n'+
      'Kurallar: İngilizce cümleler kısa ve doğal olsun. Türkçe yönergeler kullan. Cevapları açıkça belirt.';
  }
  function resolvedPrompt(r){
    const ta=$('aiPracticePrompt');
    let p=(ta&&ta.value.trim())?ta.value:defaultPrompt(r);
    return p.replaceAll('{{EN}}',enOf(r)).replaceAll('{{TR}}',trOf(r)).replaceAll('{{GRAMMAR}}',grammar(r));
  }
  function wordSpan(w,green){return '<span class="ai-word'+(green?' ai-en-sentence':'')+'" onclick="openWord(\''+jsq(w)+'\')">'+esc(w)+'</span>'}
  function clickableSegment(seg,green){return String(seg).replace(/[A-Za-z][A-Za-z'’\-]*/g,m=>wordSpan(m,green));}
  function lineLooksEnglish(line){
    const l=clean(line); if(!l)return false;
    const eng=(l.match(/\b(the|a|an|i|you|we|they|is|are|am|have|has|do|does|did|can|could|would|should|need|want|may|might|results|sentence|practice)\b/ig)||[]).length;
    const tr=(l.match(/[çğıöşüÇĞİÖŞÜ]|\b(cevap|neden|türkçe|boşluk|görev|cümle|anlam|doğru|yanlış)\b/ig)||[]).length;
    return eng>0 && tr===0;
  }
  function formatAIText(txt){
    return String(txt||'').split(/\n/).map(raw=>{
      const line=raw.trimEnd();
      if(!line.trim())return '<br>';
      if(/^\*\*.*\*\*$/.test(line)||/^#{1,4}\s+/.test(line))return '<h4>'+esc(line.replace(/^#{1,4}\s+/,'').replace(/^\*\*|\*\*$/g,''))+'</h4>';
      let html;
      const dash=line.match(/^(\s*(?:\d+[.)]\s*)?)([A-Za-z][^-–—]+?)(\s*[-–—]\s*)(.+)$/);
      if(dash && lineLooksEnglish(dash[2])){
        html=esc(dash[1])+'<span class="ai-en-sentence">'+clickableSegment(dash[2],true)+'</span>'+esc(dash[3])+clickableSegment(dash[4],false);
      }else if(lineLooksEnglish(line)){
        html='<span class="ai-en-sentence">'+clickableSegment(line,true)+'</span>';
      }else{
        html=clickableSegment(esc(line),false);
      }
      return '<span class="ai-line">'+html+'</span>';
    }).join('');
  }
  function promptEditorHtml(r){
    return '<div class="ai-prompt-editor"><h3>📝 AI Pekiştirme Promptu</h3><p class="ai-prompt-help">Promptu buradan kontrol edip değiştirebilirsin. <b>{{EN}}</b>, <b>{{TR}}</b>, <b>{{GRAMMAR}}</b> otomatik doldurulur.</p><textarea id="aiPracticePrompt">'+esc(defaultPrompt(r))+'</textarea><div class="ai-action-row"><button class="btn warn" onclick="yolAskGroqForPractice()">🤖 Bu Promptla AI Pekiştirme Üret</button><button class="btn secondary" onclick="yolResetAIPrompt()">Promptu Sıfırla</button></div></div>';
  }
  window.yolResetAIPrompt=function(){const r=active(),ta=$('aiPracticePrompt'); if(ta&&r){ta.value=defaultPrompt(r); try{toast('Prompt sıfırlandı.')}catch(e){}}};
  window.yolAskGroqForPractice=async function(){
    const r=active(), out=$('labGroqInline')||$('aiLabOut'); if(!r||!out)return;
    if(!$('aiPracticePrompt')) out.insertAdjacentHTML('afterbegin',promptEditorHtml(r));
    const target=$('aiPracticeResult')||document.createElement('div'); target.id='aiPracticeResult'; if(!target.parentNode) out.appendChild(target);
    target.innerHTML='<div class="dict-box">AI hazırlanıyor...</div>';
    const prompt=resolvedPrompt(r);
    try{
      const txt=await (window.callGroq||window.callGrok||window.callAI)(prompt,{max_tokens:1800});
      target.innerHTML='<div class="dict-box groq-big-text"><h3>🤖 AI Pekiştirme</h3><div class="ai-clickable-output">'+formatAIText(txt)+'</div></div>';
    }catch(e){
      const sims=similarObjects(r,6).map((o,i)=>(i+1)+'. '+o.en+' - '+(o.tr||'')).join('\n');
      const fallback='**İngilizce-Türkçe Benzer Cümleler**\n'+sims+'\n\n**Boşluk Doldurma**\n1. _____ more information. - Cevap: We need\nNeden: Cümlede özne + fiil yapısı gerekir.\n\n**Gerçek Hayat Görevi**\nWrite two new sentences with this structure.';
      target.innerHTML='<div class="badline">AI bağlantısı yok. Yerel pekiştirme açıldı.<br>'+esc(e.message||e)+'</div><div class="dict-box groq-big-text"><h3>🤖 Yerel Pekiştirme</h3><div class="ai-clickable-output">'+formatAIText(fallback)+'</div></div>';
    }
  };
  function podcastHtml(){
    const r=active(); if(!r)return '<div class="badline">Aktif cümle bulunamadı.</div>';
    const pod='Hello. Today we practice this sentence. '+enOf(r)+' '+similarObjects(r,3).map(x=>x.en).join(' ');
    return '<h2>7) Mikro Podcast / AI Sohbet</h2><div class="practice"><p>'+esc(pod)+'</p><div class="row"><button class="btn" onclick="speakText(\''+jsq(pod)+'\')">🎧 Podcast Oku</button></div><div id="labGroqInline" style="margin-top:14px">'+promptEditorHtml(r)+'</div></div>';
  }
  const prevToggle=window.togglePracticeScreen;
  window.togglePracticeScreen=function(n){
    if(Number(n)!==7){return prevToggle?prevToggle(n):undefined;}
