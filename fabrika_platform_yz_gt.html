function canvasStartLink(id) {
  state.canvasLinkFrom = id;
  state.canvasSelected = null;
  renderDesignerOnly();
}

function canvasCompleteLink(toId) {
  const fromId = state.canvasLinkFrom;
  if (!fromId || fromId === toId) { state.canvasLinkFrom = null; renderDesignerOnly(); return; }
  const def = getDef(state.designerProcessId);
  canvasSnapshot();
  const fromNode = def.steps.find(s => s.id === fromId);
  let when = 'next';
  if (fromNode.type === 'human' || fromNode.type === 'parallel') {
    const hasApprove = (def.transitions||[]).some(t => t.from===fromId && t.when==='approve');
    when = hasApprove ? 'reject' : 'approve';
  } else if (fromNode.type === 'system') {
    const hasPass = (def.transitions||[]).some(t => t.from===fromId && t.when==='pass');
    when = hasPass ? 'fail' : 'pass';
  } else if (fromNode.type === 'wait') {
    when = 'timeout';
  }
  if (!def.transitions) def.transitions = [];
  const existing = def.transitions.find(t => t.from===fromId && t.when===when);
  if (existing) existing.to = toId;
  else def.transitions.push({ from: fromId, when, to: toId });
  state.canvasLinkFrom = null;
  persist();
  renderDesignerOnly();
}

function canvasEditEdge(from, when) {
  const def = getDef(state.designerProcessId);
  const t = def.transitions.find(x => x.from===from && x.when===when);
  if (!t) return;
  canvasSnapshot();
  def.transitions = def.transitions.filter(x => !(x.from===from && x.when===when));
  persist();
  renderDesignerOnly();
  notify('Ok silindi — geri almak için ↩ (Ctrl+Z)', 'info');
}

function canvasZoom(delta) {
  if (delta === 0) { state.canvasZoom = 1; state.canvasPan = {x:0,y:0}; }
  else state.canvasZoom = Math.max(0.4, Math.min(2, (state.canvasZoom||1) + delta));
  renderDesignerOnly();
}

// --- GERİ AL / YİNELE ---
// Değişiklik YAPMADAN ÖNCE çağrılır: mevcut steps+transitions+startStep'i yığına atar
function canvasSnapshot() {
  const def = getDef(state.designerProcessId);
  if (!def) return;
  const snap = JSON.stringify({ steps: def.steps, transitions: def.transitions, startStep: def.startStep });
  state.canvasUndoStack.push(snap);
  if (state.canvasUndoStack.length > 40) state.canvasUndoStack.shift(); // en fazla 40 adım
  state.canvasRedoStack = []; // yeni değişiklik → yinele geçmişi sıfırlanır
}

function canvasUndo() {
  if (state.canvasUndoStack.length === 0) { notify('Geri alınacak işlem yok', 'info'); return; }
  const def = getDef(state.designerProcessId);
  // Mevcut durumu redo'ya at
  state.canvasRedoStack.push(JSON.stringify({ steps: def.steps, transitions: def.transitions, startStep: def.startStep }));
  const snap = JSON.parse(state.canvasUndoStack.pop());
  def.steps = snap.steps; def.transitions = snap.transitions; def.startStep = snap.startStep;
  state.canvasSelected = null; state.canvasLinkFrom = null;
  persist();
  renderDesignerOnly();
}

function canvasRedo() {
  if (state.canvasRedoStack.length === 0) { notify('Yinelenecek işlem yok', 'info'); return; }
  const def = getDef(state.designerProcessId);
  state.canvasUndoStack.push(JSON.stringify({ steps: def.steps, transitions: def.transitions, startStep: def.startStep }));
  const snap = JSON.parse(state.canvasRedoStack.pop());
  def.steps = snap.steps; def.transitions = snap.transitions; def.startStep = snap.startStep;
  state.canvasSelected = null; state.canvasLinkFrom = null;
  persist();
  renderDesignerOnly();
}

// --- OTOMATİK DÜZENLE (kutuları akış katmanlarına göre hizala) ---
function canvasAutoLayout() {
  const def = getDef(state.designerProcessId);
  if (!def || def.steps.length === 0) return;
  canvasSnapshot(); // geri alınabilir olsun

  // Katmanları hesapla: başlangıçtan başlayarak BFS ile derinlik
  const stepMap = {}; def.steps.forEach(s => stepMap[s.id] = s);
  const depth = {};
  const start = def.startStep || def.steps[0].id;
  const queue = [{ id: start, d: 0 }];
  const visited = new Set();
  while (queue.length) {
    const { id, d } = queue.shift();
    if (visited.has(id)) { if (d > (depth[id]||0)) depth[id] = d; continue; }
    visited.add(id);
    depth[id] = Math.max(depth[id]||0, d);
    const outs = (def.transitions||[]).filter(t => t.from === id);
    outs.forEach(t => { if (stepMap[t.to]) queue.push({ id: t.to, d: d+1 }); });
  }
  // Bağlantısız kutular en alta
  let maxD = 0; Object.values(depth).forEach(d => { if (d>maxD) maxD = d; });
  def.steps.forEach(s => { if (depth[s.id] === undefined) depth[s.id] = maxD + 1; });

  // Katmanlara grupla
  const layers = {};
  def.steps.forEach(s => { (layers[depth[s.id]] = layers[depth[s.id]] || []).push(s); });

  // Yerleştir: her katman bir satır, içindekiler yan yana ortalı
  const COL_W = 200, ROW_H = 130, TOP = 40;
  const layerKeys = Object.keys(layers).map(Number).sort((a,b)=>a-b);
  layerKeys.forEach(d => {
    const row = layers[d];
    const totalW = row.length * COL_W;
    const startX = Math.max(40, (900 - totalW) / 2);
    row.forEach((s, i) => {
      s.x = Math.round(startX + i * COL_W);
      s.y = TOP + d * ROW_H;
    });
  });
  persist();
  renderDesignerOnly();
  notify('Kutular düzenlendi', 'success');
}

// Tuvali gerçek tam ekran yap (browser Fullscreen API)
function canvasFullscreen() {
  // Tam ekranı admin-content'e uygula → hem tuval hem liste tasarımcısı kapsanır
  const el = document.getElementById('admin-content');
  if (!el) return;
  if (!document.fullscreenElement) {
    el.classList.add('designer-fullscreen');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    const onFsChange = () => {
      if (!document.fullscreenElement) {
        el.classList.remove('designer-fullscreen');
        document.removeEventListener('fullscreenchange', onFsChange);
        renderDesignerOnly();
        if (state.canvasMode) setTimeout(attachCanvasHandlers, 0);
      }
    };
    document.addEventListener('fullscreenchange', onFsChange);
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    el.classList.remove('designer-fullscreen');
  }
}

// --- DOĞRULAMA: süreçteki mantık hatalarını bul ---
function canvasValidate() {
  const def = getDef(state.designerProcessId);
  const issues = [];
  const steps = def.steps || [];
  const trans = def.transitions || [];

  if (steps.length === 0) { issues.push({ sev:'error', msg:'Hiç adım yok' }); }
  if (!def.startStep || !steps.find(s => s.id === def.startStep)) {
    issues.push({ sev:'error', msg:'Başlangıç adımı belirlenmemiş (bir kutuya sağ tık → Başlangıç yap)' });
  }
  if (!steps.some(s => s.type === 'end-good' || s.type === 'end-bad')) {
    issues.push({ sev:'error', msg:'Hiç bitiş kutusu yok (✅ veya ❌ ekle)' });
  }
  for (const s of steps) {
    const outs = trans.filter(t => t.from === s.id);
    const ins = trans.filter(t => t.to === s.id);
    const td = CANVAS_NODE_TYPES[s.type]?.label || s.type;
    if (s.type !== 'end-good' && s.type !== 'end-bad' && outs.length === 0) {
      issues.push({ sev:'error', msg:`"${s.title}" (${td}) kutusundan çıkış oku yok` });
    }
    if (s.id !== def.startStep && ins.length === 0) {
      issues.push({ sev:'warn', msg:`"${s.title}" kutusuna gelen ok yok (kopuk olabilir)` });
    }
    if (s.type === 'human') {
      if (!outs.some(t=>t.when==='approve')) issues.push({ sev:'warn', msg:`"${s.title}" onaylanınca nereye gideceği belirsiz (onayla oku yok)` });
      if (!outs.some(t=>t.when==='reject')) issues.push({ sev:'warn', msg:`"${s.title}" reddedilince nereye gideceği belirsiz (reddet oku yok)` });
    }
    if (s.type === 'parallel') {
      if (!outs.some(t=>t.when==='approve')) issues.push({ sev:'warn', msg:`"${s.title}" (paralel) onayla oku yok` });
      if (!s.assignees || s.assignees.length === 0) issues.push({ sev:'warn', msg:`"${s.title}" (paralel) için onaylayacak rol seçilmemiş` });
    }
    if (s.type === 'system') {
      if (!outs.some(t=>t.when==='pass')) issues.push({ sev:'error', msg:`"${s.title}" (karar) doğru yolu yok (doğru oku çek)` });
      if (!outs.some(t=>t.when==='fail')) issues.push({ sev:'error', msg:`"${s.title}" (karar) yanlış yolu yok (yanlış oku çek)` });
      const condTxt = describeRuleStatic(s.rule);
      if (!s.rule || condTxt === 'koşul yok') issues.push({ sev:'warn', msg:`"${s.title}" (karar) için koşul tanımlanmamış` });
    }
    if (s.type === 'wait' && !outs.some(t=>t.when==='timeout'||t.when==='next')) {
      issues.push({ sev:'warn', msg:`"${s.title}" (bekleme) süre dolunca nereye gideceği belirsiz` });
    }
  }

  const errors = issues.filter(i=>i.sev==='error');
  const warns = issues.filter(i=>i.sev==='warn');
  let inner;
  if (issues.length === 0) {
    inner = `<div style="text-align:center;padding:20px;">
      <div style="font-size:36px;">✅</div>
      <div style="font-size:15px;font-weight:600;margin-top:8px;">Akış geçerli!</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:4px;">Hiçbir sorun yok. Güvenle yayınlayabilirsin.</div>
    </div>`;
  } else {
    inner = `<div style="font-size:13px;margin-bottom:10px;">${errors.length} hata, ${warns.length} uyarı:</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;">
      ${issues.map(i => `
        <div style="display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:${i.sev==='error'?'rgba(226,75,74,0.12)':'rgba(239,159,39,0.12)'};">
          <span>${i.sev==='error'?'🔴':'🟡'}</span><span style="font-size:13px;">${escapeHtml(i.msg)}</span>
        </div>`).join('')}
      </div>`;
  }
  // Tuval-içi panel olarak göster (fullscreen'de de görünür, modal değil)
  let panel = document.getElementById('cv-validate-panel');
  if (panel) panel.remove();
  panel = document.createElement('div');
  panel.id = 'cv-validate-panel';
  panel.className = 'cv-validate-panel';
  panel.innerHTML = `
    <div class="cv-validate-head">
      <span>🔍 Akış Doğrulama</span>
      <button onclick="document.getElementById('cv-validate-panel').remove()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div class="cv-validate-body">${inner}</div>`;
  // Fullscreen aktifse .canvas-wrap içine, değilse body'ye ekle
  const host = document.fullscreenElement ? document.querySelector('.canvas-wrap') : document.body;
  (host || document.body).appendChild(panel);
}

function canvasOpenCondition(id) {
  const def = getDef(state.designerProcessId);
  const n = def.steps.find(s => s.id === id);
  if (!n) return;
  // Mevcut kuralı ağaç formatına normalize et (eski formatları da kabul)
  state._condEditNodeId = id;
  state._condEditRule = normalizeRuleToTree(n.rule);
  openCondModal();
}

// Eski/karışık kuralı her zaman {type, nodes:[]} ağacına çevir
function normalizeRuleToTree(rule) {
  if (!rule) return { type:'all', nodes:[] };
  // Zaten ağaçsa
  if (Array.isArray(rule.nodes)) return JSON.parse(JSON.stringify(rule));
  // Tek koşul
  if (rule.op !== undefined) return { type:'all', nodes:[ { left:rule.left, op:rule.op, right:rule.right } ] };
  // Eski düz çoklu (conditions)
  if (Array.isArray(rule.conditions)) {
    return { type: rule.type || 'all', nodes: rule.conditions.map(c => ({ left:c.left, op:c.op, right:c.right })) };
  }
  return { type:'all', nodes:[] };
}

function openCondModal() {
  openModal({
    title: '⚙️ Koşul Editörü',
    wide: true,
    body: `<div id="cond-editor">${renderCondTree(state._condEditRule, 'root')}</div>
           <div style="margin-top:14px;padding:10px 12px;background:var(--panel-2);border-radius:6px;font-size:12px;">
             <span style="color:var(--text-dim);">Önizleme: </span>
             <span id="cond-preview" style="color:var(--accent);font-family:var(--mono);">${escapeHtml(describeRuleStatic(state._condEditRule))}</span>
           </div>`,
    foot: `<button class="ghost-btn" onclick="closeModal()">İptal</button>
           <button class="btn approve" style="flex:0;padding:7px 14px;" onclick="saveCondRule()">Kaydet</button>`
  });
}

// Kural ağacını özyinelemeli render et. path: bu düğümün ağaçtaki konumu (örn "root.0.1")
function renderCondTree(node, path, depth=0) {
  // Grup düğümü (nodes var)
  if (Array.isArray(node.nodes)) {
    const typeLabel = { all:'VE (hepsi)', any:'VEYA (biri)', not:'DEĞİL' };
    const borderColor = node.type==='any' ? '#EF9F27' : node.type==='not' ? '#E24B4A' : '#378ADD';
    const childrenHtml = node.nodes.map((child, i) => renderCondTree(child, path+'.'+i, depth+1)).join('');
    return `
      <div class="cond-group" style="border-left:3px solid ${borderColor};">
        <div class="cond-group-head">
          <select onchange="condSetType('${path}',this.value)" style="font-weight:600;">
            <option value="all" ${node.type==='all'?'selected':''}>VE — hepsi doğru olmalı</option>
            <option value="any" ${node.type==='any'?'selected':''}>VEYA — biri doğru yeter</option>
            <option value="not" ${node.type==='not'?'selected':''}>DEĞİL — tersi</option>
          </select>
          ${path!=='root' ? `<button class="cond-x" onclick="condRemove('${path}')" title="Grubu sil">✕</button>` : ''}
        </div>
        <div class="cond-group-body">
          ${childrenHtml || '<div style="font-size:11px;color:var(--text-mute);padding:6px;">Boş — koşul veya grup ekle</div>'}
          <div class="cond-add-row">
            <button class="cv-add" onclick="condAddCondition('${path}')">+ Koşul</button>
            <button class="cv-add" onclick="condAddGroup('${path}')">+ Grup ( )</button>
          </div>
        </div>
      </div>
    `;
  }
  // Koşul düğümü (left/op/right)
  const def = getDef(state.designerProcessId);
  const fields = getRuleFieldOptions(def);
  const ops = getRuleOperators();
  const noValue = (node.op === 'empty' || node.op === 'not_empty');
  return `
    <div class="cond-row">
      <select onchange="condSet('${path}','left',this.value)">
        ${fields.map(f=>`<option value="${f.value}" ${node.left===f.value?'selected':''}>${escapeHtml(f.label)}</option>`).join('')}
      </select>
      <select onchange="condSet('${path}','op',this.value)">
        ${ops.map(o=>`<option value="${o.value}" ${node.op===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
      ${noValue ? '<span style="font-size:11px;color:var(--text-mute);align-self:center;">(değer gerekmez)</span>'
                : `<input value="${escapeHtml(node.right!==undefined?String(node.right):'')}" placeholder="değer" oninput="condSet('${path}','right',this.value)">`}
      <button class="cond-x" onclick="condRemove('${path}')" title="Koşulu sil">✕</button>
    </div>
  `;
}

// path ("root.0.1") ile ağaçta düğüme eriş
function condGetByPath(path) {
  const parts = path.split('.');
  let node = state._condEditRule; // parts[0]='root'
  for (let i=1;i<parts.length;i++) node = node.nodes[parseInt(parts[i])];
  return node;
}
function condGetParent(path) {
  const parts = path.split('.');
  if (parts.length < 2) return null;
  let node = state._condEditRule;
  for (let i=1;i<parts.length-1;i++) node = node.nodes[parseInt(parts[i])];
  return { parent: node, index: parseInt(parts[parts.length-1]) };
}

function condSetType(path, val) {
  const node = condGetByPath(path);
  node.type = val;
  refreshCondEditor();
}
function condSet(path, key, val) {
  const node = condGetByPath(path);
  node[key] = val;
  // empty/not_empty seçilince right'ı temizle, value alanı gizlensin
  if (key==='op' && (val==='empty'||val==='not_empty')) delete node.right;
  if (key==='op') refreshCondEditor(); // operatör değişince value alanı görünür/gizlenir
  else updateCondPreview();
}
function condAddCondition(path) {
  const node = condGetByPath(path);
  const def = getDef(state.designerProcessId);
  const firstField = getRuleFieldOptions(def)[0]?.value || 'form.x';
  node.nodes.push({ left: firstField, op:'==', right:'' });
  refreshCondEditor();
}
function condAddGroup(path) {
  const node = condGetByPath(path);
  node.nodes.push({ type:'all', nodes:[] });
  refreshCondEditor();
}
function condRemove(path) {
  const pp = condGetParent(path);
  if (!pp) return;
  pp.parent.nodes.splice(pp.index, 1);
  refreshCondEditor();
}
function refreshCondEditor() {
  const el = document.getElementById('cond-editor');
  if (el) el.innerHTML = renderCondTree(state._condEditRule, 'root');
  updateCondPreview();
}
function updateCondPreview() {
  const el = document.getElementById('cond-preview');
  if (el) el.textContent = describeRuleStatic(state._condEditRule);
}
function saveCondRule() {
  const def = getDef(state.designerProcessId);
  const n = def.steps.find(s => s.id === state._condEditNodeId);
  if (n) {
    // Tek koşullu basit ağacı sadeleştirebiliriz ama ağaç da çalışır — olduğu gibi kaydet
    n.rule = JSON.parse(JSON.stringify(state._condEditRule));
    persist();
  }
  closeModal();
  renderDesignerOnly();
  notify('Koşul kaydedildi', 'success');
}

function attachCanvasHandlers() {
  const svg = document.getElementById('canvas-svg');
  if (!svg) return;
  const def = getDef(state.designerProcessId);
  if (!def) return;
  let dragId = null, dragOffset = {x:0,y:0}, moved = false;

  function svgPoint(evt) {
    const rect = svg.getBoundingClientRect();
    const z = state.canvasZoom || 1;
    const pan = state.canvasPan || {x:0,y:0};
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return { x: (clientX - rect.left - pan.x) / z, y: (clientY - rect.top - pan.y) / z };
  }
  function onDown(evt) {
    closeContextMenu();
    // ✕ silme düğmesi
    const delBtn = evt.target.closest('.cv-node-del');
    if (delBtn) {
      const id = delBtn.getAttribute('data-del');
      canvasDeleteNode(id);
      evt.preventDefault();
      evt.stopPropagation();
      return;
    }
    const port = evt.target.closest('.cv-port');
    if (port) {
      state.canvasLinkFrom = port.getAttribute('data-id');
      state.canvasSelected = null;
      renderDesignerOnly();
      evt.preventDefault();
      return;
    }
    const nodeEl = evt.target.closest('.cv-node');
    if (nodeEl) {
      const id = nodeEl.getAttribute('data-id');
      if (state.canvasLinkFrom) { canvasCompleteLink(id); evt.preventDefault(); return; }
      dragId = id; moved = false;
      canvasSnapshot(); // taşımayı geri alınabilir yap
      const n = def.steps.find(s => s.id === id);
      const p = svgPoint(evt);
      dragOffset = { x: p.x - n.x, y: p.y - n.y };
      evt.preventDefault();
    }
  }
  function onMove(evt) {
    if (!dragId) return;
    const n = def.steps.find(s => s.id === dragId);
    if (!n) return;
    const p = svgPoint(evt);
    n.x = Math.round(p.x - dragOffset.x);
    n.y = Math.round(p.y - dragOffset.y);
    moved = true;
    const g = svg.querySelector(`.cv-node[data-id="${dragId}"]`);
    if (g) g.setAttribute('transform', `translate(${n.x},${n.y})`);
    redrawEdgesOnly(def);
    evt.preventDefault();
  }
  function onUp() {
    if (dragId) {
      if (moved) persist();
      else {
        // Taşınmadı (sadece tıklama) → drag başında alınan snapshot'ı geri al
        if (state.canvasUndoStack.length) state.canvasUndoStack.pop();
        if (!state.canvasLinkFrom) { state.canvasSelected = dragId; renderDesignerOnly(); }
      }
    }
    dragId = null;
  }
  svg.addEventListener('mousedown', onDown);
  svg.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  svg.addEventListener('touchstart', onDown, {passive:false});
  svg.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);
}

function redrawEdgesOnly(def) {
  const content = document.getElementById('canvas-content');
  if (!content) return;
  const nodes = def.steps;
  content.querySelectorAll('.cv-edge').forEach(e => e.remove());
  const svgNS = 'http://www.w3.org/2000/svg';
  for (const t of (def.transitions||[])) {
    const from = nodes.find(n => n.id===t.from), to = nodes.find(n => n.id===t.to);
    if (!from||!to) continue;
    const x1=from.x+CANVAS_NODE_W/2, y1=from.y+CANVAS_NODE_H, x2=to.x+CANVAS_NODE_W/2, y2=to.y;
    const midY=(y1+y2)/2;
    const color=(t.when==='approve'||t.when==='pass')?'#1D9E75':(t.when==='reject'||t.when==='fail')?'#E24B4A':'#888';
    const path=document.createElementNS(svgNS,'path');
    path.setAttribute('d',`M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke',color); path.setAttribute('stroke-width','2');
    path.setAttribute('marker-end','url(#cv-arrow)'); path.setAttribute('opacity','0.85'); path.setAttribute('class','cv-edge');
    content.insertBefore(path, content.firstChild);
  }
}

function renderStepsList(def) {
  return def.steps.map((s, idx) => {
    const typeClass = s.type;
    const isEnd = s.type === 'end-good' || s.type === 'end-bad';
    let assignHtml = '';
    if (s.type === 'human') {
      const assign = s.assign || { mode:'role', role:'manager' };
      assignHtml = `
        <select onchange="updateStepAssign('${s.id}','mode',this.value)">
          <option value="role" ${assign.mode === 'role' ? 'selected':''}>Rol</option>
          <option value="requester_manager" ${assign.mode === 'requester_manager' ? 'selected':''}>Talep edenin müdürü</option>
          <option value="specific_user" ${assign.mode === 'specific_user' ? 'selected':''}>Belirli kişi</option>
        </select>
        ${assign.mode === 'role' ?
          `<select onchange="updateStepAssign('${s.id}','role',this.value)">
            ${['manager','hr','admin'].map(r => `<option value="${r}" ${assign.role===r?'selected':''}>${r}</option>`).join('')}
          </select>` :
          assign.mode === 'specific_user' ?
          `<select onchange="updateStepAssign('${s.id}','userId',this.value)">
            ${state.users.map(u => `<option value="${u.id}" ${assign.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
          </select>` :
          `<div style="font-size:11px;color:var(--text-mute);padding:6px;">Otomatik: talep edenin müdür alanı</div>`
        }
      `;
    } else if (s.type === 'system') {
      assignHtml = `<div style="font-size:11px;color:var(--text-mute);padding:6px;">Otomatik kural (aşağıda)</div><div></div>`;
    } else {
      assignHtml = `<input type="text" placeholder="Sonuç mesajı" value="${escapeHtml(s.message||'')}" oninput="updateStep('${s.id}','message',this.value)" style="grid-column:1/3;">`;
    }
    let ruleHtml = '';
    if (s.type === 'system') {
      ruleHtml = renderRuleBuilder(s, def);
    } else if (s.type === 'human') {
      // Vekil yönlendirmesi toggle - varsayılan açık (noDelegate undefined ise açık demektir)
      const delegationOn = !s.noDelegate;
      const slaHours = s.slaHours || 0;
      ruleHtml = `
        <div class="rule-builder">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);font-size:11px;">
            <input type="checkbox" ${delegationOn?'checked':''} onchange="updateStep('${s.id}','noDelegate',!this.checked)" style="width:auto;">
            <span>🔁 Atanan kişi izinde ise vekiline yönlendir</span>
          </label>
          <span class="lbl" style="margin-left:auto;">${delegationOn?'Varsayılan':'Atlama açık'}</span>
        </div>
        <div class="rule-builder" style="margin-top:4px;">
          <span class="lbl">⏱ Hedef süre:</span>
          <input type="number" min="0" value="${slaHours}" onchange="updateStep('${s.id}','slaHours',parseFloat(this.value)||0)" style="width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;font-family:var(--sans);" placeholder="0">
          <span class="lbl">saat</span>
          <span class="lbl" style="margin-left:auto;">${slaHours > 0 ? `Sayaç görev kartında görünür` : 'Süre takibi kapalı'}</span>
        </div>
      `;
    }
    // Eylem editörü - sadece human adımları için (end ve system'da yok)
    let actionsHtml = '';
    if (s.type === 'human') {
      actionsHtml = renderStepActions(s);
    }
    return `
      <div class="step-row ${typeClass}">
        <div class="ord" style="grid-column:1;">${idx+1}.</div>
        <input type="text" placeholder="Adım başlığı" value="${escapeHtml(s.title)}" oninput="updateStep('${s.id}','title',this.value)">
        ${assignHtml}

// ============== ÇOKLU KOŞUL RULE BUILDER ==============

// Bir adımın kuralını normalleştir: eski tek koşul -> yeni çoklu koşul formatı
// Sadece editleme için kullanılır; motor zaten iki formatı da tanıyor (geri uyum)
function normalizeRuleForEdit(rule) {
  if (!rule) return { type: 'all', conditions: [] };
  if (rule.op !== undefined) {
    // Eski tek koşul - çoklu formatta tek koşullu olarak göster
    return { type: 'all', conditions: [{ left: rule.left, op: rule.op, right: rule.right }] };
  }
  return {
    type: rule.type || 'all',
    conditions: Array.isArray(rule.conditions) ? rule.conditions.slice() : []
  };
}

function renderRuleBuilder(s, def) {
  const rule = normalizeRuleForEdit(s.rule);
  const fieldOpts = getRuleFieldOptions(def);
  const ops = ['==','!=','>=','<=','>','<','contains'];

  // Tek koşul olduysa eski stildeki kompakt görünüm + "+ koşul ekle"
  // Birden fazla koşul varsa VE/VEYA seçici ile birlikte
  const isMulti = rule.conditions.length > 1;
  const condRows = rule.conditions.map((c, idx) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">
      ${isMulti && idx === 0 ? '<span class="lbl" style="min-width:28px;">EĞER</span>' :
        isMulti ? `<span class="lbl" style="min-width:28px;font-weight:600;color:var(--accent);">${rule.type==='any'?'VEYA':'VE'}</span>` :
        '<span class="lbl">EĞER</span>'}
      <select onchange="updateRuleCondition('${s.id}',${idx},'left',this.value)" style="flex:1;">
        ${fieldOpts.map(o => `<option value="${o.value}" ${c.left===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
      <select onchange="updateRuleCondition('${s.id}',${idx},'op',this.value)" style="width:60px;">
        ${ops.map(op => `<option ${c.op===op?'selected':''}>${op}</option>`).join('')}
      </select>
      <input type="text" value="${escapeHtml(String(c.right!==undefined?c.right:''))}" oninput="updateRuleCondition('${s.id}',${idx},'right',this.value)" style="width:80px;" placeholder="değer">
      ${rule.conditions.length > 1 ? `<button class="icon-btn delete" onclick="removeRuleCondition('${s.id}',${idx})" type="button" title="Koşulu sil" style="width:22px;height:22px;font-size:11px;">×</button>` : ''}
    </div>
  `).join('');

  const groupSelector = isMulti ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border);">
      <span class="lbl">Koşullar arası:</span>
      <select onchange="updateRuleType('${s.id}',this.value)" style="width:auto;padding:3px 6px;">
        <option value="all" ${rule.type==='all'?'selected':''}>HEPSİ (VE)</option>
        <option value="any" ${rule.type==='any'?'selected':''}>HERHANGİ BİRİ (VEYA)</option>
      </select>
      <span class="lbl" style="margin-left:auto;font-size:10px;">${rule.conditions.length} koşul</span>
    </div>
  ` : '';

  return `
    <div class="rule-builder" style="flex-direction:column;align-items:stretch;padding:8px 10px;">
      ${groupSelector}
      ${condRows || '<div style="font-size:11px;color:var(--text-mute);padding:4px;">Koşul yok</div>'}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
        <button class="add-mini" onclick="addRuleCondition('${s.id}')" type="button" style="font-size:10px;padding:3px 8px;">+ Koşul ekle</button>
        <span class="lbl" style="font-size:10px;">→ pass / fail</span>
      </div>
    </div>
  `;
}

function getNormalizedRule(s) {
  if (!s.rule) s.rule = { type: 'all', conditions: [] };
  // Eski tek koşul formatındaysa yeni formata çevir
  if (s.rule.op !== undefined) {
    const old = s.rule;
    s.rule = {
      type: 'all',
      conditions: [{ left: old.left, op: old.op, right: old.right }]
    };
  }
  if (!s.rule.conditions) s.rule.conditions = [];
  if (!s.rule.type) s.rule.type = 'all';
  return s.rule;
}

function updateRuleCondition(sid, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  if (!rule.conditions[idx]) return;
  if (key === 'right' && val !== '' && !isNaN(parseFloat(val))) {
    rule.conditions[idx][key] = parseFloat(val);
  } else {
    rule.conditions[idx][key] = val;
  }
  persist();
  updatePreview();
}

function addRuleCondition(sid) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  const fieldOpts = getRuleFieldOptions(def);
  rule.conditions.push({
    left: fieldOpts[0]?.value || 'user.seniorityYears',
    op: '>=',
    right: 1
  });
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

function removeRuleCondition(sid, idx) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  rule.conditions.splice(idx, 1);
  // Eğer tek koşul kaldıysa eski formata geri çevirme - yeni formatta tutalım, motor zaten anlıyor
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

function updateRuleType(sid, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  rule.type = val;
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

        💡 İpucu: Mesaj/konu içinde değişken kullanın: <code style="color:var(--accent);">{{user.name}}</code> {{form.startDate}} {{instance.id}} {{approver.name}}
      </div>
    </div>
  `;
}

const ACTION_TYPE_LABELS = {
  send_email: { icon: '✉️', name: 'E-posta' },
  send_sms: { icon: '📱', name: 'SMS' },
  send_whatsapp: { icon: '💬', name: 'WhatsApp' },
  generate_pdf: { icon: '📄', name: 'PDF üret' },
  start_process: { icon: '🔗', name: 'Süreç tetikle' }
};

function renderActionRow(stepId, trigger, idx, action) {
  const meta = ACTION_TYPE_LABELS[action.type] || { icon: '?', name: action.type };

  if (action.type === 'send_email' || action.type === 'send_sms' || action.type === 'send_whatsapp') {
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <span class="lbl" style="margin-left:6px;">Alıcı:</span>
          ${renderRecipientPicker(stepId, trigger, idx, action.recipient)}
          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
        </div>
        ${action.type === 'send_email' ? `
          <input type="text" value="${escapeHtml(action.subject||'')}" placeholder="Konu (örn: İzin talebiniz onayınızı bekliyor)" oninput="updateAction('${stepId}','${trigger}',${idx},'subject',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;margin-bottom:4px;font-family:var(--sans);">
        ` : ''}
        <textarea placeholder="Mesaj... (değişken örneği: Sayın {{user.name}}, {{form.startDate}} tarihli izin talebiniz...)" oninput="updateAction('${stepId}','${trigger}',${idx},'body',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;min-height:40px;font-family:var(--sans);resize:vertical;">${escapeHtml(action.body||'')}</textarea>
      </div>
    `;
  }

  if (action.type === 'generate_pdf') {
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
        </div>
        <input type="text" value="${escapeHtml(action.filename||'')}" placeholder="Dosya adı (örn: izin-{{instance.id}}.pdf)" oninput="updateAction('${stepId}','${trigger}',${idx},'filename',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;margin-bottom:4px;font-family:var(--sans);">
        <input type="text" value="${escapeHtml(action.title||'')}" placeholder="Belge başlığı" oninput="updateAction('${stepId}','${trigger}',${idx},'title',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;font-family:var(--sans);">
      </div>
    `;
  }

  if (action.type === 'start_process') {
    const otherDefs = state.definitions.filter(d => d.id !== state.designerProcessId);
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <span class="lbl" style="margin-left:6px;">Hedef süreç:</span>
          <select onchange="updateAction('${stepId}','${trigger}',${idx},'targetDefId',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;flex:1;">
            <option value="">— Seç —</option>
            ${otherDefs.map(d => `<option value="${d.id}" ${action.targetDefId===d.id?'selected':''}>${d.icon||''} ${escapeHtml(d.name)}</option>`).join('')}

          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>

      </div>

  }

  return `<div style="font-size:10px;color:var(--text-mute);">Bilinmeyen eylem: ${action.type}</div>`;
}

function renderRecipientPicker(stepId, trigger, idx, recipient) {
  recipient = recipient || { type: 'owner' };
  const isSpecific = recipient.type === 'specific';
  const isRole = recipient.type === 'role';
  return `
    <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'type',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
      <option value="owner" ${recipient.type==='owner'?'selected':''}>Talep sahibi</option>
      <option value="approver" ${recipient.type==='approver'?'selected':''}>Onaylayan kişi</option>
      <option value="manager" ${recipient.type==='manager'?'selected':''}>Talep sahibinin müdürü</option>
      <option value="role" ${isRole?'selected':''}>Rol</option>
      <option value="specific" ${isSpecific?'selected':''}>Belirli kişi</option>
    </select>
    ${isRole ? `
      <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'role',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
        ${['worker','manager','hr','admin'].map(r => `<option value="${r}" ${recipient.role===r?'selected':''}>${r}</option>`).join('')}
      </select>
    ` : ''}
    ${isSpecific ? `
      <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'userId',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
        <option value="">— Seç —</option>
        ${state.users.map(u => `<option value="${u.id}" ${recipient.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
      </select>
    ` : ''}
  `;
}

function toggleStepActions(sid) {
  state._expandedActions = state._expandedActions === sid ? null : sid;
  const def = getDef(state.designerProcessId);
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function addAction(stepId, trigger, type) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  const newAction = { type, recipient: { type: 'owner' } };
  // Tip bazlı varsayılan içerik
  if (type === 'send_email') {
    newAction.subject = `${def.name} - ${s.title}`;
    newAction.body = `Sayın {{user.name}},\n\n{{instance.id}} numaralı talebinizle ilgili durum: ${s.title}.\n\nİyi günler.`;
  } else if (type === 'send_sms' || type === 'send_whatsapp') {
    newAction.body = `{{user.name}}, {{instance.id}} - ${s.title}`;
  } else if (type === 'generate_pdf') {
    newAction.filename = `belge-{{instance.id}}.pdf`;
    newAction.title = def.name;
  } else if (type === 'start_process') {
    newAction.targetDefId = '';
  }
  actions[trigger].push(newAction);
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function removeAction(stepId, trigger, idx) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  actions[trigger].splice(idx, 1);
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function updateAction(stepId, trigger, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  if (!actions[trigger][idx]) return;
  actions[trigger][idx][key] = val;
  persist();
  // Bu input/textarea, re-render tetiklersek odak kaybolur - sadece persist
}

function updateActionRecipient(stepId, trigger, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  if (!actions[trigger][idx]) return;
  if (!actions[trigger][idx].recipient) actions[trigger][idx].recipient = {};
  actions[trigger][idx].recipient[key] = val;
  // Tip değiştiğinde ek alanları resetle
  if (key === 'type') {
    if (val === 'role') actions[trigger][idx].recipient.role = 'manager';
    if (val === 'specific') actions[trigger][idx].recipient.userId = state.users[0]?.id || '';
  }
  persist();
  // Sadece bu adımın eylem alanını yeniden render et - tüm listeyi yenilesek odak kaybolur
  // Basit çözüm: tüm steps-list yenile (eylem editörü zaten açık)
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function removeStep(sid) {
  const def = getDef(state.designerProcessId);
  def.steps = def.steps.filter(s => s.id !== sid);
  // Bu adıma referans veren geçişleri sil
  def.transitions = def.transitions.filter(t => t.from !== sid && t.to !== sid);
  // Başlangıç bu ise yenile
  if (def.startStep === sid) {
    const first = def.steps.find(s => s.type !== 'end-good' && s.type !== 'end-bad');
    def.startStep = first ? first.id : null;
  }
  persist();
  renderDesignerOnly();
}

// -- GEÇİŞLER --
function renderTransitionsList(def) {
  if (def.transitions.length === 0) {
    return '<div style="font-size:12px;color:var(--text-mute);padding:8px;">Henüz geçiş yok. Adımlar arası akışı tanımlayın.</div>';
  }
  return def.transitions.map((t, idx) => `
    <div class="trans-row" data-idx="${idx}">
      <select onchange="updateTransition(${idx},'from',this.value)">
        ${def.steps.filter(s => s.type !== 'end-good' && s.type !== 'end-bad').map(s =>
          `<option value="${s.id}" ${t.from===s.id?'selected':''}>${escapeHtml(s.title)}</option>`
        ).join('')}
      </select>
      <div class="trans-arrow">+</div>
      <select onchange="updateTransition(${idx},'when',this.value)">
        ${['approve','reject','pass','fail'].map(w => `<option ${t.when===w?'selected':''}>${w}</option>`).join('')}
      </select>
      <div class="trans-arrow">→</div>
      <select onchange="updateTransition(${idx},'to',this.value)">
        ${def.steps.map(s => `<option value="${s.id}" ${t.to===s.id?'selected':''}>${escapeHtml(s.title)}</option>`).join('')}
      </select>
      <button class="icon-btn delete" onclick="removeTransition(${idx})">×</button>
    </div>
  `).join('');
}

function addTransition() {
  const def = getDef(state.designerProcessId);
  const nonEnd = def.steps.filter(s => s.type !== 'end-good' && s.type !== 'end-bad');
  if (nonEnd.length === 0) { notify('Önce adım ekleyin', 'error'); return; }
  def.transitions.push({ from: nonEnd[0].id, when: 'approve', to: def.steps[def.steps.length-1].id });
  persist();
  document.getElementById('trans-list').innerHTML = renderTransitionsList(def);
  updatePreview();
}

function updateTransition(idx, key, val) {
  const def = getDef(state.designerProcessId);
  if (!def.transitions[idx]) return;
  def.transitions[idx][key] = val;
  persist();
  updatePreview();
}

function removeTransition(idx) {
  const def = getDef(state.designerProcessId);
  def.transitions.splice(idx, 1);
  persist();
  document.getElementById('trans-list').innerHTML = renderTransitionsList(def);
  updatePreview();
}

function saveAndClose() {
  // Validasyon
  const def = getDef(state.designerProcessId);
  if (!def.name || def.name === 'Yeni Süreç') {
    if (!confirm('Süreç adı varsayılan. Yine de kaydedeyim mi?')) return;
  }
  if (def.steps.length === 0) { notify('En az bir adım gerekli', 'error'); return; }
  if (!def.startStep) { notify('Başlangıç adımı seçilmemiş', 'error'); return; }
  persist();
  closeDesigner();
  notify('Süreç kaydedildi', 'success');
}

function saveActivateAndClose(defId) {
  const def = getDef(defId);
  if (!def) return;
  // Validasyon
  if (!def.name || def.name === 'Yeni Süreç') {
    if (!confirm('Süreç adı varsayılan. Yine de aktifleştirip kaydedeyim mi?')) return;
  }
  if (def.steps.length === 0) { notify('En az bir adım gerekli', 'error'); return; }
  if (!def.startStep) { notify('Başlangıç adımı seçilmemiş', 'error'); return; }
  // Aktif et + kaydet
  def.active = true;
  persist();
  closeDesigner();
  notify(`"${def.name}" aktifleştirildi ve kaydedildi`, 'success');
}

// Önizleme sekmesi - Akış / Form
function setPreviewTab(tab) {
  state._previewTab = tab;
  renderDesignerOnly();
}

// Önizleme alanı render - aktif sekmeye göre
function renderDesignerPreview(def) {

// Çalışanın göreceği gerçek form önizlemesi

    } else {

function testProcess(defId) {
  const def = getDef(defId);
  if (!def.steps || def.steps.length === 0) {
    notify('Önce adım ekleyin', 'error'); return;
  }
  if (!def.startStep) {
    notify('Başlangıç adımı belirleyin (bir kutuya sağ tık → Başlangıç yap)', 'error'); return;
  }
  // Form alanı yoksa direkt boş test
  if (!def.fields || def.fields.length === 0) {
    runTestProcess(defId, {});
    return;
  }
  // Form alanları varsa: test değerlerini sor
  const fieldsHtml = def.fields.map(f => {
    let input = '';
    if (f.type === 'number') input = `<input type="number" id="tf-${f.id}" value="0" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;">`;
    else if (f.type === 'date') input = `<input type="date" id="tf-${f.id}" value="${new Date().toISOString().slice(0,10)}" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;">`;
    else if (f.type === 'select') input = `<select id="tf-${f.id}" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;">${(f.options||[]).map(o=>`<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('')}</select>`;
    else input = `<input type="text" id="tf-${f.id}" value="Test" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;">`;
    return `<div style="margin-bottom:12px;"><label style="display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;">${escapeHtml(f.label)}</label>${input}</div>`;
  }).join('');
  openModal({
    title: '▶ Test Et — ' + def.name,
    body: `<div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">Test değerlerini gir, akışın hangi yola gittiğini gör. (Süreç pasif olsa bile test çalışır.)</div>${fieldsHtml}`,
    foot: `<button class="ghost-btn" onclick="closeModal()">İptal</button>
           <button class="btn approve" style="flex:0;padding:7px 14px;" onclick="submitTestProcess('${defId}')">Testi Başlat</button>`
  });
}

function submitTestProcess(defId) {
  const def = getDef(defId);
  const data = {};
  def.fields.forEach(f => {
    const el = document.getElementById('tf-' + f.id);
    data[f.id] = el ? el.value : '';
  });
  closeModal();
  runTestProcess(defId, data);
}

function runTestProcess(defId, data) {
  try {
    const inst = startProcess(defId, state.currentUser, data, false, true); // allowInactive=true
    notify(`Test örneği oluşturuldu: ${inst.id} — İş Akışları'nda görebilirsin`, 'success');
  } catch(e) {
    notify('Test hatası: ' + e.message, 'error');
  }
}

// ============== 7) DİYAGRAM ÖNİZLEME ==============

function renderProcessPreview(def) {
  if (!def || def.steps.length === 0) {
    return `<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Henüz adım yok</div>`;
  }

  // Adımları "katman" mantığıyla yerleştir (topological düzen)
  const layers = computeLayers(def);
  if (!layers) {
    return `<div style="padding:20px;color:var(--amber);font-size:11px;">Akışta döngü veya bağlantısız adım var. Yine de gösteriliyor:</div>` + renderRawPreview(def);
  }

  const W = 340, ROW = 80;
  const layerCount = layers.length;
  const H = Math.max(layerCount * ROW + 20, 120);

  // Her adımın pozisyonunu hesapla
  const positions = {};
  layers.forEach((layer, li) => {
    const y = 20 + li * ROW;
    const xStep = W / (layer.length + 1);
    layer.forEach((sid, si) => {
      positions[sid] = { x: xStep * (si + 1), y };
    });
  });

  // Adımı dikdörtgen olarak çiz
  let nodes = '';
  for (const sid in positions) {
    const p = positions[sid];
    const s = def.steps.find(x => x.id === sid);
    if (!s) continue;
    const color = s.type === 'system' ? '#a78bfa' :
                  s.type === 'human' ? '#4a9eff' :
                  s.type === 'end-good' ? '#4ade80' : '#f87171';
    const bg = s.type === 'system' ? 'rgba(167,139,250,0.15)' :
               s.type === 'human' ? 'rgba(74,158,255,0.15)' :
               s.type === 'end-good' ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
    const w = 110, h = 38;
    const title = s.title.length > 18 ? s.title.slice(0, 16) + '…' : s.title;
    const isStart = sid === def.startStep;
    nodes += `
      <g>
        <rect x="${p.x - w/2}" y="${p.y - h/2}" width="${w}" height="${h}" rx="5"
              fill="${bg}" stroke="${color}" stroke-width="${isStart ? 2 : 1}"/>
        <text x="${p.x}" y="${p.y + 4}" text-anchor="middle"
              fill="${color}" font-size="11" font-family="system-ui" font-weight="500">${escapeHtml(title)}</text>
        ${isStart ? `<circle cx="${p.x - w/2 - 6}" cy="${p.y}" r="3" fill="${color}"/>` : ''}
      </g>
    `;
  }

  // Geçişleri çiz
  let edges = '';
  def.transitions.forEach(t => {
    const from = positions[t.from];
    const to = positions[t.to];
    if (!from || !to) return;
    const isPositive = t.when === 'approve' || t.when === 'pass';
    const color = isPositive ? '#4ade80' : '#f87171';
    const dy = to.y - from.y;
    // Sadece düz aşağı veya çok kavisli
    let path;
    if (Math.abs(to.x - from.x) < 5) {
      path = `M ${from.x} ${from.y + 19} L ${to.x} ${to.y - 19}`;
    } else {
      const my = (from.y + to.y) / 2;
      path = `M ${from.x} ${from.y + 19} C ${from.x} ${my}, ${to.x} ${my}, ${to.x} ${to.y - 19}`;
    }
    edges += `
      <path d="${path}" stroke="${color}" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity="0.7"/>
      <text x="${(from.x + to.x)/2}" y="${(from.y + to.y)/2}" text-anchor="middle"
            fill="${color}" font-size="9" font-family="monospace" opacity="0.9"
            style="paint-order:stroke;stroke:var(--panel);stroke-width:3px;">${t.when}</text>
    `;
  });

  return `
    <svg class="preview-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-height:${H + 20}px;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      ${edges}
      ${nodes}
    </svg>
    <div style="display:flex;gap:10px;font-size:10px;color:var(--text-dim);margin-top:10px;flex-wrap:wrap;">
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(167,139,250,0.3);border:1px solid #a78bfa;vertical-align:middle;margin-right:3px;"></span>Sistem</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(74,158,255,0.3);border:1px solid #4a9eff;vertical-align:middle;margin-right:3px;"></span>İnsan</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(74,222,128,0.3);border:1px solid #4ade80;vertical-align:middle;margin-right:3px;"></span>Son ✓</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(248,113,113,0.3);border:1px solid #f87171;vertical-align:middle;margin-right:3px;"></span>Son ✕</span>
      <span style="margin-left:auto;"><span style="display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;vertical-align:middle;margin-right:3px;"></span>Başlangıç</span>
    </div>
  `;
}

// Adımları "kaç adım uzaklıkta" olduklarına göre katmanlara yerleştir
function computeLayers(def) {
  if (!def.startStep) return null;
  const depths = { [def.startStep]: 0 };
  const queue = [def.startStep];
  let maxIter = 200;
  while (queue.length && maxIter--) {
    const cur = queue.shift();
    const outs = def.transitions.filter(t => t.from === cur);
    for (const t of outs) {
      const proposed = depths[cur] + 1;
      if (depths[t.to] === undefined || depths[t.to] < proposed) {
        depths[t.to] = proposed;
        queue.push(t.to);
      }
    }
  }
  // Eklenmemiş adımları (bağlantısız) sona koy
  let maxDepth = 0;
  Object.values(depths).forEach(d => { if (d > maxDepth) maxDepth = d; });
  def.steps.forEach(s => {
    if (depths[s.id] === undefined) depths[s.id] = maxDepth + 1;
  });
  // Katmanlara grupla
  const layers = [];
  Object.entries(depths).forEach(([sid, d]) => {
    if (!layers[d]) layers[d] = [];
    layers[d].push(sid);
  });
  return layers.filter(Boolean);
}

function renderRawPreview(def) {
  return `<div style="font-size:12px;padding:10px;">
    ${def.steps.map(s => `<div style="padding:4px 0;">→ ${escapeHtml(s.title)} <span style="color:var(--text-mute);font-size:10px;">[${s.type}]</span></div>`).join('')}
  </div>`;
}

function getStation(id) { return STATIONS.find(s => s.id === id); }

function getStationOperators(stationId) {
  const a = state.stationAssignments.find(x => x.stationId === stationId);
  return a ? a.operatorIds : [];
}

function isUserOperatorOf(stationId, userId) {
  return getStationOperators(stationId).includes(userId);
}

// Kullanıcının sorumlu olduğu istasyonları döndür
function getMyStations(userId) {
  return state.stationAssignments
    .filter(a => a.operatorIds.includes(userId))
    .map(a => getStation(a.stationId))
    .filter(Boolean);
}

function getOrdersAtStation(stationId) {
  return state.orders.filter(o => o.currentStation === stationId && o.status === 'in_progress');
}

// Operatör "başla" der → durum aktif olur
function startWorkOnOrder(orderId) {
  if (!hasPermission(state.currentUser, 'production_start_task')) {
    notify('Üretim başlatma yetkiniz yok', 'error');
    return;
  }
  const o = state.orders.find(o => o.id === orderId);
  if (!o) return;
  if (o.currentTask && o.currentTask.status === 'started') {
    notify('Bu siparişte zaten başlamış bir iş var', 'error'); return;
  }
  o.currentTask = {
    startedBy: state.currentUser,
    startedAt: Date.now(),
    status: 'started'
  };
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: o.currentStation,
    event: 'started',
    by: state.currentUser,
    at: Date.now()
  });
  persist();
  renderAll();
  notify(`${orderId} — ${getStation(o.currentStation).name} başladı`, 'success');
}

// Operatör "bittiği" der → bir sonraki istasyona geçer
function finishWorkOnOrder(orderId) {
  if (!hasPermission(state.currentUser, 'production_finish_task')) {
    notify('Üretim tamamlama yetkiniz yok', 'error');
    return;
  }
  const o = state.orders.find(o => o.id === orderId);
  if (!o) return;
  const fromStation = o.currentStation;
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: fromStation,
    event: 'finished',
    by: state.currentUser,
    at: Date.now(),
    startedAt: o.currentTask?.startedAt
  });

  if (fromStation >= STATIONS.length) {
    // Son istasyondaydı → tamamlandı
    o.status = 'completed';
    o.currentStation = STATIONS.length + 1;
    o.completedAt = Date.now();
    o.currentTask = null;
    notify(`${orderId} sevk edildi!`, 'success');
    // Müdüre bildirim
    state.users.filter(u => u.roles.includes('manager')).forEach(m => {
      pushNotif(m.id, `🏭 ${orderId} sevk edildi (${o.product})`, null);
    });
  } else {
    // Bir sonraki istasyona geç
    o.currentStation += 1;
    o.currentTask = null;
    notify(`${orderId} → ${getStation(o.currentStation).name}`, 'success');
    // Yeni istasyon operatörlerine bildirim
    getStationOperators(o.currentStation).forEach(opId => {
      pushNotif(opId, `🏭 ${orderId} (${o.product}) - ${getStation(o.currentStation).name} adımına geldi`, null);
    });
  }
  persist();
  renderAll();
}

// Operatör "geri al" der → bir önceki istasyona geri
function rewindOrder(orderId) {
  const o = state.orders.find(o => o.id === orderId);
  if (!o || o.currentStation <= 1) return;
  if (!confirm(`${orderId} bir önceki istasyona geri alınsın mı?`)) return;
  o.currentStation -= 1;
  o.currentTask = null;
  o.status = 'in_progress';
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: o.currentStation,
    event: 'rewind',
    by: state.currentUser,
    at: Date.now()
  });
  persist();
  renderAll();
  notify(`${orderId} geri alındı`, 'success');
}

function saveNewOrder() {
  const id = document.getElementById('o-id').value.trim();

  const o = state.orders.find(o => o.id === orderId);
  if (!o) return;
  if (!confirm(`${orderId} silinsin mi?`)) return;
  state.orders = state.orders.filter(o => o.id !== orderId);
  if (state.selectedOrderId === orderId) state.selectedOrderId = null;
  persist();
  renderAll();
  notify('Sipariş silindi', 'success');
}

// ============== TAKVİM VIEW ==============

function getActiveFilterTypes() {
  // Eğer kullanıcı bir kez bile değişiklik yaptıysa state.calFilterTypes Set olarak tutulur
  if (state.calFilterTypes instanceof Set) return state.calFilterTypes;
  // İlk kez ise default'lardan üret
  const s = new Set();
  Object.entries(EVENT_TYPES).forEach(([k, v]) => { if (v.defaultOn) s.add(k); });
  state.calFilterTypes = s;
  return s;
}

function toggleCalFilter(typeKey) {
  const types = getActiveFilterTypes();
  if (types.has(typeKey)) types.delete(typeKey);
  else types.add(typeKey);
  state.calFilterTypes = types;
  renderCalendarMain();
}

function setCalScope(scope) {
  state.calFilterScope = scope;
  renderCalendarMain();
}

function setCalView(view) {
  state.calView = view;
  renderCalendarMain();
}

function calNav(direction) {
  // direction: -1 (geri), 0 (bugün), 1 (ileri)
  const c = new Date(state.calCursor);
  if (direction === 0) {
    state.calCursor = Date.now();
  } else if (state.calView === 'month') {
    c.setMonth(c.getMonth() + direction);
    state.calCursor = c.getTime();
  } else if (state.calView === 'week') {
    c.setDate(c.getDate() + direction * 7);
    state.calCursor = c.getTime();
  } else if (state.calView === 'day') {
    c.setDate(c.getDate() + direction);
    state.calCursor = c.getTime();
  } else if (state.calView === 'agenda') {
    c.setDate(c.getDate() + direction * 14);
    state.calCursor = c.getTime();
  }
  renderCalendarMain();
}

function renderCalendarView(v) {
  v.innerHTML = `
    <aside class="sidebar" id="cal-sidebar"></aside>
    <main id="cal-main"></main>
  `;
  renderCalendarSidebar();
  renderCalendarMain();
}

function renderCalendarSidebar() {
  const c = document.getElementById('cal-sidebar');
  if (!c) return;
  const types = getActiveFilterTypes();
  const user = getUser(state.currentUser);
  // YETKİ BAZLI: hangi kapsamı görebileceğine bak
  const canViewSelf = hasPermission(user, 'calendar_view_self');
  const canViewTeam = hasPermission(user, 'calendar_view_team');
  const canViewAll = hasPermission(user, 'calendar_view_all');

  // Mevcut scope yetkisiz ise düzelt
  if (state.calFilterScope === 'all' && !canViewAll) {
    state.calFilterScope = canViewTeam ? 'team' : 'mine';
  }
  if (state.calFilterScope === 'team' && !canViewTeam) {
    state.calFilterScope = canViewAll ? 'all' : 'mine';
  }

  // Her tip için ne kadar olay var (geniş aralık - yıllık) — sayım
  // Performans için sadece görünür aralığın 2 katı kadar bakalım
  const cursor = new Date(state.calCursor);
  const rangeStart = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1).getTime();
  const rangeEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 2, 0, 23, 59, 59).getTime();
  const counts = {};
  Object.keys(EVENT_TYPES).forEach(k => {
    const sample = getCalendarEvents(rangeStart, rangeEnd, {
      types: new Set([k]),
      scope: state.calFilterScope
    });
    counts[k] = sample.length;
  });

  c.innerHTML = `
    <div class="cal-filters">
      <div class="cal-filter-group">
        <div class="cal-filter-title">Görünüm Kapsamı</div>
        ${canViewSelf ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'mine' ? 'checked':''} onchange="setCalScope('mine')">
          <span>Sadece benim</span>
        </label>` : ''}
        ${canViewTeam ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'team' ? 'checked':''} onchange="setCalScope('team')">
          <span>Ekibim</span>
        </label>` : ''}
        ${canViewAll ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'all' ? 'checked':''} onchange="setCalScope('all')">
          <span>Tüm şirket</span>
        </label>` : ''}
      </div>

      <div class="cal-filter-group">
        <div class="cal-filter-title">Olay Türleri</div>
        ${Object.entries(EVENT_TYPES).map(([key, meta]) => `
          <label class="cal-filter-item">
            <input type="checkbox" ${types.has(key) ? 'checked':''} onchange="toggleCalFilter('${key}')">
            <span class="cal-filter-color" style="background:${meta.color};"></span>
            <span>${meta.icon} ${meta.label}</span>
            <span class="cal-filter-count">${counts[key] || 0}</span>
          </label>
        `).join('')}
      </div>

      <div class="cal-filter-group">
        <div class="cal-filter-title">Hızlı İşlem</div>
        <button class="ghost-btn" onclick="calNav(0)" style="width:100%;">🎯 Bugüne git</button>
      </div>
    </div>
  `;
}

function renderCalendarMain() {
  const m = document.getElementById('cal-main');
  if (!m) return;
  const cursor = new Date(state.calCursor);
  const periodLabel = getCalendarPeriodLabel(cursor, state.calView);

  m.innerHTML = `
    <div class="cal-wrap">
      <div class="cal-head">
        <div class="cal-nav">
          <button onclick="calNav(-1)" title="Önceki">◀</button>
          <button onclick="calNav(0)" title="Bugün">⊙</button>
          <button onclick="calNav(1)" title="Sonraki">▶</button>
        </div>
        <div class="cal-period">${periodLabel}</div>

        <div class="cal-view-switch">
          ${['month','week','day','agenda'].map(v => `
            <button class="${state.calView === v ? 'active':''}" onclick="setCalView('${v}')">${
              v === 'month' ? 'Aylık' :
              v === 'week'  ? 'Haftalık' :
              v === 'day'   ? 'Günlük' : 'Ajanda'
            }</button>
          `).join('')}

      </div>

      <div class="cal-body" id="cal-body">
        ${renderCalendarBody()}
      </div>
    </div>
  `;

  renderCalendarSidebar();

function getCalendarPeriodLabel(cursor, view) {
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  if (view === 'month') {
    return `${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`;
  } else if (view === 'week') {
    const start = new Date(cursor);
    const day = start.getDay();
    const diff = day === 0 ? -6 : 1 - day; // Pazartesi başlasın
    start.setDate(start.getDate() + diff);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return `${start.getDate()} ${monthNames[start.getMonth()]} - ${end.getDate()} ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
  } else if (view === 'day') {
    const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    return `${days[cursor.getDay()]}, ${cursor.getDate()} ${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`;
  } else {
    return `Önümüzdeki 14 gün (${cursor.getDate()} ${monthNames[cursor.getMonth()]}'dan)`;
  }
}

function renderCalendarBody() {
  if (state.calView === 'month') return renderMonthView();
  if (state.calView === 'week') return renderWeekView();
  if (state.calView === 'day') return renderDayView();
  if (state.calView === 'agenda') return renderAgendaView();
  return '';
}

// AYLIK GÖRÜNÜM
function renderMonthView() {
  const cursor = new Date(state.calCursor);
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Pazartesi=0
  const gridStart = new Date(year, month, 1 - startDay);
  // 6 hafta = 42 hücre
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridStart.getDate() + 41);
  gridEnd.setHours(23,59,59);

  const events = getCalendarEvents(gridStart.getTime(), gridEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Olayları gün gün dağıt - aralıklı olaylar her güne basılır
  const dayMap = {}; // 'YYYY-MM-DD' -> [events]
  events.forEach(ev => {
    const start = new Date(ev.date);
    const end = ev.endDate ? new Date(ev.endDate) : start;
    // Her güne ekle
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while (cur <= endDay) {
      const key = formatDateKey(cur);
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  // Grid HTML
  const dayHeaders = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let html = '<div class="cal-month">';
  dayHeaders.forEach(d => html += `<div class="cal-month-header">${d}</div>`);

  const today = new Date();
  const todayKey = formatDateKey(today);

  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const isOtherMonth = cellDate.getMonth() !== month;
    const isToday = formatDateKey(cellDate) === todayKey;
    const key = formatDateKey(cellDate);
    const dayEvents = dayMap[key] || [];
    const shown = dayEvents.slice(0, 3);
    const moreCount = dayEvents.length - shown.length;

    html += `<div class="cal-month-cell ${isOtherMonth?'other-month':''} ${isToday?'today':''}" onclick="onCalDayClick('${cellDate.toISOString()}')">
      <div class="cal-day-num">${cellDate.getDate()}</div>
      ${shown.map(ev => `
        <div class="cal-event-chip" style="border-left-color:${ev.color};background:${ev.color}22;" onclick="event.stopPropagation();showCalEventDetail('${escapeAttr(ev.id)}')">
          ${ev.icon || ''} ${escapeHtml(ev.title)}
        </div>
      `).join('')}
      ${moreCount > 0 ? `<div class="cal-more-link" onclick="event.stopPropagation();onCalDayClick('${cellDate.toISOString()}')">+ ${moreCount} daha</div>` : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

// HAFTALIK GÖRÜNÜM
function renderWeekView() {
  const cursor = new Date(state.calCursor);
  const day = cursor.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const weekStart = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + diff);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  weekEnd.setHours(23,59,59);

  const events = getCalendarEvents(weekStart.getTime(), weekEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Günleri grupla
  const byDay = {};
  events.forEach(ev => {
    const start = new Date(ev.date);
    const end = ev.endDate ? new Date(ev.endDate) : start;
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while (cur <= endDay) {
      const key = formatDateKey(cur);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  const todayKey = formatDateKey(new Date());
  const dayNames = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];

  let html = '<div class="cal-week">';
  // Başlık satırı
  html += '<div class="cal-week-header"></div>';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const isToday = formatDateKey(d) === todayKey;
    html += `<div class="cal-week-header ${isToday?'today':''}">${dayNames[i]}<br>${d.getDate()}.${d.getMonth()+1}</div>`;
  }
  // Tek satır: tüm günün olayları
  html += '<div class="cal-week-hour" style="background:var(--panel-2);">Tüm gün</div>';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const key = formatDateKey(d);
    const dayEvents = byDay[key] || [];
    html += `<div class="cal-week-cell" onclick="onCalDayClick('${d.toISOString()}')">
      ${dayEvents.map(ev => `
        <div class="cal-event-chip" style="border-left-color:${ev.color};background:${ev.color}22;font-size:11px;margin:2px 0;" onclick="event.stopPropagation();showCalEventDetail('${escapeAttr(ev.id)}')">
          ${ev.icon || ''} ${escapeHtml(ev.title)}
        </div>
      `).join('')}
    </div>`;
  }
  html += '</div>';
  return html;
}

// GÜNLÜK GÖRÜNÜM
function renderDayView() {
  const cursor = new Date(state.calCursor);
  const dayStart = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  const dayEnd = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), 23,59,59);

  const events = getCalendarEvents(dayStart.getTime(), dayEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Tüm gün olayları + aralık olayları (bu gün içine girenler)
  const allEvents = events.slice();
  state.users.forEach(u => {
    if (!getActiveFilterTypes().has('absence')) return;
    (u.absences || []).forEach(a => {
      if (!a.from || !a.to) return;
      const f = new Date(a.from).getTime();
      const t = new Date(a.to).getTime();
      if (f <= dayEnd.getTime() && t >= dayStart.getTime()) {
        // events listesinde zaten olabilir, filtreliyoruz
        if (!allEvents.find(e => e.id === `abs_${u.id}_${a.id || a.from}`)) {
          // (Aslında getCalendarEvents zaten ekliyor olmalı, bu sigorta)
        }
      }
    });
  });

  events.sort((a,b) => a.date - b.date);

  if (events.length === 0) {
    return '<div class="cal-day-list"><div class="empty"><div class="empty-icon">📅</div><div>Bu günde olay yok</div></div></div>';
  }

  return '<div class="cal-day-list">' + events.map(ev => {
    const timeLabel = ev.allDay ? 'Tüm gün' : new Date(ev.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="cal-day-event" style="border-left:3px solid ${ev.color};" onclick="showCalEventDetail('${escapeAttr(ev.id)}')">
        <div class="cal-day-event-icon">${ev.icon || '•'}</div>
        <div style="flex:1;">
          <div class="cal-day-event-title">${escapeHtml(ev.title)}</div>
          ${ev.subtitle ? `<div class="cal-day-event-subtitle">${escapeHtml(ev.subtitle)}</div>` : ''}
        </div>
        <div class="cal-day-event-time">${timeLabel}</div>
      </div>
    `;
  }).join('') + '</div>';
}

// AJANDA GÖRÜNÜMÜ
function renderAgendaView() {
  const start = new Date(state.calCursor);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 14);
  end.setHours(23,59,59);

  const events = getCalendarEvents(start.getTime(), end.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Gün gün grupla
  const byDay = {};
  events.forEach(ev => {
    const d = new Date(ev.date);
    const key = formatDateKey(d);
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(ev);
  });

  const todayKey = formatDateKey(new Date());
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const dayNames = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];

  let html = '<div class="cal-agenda">';
  for (let i = 0; i < 14; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = formatDateKey(d);
    const dayEvents = byDay[key] || [];
    if (dayEvents.length === 0) continue;
    const isToday = key === todayKey;
    html += `<div class="cal-agenda-day">
      <div class="cal-agenda-day-head ${isToday?'today':''}">
        <span>${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]}${isToday ? ' (Bugün)' : ''}</span>
        <span style="font-weight:400;color:var(--text-mute);">${dayEvents.length} olay</span>
      </div>
      ${dayEvents.map(ev => `
        <div class="cal-agenda-event" style="border-left:3px solid ${ev.color};" onclick="showCalEventDetail('${escapeAttr(ev.id)}')">
          <div style="font-size:16px;">${ev.icon || '•'}</div>
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:500;">${escapeHtml(ev.title)}</div>
            ${ev.subtitle ? `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${escapeHtml(ev.subtitle)}</div>` : ''}
          </div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text-mute);">${ev.allDay ? 'Tüm gün' : new Date(ev.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      `).join('')}
    </div>`;
  }
  html += '</div>';
  if (Object.keys(byDay).length === 0) {
    html = '<div class="empty" style="padding:40px;"><div class="empty-icon">📅</div><div>Önümüzdeki 14 günde olay yok</div></div>';
  }
  return html;
}

// Olay detayını modal'da göster
function showCalEventDetail(eventId) {
  // Olayı bul - tarihten geri arama yapamayacağımız için tüm geniş aralıkta ara
  const rangeStart = Date.now() - 365 * 24 * 3600000;
  const rangeEnd = Date.now() + 365 * 24 * 3600000;
  const all = getCalendarEvents(rangeStart, rangeEnd, {
    types: new Set(Object.keys(EVENT_TYPES)),
    scope: 'all'
  });
  const ev = all.find(e => e.id === eventId);
  if (!ev) { notify('Olay bulunamadı', 'error'); return; }

  const user = ev.userId ? getUser(ev.userId) : null;
  const dateStr = new Date(ev.date).toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const endStr = ev.endDate ? new Date(ev.endDate).toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : null;

  let extraDetail = '';
  if (ev.extra?.reason) extraDetail += `<div class="kv"><span class="k">Sebep</span><span class="v">${escapeHtml(ev.extra.reason)}</span></div>`;
  if (ev.extra?.delegate) extraDetail += `<div class="kv"><span class="k">Vekil</span><span class="v">${escapeHtml(ev.extra.delegate)}</span></div>`;
  if (ev.extra?.qty) extraDetail += `<div class="kv"><span class="k">Miktar</span><span class="v">${escapeHtml(String(ev.extra.qty))}</span></div>`;
  if (ev.extra?.status) extraDetail += `<div class="kv"><span class="k">Durum</span><span class="v">${escapeHtml(ev.extra.status)}</span></div>`;

  let actionBtn = '';
  if (ev.instanceId) {
    actionBtn = `<button class="primary-btn" onclick="closeModal();state.currentTop='work';state.selected={type:'instance',id:'${ev.instanceId}'};state.workTab='all';renderAll();">İlgili talebi aç →</button>`;
  }

  openModal({
    title: `${ev.icon || '📅'} ${ev.title}`,
    body: `
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">
        ${escapeHtml(EVENT_TYPES[ev.type]?.label || ev.type)}
      </div>
      <div class="detail-section">
        <div class="kv"><span class="k">Tarih</span><span class="v">${dateStr}</span></div>
        ${endStr ? `<div class="kv"><span class="k">Bitiş</span><span class="v">${endStr}</span></div>` : ''}
        ${user ? `<div class="kv"><span class="k">Kullanıcı</span><span class="v">${escapeHtml(user.name)}</span></div>` : ''}
        ${ev.subtitle ? `<div class="kv"><span class="k">Detay</span><span class="v">${escapeHtml(ev.subtitle)}</span></div>` : ''}
        ${extraDetail}
      </div>
    `,
    foot: `
      <button class="ghost-btn" onclick="closeModal()">Kapat</button>
      ${actionBtn}
    `
  });
}

// Yardımcı: YYYY-MM-DD anahtarı üret
function formatDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeAttr(s) {
  return String(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

const REPORT_RANGES = {
  '7d':   { label:'Son 7 gün',   days: 7 },
  '30d':  { label:'Son 30 gün',  days: 30 },
  '90d':  { label:'Son 90 gün',  days: 90 },
  '365d': { label:'Son 1 yıl',   days: 365 },
  'all':  { label:'Tümü',        days: null }
};

function getReportRangeMs() {
  const r = REPORT_RANGES[state.reportRange] || REPORT_RANGES['30d'];
  if (r.days === null) return { start: 0, end: Date.now(), label: r.label };
  return { start: Date.now() - r.days * 24 * 3600 * 1000, end: Date.now(), label: r.label };
}

}

function setReportRange(range) {
  state.reportRange = range;
  renderReportsView(document.getElementById('view'));
}

function renderHomeView(v) {

  const isPrivileged = hasPermission(u, 'workflows_view_all') || hasPermission(u, 'workflows_view_team');

  // Selamlama
  const hour = new Date().getHours();
  const greeting = hour < 6 ? 'İyi geceler' : hour < 12 ? 'Günaydın' : hour < 18 ? 'İyi günler' : 'İyi akşamlar';

    myTeam.some(m => m.id === i.ownerId) && (i.status === 'active' || i.status === 'in_progress')

  // Üretim (operator için)
  let myStations = u.stations || [];

    myStations.includes(o.currentStation) && o.status === 'in_progress'

  const recentHistory = (state.history || [])

    .slice(0, 10);

  // Yaklaşan tarihler (kullanıcının ilgili olduğu)

      upcomingDates.push({

        icon: '🌴',

  });
  // Ekibinin izinleri (manager için)
  if (isManager) {
    myTeam.forEach(m => {
      (m.absences || []).forEach(a => {
        const fromDate = new Date(a.from);
        const daysAway = Math.floor((fromDate - today) / 86400000);
        if (daysAway >= 0 && daysAway <= 14) {
          upcomingDates.push({
            date: a.from,
            daysAway,

            <div class="home-stat-num">${myTasks.length}</div>
            <div class="home-stat-label">Bekleyen Görevim</div>
          </div>
        </div>

        <div class="home-stat-card" onclick="setTopTab('work');state.workTab='mine';renderAll();">

        ${isPrivileged ? `

            <div class="home-stat-label">Sistemde Aktif Talep</div>

        ${isOperator && myStations.length ? `

            <div class="notif-page-item-body">

              <div class="notif-page-item-time">${formatAge(n.ts || 0)}${n.instanceId ? ` · <span class="notif-page-item-link">${n.instanceId}</span>` : ''}</div>
            </div>
            ${!n.read ? '<button class="notif-page-item-mark" onclick="event.stopPropagation();markNotifRead(\'' + n.id + '\');renderAll();">Okundu</button>' : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function markNotifRead(notifId) {
  const n = state.notifications.find(x => x.id === notifId);
  if (n) { n.read = true; persist(); }
}

function handleNotifClick(notifId, instanceId) {
  markNotifRead(notifId);
  if (instanceId) {
    state.currentTop = 'work';
    state.selected = { type: 'instance', id: instanceId };
    renderAll();
  } else {
    renderAll();
  }
}

function clearReadNotifications() {
  if (!confirm('Okunmuş bildirimler silinsin mi?')) return;
  const me = state.currentUser;
  state.notifications = state.notifications.filter(n => n.userId !== me || !n.read);
  persist();
  renderAll();
  notify('Okunmuş bildirimler silindi', 'success');
}
