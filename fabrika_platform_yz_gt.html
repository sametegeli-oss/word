function localInterpret(t) {
  const s = t.toLocaleLowerCase('tr-TR');
  // Rol oluştur: "... rolü aç/oluştur/ekle"
  let m = s.match(/([a-zçğıöşü0-9 ]+?)\s*(?:rol[üu]?|rol)\s*(?:olu[şs]tur|a[çc]|ekle)/);
  if (m && m[1] && m[1].trim()) return { tool: 'rolOlustur', params: { ad: m[1].trim() }, explain: `"${m[1].trim()}" rolü oluşturulacak.` };
  if (/(rol olu[şs]tur|yeni rol|rol ekle)/.test(s)) return { tool: 'rolOlustur', params: { ad: t.replace(/.*rol/i,'').replace(/(olu[şs]tur|a[çc]|ekle)/gi,'').trim() }, explain: 'Rol oluşturulacak.' };
  // Kullanıcı oluştur — "tanımla", "kaydet", "ekle", "aç", "oluştur" + araya sıfat (ör. pazarlamacı) girebilir
  if (/(kullanıcı|personel|çalışan|eleman)[^.]*\b(olu[şs]tur|a[çc]|ekle|tanımla|kaydet|gir)|\b(olu[şs]tur|tanımla|ekle|kaydet)[^.]*\b(kullanıcı|personel|çalışan|eleman)|(yeni|bir)\b[^.]*\b(kullanıcı|personel|çalışan|eleman)/.test(s)) {
    // İsim çıkarımı: "ahmet yavuz adında", "adı ahmet yavuz olan", "ahmet yavuz isimli" gibi kalıplar
    let ad = '';
    let am = t.match(/([a-zçğıöşüA-ZÇĞİÖŞÜ]+(?:\s+[a-zçğıöşüA-ZÇĞİÖŞÜ]+)?)\s*(?:adında|adıyla|isminde|isimli|ismiyle)/);
    if (!am) am = t.match(/(?:adı|ismi)\s+([a-zçğıöşüA-ZÇĞİÖŞÜ]+(?:\s+[a-zçğıöşüA-ZÇĞİÖŞÜ]+)?)\s*(?:olan|olarak)?/);
    if (am && am[1]) ad = am[1].trim();
    return { tool: 'kullaniciOlusturmaEkraniAc', params: ad ? { ad } : {}, explain: `Kullanıcı oluşturma ekranı açılıyor${ad ? ' ("' + ad + '" ile dolduruluyor)' : ''} — şifre ve onay sizde kalır.` };
  }
  // Atanmamış / sahipsiz görevler (kişi adı sanılmasın)
  if (/atanmam[ıi][şs]|sahipsiz|kimseye atanma|bo[şs]ta(ki)? görev/.test(s) && /görev|i[şs]/.test(s)) {
    return { tool: 'sorgu', params: { koleksiyon: 'tasks', filtreler: [{ field: 'assigneeId', op: 'exists', value: false }], alanlar: ['id', 'title', 'instanceId'] }, explain: 'Atanmamış görevler listeleniyor.' };
  }

  // Kişinin görevleri: "Ali'nin görevleri", "Ahmet'in işleri"
  let gm = s.match(/([a-zçğıöşü]+)['']?(?:n[ıi]n|in|nin)?\s*(?:üzerindeki\s*)?(?:açık\s*)?(?:görev|i[şs])(?:ler)?/);
  if (gm && gm[1] && gm[1].length > 2 && !/kim|hangi|tüm|bütün|atanmam|sahipsiz|bo[şs]ta/.test(gm[1])) {
    return { tool: 'kisininGorevleri', params: { ad: gm[1].trim() }, explain: `"${gm[1].trim()}" kişisinin görevleri listeleniyor.` };
  }
  if (/en yük[lü]ü|en çok görev|kim yoğun|en meşgul|iş yükü/.test(s)) return { tool: 'enYukluKisilerDetayli', params: {}, explain: 'En yüklü kişiler detaylı olarak sıralanıyor.' };

  // Çoklu tablo / yerel analiz araçları
  if (/(kullan[ıi]c[ıi]s[ıi] olmayan rol|bo[şs] rol|kullan[ıi]lmayan rol)/.test(s)) return { tool: 'kullanilmayanRoller', params: {}, explain: 'Kullanıcısı olmayan roller bulunuyor.' };
  if (/(bo[şs]|kullan[ıi]lmayan|hi[çc] talep aç[ıi]lmam[ıi][şs]|talebi olmayan)\s+(s[üu]re[çc]|form)|s[üu]re[çc].*(bo[şs]|kullan[ıi]lmayan|talep yok)/.test(s)) return { tool: 'kullanilmayanSurecler', params: {}, explain: 'Hiç talep açılmamış/boş süreçler bulunuyor.' };
  if (/(rollere göre kullan[ıi]c[ıi]|rol bazl[ıi] kullan[ıi]c[ıi]|kullan[ıi]c[ıi]lar[ıi]? rollere göre|hangi rolde kim)/.test(s)) return { tool: 'rolBazliKullanicilar', params: {}, explain: 'Kullanıcılar rollere göre listeleniyor.' };
  if (/(hi[çc] görev[iı] olmayan kullan[ıi]c[ıi]|görevsiz kullan[ıi]c[ıi]|üzerinde görev olmayan)/.test(s)) return { tool: 'gorevsizKullanicilar', params: {}, explain: 'Hiç açık görevi olmayan kullanıcılar listeleniyor.' };
  if (/(hi[çc] talep açmam[ıi][şs]|talep açmayan kullan[ıi]c[ıi])/.test(s)) return { tool: 'talepAcmayanKullanicilar', params: {}, explain: 'Hiç talep açmamış kullanıcılar listeleniyor.' };
  if (/(görevi olmayan ama açık talebi olan|aç[ıi]k talebi olup görevi olmayan)/.test(s)) return { tool: 'gorevsizAmaTalebiOlanlar', params: {}, explain: 'Açık talebi olup açık görevi olmayan kullanıcılar bulunuyor.' };
  if (/(hangi rol hi[çc] talep açmam[ıi][şs]|rol.*talep açmam)/.test(s)) return { tool: 'hangiRolTalepAcmamis', params: {}, explain: 'Talep açmamış roller analiz ediliyor.' };
  if (/(bu hafta aç[ıi]lan talep|son 7 gün.*talep)/.test(s)) return { tool: 'buHaftaAcilanlar', params: {}, explain: 'Bu hafta açılan talepler listeleniyor.' };
  if (/(bu ay aç[ıi]lan talep|ayl[ıi]k talep)/.test(s)) return { tool: 'buAyAcilanlar', params: {}, explain: 'Bu ay açılan talepler listeleniyor.' };
  if (/(bug[üu]n aç[ıi]lan talep|günlük talep)/.test(s)) return { tool: 'bugunAcilanlar', params: {}, explain: 'Bugün açılan talepler listeleniyor.' };
  if (/(son 24 saat.*görev|24 saatteki görev)/.test(s)) return { tool: 'son24SaatGorevleri', params: {}, explain: 'Son 24 saatteki görevler listeleniyor.' };
  if (/(ortalama tamamlanma süresi|talep.*kaç günde tamamlan)/.test(s)) return { tool: 'ortalamaTamamlanmaSuresi', params: {}, explain: 'Ortalama talep tamamlanma süresi hesaplanıyor.' };
  if (/(ortalama bekleme süresi|ortalama.*bekliyor)/.test(s)) return { tool: 'ortalamaBeklemeSuresi', params: {}, explain: 'Ortalama bekleme süresi hesaplanıyor.' };
  if (/(sla|süre a[şs][ıi]m|süreyi aşan|geç kalan)/.test(s)) return { tool: 'slaAsanlar', params: {}, explain: 'SLA/süre aşımı olan talepler listeleniyor.' };
  if (/(en aktif gün|en aktif saat|hangi saat.*yoğun)/.test(s)) return { tool: 'enAktifGunSaat', params: {}, explain: 'En aktif gün ve saat dağılımı çıkarılıyor.' };
  if (/(geçen aya göre|geçen ay.*art[ıi][şs]|talep art[ıi][şs][ıi])/.test(s)) return { tool: 'gecenAyaGoreTalepArtisi', params: {}, explain: 'Geçen aya göre talep artışı hesaplanıyor.' };
  if (/(tamamlama oran[ıi]|görev tamamlama)/.test(s)) return { tool: 'gorevTamamlamaOrani', params: {}, explain: 'Kişi bazlı görev tamamlama oranı hesaplanıyor.' };
  if (/(talep ba[şs][ıi]na.*görev|ortalama görev say[ıi]s[ıi])/.test(s)) return { tool: 'talepBasinaOrtalamaGorev', params: {}, explain: 'Talep başına ortalama görev sayısı hesaplanıyor.' };
  if (/(departman.*iş yükü|rol bazl[ıi].*iş yükü|ekip yükü)/.test(s)) return { tool: 'departmanBazliIsYuku', params: {}, explain: 'Departman/rol bazlı iş yükü hesaplanıyor.' };
  if (/(bo[şs] kapasite|bo[şs]ta kapasite|bo[şs]ta olan ekip|kapasitesi olan)/.test(s)) return { tool: 'bosKapasiteAnalizi', params: {}, explain: 'Boş kapasite analizi yapılıyor.' };
  if (/(iş da[ğg][ıi]t[ıi]m öner|görevleri kime ver|atanmam[ıi][şs].*da[ğg][ıi]t)/.test(s)) return { tool: 'isDagitimOnerisi', params: {}, explain: 'İş dağıtım önerisi hazırlanıyor.' };
  if (/(tıkan|tikan|darbo[ğg]az|hangi süreç.*sorun|hangi süreç.*bekliyor)/.test(s)) return { tool: 'surecTikaniklikAnalizi', params: {}, explain: 'Süreç tıkanıklığı yerel veriyle analiz ediliyor.' };

  // Kayıtlı sorgular: "kayıtlı sorgular", "<ad> sorgusunu çalıştır""
  if (/(kay[ıi]tl[ıi] sorgu(lar)?|kaydedilmi[şs] sorgu)/.test(s) && !/çal[ıi][şs]t[ıi]r|aç/.test(s)) {
    return { tool: 'kayitliSorgular', params: {}, explain: 'Kayıtlı sorgular listeleniyor.' };
  }
  let sq = t.match(/["']?([a-zA-ZçğıöşüÇĞİÖŞÜ0-9 _-]+?)["']?\s*(?:adl[ıi]|isimli|adındaki)?\s*sorgu\w*\s*(?:çal[ıi][şs]t[ıi]r|aç|getir|listele)/i);
  if (sq && sq[1] && sq[1].trim() && !/^(kay[ıi]tl[ıi]|kaydedilmi[şs]|t[üu]m|b[üu]t[üu]n)$/i.test(sq[1].trim())) {
    return { tool: 'kayitliSorguCalistir', params: { ad: sq[1].trim() }, explain: `"${sq[1].trim()}" kayıtlı sorgusu çalıştırılıyor.` };
  }
  if (/izinli|izinde|bugün kim yok|kimler izinli|tatilde/.test(s)) return { tool: 'izinliler', params: {}, explain: 'İzinli kişiler listeleniyor.' };

  if (/(tıkan|tikan|darbo[ğg]az|en yava[şs]|neden gecik|hangi süreç.*sorun|performans|analiz|yorumla|de[ğg]erlendir)/.test(s)) return { tool: 'analizYap', params: { soru: t }, explain: 'Tıkanıklık/performans analizi yapılıyor.' };
  if (/(özel|genel durum|durum nedir|özet|genel bak|dashboard|panele bak)/.test(s)) return { tool: 'ozet', params: {}, explain: 'Sistem özeti getiriliyor.' };

  // Geciken talepler — "X günden eski" gibi sayı yakalama
  if (/geciken|gecikmiş|bekleyen.*uzun|uzun süredir/.test(s)) {
    const gunMatch = s.match(/(\d+)\s*g[üu]n/);
    const params = gunMatch ? { gun: parseInt(gunMatch[1], 10) } : {};
    return { tool: 'gecikenTalepler', params, explain: `Geciken talepler listeleniyor${gunMatch ? ' (' + gunMatch[1] + ' günden eski)' : ''}.` };
  }

  // Kullanıcı listeleme (opsiyonel rol filtresi)
  if (/^(kullan[ıi]c[ıi]lar|kullan[ıi]c[ıi]lar[ıi]?|personeller|çalışanlar)$/i.test(s.trim()) || /kullan[ıi]c[ıi].*(liste|ver|söyle|göster)|kim var|çalışanlar|personel listesi|personelleri göster|t[üu]m kullan[ıi]c[ıi]/.test(s)) {
    const rolMatch = s.match(/(?:rol[üu]?|rolünde|rolündeki|olan)\s*([a-zçğıöşü_]+)/);
    let role = null;
    if (rolMatch && rolMatch[1]) {
      const aday = rolMatch[1].trim();
      const bulunan = (state.roles || []).find(r => r.id === aday || String(r.name).toLocaleLowerCase('tr-TR').includes(aday));
      if (bulunan) role = bulunan.id;
    }
    return { tool: 'listeKullanicilar', params: role ? { role } : {}, explain: 'Kullanıcılar listeleniyor.' };
  }

  if (/^(s[üu]re[çc]ler|formlar)$/i.test(s.trim()) || /s[üu]re[çc].*(liste|ver|söyle|göster)|form.*(liste|ver|söyle|göster)|hangi s[üu]re[çc]|form tipleri|tanımlı form/.test(s)) return { tool: 'listeSurecler', params: {}, explain: 'Süreçler listeleniyor.' };

  // Talep durumu (tamamlanan / reddedilen / açık / hepsi)
  if (/tamamlanan.*talep|biten.*talep|talepleri.*tamamlan/.test(s)) return { tool: 'listeTalepler', params: { status: 'completed' }, explain: 'Tamamlanan talepler listeleniyor.' };
  if (/reddedilen.*talep|red.*talep|talepleri.*reddedil/.test(s)) return { tool: 'listeTalepler', params: { status: 'rejected' }, explain: 'Reddedilen talepler listeleniyor.' };
  if (/t[üu]m talepler|b[üu]t[üu]n talepler|talepleri.*hepsi/.test(s)) return { tool: 'listeTalepler', params: { status: 'all' }, explain: 'Tüm talepler listeleniyor.' };
  if (/talep.*listele|talepleri göster|açık talep/.test(s)) return { tool: 'listeTalepler', params: { status: 'running' }, explain: 'Açık talepler listeleniyor.' };

  // Yardım / yönlendirme: "nasıl komut girerim", "ne yapabilirsin", "komut listesi" vb.
  if (/yard[ıi]m|ne yapabil|neler yapabil|nas[ıi]l komut|komut.*(listesi|göster|gir|ver|yaz|kullan)|hangi komut|komutlar.*(ne|var|liste|göster)|ne.*komut|nas[ıi]l kullan|ne.*söyleyebil|örnek.*(komut|kullan)|seni nas[ıi]l|sana nas[ıi]l|yönlendir/.test(s)) {
    return { tool: null, isHelp: true, explain: (typeof aiHelpText === 'function' ? aiHelpText() : 'Komut listesi alınamadı.') };
  }

  return { tool: null, explain: 'Komutu anlayamadım. "yardım" yazarak neler yapabileceğimi görebilirsiniz.' };
}

// Konsola sonuç yaz + (açıksa) sesli oku
// Aktif yapay zeka sağlayıcısı + model adını okunabilir biçimde döndürür.
// Konsol başlığı ve her AI cevabının etiketi bunu kullanır.
function aiActiveModelLabel() {
  const cfg = (typeof getAISettings === 'function') ? getAISettings() : { provider: 'local' };
  const provider = cfg.provider || 'local';
  const providerNames = { local: 'Yerel motor', openai: 'OpenAI', groq: 'Groq', gemini: 'Gemini', anthropic: 'Claude', custom: 'Özel API' };
  const pName = providerNames[provider] || provider;
  if (provider === 'local') return 'Yerel motor (AI kapalı)';
  let model = cfg.models?.[provider] || (typeof AI_PROVIDERS !== 'undefined' ? AI_PROVIDERS[provider]?.model : '') || '';
  if (typeof GROQ_MODEL_REMAP !== 'undefined' && provider === 'groq' && GROQ_MODEL_REMAP[model]) model = GROQ_MODEL_REMAP[model];
  return model ? `${pName} · ${model}` : pName;
}
window.aiActiveModelLabel = aiActiveModelLabel;

// Araç sonucunu okunabilir HTML'e çevir (ham JSON yerine tablo/liste).
function formatResultAsHtml(data) {
  if (data === undefined || data === null) return '';
  const tbl = 'width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;';
  const th = 'text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-hi);color:var(--text-mute);font-size:10px;text-transform:uppercase;';
  const td = 'padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text);';

  const cell = (v) => {
    if (v === null || v === undefined || v === '') return '<span style="color:var(--text-mute);">—</span>';
    if (Array.isArray(v)) return escapeHtml(v.join(', '));
    if (typeof v === 'object') return escapeHtml(JSON.stringify(v));
    return escapeHtml(String(v));
  };

  // 1) Gruplama sonucu: { gruplar: [{deger, sayi}], ... }
  if (Array.isArray(data.gruplar)) {
    if (!data.gruplar.length) return '<div style="color:var(--text-mute);margin-top:6px;">Sonuç yok.</div>';
    const rows = data.gruplar.map(g =>
      `<tr><td style="${td}">${cell(g.deger)}</td><td style="${td}text-align:right;font-family:var(--mono);">${cell(g.sayi)}</td></tr>`
    ).join('');
    return `<table style="${tbl}"><thead><tr><th style="${th}">Değer</th><th style="${th}text-align:right;">Sayı</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // 2) Liste sonucu: { items: [...] }
  if (Array.isArray(data.items)) {
    if (!data.items.length) return '<div style="color:var(--text-mute);margin-top:6px;">Kayıt bulunamadı.</div>';
    const first = data.items[0];
    if (first && typeof first === 'object') {
      const cols = Object.keys(first);
      const head = cols.map(c => `<th style="${th}">${escapeHtml(c)}</th>`).join('');
      const body = data.items.map(it =>
        '<tr>' + cols.map(c => `<td style="${td}">${cell(it[c])}</td>`).join('') + '</tr>'
      ).join('');
      const fazla = (data.toplam && data.toplam > data.items.length)
        ? `<div style="color:var(--text-mute);font-size:11px;margin-top:4px;">${data.items.length} / ${data.toplam} kayıt gösteriliyor.</div>` : '';
      return `<table style="${tbl}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${fazla}`;
    }
    // Basit dizi (nesne değil)
    return `<div style="margin-top:6px;">${data.items.map(x => escapeHtml(String(x))).join(', ')}</div>`;
  }

  // 3) Tekil nesne: etiket-değer çiftleri (items/gruplar dışındaki anlamlı alanlar)
  if (typeof data === 'object') {
    const gizli = new Set(['items', 'gruplar', 'alanlar', 'veri', 'analiz']);
    const entries = Object.entries(data).filter(([k, v]) =>
      !gizli.has(k) && v !== undefined && v !== null && typeof v !== 'object'
    );
    if (entries.length) {
      const rows = entries.map(([k, v]) =>
        `<tr><td style="${td}color:var(--text-mute);">${escapeHtml(k)}</td><td style="${td}">${cell(v)}</td></tr>`
      ).join('');
      return `<table style="${tbl}"><tbody>${rows}</tbody></table>`;
    }
  }
  return ''; // gösterilecek yapısal veri yok
}

function aiConsoleLog(role, text, data) {
  const box = document.getElementById('ai-console-log');
  if (box) {
    const div = document.createElement('div');
    div.style.cssText = 'margin-bottom:10px;font-size:13px;line-height:1.5;';
    const isAI = role !== 'user';
    const who = isAI ? '🤖 AI' : '🗣️ Siz';
    const color = isAI ? 'var(--accent)' : 'var(--text)';
    // AI satırlarında o an aktif olan modeli küçük bir etiketle göster
    const modelTag = isAI
      ? `<span style="font-weight:400;font-size:10px;color:var(--text-mute,#64748b);margin-left:6px;">· ${escapeHtml(aiActiveModelLabel())}</span>`
      : '';
    let html = `<div style="color:${color};font-weight:600;">${who}${modelTag}</div><div style="color:var(--text-dim);">${escapeHtml(text)}</div>`;
    if (data !== undefined) {
      const pretty = formatResultAsHtml(data);
      if (pretty) {
        html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;margin-top:5px;overflow:auto;max-height:300px;">${pretty}</div>`;
      }
      // Ham JSON'u yalnızca isteğe bağlı, katlanmış bir detay olarak sun
      html += `<details style="margin-top:4px;"><summary style="cursor:pointer;color:var(--text-mute);font-size:10px;">Ham veri (JSON)</summary><pre style="background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;margin-top:4px;font-size:11px;overflow:auto;max-height:240px;">${escapeHtml(JSON.stringify(data, null, 2))}</pre></details>`;
    }
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
}

// Çalıştırılan sorguyu düzenlenebilir bir kutuda göster (kullanıcı değiştirip yeniden çalıştırabilir)
function aiConsoleShowQuery(params) {

window.aiConsoleShowQuery = aiConsoleShowQuery;

// Düzenlenmiş sorgu kutusundaki JSON'u alıp sorgu aracını tekrar çalıştır
async function rerunEditedQuery(qid) {
  const el = document.getElementById(qid);
  if (!el) return;
  let params;
  try {
    params = JSON.parse(el.value);
  } catch (e) {
    aiConsoleLog('ai', 'Sorgu JSON geçersiz: ' + e.message + ' — virgül/tırnak hatası olabilir.');
    return;
  }
  aiConsoleLog('ai', 'Düzenlenen sorgu çalıştırılıyor...');
  try {
    const result = await runAITool('sorgu', params);
    if (result && result.iptal) { aiConsoleLog('ai', result.mesaj); return; }
    aiConsoleShowQuery(params); // yeni sürümü de düzenlenebilir göster
    const spoken = summarizeResultForSpeech('sorgu', result);
    aiConsoleLog('ai', spoken, result);
    speak(spoken);
  } catch (e) {
    aiConsoleLog('ai', 'Sorgu başarısız: ' + e.message);
  }
}
window.rerunEditedQuery = rerunEditedQuery;

// Sorgu kutusundaki (düzenlenmiş) JSON'u alıp isim sorarak kayıtlı sorgu olarak sakla
async function saveQueryFromBox(qid) {
  const el = document.getElementById(qid);
  if (!el) return;
  let params;
  try { params = JSON.parse(el.value); }
  catch (e) { aiConsoleLog('ai', 'Sorgu JSON geçersiz, kaydedilemedi: ' + e.message); return; }
  const ad = prompt('Bu sorguyu hangi isimle kaydedeyim?\n(Tüm kullanıcılar bu adla çağırabilir.)');
  if (ad === null) return;
  if (!ad.trim()) { aiConsoleLog('ai', 'İsim boş olamaz, kaydetme iptal edildi.'); return; }
  const aciklama = prompt('Kısa açıklama (opsiyonel):') || '';
  try {
    const q = await saveNamedQuery(ad, params, aciklama);
    aiConsoleLog('ai', `✓ "${q.name}" adıyla kaydedildi. Artık "${q.name} sorgusunu çalıştır" diyebilirsiniz.`);
    if (typeof renderAll === 'function') renderAll();
  } catch (e) {
    aiConsoleLog('ai', 'Kaydedilemedi: ' + e.message);
  }
}
window.saveQueryFromBox = saveQueryFromBox;

// Ana akış: direktif al → yorumla → çalıştır → bildir
let AI_COMMAND_RUNNING = false;
async function runAICommand(userText) {
  userText = (userText || '').trim();
  if (!userText) return;
  if (AI_COMMAND_RUNNING) return; // Aynı anda iki komut işlenmesin (Enter + buton)
  AI_COMMAND_RUNNING = true;
  const sendBtn = document.querySelector('#ai-console-overlay .primary-btn');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.style.opacity = '0.6'; }
  try {
    await _runAICommandInner(userText);
  } finally {
    AI_COMMAND_RUNNING = false;
    if (sendBtn) { sendBtn.disabled = false; sendBtn.style.opacity = ''; }
  }
}

async function _runAICommandInner(userText) {
  aiConsoleLog('user', userText);
  const inputEl = document.getElementById('ai-console-input');
  if (inputEl) inputEl.value = '';

  // Proaktif öneri bekliyorsa ve kullanıcı onaylıyorsa, o eylemi çalıştır
  if (typeof PROACTIVE !== 'undefined' && PROACTIVE.pendingAction && /^(evet|olur|tamam|gönder|yap|onayl[ıi]yorum)/i.test(userText)) {
    const pa = PROACTIVE.pendingAction; PROACTIVE.pendingAction = null;
    aiConsoleLog('ai', 'Tamam, hatırlatmaları gönderiyorum...');
    try {
      const res = await runAITool(pa.tool, { ids: pa.ids });
      if (res && res.iptal) { aiConsoleLog('ai', res.mesaj); speak(res.mesaj); return; }
      const m = `${res.gonderildi} hatırlatma gönderildi.`;
      aiConsoleLog('ai', m, res); speak(m);
    } catch (e) { aiConsoleLog('ai', 'Hata: ' + e.message); speak('Hata oluştu.'); }
    return;
  }

  aiConsoleLog('ai', 'Düşünüyorum...');
  let plan;
  try {
    plan = await interpretCommand(userText);
  } catch (e) {
    const msg = 'Komutu yorumlayamadım: ' + e.message;
    aiConsoleLog('ai', msg); speak(msg); return;
  }
  if (!plan || !plan.tool) {
    const msg = (plan && plan.explain) || 'Bu komutu bir işleme bağlayamadım.';
    aiConsoleLog('ai', msg); speak(msg);
    // Yardım/yönlendirme değilse, cevaplanamayan talebi öğrenme kuyruğuna ekle
    if (!(plan && plan.isHelp)) logUnansweredCommand(userText, 'eşleşmedi');
    return;
  }
  aiConsoleLog('ai', plan.explain || ('Çalıştırılıyor: ' + plan.tool));
  try {
    const result = await runAITool(plan.tool, plan.params || {});
    if (result && result.iptal) { aiConsoleLog('ai', result.mesaj); speak(result.mesaj); return; }
    // "sorgu" aracı kullanıldıysa: çalıştırılan sorguyu düzenlenebilir biçimde göster
    if (plan.tool === 'sorgu' && typeof aiConsoleShowQuery === 'function') {
      aiConsoleShowQuery(plan.params || {});
    }
    const spoken = summarizeResultForSpeech(plan.tool, result);
    aiConsoleLog('ai', spoken, result);
    speak(spoken);
    if (typeof renderAll === 'function') renderAll();
  } catch (e) {
    const msg = 'İşlem başarısız: ' + e.message;
    aiConsoleLog('ai', msg); speak(msg);
    logUnansweredCommand(userText, 'hata: ' + e.message);
  }
}

// Sonuçtan kısa, sesli okunabilir bir özet üret
function summarizeResultForSpeech(tool, r) {
  if (!r) return 'İşlem tamamlandı.';
  if (r.analiz) return r.analiz;
  if (tool === 'kayitliSorgular') return r.count ? `${r.count} kayıtlı sorgu var.` : 'Henüz kayıtlı sorgu yok.';
  if (tool === 'sorguKaydet') return r.kaydedildi ? `"${r.ad}" adıyla kaydedildi.` : 'Kaydedilemedi.';
  if (tool === 'kayitliSorguCalistir') {
    if (r.gruplandi) return r.enYuksek ? `"${r.kayitliSorgu}": en fazla "${r.enYuksek.deger}" (${r.enYuksek.sayi}).` : `"${r.kayitliSorgu}" sonuç vermedi.`;
    return `"${r.kayitliSorgu}": ${r.toplam} kayıt eşleşti.`;
  }
  if (tool === 'sorgu') {
    if (r.gruplandi) return r.enYuksek ? `En fazla "${r.enYuksek.deger}" (${r.enYuksek.sayi} kayıt). Toplam ${r.toplamKayit} kayıt gruplandı.` : 'Gruplanacak kayıt bulunamadı.';
    return `${r.koleksiyon} tablosunda ${r.toplam} kayıt eşleşti, ${r.donen} tanesi gösteriliyor.`;
  }
  if (tool === 'kullaniciDetay') return `${r.ad}, ${r.roller} rolünde, ${r.acikGorev} açık görevi var.`;
  if (tool === 'talepDetay') return `${r.surec} talebi ${r.durum} durumunda, ${r.suandakiAdim} adımında, ${r.gunSayisi} gündür açık.`;
  if (tool === 'kisininGorevleri') return `${r.kisi} üzerinde ${r.count} açık görev var.`;
  if (tool === 'enYukluKisiler' && r.items?.length) return `En yüklü kişi ${r.items[0].kisi}, ${r.items[0].acikGorev} açık görevle.`;
  if (tool === 'izinliler') return r.count ? `${r.tarih} tarihinde ${r.count} kişi izinli.` : `${r.tarih} tarihinde izinli kimse yok.`;
  if (typeof r.gonderildi === 'number') return `${r.gonderildi} hatırlatma gönderildi.`;
  if (r.olusturuldu) return `${r.ad} rolü oluşturuldu. Yetkilerini kontrol etmeyi unutmayın.`;
  if (r.ekranAcildi) return r.not || 'Kullanıcı oluşturma ekranı açıldı.';
  if (typeof r.count === 'number') return `${r.count} sonuç bulundu.`;
  if (tool === 'ozet') return `${r.kullanici} kullanıcı, ${r.acikTalep} açık talep, ${r.acikGorev} açık görev var.`;
  if (r.gonderildi) return `Hatırlatma ${r.kime} kişisine gönderildi.`;
  return 'İşlem tamamlandı.';
}

// ============== 1) ANALİZ + YORUM ==============
// Tıkanıklık verisini toplar (deterministik), sonra AI'a yorumlatır (serbest metin).
function collectBottleneckData() {
  const now = Date.now();
  const byDef = {};
  state.definitions.forEach(d => { byDef[d.id] = { ad: d.name, acik: 0, tamamlanan: 0, toplamSure: 0, tamamSayi: 0, enEskiGun: 0 }; });
  (state.instances || []).forEach(i => {
    const b = byDef[i.defId]; if (!b) return;
    if (i.status === 'running') {
      b.acik++;
      const gun = Math.floor((now - i.createdAt) / 86400000);
      if (gun > b.enEskiGun) b.enEskiGun = gun;
    } else if (i.status === 'completed') {
      b.tamamlanan++;
      b.toplamSure += (i.updatedAt - i.createdAt);
      b.tamamSayi++;
    }
  });
  // Açık görevlerin hangi adımda biriktiği
  const adimYuku = {};
  (state.tasks || []).filter(t => t.status === 'open').forEach(t => {
    const inst = state.instances.find(x => x.id === t.instanceId);
    const def = inst ? getDef(inst.defId) : null;
    const key = (def?.name || '?') + ' / ' + (t.stepTitle || t.stepId || 'adım');
    adimYuku[key] = (adimYuku[key] || 0) + 1;
  });
  return {
    surecler: Object.values(byDef).map(b => ({
      ad: b.ad, acikTalep: b.acik, tamamlanan: b.tamamlanan,
      ortTamamlamaGunu: b.tamamSayi ? Math.round(b.toplamSure / b.tamamSayi / 86400000) : null,
      enEskiAcikGun: b.enEskiGun
    })),
    adimYuku: Object.entries(adimYuku).map(([k, v]) => ({ adim: k, bekleyenGorev: v })).sort((a, b) => b.bekleyenGorev - a.bekleyenGorev)
  };
}

// Toplanan veriden dış AI gerektirmeyen güvenilir yerel analiz üretir.
function buildLocalBottleneckAnalysis(data) {
  data = data || { surecler: [], adimYuku: [] };
  const surecler = (data.surecler || []).slice();
  const acikSirali = surecler
    .filter(s => (s.acikTalep || 0) > 0)
    .sort((a, b) => (b.acikTalep - a.acikTalep) || (b.enEskiAcikGun - a.enEskiAcikGun))
    .slice(0, 5);
  const eskiSirali = surecler
    .filter(s => (s.enEskiAcikGun || 0) > 0)
    .sort((a, b) => b.enEskiAcikGun - a.enEskiAcikGun)
    .slice(0, 3);
  const yavasSirali = surecler
    .filter(s => s.ortTamamlamaGunu != null)
    .sort((a, b) => b.ortTamamlamaGunu - a.ortTamamlamaGunu)
    .slice(0, 3);
  const adimSirali = (data.adimYuku || []).slice(0, 5);

  const lines = ['Yerel tıkanıklık analizi:'];
  if (acikSirali.length) {
    lines.push('En çok açık talebi olan süreçler:');
    acikSirali.forEach((s, i) => lines.push(`${i + 1}. ${s.ad}: ${s.acikTalep} açık talep${s.enEskiAcikGun ? `, en eski ${s.enEskiAcikGun} gün` : ''}.`));
  } else {
    lines.push('Şu anda açık talebi olan süreç görünmüyor.');
  }
  if (adimSirali.length) {
    lines.push('Görevlerin en çok beklediği adımlar:');
    adimSirali.forEach((a, i) => lines.push(`${i + 1}. ${a.adim}: ${a.bekleyenGorev} açık görev.`));
  }
  if (eskiSirali.length) {
    lines.push('En uzun bekleyen süreçler: ' + eskiSirali.map(s => `${s.ad} (${s.enEskiAcikGun} gün)`).join(', ') + '.');
  }
  if (yavasSirali.length) {
    lines.push('Ortalama tamamlanması en uzun süreçler: ' + yavasSirali.map(s => `${s.ad} (~${s.ortTamamlamaGunu} gün)`).join(', ') + '.');
  }
  return lines.join('\n');
}

// Toplanan veriyi önce yerel olarak yorumlar; dış AI varsa yalnızca zenginleştirme için dener.
async function aiFreeformAnalysis(question, data) {
  const cfg = (typeof getAISettings === 'function') ? getAISettings() : { provider: 'local' };
  const localText = buildLocalBottleneckAnalysis(data);
  if (!cfg || cfg.provider === 'local') return localText;

  const sys = getEffectiveAIPrompt('analysis', defaultAIAnalysisPrompt());
  const prompt = `Soru: ${question}\n\nVeri:\n${JSON.stringify(data, null, 2)}\n\nÖnce sayısal bulguları doğru ver, sonra kısa yorum yap.`;
  try {
    const aiText = await aiPlainTextCall(sys, prompt, cfg);
    return aiText && aiText.trim() ? aiText.trim() : localText;
  } catch (e) {
    console.warn('[aiFreeformAnalysis] Dış AI erişilemedi, yerel analiz kullanıldı:', e.message);
    return localText + `\n\nNot: Dış AI erişilemedi (${e.message}). Sonuç yerel analiz motoruyla üretildi.`;
  }
}

// Düz metin (JSON olmayan) AI çağrısı — analiz ve sohbet için
async function aiPlainTextCall(sys, prompt, cfg) {
  cfg = cfg || ((typeof getAISettings === 'function') ? getAISettings() : { provider: 'local' });
  const provider = cfg.provider;
  const key = cfg.keys?.[provider];
  let model = cfg.models?.[provider] || (typeof AI_PROVIDERS !== 'undefined' ? AI_PROVIDERS[provider]?.model : '') || '';
  if (typeof GROQ_MODEL_REMAP !== 'undefined' && provider === 'groq' && GROQ_MODEL_REMAP[model]) model = GROQ_MODEL_REMAP[model];
  if (provider === 'openai' || provider === 'groq') {
    const url = provider === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: model || (provider === 'groq' ? 'llama-3.3-70b-versatile' : 'gpt-4o-mini'), temperature: 0.3, max_tokens: 1500, messages: [{ role: 'system', content: sys }, { role: 'user', content: prompt }] }) });
    if (!res.ok) { const b = await res.text().catch(() => ''); throw new Error(provider + ' hata: ' + res.status + ' ' + b.slice(0, 200)); }
    const d = await res.json();
    return d.choices?.[0]?.message?.content || '';
  } else if (provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: model || 'claude-3-5-haiku-latest', max_tokens: 1500, system: sys, messages: [{ role: 'user', content: prompt }] }) });
    if (!res.ok) throw new Error('Claude hata: ' + res.status);
    const d = await res.json();
    return d.content?.map(x => x.text || '').join('') || '';
  } else if (provider === 'gemini') {
    const u = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(remapGeminiModel(model) || 'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sys + '\n\n' + prompt }] }] }) });
    if (!res.ok) throw new Error('Gemini hata: ' + res.status);
    const d = await res.json();
    return d.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  }
  throw new Error('Bu sağlayıcı düz metin analizini desteklemiyor');
}

// ============== 2) PROAKTİF İZLEME ==============
// Belirli aralıklarla arka planda kontrol eder; eşik aşılırsa kullanıcıya sorar.
const PROACTIVE = { enabled: false, timer: null, intervalMin: 15, gunEsik: 7, sonUyari: 0 };

function proactiveCheck() {
  if (!PROACTIVE.enabled) return;
  const esik = Date.now() - PROACTIVE.gunEsik * 86400000;
  const geciken = (state.instances || []).filter(i => i.status === 'running' && i.createdAt < esik);
  // Aynı uyarıyı sık sık tekrarlama: en az 1 saat ara
  if (geciken.length > 0 && (Date.now() - PROACTIVE.sonUyari) > 3600000) {
    PROACTIVE.sonUyari = Date.now();
    const msg = `${geciken.length} talep ${PROACTIVE.gunEsik} günden uzun süredir bekliyor. Sahiplerine hatırlatma göndermemi ister misiniz?`;
    // Konsol açıksa oraya yaz, değilse bildirim + (açıksa) sesli
    if (document.getElementById('ai-console-log')) aiConsoleLog('ai', '🔔 ' + msg);
    if (typeof notify === 'function') notify('🤖 ' + msg, 'info');
    speak(msg);
    // Kullanıcı "evet" derse diye bekleyen eylemi sakla
    PROACTIVE.pendingAction = { tool: 'topluHatirlatma', ids: geciken.map(i => i.id) };
  }
}

function toggleProactive(on) {
  PROACTIVE.enabled = (on === undefined) ? !PROACTIVE.enabled : on;
  if (PROACTIVE.enabled) {
    if (PROACTIVE.timer) clearInterval(PROACTIVE.timer);
    PROACTIVE.timer = setInterval(proactiveCheck, PROACTIVE.intervalMin * 60000);
    setTimeout(proactiveCheck, 3000); // ilk kontrol birazdan
    notify('Proaktif izleme açıldı', 'success');
  } else {
    if (PROACTIVE.timer) clearInterval(PROACTIVE.timer);
    notify('Proaktif izleme kapatıldı', 'success');
  }
  return PROACTIVE.enabled;
}

// Toplu hatırlatma aracı (proaktif önerinin "evet" karşılığı) — kritik, onaylı
AI_TOOLS.topluHatirlatma = {
  desc: 'Birden fazla talebin sahibine toplu hatırlatma gönderir. Parametre: ids (talep id dizisi) veya gun (kaç günden eski)',
  risk: 'confirm',
  perm: 'workflows_view',
  summarize: ({ ids, gun }) => {
    const n = ids ? ids.length : (state.instances || []).filter(i => i.status === 'running' && i.createdAt < Date.now() - (gun || 7) * 86400000).length;
    return `${n} talebin sahibine toplu hatırlatma gönderilecek.`;
  },
  run: ({ ids, gun }) => {
    let list = ids ? state.instances.filter(i => ids.includes(i.id))
      : state.instances.filter(i => i.status === 'running' && i.createdAt < Date.now() - (gun || 7) * 86400000);
    let n = 0;
    list.forEach(i => { const def = getDef(i.defId); pushNotif(i.ownerId, `⏰ Hatırlatma: ${def?.name || ''} (${i.id}) uzun süredir bekliyor`, i.id); n++; });
    persist();
    return { gonderildi: n };
  }
};

// ============== 3) SÜREKLİ SESLİ OTURUM ==============
// Komut konsolunda mikrofonu sürekli moda alır: konuş → işle → cevapla → tekrar dinle.
const VOICE_SESSION = { active: false, recognition: null };

function startVoiceSession() {
  if (!VOICE.supportsSTT) { notify('Tarayıcı sesli oturumu desteklemiyor (Chrome önerilir)', 'error'); return; }
  if (!document.getElementById('ai-console-log')) openAICommandConsole();
  VOICE.ttsEnabled = true; // sesli oturumda cevap otomatik açık
  VOICE_SESSION.active = true;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  r.lang = 'tr-TR'; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  VOICE_SESSION.recognition = r;

  r.onresult = async (ev) => {
    const text = ev.results[ev.results.length - 1][0].transcript.trim();
    if (!text) return;
    // "kapat / dur / bitir" → oturumu sonlandır
    if (/^(kapat|dur|bitir|sonland[ıi]r|yeter)$/i.test(text)) { stopVoiceSession(); return; }
    VOICE_SESSION.paused = true;
    await runAICommand(text);   // sonuç sesli okunur (ttsEnabled açık)
    VOICE_SESSION.paused = false;
    // Cevap bittikten sonra tekrar dinlemeye geç
    if (VOICE_SESSION.active) setTimeout(() => { try { r.start(); } catch(e) {} }, 800);
  };
  r.onerror = (ev) => { if (ev.error === 'not-allowed') { notify('Mikrofon izni gerekli', 'error'); stopVoiceSession(); } };
  r.onend = () => { if (VOICE_SESSION.active && !VOICE_SESSION.paused) { try { r.start(); } catch(e) {} } };

  try { r.start(); } catch(e) {}
  notify('🎙️ Sesli oturum başladı — konuşun. Bitirmek için "kapat" deyin.', 'success');
  aiConsoleLog('ai', 'Sesli oturum açık. Sizi dinliyorum. Bitirmek için "kapat" deyin.');

async function aiQuickRun(toolName) {
  const out = document.getElementById('ai-panel-quick-result');
  if (out) out.textContent = 'Çalışıyor...';
  try {
    const params = toolName === 'analizYap' ? { soru: 'Hangi süreç en çok tıkanıyor ve neden?' } : {};
    const res = await runAITool(toolName, params);
    const spoken = summarizeResultForSpeech(toolName, res);
    if (out) {
      out.innerHTML = `<div style="color:var(--text);font-weight:600;margin-bottom:6px;">${escapeHtml(spoken)}</div>` +
        `<pre style="background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px;font-size:11px;overflow:auto;max-height:260px;">${escapeHtml(JSON.stringify(res, null, 2))}</pre>`;
    }
    speak(spoken);
  } catch (e) {
    if (out) out.textContent = 'Hata: ' + e.message;
  }
}

async function importMuteksRoles() {
  if (!hasPermission(state.currentUser, 'admin_roles_edit')) { notify('Rol oluşturma yetkiniz yok', 'error'); return; }
  const roles = muteksRoleSet();
  const yeni = roles.filter(r => !(state.roles || []).some(x => x.id === r.id));
  if (yeni.length === 0) { notify('Tüm Muteks rolleri zaten tanımlı', 'info'); return; }
  const ok = confirm(`⚠️ ${yeni.length} yeni rol oluşturulacak:\n\n${yeni.map(r => '• ' + r.name).join('\n')}\n\nYetkiler varsayılan olarak ayarlanır, sonra Roller ekranından düzenleyebilirsiniz. Devam edilsin mi?`);
  if (!ok) return;
  if (!Array.isArray(state.roles)) state.roles = [];
  let n = 0;
  for (const r of yeni) {
    const role = { ...r, isBuiltIn: false };
    state.roles.push(role);
    try {
      if (window.fb && window.fb.db) await window.fb.setDoc(window.fb.doc(window.fb.db, 'roles', role.id), (typeof sanitize === 'function' ? sanitize(role) : role));
      n++;
    } catch (e) { console.error('[importMuteksRoles]', role.id, e); }
  }
  notify(`✓ ${n} rol oluşturuldu`, 'success');
  if (typeof renderAdminContent === 'function') renderAdminContent();
}

async function importMuteksUsers() {
  if (!hasPermission(state.currentUser, 'admin_users_edit')) { notify('Kullanıcı oluşturma yetkiniz yok', 'error'); return; }
  const list = muteksUserList();
  // Tanımlı olmayan rol kullanan var mı? (rolleri önce açmış olmak gerekir)
  const knownRoles = new Set((state.roles || []).map(r => r.id));
  const eksikRoller = [...new Set(list.flatMap(u => u.roles).filter(r => !knownRoles.has(r)))];
  if (eksikRoller.length) {
    const devam = confirm(`⚠️ Şu roller henüz tanımlı değil: ${eksikRoller.join(', ')}\n\nÖnce "Muteks rollerini içe aktar" düğmesiyle rolleri açmanız önerilir. Yine de kullanıcıları bu rollerle eklemek ister misiniz?`);
    if (!devam) return;
  }
  const mevcut = new Set((state.users || []).map(u => u.id));
  const yeni = list.filter(u => !mevcut.has(u.id));
  if (yeni.length === 0) { notify('Bu kullanıcıların tümü zaten sistemde', 'info'); return; }

  const ok = confirm(`⚠️ ${yeni.length} kullanıcı PROFİLİ sisteme eklenecek.\n\nNOT: Bu işlem kişileri sistemde görünür ve role atanmış yapar, ANCAK giriş kimliği (şifre) oluşturmaz. Kişiler giriş yapana kadar şifre belirlenmelidir.\n\nDevam edilsin mi?`);
  if (!ok) return;

  let n = 0, hata = 0;
  for (const u of yeni) {
    const profile = {
      username: u.username, name: u.name, email: u.email,
      roles: u.roles, manager: u.manager, hireDate: u.hireDate,
      absences: u.absences, dahili: u.dahili || '', cep: u.cep || '',
      authPending: true  // Auth/şifre henüz yok işareti
    };
    state.users.push({ id: u.id, firebaseUid: u.id, ...profile });
    try {
      if (window.fb && window.fb.db) {
        await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', u.id), (typeof sanitize === 'function' ? sanitize(profile) : profile));
      }
      n++;
    } catch (e) { console.error('[importMuteksUsers]', u.id, e); hata++; }
  }
  notify(`✓ ${n} kullanıcı profili eklendi${hata ? ' (' + hata + ' hata)' : ''}. Giriş için şifre belirlemeyi unutmayın.`, 'success');
  if (typeof renderAll === 'function') renderAll();
}

    if (sidebar) sidebar.innerHTML = renderSidebarHTML();
    if (fired > 0) {
      renderHeader();
    }
  } else if (state.currentTop === 'calendar') {
    renderCalendarMain();
    if (fired > 0) renderHeader();
  }
}, 60000);
</script>

<script>
/* =========================================================
   GPT DÜZENLEME PAKETİ — ÇALIŞMA KORUMA KATMANI
   Amaç: Firebase yüklenmezse login ekranında sonsuz beklemeyi önlemek,
   mobil drawer hedeflerini düzeltmek, panel kapatmayı güvenilir yapmak.
   ========================================================= */
(function () {
  'use strict';

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  function showFirebaseLoadError() {
    if (window.fb) return;
    var loading = $('#login-loading');
    var form = $('#login-form');
    if (loading) loading.style.display = 'none';
    if (form) form.style.display = 'block';
    if (typeof window.showLoginError === 'function') {
      window.showLoginError('Firebase SDK yüklenemedi. İnternet bağlantısını, Firebase domain erişimini ve hosting ayarlarını kontrol edin.');
    }
    var btn = $('#login-btn');
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
    }
  }

  window.addEventListener('load', function () {
    setTimeout(showFirebaseLoadError, 3500);
  });

  var oldDoLogin = window.doLogin;
  window.doLogin = async function () {
    if (!window.fb || !window.fb.auth) {
      showFirebaseLoadError();
      return;
    }
    return oldDoLogin.apply(this, arguments);
  };

  function activeSidebar() {
    var top = window.state && window.state.currentTop;
    if (top === 'work') return $('.view-work .sidebar');
    if (top === 'calendar') return $('#cal-sidebar');
    if (top === 'production') return $('.prod-sidebar');
    if (top === 'admin') return $('.admin-nav');
    return $('.view .sidebar, #cal-sidebar, .prod-sidebar, .admin-nav');
  }

  window.toggleMobileSidebar = function () {
    var sb = activeSidebar();
    var overlay = $('#sidebar-overlay');
    if (!sb) return;
    var open = sb.classList.contains('open');
    $all('.sidebar, #cal-sidebar, .prod-sidebar, .admin-nav').forEach(function (x) { x.classList.remove('open'); });
    if (!open) sb.classList.add('open');
    if (overlay) overlay.classList.toggle('open', !open);
  };

  window.closeMobileSidebar = function () {
    $all('.sidebar, #cal-sidebar, .prod-sidebar, .admin-nav').forEach(function (x) { x.classList.remove('open'); });
    var overlay = $('#sidebar-overlay');
    if (overlay) overlay.classList.remove('open');
  };

  document.addEventListener('click', function (e) {
    if (e.target.closest('#sidebar-overlay')) window.closeMobileSidebar();

    var workDetail = e.target.closest('.view-work .detail.open');
    if (workDetail && window.innerWidth <= 1024) {
      var r = workDetail.getBoundingClientRect();
      if (e.clientY - r.top <= 48) {
        if (typeof window.closeMobileDetail === 'function') window.closeMobileDetail();
        e.preventDefault();
        e.stopPropagation();
      }
    }

    var prodDetail = e.target.closest('.prod-detail.open');
    if (prodDetail && window.innerWidth <= 1024) {
      var pr = prodDetail.getBoundingClientRect();
      if (e.clientY - pr.top <= 48) {
        if (typeof window.closeMobileProdDetail === 'function') window.closeMobileProdDetail();
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    window.closeMobileSidebar();
    if (typeof window.closeMobileDetail === 'function') window.closeMobileDetail();
    if (typeof window.closeMobileProdDetail === 'function') window.closeMobileProdDetail();
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 1024) window.closeMobileSidebar();
  });
})();
</script>

</body>
</html>
