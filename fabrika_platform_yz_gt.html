async function buildProcessWithExternalAI(prompt, cfg) {
  const provider = cfg.provider;
  const key = cfg.keys?.[provider];
  let model = cfg.models?.[provider] || AI_PROVIDERS[provider]?.model || '';
  if (provider === 'groq' && GROQ_MODEL_REMAP[model]) {
    console.info('[Groq] Kullanımdan kaldırılan model "' + model + '" -> "' + GROQ_MODEL_REMAP[model] + '" olarak güncellendi.');
    model = GROQ_MODEL_REMAP[model];
  }
  if (AI_PROVIDERS[provider]?.needsKey && !key) throw new Error('API key girilmedi');
  const sysPrompt = cfg._systemOverride || aiSystemPrompt();
  let text = '';
  if (provider === 'openai') {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
      body: JSON.stringify({ model: model || 'gpt-4o-mini', temperature:0.2, max_tokens:4096, response_format:{type:'json_object'}, messages:[{role:'system',content:sysPrompt + ' Cevabını JSON olarak ver.'},{role:'user',content:prompt}] })
    });
    if (!res.ok) { const body = await res.text().catch(()=> ''); throw new Error('OpenAI hata: ' + res.status + (body ? ' - ' + body.slice(0,300) : '')); }
    const data = await res.json();
    text = data.choices?.[0]?.message?.content || '';
  } else if (provider === 'groq') {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
      body: JSON.stringify({ model: model || 'llama-3.3-70b-versatile', temperature:0.2, max_tokens:4096, response_format:{type:'json_object'}, messages:[{role:'system',content:sysPrompt + ' Cevabını JSON olarak ver.'},{role:'user',content:prompt}] })
    });
    if (!res.ok) { const body = await res.text().catch(()=> ''); throw new Error('Groq hata: ' + res.status + (body ? ' - ' + body.slice(0,300) : '')); }
    const data = await res.json();
    text = data.choices?.[0]?.message?.content || '';
  } else if (provider === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(remapGeminiModel(model) || 'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ contents:[{parts:[{text: sysPrompt + '\n\nKullanıcı tarifi:\n' + prompt}]}], generationConfig:{temperature:0.2, responseMimeType:'application/json'} }) });
    if (!res.ok) throw new Error('Gemini hata: ' + res.status);
    const data = await res.json();
    text = data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
  } else if (provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01' },
      body: JSON.stringify({ model: model || 'claude-3-5-haiku-latest', max_tokens:2500, temperature:0.2, system:sysPrompt, messages:[{role:'user',content:prompt}] })
    });
    if (!res.ok) throw new Error('Claude hata: ' + res.status);
    const data = await res.json();
    text = data.content?.map(x=>x.text||'').join('') || '';
  } else if (provider === 'custom') {
    if (!cfg.customUrl) throw new Error('Özel API URL girilmedi');
    const res = await fetch(cfg.customUrl, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key }, body: JSON.stringify({ prompt, system: sysPrompt, model }) });
    if (!res.ok) throw new Error('Özel API hata: ' + res.status);
    const data = await res.json();
    return data.draft || data.process || data;
  }
  return parseAIJSON(text);
}

function parseAIJSON(text) {
  if (!text) throw new Error('Boş AI cevabı');
  const cleaned = text.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start < 0 || end < start) throw new Error('JSON bulunamadı');
  return JSON.parse(cleaned.slice(start, end + 1));
}

function normalizeAIDraft(draft, prompt) {
  const local = buildProcessFromPrompt(prompt);
  draft = draft && typeof draft === 'object' ? draft : local;
  draft.id = '';
  draft.name = draft.name || local.name;
  draft.icon = draft.icon || local.icon || '🤖';
  draft.description = draft.description || 'Yapay zeka form oluşturucu ile üretildi. Kaydetmeden önce alanları ve onay adımlarını kontrol edin.';
  draft.active = false;
  draft.fields = Array.isArray(draft.fields) && draft.fields.length ? draft.fields : local.fields;
  draft.fields = draft.fields.map((f, i) => {
    const label = f.label || f.name || ('Alan ' + (i+1));
    const type = ['text','textarea','number','date','select','file','email','phone'].includes(f.type) ? f.type : guessFieldType(String(label).toLocaleLowerCase('tr-TR'));
    const obj = { id: slugifyTR(f.id || label).replace(/-/g,'_') || ('alan_' + (i+1)), label, type, required: !!f.required, placeholder: f.placeholder || '' };
    if (type === 'select') obj.options = Array.isArray(f.options) && f.options.length ? f.options : defaultOptionsForField(String(label).toLocaleLowerCase('tr-TR'));
    return obj;
  }).slice(0, 24);
  draft.steps = Array.isArray(draft.steps) && draft.steps.length ? draft.steps : local.steps;
  draft.steps = draft.steps.map((s,i)=>({ id: slugifyTR(s.id || s.title || ('s_' + (i+1))).replace(/-/g,'_'), title: s.title || s.name || ('Adım ' + (i+1)), type: s.type || 'human', assign: s.assign || (s.type==='human' ? {mode:'requester_manager'} : undefined), message: s.message || '' }));
  if (!draft.steps.some(s=>s.type==='end-good')) draft.steps.push({id:'s_done',title:'Tamamlandı',type:'end-good',message:'Talep tamamlandı'});
  if (!draft.steps.some(s=>s.type==='end-bad')) draft.steps.push({id:'s_rej',title:'Reddedildi',type:'end-bad',message:'Talep reddedildi'});
  draft.transitions = Array.isArray(draft.transitions) && draft.transitions.length ? draft.transitions : local.transitions;
  draft.startStep = draft.startStep || draft.steps.find(s=>s.type==='human')?.id || draft.steps[0]?.id || 's_onay_1';
  // uniqueBy: AI'ın önerdiği tekillik alanını koru, ama gerçekten var olan bir alan id'sine eşle
  if (draft.uniqueBy) {
    const wantedId = slugifyTR(draft.uniqueBy).replace(/-/g, '_');
    const match = draft.fields.find(f => f.id === wantedId || f.id === draft.uniqueBy
      || String(f.label).toLocaleLowerCase('tr-TR') === String(draft.uniqueBy).toLocaleLowerCase('tr-TR'));
    if (match) draft.uniqueBy = match.id; else delete draft.uniqueBy;
  }
  return draft;
}

// Taslaktaki onay adımlarının kullandığı rollerin sistemde tanımlı olup olmadığını denetler
function validateDraftRoles(draft) {
  const knownRoleIds = new Set((state.roles || []).map(r => String(r.id).toLowerCase()));
  const knownRoleNames = new Set((state.roles || []).map(r => String(r.name || '').toLowerCase()));
  const missing = new Map(); // istenenEtiket -> ilk görülen step başlığı
  (draft.steps || []).forEach(s => {
    if (s.assign && s.assign.mode === 'role' && s.assign.role) {
      const wanted = String(s.assign.role).toLowerCase();
      const exists = knownRoleIds.has(wanted) || knownRoleNames.has(wanted);
      if (!exists && !missing.has(wanted)) missing.set(wanted, s.title || s.assign.role);
    }
  });
  return Array.from(missing.entries()).map(([role, stepTitle]) => ({ role, stepTitle }));
}

// Eksik bir rolü hızlıca oluştur, sonra önizlemeyi tazele
window.createMissingRoleFromDraft = async function(roleId) {
  if (!Array.isArray(state.roles)) state.roles = [];
  const exists = state.roles.some(r => String(r.id).toLowerCase() === roleId.toLowerCase() || String(r.name || '').toLowerCase() === roleId.toLowerCase());
  if (exists) { notify('Bu rol zaten tanımlı', 'error'); return; }
  const cleanId = (typeof slugifyTR === 'function' ? slugifyTR(roleId) : roleId.toLowerCase()).replace(/-/g, '_') || roleId.toLowerCase();
  if (state.roles.some(r => r.id === cleanId)) { notify('Bu ID zaten kullanımda', 'error'); return; }
  const label = roleId.charAt(0).toLocaleUpperCase('tr-TR') + roleId.slice(1);
  const basePerms = (typeof defaultRoles === 'function')
    ? (defaultRoles().find(r => r.id === 'manager')?.permissions || {})
    : {};
  const newRole = {
    id: cleanId, name: label, icon: '🧩', color: '#6366f1',
    description: 'Yapay zeka form tasarımı sırasında otomatik oluşturuldu. Yetkilerini Roller ve Yetkiler ekranından düzenleyin.',
    isBuiltIn: false, permissions: { ...basePerms }
  };
  state.roles.push(newRole);
  try {
    if (window.fb && window.fb.db) {
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'roles', newRole.id), (typeof sanitize === 'function' ? sanitize(newRole) : newRole));
    }
    notify('"' + label + '" rolü oluşturuldu. Yetkilerini kontrol edin.', 'success');
  } catch (e) {
    console.error('[createMissingRoleFromDraft]', e);
    notify('Rol yerel olarak eklendi ama kayıt başarısız: ' + e.message, 'error');
  }
  // Süreç adımındaki rol id'sini, oluşturulan temiz id ile eşitle ki uyarı kalksın
  if (state._aiFormDraft) {
    (state._aiFormDraft.steps || []).forEach(s => {
      if (s.assign && s.assign.mode === 'role' && String(s.assign.role).toLowerCase() === roleId.toLowerCase()) {
        s.assign.role = newRole.id;
      }
    });
    renderAIFormPreview(state._aiFormDraft);
  }
};

}


function downloadAIProcessJSON() {
  if (!state._aiFormDraft) { notify('Dışa aktarılacak taslak yok', 'error'); return; }
  const name = slugifyTR(state._aiFormDraft.name || 'form') || 'form';
  const blob = new Blob([JSON.stringify(state._aiFormDraft, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);

}

function setAIImportStatus(msg, type) {

function convertSimpleJSONToDraft(obj) {
  if (!obj || typeof obj !== 'object') throw new Error('Geçerli JSON nesnesi bulunamadı');
  if (obj.steps && obj.fields) return obj;
  const name = obj.name || obj.formName || obj.form_name || obj.title || 'JSON Formu';
  const fields = Array.isArray(obj.fields) ? obj.fields : [];
  const workflow = Array.isArray(obj.workflow) ? obj.workflow : (Array.isArray(obj.approvals) ? obj.approvals : []);
  if (!fields.length) throw new Error('fields alanı boş veya yok');
  if (!workflow.length) throw new Error('workflow/onay akışı boş veya yok');
  const steps = workflow.map((w, i) => {
    const title = typeof w === 'string' ? w : (w.title || w.name || w.role || ('Onay ' + (i+1)));
    return { id:'s_' + slugifyTR(title).replace(/-/g,'_'), title:title + ' Onayı', type:'human', assign:{mode:'role', role:title} };
  });
  steps.push({id:'s_done', title:'Tamamlandı', type:'end-good', message:'Süreç tamamlandı'});
  steps.push({id:'s_rej', title:'Reddedildi', type:'end-bad', message:'Süreç reddedildi'});
  const transitions = [];
  for (let i=0; i<workflow.length; i++) {
    const from = steps[i].id;
    transitions.push({from, when:'reject', to:'s_rej'});
    transitions.push({from, when:'approve', to: i === workflow.length - 1 ? 's_done' : steps[i+1].id});
  }
  return {
    name,
    icon: obj.icon || '📄',
    description: obj.description || 'JSON içe aktarma ile oluşturuldu. Kaydetmeden önce alanları ve onay adımlarını kontrol edin.',
    fields: fields.map((f, i) => ({
      id: f.id || f.name || f.label || ('alan_' + (i+1)),
      label: f.label || f.name || ('Alan ' + (i+1)),
      type: f.type === 'user' ? 'text' : (f.type || ''),
      required: !!f.required,
      options: f.options || undefined,
      placeholder: f.placeholder || ''
    })),
    steps,
    transitions,
    startStep: steps[0]?.id
  };
}

function buildProcessFromPrompt(prompt) {
  const lower = prompt.toLocaleLowerCase('tr-TR');
  const name = inferProcessName(prompt, lower);
  const icon = inferIcon(lower);
  const fields = inferFields(prompt, lower);
  const approvers = inferApprovers(lower);
  const steps = [];
  const transitions = [];
  let previous = null;
  approvers.forEach((ap, idx) => {
    const sid = 's_onay_' + (idx + 1);
    const step = { id: sid, title: ap.title, type: 'human', assign: ap.assign };
    steps.push(step);
    if (idx === 0) transitions.push({ from: sid, when: 'approve', to: approvers.length > 1 ? 's_onay_2' : 's_done' });
    else transitions.push({ from: previous, when: 'approve', to: sid });
    transitions.push({ from: sid, when: 'reject', to: 's_rej' });
    previous = sid;
  });
  if (approvers.length > 1) transitions.push({ from: 's_onay_' + approvers.length, when: 'approve', to: 's_done' });
  if (approvers.length === 0) {
    steps.push({ id:'s_onay_1', title:'Müdür onayı', type:'human', assign:{ mode:'requester_manager' } });
    transitions.push({ from:'s_onay_1', when:'approve', to:'s_done' }, { from:'s_onay_1', when:'reject', to:'s_rej' });
  }
  steps.push({ id:'s_done', title:'Tamamlandı', type:'end-good', message:'Talep tamamlandı' });
  steps.push({ id:'s_rej', title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' });
  return {
    id: '',
    name,
    icon,
    description: 'Yapay zeka form oluşturucu ile üretildi. Kaydetmeden önce alanları ve onay adımlarını kontrol edin.',
    active: false,
    fields,
    startStep: steps[0]?.id || 's_onay_1',
    steps,
    transitions
  };
}

function inferProcessName(prompt, lower) {
  const beforeOlustur = prompt.match(/([A-Za-zÇĞİÖŞÜçğıöşü0-9\s]+?)\s+(formu|talebi|süreci)\s+oluştur/i);
  if (beforeOlustur) return titleCaseTR(beforeOlustur[1].trim() + ' ' + beforeOlustur[2].trim());
  if (lower.includes('kalite')) return 'Kalite Kontrol Formu';
  if (lower.includes('bakım') || lower.includes('arıza')) return 'Bakım Talep Formu';
  if (lower.includes('izin')) return 'İzin Talep Formu';
  if (lower.includes('satın alma') || lower.includes('malzeme')) return 'Satın Alma Talep Formu';
  return 'Yapay Zeka Formu';
}

function inferIcon(lower) {
  if (lower.includes('kalite')) return '✅';
  if (lower.includes('bakım') || lower.includes('arıza') || lower.includes('makine')) return '🔧';
  if (lower.includes('izin')) return '🌴';
  if (lower.includes('satın alma') || lower.includes('malzeme')) return '🛒';
  if (lower.includes('üretim') || lower.includes('sipariş')) return '🏭';
  return '🤖';
}

function inferFields(prompt, lower) {
  const candidates = [];
  const alanMatch = prompt.match(/alanlar\s*[:：]\s*([^\.\n]+)/i);
  if (alanMatch) alanMatch[1].split(/,|;|\n| ve /i).forEach(x => candidates.push(x.trim()));
  const keywords = [
    ['sipariş no','text',true], ['ürün adı','text',true], ['parti no','text',false], ['kontrol tarihi','date',true],
    ['kontrol eden kişi','text',false], ['hata türü','select',true], ['hata adedi','number',false], ['hata açıklaması','textarea',false],
    ['fotoğraf','file',false], ['sonuç','select',true], ['makine no','text',true], ['bölüm','text',true],
    ['arıza türü','select',true], ['aciliyet','select',true], ['arıza açıklaması','textarea',true], ['duruş var mı','select',false],
    ['başlangıç tarihi','date',true], ['bitiş tarihi','date',true], ['izin türü','select',true], ['açıklama','textarea',false], ['vekil kişi','text',false]
  ];
  keywords.forEach(([label,type,req]) => { if (lower.includes(label)) candidates.push(label + '|' + type + '|' + req); });
  if (candidates.length === 0) candidates.push('Açıklama|textarea|true', 'Talep tarihi|date|true', 'Aciliyet|select|false');
  const seen = new Set();
  const fields = [];
  candidates.forEach(raw => {
    if (!raw) return;
    const parts = raw.split('|');
    const label = titleCaseTR(parts[0].replace(/^alanlar\s*[:：]?/i,'').trim());
    if (!label || label.length < 2) return;
    const id = slugifyTR(label).replace(/-/g, '_');
    if (seen.has(id)) return;
    seen.add(id);
    const type = parts[1] || guessFieldType(label.toLocaleLowerCase('tr-TR'));
    const f = { id, label, type, required: parts[2] ? parts[2] === 'true' : /zorunlu|required|şart/.test(lower), placeholder: '' };
    if (type === 'select') f.options = defaultOptionsForField(label.toLocaleLowerCase('tr-TR'));
    fields.push(f);
  });
  return fields.slice(0, 18);
}

function guessFieldType(label) {
  if (label.includes('tarih')) return 'date';
  if (label.includes('açıklama') || label.includes('not') || label.includes('tanım')) return 'textarea';
  if (label.includes('adet') || label.includes('miktar') || label.includes('sayı') || label.includes('saat')) return 'number';
  if (label.includes('foto') || label.includes('dosya') || label.includes('belge')) return 'file';
  if (label.includes('tür') || label.includes('tip') || label.includes('durum') || label.includes('sonuç') || label.includes('aciliyet') || label.includes('var mı')) return 'select';
  return 'text';
}

function defaultOptionsForField(label) {
  if (label.includes('aciliyet')) return [{value:'low',label:'Düşük'},{value:'medium',label:'Orta'},{value:'high',label:'Yüksek'}];
  if (label.includes('sonuç')) return [{value:'ok',label:'Uygun'},{value:'nok',label:'Uygun Değil'}];
  if (label.includes('var mı')) return [{value:'yes',label:'Evet'},{value:'no',label:'Hayır'}];
  if (label.includes('izin')) return [{value:'annual',label:'Yıllık izin'},{value:'excuse',label:'Mazeret izni'},{value:'unpaid',label:'Ücretsiz izin'}];
  return [{value:'opt1',label:'Seçenek 1'},{value:'opt2',label:'Seçenek 2'}];
}

function inferApprovers(lower) {
  const out = [];
  const add = (key, title, assign) => { if (!out.some(x => x.key === key)) out.push({ key, title, assign }); };
  if (lower.includes('müdür')) add('manager','Müdür onayı',{ mode:'requester_manager' });
  if (lower.includes('ik') || lower.includes('insan kaynak')) add('hr','İK onayı',{ mode:'role', role:'hr' });
  if (lower.includes('kalite şefi') || lower.includes('kalite')) add('quality','Kalite şefi onayı',{ mode:'role', role:'manager' });
  if (lower.includes('bakım sorumlusu') || lower.includes('bakım')) add('maintenance','Bakım sorumlusu onayı',{ mode:'role', role:'manager' });
  if (out.length === 0) add('manager','Müdür onayı',{ mode:'requester_manager' });
  return out;
}

function slugifyTR(str) {
  return String(str || '')
    .toLocaleLowerCase('tr-TR')
    .replace(/[ğ]/g,'g').replace(/[ü]/g,'u').replace(/[ş]/g,'s').replace(/[ı]/g,'i').replace(/[ö]/g,'o').replace(/[ç]/g,'c')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0, 42) || 'form';
}

function titleCaseTR(str) {
  return String(str || '').split(/\s+/).filter(Boolean).map(w => w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1)).join(' ');
}

function uniqueProcessId(base) {
  let id = base || 'form';
  let n = 2;
  while (state.definitions.some(d => d.id === id)) id = `${base}_${n++}`;
  return id;
}

        <th>Süreç</th><th>Adımlar</th><th>Alanlar</th><th>Durum</th><th>Kullanım</th><th style="text-align:right">İşlem</th>

                <div style="font-size:20px;">${d.icon || '📄'}</div>
                <div>
                  <div style="font-weight:500;">${escapeHtml(d.name)}</div>
                  <div style="font-size:11px;color:var(--text-mute);font-family:var(--mono);">${escapeHtml(d.id)}</div>
                </div>
              </div>
            </td>
            <td>
              <span class="badge-tag human-step">${humanSteps} insan</span>
              <span class="badge-tag system-step">${systemSteps} sistem</span>
            </td>
            <td>${d.fields.length}</td>
            <td><span class="badge-tag ${d.active?'active':'inactive'}">${d.active?'Aktif':'Pasif'}</span></td>
            <td><span style="font-family:var(--mono);">${usage}</span> talep</td>

              ${canEdit ? `<button class="ghost-btn" onclick="openDesigner('${d.id}')">Düzenle</button>` : `<button class="ghost-btn" onclick="openProcessViewer('${d.id}')">Görüntüle</button>`}
              ${canEdit ? `<button class="danger-btn" onclick="deleteProcess('${d.id}')">Sil</button>` : ''}

}

function toggleActive(defId) {
  if (!hasPermission(state.currentUser, 'admin_processes_edit')) {
    notify('Süreç düzenleme yetkiniz yok', 'error');
    return;
  }
  const d = getDef(defId);
  d.active = !d.active;
  persist(); renderAdminContent();
  notify(d.active ? 'Süreç aktif edildi' : 'Süreç pasifleştirildi', 'success');
}

function deleteProcess(defId) {
  if (!hasPermission(state.currentUser, 'admin_processes_edit')) {
    notify('Süreç silme yetkiniz yok', 'error');
    return;
  }
  const usage = state.instances.filter(i => i.defId === defId).length;
  let msg = `${getDef(defId).name} silinsin mi?`;
  if (usage) msg += `\n${usage} mevcut talep var, onların da geçmişi kalmaya devam edecek ama süreç tanımı silinecek.`;
  if (!confirm(msg)) return;
  state.definitions = state.definitions.filter(d => d.id !== defId);
  persist(); renderAdminContent();
  notify('Süreç silindi', 'success');
}

// Şablonları kategoriye göre gruplama
function getTemplatesByCategory() {
  const groups = {};
  PROCESS_TEMPLATES.forEach(t => {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });
  return groups;
}

function useTemplate(templateId) {
  const tpl = PROCESS_TEMPLATES.find(t => t.templateId === templateId);
  if (!tpl) { notify('Şablon bulunamadı', 'error'); return; }

  // Yeni id ata, ama şablondaki içeriği bire bir kopyala (deep clone)
  const newId = 'p_' + Math.random().toString(36).substr(2, 6);
  const newDef = JSON.parse(JSON.stringify(tpl.template));
  newDef.id = newId;
  newDef.active = false; // Yeni gelen pasif - kullanıcı tasarımcıda düzenleyip aktifleştirsin
  state.definitions.push(newDef);
  persist();
  closeModal();
  openDesigner(newId);
  notify(`"${tpl.name}" şablonu yüklendi — özelleştirip kaydedin`, 'success');
}

      ${[1,2,3].map(n => `

// Soru-cevap eleyici: kullanıcı teknik şekil görmez, sorulara cevap verir, şekil otomatik belirlenir
function renderWizardShapeQuiz(w) {
  const q = w.quiz || {};

  // Soru 1: Onay var mı?
  let html = quizQuestion(
    'Bu talebi birinin onaylaması gerekiyor mu?',
    [
      { val:'yes', label:'Evet, onaylanmalı', sub:'Bir veya birden fazla kişi onay verecek' },
      { val:'no',  label:'Hayır, sadece kayıt', sub:'Form doldurulsun, onay olmadan kaydedilsin' }
    ],
    q.needsApproval, 'needsApproval'
  );

  // Onay yoksa → record, dur
  if (q.needsApproval === 'no') {
    return html + quizResult('📝 Bilgi / Kayıt', 'Form doldurulacak, onaysız kaydedilecek.', 'record', w);
  }
  if (q.needsApproval !== 'yes') return html; // henüz cevaplanmadı

  // Soru 2: Kaç kişi?
  html += quizQuestion(
    'Kaç kişi onaylayacak?',
    [
      { val:'one',  label:'Tek kişi yeter', sub:'Sadece bir onay' },
      { val:'many', label:'Birden fazla kişi', sub:'İki veya daha fazla onay gerek' }
    ],
    q.howMany, 'howMany'
  );

  if (q.howMany === 'one') {
    // Tek kişi → ama koşula göre değişebilir mi?
    html += quizQuestion(
      'Onaylayan kişi duruma göre değişsin mi?',
      [
        { val:'no',  label:'Hayır, hep aynı kişi', sub:'Her zaman aynı onaylayıcı' },
        { val:'yes', label:'Evet, duruma göre farklı', sub:'Örn. tutar büyükse başka kişi onaylasın' }
      ],
      q.conditional, 'conditional'
    );
    if (q.conditional === 'no') return html + quizResult('🚀 Tek Onaylayıcı', 'Tek kişi onaylayacak.', 'single', w);
    if (q.conditional === 'yes') return html + quizResult('🔀 Koşullu Dallanma', 'Duruma göre farklı kişi/yol. Bir sonraki adımda koşulu kuracağız.', 'conditional', w);
    return html;
  }

  if (q.howMany === 'many') {
    // Birden fazla → aynı anda mı sırayla mı?
    html += quizQuestion(
      'Bu kişiler nasıl onaylasın?',
      [
        { val:'parallel',   label:'Aynı anda', sub:'İkisine birden görev gitsin, birbirini beklemesin' },
        { val:'sequential', label:'Sırayla', sub:'Önce biri onaylasın, sonra diğeri' }
      ],
      q.order, 'order'
    );
    if (q.order === 'parallel')   return html + quizResult('👥 Paralel Onay', 'İki kişi aynı anda onaylayacak.', 'parallel', w);
    if (q.order === 'sequential') return html + quizResult('📋 İki Kademeli Sıralı', 'Önce 1. kişi, sonra 2. kişi onaylayacak.', 'sequential', w);
    return html;
  }

  return html;
}

// Tek bir soru kutusu (radyo benzeri seçenekler)
function quizQuestion(question, options, currentVal, key) {
  return `
    <div style="margin-bottom:14px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">${escapeHtml(question)}</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${options.map(o => {
          const sel = currentVal === o.val;
          return `
            <div onclick="wizardQuizAnswer('${key}','${o.val}')" style="border:1px solid ${sel?'var(--accent)':'var(--border)'};background:${sel?'var(--panel-3)':'var(--panel-2)'};border-radius:6px;padding:10px 12px;cursor:pointer;transition:all 0.15s;">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="width:16px;height:16px;border-radius:50%;border:2px solid ${sel?'var(--accent)':'var(--border-hi)'};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
                  ${sel?'<div style="width:8px;height:8px;border-radius:50%;background:var(--accent);"></div>':''}
                </div>
                <div style="flex:1;">
                  <div style="font-size:13px;font-weight:500;color:${sel?'var(--accent)':'var(--text)'};">${escapeHtml(o.label)}</div>
                  <div style="font-size:11px;color:var(--text-dim);margin-top:1px;">${escapeHtml(o.sub)}</div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// Sonuç kutusu — seçilen şekli gösterir
function quizResult(title, desc, shape, w) {
  // Şekli otomatik ayarla (henüz ayarlanmadıysa veya değiştiyse)
  if (w.shape !== shape) {
    setTimeout(() => { if (state._wizard) { wizardSelectShape(shape); } }, 0);
  }
  return `
    <div style="margin-top:6px;background:rgba(29,158,117,0.12);border:1px solid var(--green,#1D9E75);border-radius:8px;padding:14px;">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">✓ SÜRECİN ŞEKLİ BELİRLENDİ</div>
      <div style="font-size:15px;font-weight:700;color:var(--green,#1D9E75);">${title}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:3px;">${escapeHtml(desc)}</div>
    </div>
    <div style="margin-top:10px;text-align:center;">
      <button onclick="wizardResetQuiz()" style="background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;text-decoration:underline;">↺ Baştan cevapla</button>
      <span style="color:var(--text-mute);font-size:11px;margin:0 6px;">·</span>
      <button onclick="wizardSelectShape('expert');" style="background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;text-decoration:underline;">🛠️ Kendim kuracağım (uzman)</button>
    </div>
  `;
}

function wizardQuizAnswer(key, val) {
  const w = state._wizard;
  if (!w.quiz) w.quiz = {};
  w.quiz[key] = val;
  // Bu sorudan sonraki cevapları temizle (mantık değişebilir)
  const order = ['needsApproval','howMany','conditional','order'];
  const idx = order.indexOf(key);
  if (idx >= 0) order.slice(idx+1).forEach(k => delete w.quiz[k]);
  w.shape = null; // şekil yeniden hesaplanacak
  renderWizard();
}

function wizardResetQuiz() {
  state._wizard.quiz = {};
  state._wizard.shape = null;
  renderWizard();
}

function renderWizardStep1Unused(w) {
  return ``;
}

function wizardSelectShape(shape) {
  state._wizard.shape = shape;
  // Onaylayıcı sayısını şekle göre ayarla
  if (shape === 'single') {
    state._wizard.approvers = [{ mode: 'requester_manager' }];
  } else if (shape === 'parallel') {
    state._wizard.approvers = [{ mode: 'role', role: 'manager' }, { mode: 'role', role: 'hr' }];
    state._wizard.parallelMode = state._wizard.parallelMode || 'all'; // all=hepsi, any=biri yeter
  } else if (shape === 'sequential') {
    state._wizard.approvers = [{ mode: 'requester_manager' }, { mode: 'role', role: 'hr' }];
  } else if (shape === 'conditional') {
    state._wizard.condition = state._wizard.condition || { fieldId: '', op: '<=', value: 5000 };
    state._wizard.approvers = [{ mode: 'role', role: 'hr' }, { mode: 'requester_manager' }];
  } else if (shape === 'record') {
    state._wizard.approvers = []; // onay yok
  }
  renderWizard();
}

function renderWizardStep2(w) {
  // Mevcut seçili presetler
  const selectedKeys = new Set();
  w.fields.forEach(f => {
    // Hangi preset'ten geldiğini ID'den çıkar
    const preset = PRESET_FIELDS.find(p =>
      p.field?.id === f.id ||
      p.fields?.some(pf => pf.id === f.id)
    );
    if (preset) selectedKeys.add(preset.key);
  });

  return `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Talep edenin dolduracağı alanlar</h4>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Bir veya birkaç hazır alan seç. Sağda canlı önizleme.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${PRESET_FIELDS.map(p => {
            const selected = selectedKeys.has(p.key);
            return `
              <div onclick="wizardToggleField('${p.key}')" style="border:1px solid ${selected ? 'var(--accent)' : 'var(--border)'};background:${selected ? 'var(--panel-3)' : 'var(--panel-2)'};border-radius:6px;padding:10px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <div style="font-size:18px;">${p.icon}</div>
                  <div style="flex:1;font-size:12px;font-weight:500;">${p.label}</div>
                  <div style="font-size:14px;color:${selected ? 'var(--accent)' : 'var(--text-mute)'};">${selected ? '✓' : '+'}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:20px 0 8px;">Eklenen alanlar (${w.fields.length})</h4>
        ${w.fields.length === 0 ?
          '<div style="font-size:12px;color:var(--text-mute);padding:12px;background:var(--panel-2);border-radius:4px;text-align:center;">Yukarıdan en az bir alan seç</div>' :
          w.fields.map((f, i) => `
            <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;margin-bottom:4px;font-size:12px;">
              <span style="color:var(--text);">${escapeHtml(f.label)}</span>
              <span class="badge-tag">${f.type}</span>
              ${f.required ? '<span class="badge-tag" style="color:var(--red);">zorunlu</span>' : ''}
              <button class="icon-btn delete" onclick="wizardRemoveField('${f.id}')" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
            </div>
          `).join('')
        }
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">📋 Form Önizleme</h4>
        <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:10px;">${w.icon} ${escapeHtml(w.name || 'Süreç Adı')}</div>
          ${w.fields.length === 0 ?
            '<div style="font-size:11px;color:var(--text-mute);padding:20px;text-align:center;">Henüz alan yok</div>' :
            w.fields.map(f => `
              <div style="margin-bottom:10px;">
                <label style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:3px;">${escapeHtml(f.label)} ${f.required?'<span style="color:var(--red);">*</span>':''}</label>
                ${f.type === 'textarea' ?
                  '<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);min-height:36px;">[uzun metin alanı]</div>' :
                  f.type === 'select' ?
                  '<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);">[seçim listesi]</div>' :
                  `<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);">[${f.type} girişi]</div>`
                }
              </div>
            `).join('')
          }
          <div style="margin-top:12px;text-align:right;">
            <span style="background:var(--accent);color:#000;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;">Gönder</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wizardToggleField(presetKey) {
  const w = state._wizard;
  const preset = PRESET_FIELDS.find(p => p.key === presetKey);
  if (!preset) return;
  // Bu preset şu an seçili mi?
  const fieldIds = preset.field ? [preset.field.id] : preset.fields.map(f => f.id);
  const currentlySelected = fieldIds.every(id => w.fields.some(f => f.id === id));
  if (currentlySelected) {
    // Kaldır
    w.fields = w.fields.filter(f => !fieldIds.includes(f.id));
  } else {
    // Ekle (deep clone)
    if (preset.field) {
      w.fields.push(JSON.parse(JSON.stringify(preset.field)));
    } else {
      preset.fields.forEach(f => w.fields.push(JSON.parse(JSON.stringify(f))));
    }
  }
  renderWizard();
}

function wizardRemoveField(fid) {
  const w = state._wizard;
  w.fields = w.fields.filter(f => f.id !== fid);
  renderWizard();
}

function renderWizardStep3(w) {
  if (w.shape === 'conditional') {
    return renderWizardStep3Conditional(w);
  }
  if (w.shape === 'record') {
    return `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>
          <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Onay yok</h4>
          <div style="font-size:13px;color:var(--text-dim);line-height:1.6;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:14px;">
            📝 Bu bir <b>bilgi/kayıt</b> sürecidir. Çalışan formu doldurur, kayıt anında oluşur ve tamamlanır. Onay aşaması yoktur.<br><br>
            Örnek: arıza bildirimi, ziyaretçi kaydı, vardiya teslim notu.
          </div>
        </div>
        <div>
          <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
          ${renderWizardPreview(w)}
        </div>
      </div>
    `;
  }
  if (w.shape === 'parallel') {
    const mode = w.parallelMode || 'all';
    return `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>
          <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Kim onaylayacak? (aynı anda)</h4>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">İki kişiye de görev <b>aynı anda</b> düşer. Sıralı beklemezler.</div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;">1. Onaylayıcı</div>
            ${renderApproverPicker(0, w.approvers[0])}
          </div>
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:14px;">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;">2. Onaylayıcı</div>
            ${renderApproverPicker(1, w.approvers[1])}
          </div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;">
            <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">SONUÇ NASIL BELİRLENSİN?</div>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer;">
              <input type="radio" name="pmode" ${mode==='all'?'checked':''} onclick="state._wizard.parallelMode='all';renderWizard();">
              <span><b>Hepsi onaylamalı</b> — ikisi de onaylarsa geçer, biri reddederse reddedilir</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
              <input type="radio" name="pmode" ${mode==='any'?'checked':''} onclick="state._wizard.parallelMode='any';renderWizard();">
              <span><b>Biri yeter</b> — biri onaylarsa geçer</span>
            </label>
          </div>
        </div>
        <div>
          <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
          ${renderWizardPreview(w)}
        </div>
      </div>
    `;
  }
  // single veya sequential
  const approvers = w.approvers || [];
  const labels = w.shape === 'single' ? ['Onaylayıcı'] : ['1. Onaylayıcı', '2. Onaylayıcı'];

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Kim onaylayacak?</h4>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">${w.shape === 'single' ? 'Bu süreçte tek onay var.' : 'Önce 1. kişi onaylar, sonra 2. kişi onaylar.'}</div>

        ${approvers.map((a, i) => `
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;">${labels[i]}</div>
            ${renderApproverPicker(i, a)}
          </div>
        `).join('')}
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
        ${renderWizardPreview(w)}
      </div>
    </div>
  `;
}

function renderWizardStep3Conditional(w) {
  const cond = w.condition || { fieldId: '', op: '<=', value: 5000 };
  // Sayısal alanları (number, date) koşul için seçilebilir yap
  const numericFields = w.fields.filter(f => f.type === 'number' || f.type === 'date' || f.type === 'select');
  if (!cond.fieldId && numericFields.length > 0) cond.fieldId = numericFields[0].id;

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Koşullu Akış</h4>
        ${numericFields.length === 0 ?
          '<div style="font-size:12px;color:var(--amber);background:rgba(251,191,36,0.1);border:1px solid var(--amber);padding:10px;border-radius:4px;">⚠ Koşul için sayı/tarih/seçim alanı gerekli. Geri dönüp en az bir tane ekleyin.</div>' :
          `
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">EĞER (koşul)</div>
            <div style="display:flex;gap:6px;align-items:center;">
              <select onchange="state._wizard.condition.fieldId=this.value;renderWizard();" style="flex:1;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
                ${numericFields.map(f => `<option value="${f.id}" ${cond.fieldId===f.id?'selected':''}>${escapeHtml(f.label)}</option>`).join('')}
              </select>
              <select onchange="state._wizard.condition.op=this.value;renderWizard();" style="width:60px;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
                ${['<=','<','==','!=','>','>='].map(op => `<option ${cond.op===op?'selected':''}>${op}</option>`).join('')}
              </select>
              <input type="text" value="${escapeHtml(String(cond.value))}" oninput="state._wizard.condition.value=this.value;" style="width:90px;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;" placeholder="değer">
            </div>
          </div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;border-left:3px solid var(--green);">
            <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:8px;">✓ KOŞUL DOĞRUYSA — Hızlı yol (tek onay)</div>
            ${renderApproverPicker(0, w.approvers[0] || { mode:'role', role:'hr' })}
          </div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;border-left:3px solid var(--amber);">
            <div style="font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px;">↳ KOŞUL YANLIŞSA — Uzun yol (müdür sonra İK)</div>
            <div style="font-size:11px;color:var(--text-dim);">Müdür onayı, ardından İK onayı (sabit)</div>
          </div>
          `
        }
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
        ${renderWizardPreview(w)}
      </div>
    </div>
  `;
}

function renderApproverPicker(idx, approver) {
  approver = approver || { mode: 'requester_manager' };
  const isRole = approver.mode === 'role';
  const isSpecific = approver.mode === 'specific_user';
  return `
    <div style="display:flex;gap:6px;align-items:center;">
      <select onchange="wizardUpdateApprover(${idx},'mode',this.value)" style="flex:1;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
        <option value="requester_manager" ${approver.mode==='requester_manager'?'selected':''}>Talep edenin müdürü</option>
        <option value="role" ${isRole?'selected':''}>Belirli bir rol</option>
        <option value="specific_user" ${isSpecific?'selected':''}>Belirli bir kişi</option>
      </select>
      ${isRole ? `
        <select onchange="wizardUpdateApprover(${idx},'role',this.value)" style="background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
          ${['manager','hr','admin'].map(r => `<option value="${r}" ${approver.role===r?'selected':''}>${r}</option>`).join('')}
        </select>
      ` : ''}
      ${isSpecific ? `
        <select onchange="wizardUpdateApprover(${idx},'userId',this.value)" style="background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
          ${state.users.map(u => `<option value="${u.id}" ${approver.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
        </select>
      ` : ''}
    </div>
  `;
}

function wizardUpdateApprover(idx, key, val) {
  const w = state._wizard;
  if (!w.approvers[idx]) w.approvers[idx] = {};
  w.approvers[idx][key] = val;
  if (key === 'mode') {
    if (val === 'role') w.approvers[idx].role = 'manager';
    if (val === 'specific_user') w.approvers[idx].userId = state.users[0]?.id;
  }
  renderWizard();
}

function renderWizardPreview(w) {
  // Mini ASCII-style akış önizleme
  let steps = [];
  steps.push({ label: '▶ Talep', color: 'var(--accent)' });

  if (w.shape === 'conditional') {
    steps.push({ label: 'Koşul kontrolü', color: 'var(--purple)' });
  }

  if (w.shape === 'single') {
    steps.push({ label: describeApprover(w.approvers[0]), color: 'var(--accent)' });
  } else if (w.shape === 'parallel') {
    const modeTxt = (w.parallelMode === 'any') ? 'biri yeter' : 'hepsi onaylamalı';
    steps.push({ label: '👥 ' + describeApprover(w.approvers[0]) + ' + ' + describeApprover(w.approvers[1]), color: 'var(--purple)' });
    steps.push({ label: '(' + modeTxt + ')', color: 'var(--text-dim)' });
  } else if (w.shape === 'record') {
    steps.push({ label: '📝 Kayıt oluşturulur (onaysız)', color: 'var(--accent)' });
  } else if (w.shape === 'sequential') {
    steps.push({ label: describeApprover(w.approvers[0]), color: 'var(--accent)' });
    steps.push({ label: describeApprover(w.approvers[1]), color: 'var(--accent)' });
  } else if (w.shape === 'conditional') {
    steps.push({ label: 'Koşul doğru → ' + describeApprover(w.approvers[0]), color: 'var(--green)' });
    steps.push({ label: 'veya Koşul yanlış → Müdür + İK', color: 'var(--amber)' });
  }

  steps.push({ label: '✓ Tamamlandı', color: 'var(--green)' });

  return `
    <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;">
      ${steps.map((s, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-left:3px solid ${s.color};border-radius:3px;margin-bottom:${i < steps.length - 1 ? '4px' : '0'};font-size:12px;">
          ${escapeHtml(s.label)}
        </div>
        ${i < steps.length - 1 ? '<div style="text-align:center;color:var(--text-mute);font-size:14px;margin:2px 0;">↓</div>' : ''}
      `).join('')}
    </div>
    <div style="font-size:11px;color:var(--text-mute);margin-top:10px;text-align:center;">Sihirbazdan sonra detayları tasarımcıdan ekleyebilirsiniz</div>
  `;
}

function describeApprover(approver) {
  if (!approver) return '?';
  if (approver.mode === 'requester_manager') return '👔 Müdür onayı';
  if (approver.mode === 'role') {
    const labels = { manager:'👔 Yönetici', hr:'🧑‍💼 İK', admin:'⚙️ Admin', worker:'👷 Çalışan' };
    return (labels[approver.role] || approver.role) + ' onayı';
  }
  if (approver.mode === 'specific_user') {
    const u = getUser(approver.userId);
    return `👤 ${u?.name || '?'} onayı`;
  }
  return '?';
}

function wizardNext() {
  const w = state._wizard;
  // Validasyon
  if (w.step === 1) {
    if (!w.name?.trim()) { notify('Süreç adı zorunlu', 'error'); return; }
    if (!w.shape) { notify('Lütfen sağdaki soruları cevaplayın', 'error'); return; }
    // Expert seçildiyse direkt tasarımcıya
    if (w.shape === 'expert') {
      wizardCreateAndOpen({ skipWizard: true });
      return;
    }
  }
  if (w.step === 2) {
    if (w.fields.length === 0) {
      if (!confirm('Hiç form alanı eklemediniz. Yine de devam etmek ister misiniz?')) return;
    }
  }
  if (w.step < 3) w.step++;
  renderWizard();
}

function wizardPrev() {
  if (state._wizard.step > 1) state._wizard.step--;
  renderWizard();
}

function closeWizard() {
  state._wizard = null;
  closeModal();
}

function wizardFinish() {
  // Aktivasyon onayı
  const w = state._wizard;
  if (!w) return;
  if (confirm(`"${w.name}" sürecini hemen AKTİFLEŞTİRİP kullanıcıların erişimine açayım mı?\n\nEvet: Aktif olarak yaratılır, çalışanlar hemen "Yeni Talep Aç" menüsünde görür.\nHayır: Pasif yaratılır, tasarımcıdan inceleyip sonra aktifleştirirsin.`)) {
    wizardCreateAndOpen({ skipWizard: false, activate: true });
  } else {
    wizardCreateAndOpen({ skipWizard: false, activate: false });
  }
}

// Sihirbaz cevaplarından gerçek süreç tanımı üret ve tasarımcıyı aç
function wizardCreateAndOpen(opts) {
  const w = state._wizard;
  if (!w) return;
  const newId = 'p_' + Math.random().toString(36).substr(2, 6);

  let newDef;
  if (opts.skipWizard) {
    // Expert: tasarımcıya direkt boş süreç gönder
    newDef = {
      id: newId,
      name: w.name || 'Yeni Süreç',
      icon: w.icon || '📄',
      description: w.description || '',
      active: false,
      fields: w.fields.length > 0 ? JSON.parse(JSON.stringify(w.fields)) : [],
      startStep: 's1',
      steps: [
        { id:'s1', title:'İlk onay', type:'human', assign:{ mode:'role', role:'manager' } },
        { id:'s_done', title:'Tamamlandı', type:'end-good', message:'Onaylandı' },
        { id:'s_rej',  title:'Reddedildi', type:'end-bad', message:'Reddedildi' }
      ],
      transitions: [
        { from:'s1', when:'approve', to:'s_done' },
        { from:'s1', when:'reject', to:'s_rej' }
      ]
    };
  } else if (w.shape === 'single') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_approve',
      steps: [
        { id:'s_approve', title:'Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej',  title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' }
      ],
      transitions: [
        { from:'s_approve', when:'approve', to:'s_done' },
        { from:'s_approve', when:'reject',  to:'s_rej' }
      ]
    };
  } else if (w.shape === 'sequential') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_approve1',
      steps: [
        { id:'s_approve1', title:'1. Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_approve2', title:'2. Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[1])) },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej1', title:'1. Onayda reddedildi', type:'end-bad', message:'1. onaylayıcı reddetti' },
        { id:'s_rej2', title:'2. Onayda reddedildi', type:'end-bad', message:'2. onaylayıcı reddetti' }
      ],
      transitions: [
        { from:'s_approve1', when:'approve', to:'s_approve2' },
        { from:'s_approve1', when:'reject',  to:'s_rej1' },
        { from:'s_approve2', when:'approve', to:'s_done' },
        { from:'s_approve2', when:'reject',  to:'s_rej2' }
      ]
    };
  } else if (w.shape === 'conditional') {
    const cond = w.condition;
    const valNum = parseFloat(cond.value);
    const rightVal = !isNaN(valNum) ? valNum : cond.value;
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_check',
      steps: [
        { id:'s_check', title:'Koşul kontrolü', type:'system',
          rule: { left:'form.'+cond.fieldId, op:cond.op, right:rightVal } },
        { id:'s_fast', title:'Hızlı onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_slow_mgr', title:'Müdür onayı (uzun yol)', type:'human', assign:{ mode:'requester_manager' } },
        { id:'s_slow_hr',  title:'İK onayı (uzun yol)', type:'human', assign:{ mode:'role', role:'hr' } },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej', title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' }
      ],
      transitions: [
        { from:'s_check', when:'pass', to:'s_fast' },
        { from:'s_check', when:'fail', to:'s_slow_mgr' },
        { from:'s_fast', when:'approve', to:'s_done' },
        { from:'s_fast', when:'reject',  to:'s_rej' },
        { from:'s_slow_mgr', when:'approve', to:'s_slow_hr' },
        { from:'s_slow_mgr', when:'reject',  to:'s_rej' },
        { from:'s_slow_hr', when:'approve', to:'s_done' },
        { from:'s_slow_hr', when:'reject',  to:'s_rej' }
      ]
    };
  } else if (w.shape === 'parallel') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_par',
      steps: [
        { id:'s_par', title:'Paralel onay', type:'parallel',
          mode: w.parallelMode || 'all',
          assignees: JSON.parse(JSON.stringify(w.approvers)) },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej',  title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' }
      ],
      transitions: [
        { from:'s_par', when:'approve', to:'s_done' },
        { from:'s_par', when:'reject',  to:'s_rej' }
      ]
    };
  } else if (w.shape === 'record') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_done',
      steps: [
        { id:'s_done', title:'Kayıt oluşturuldu', type:'end-good', message:'Kayıt alındı' }
      ],
      transitions: []
    };
  }

  // Aktivasyon kararını uygula
  if (opts.activate === true) {
    newDef.active = true;
  }

  state.definitions.push(newDef);
  state._wizard = null;
  persist();
  closeModal();
  openDesigner(newId);
  if (newDef.active) {
    notify(`"${newDef.name}" sihirbazla oluşturuldu ve AKTİF — kullanıcılar artık talep açabilir`, 'success');
  } else {
    notify(`"${newDef.name}" PASİF olarak yaratıldı — aktifleştirmek için Aktifleştir butonuna basın`, 'success');
  }
}

function openDesigner(defId) {
  state.designerProcessId = defId;
  renderAdminContent();
}

function closeDesigner() {
  // Tam ekrandaysa çık
  if (document.fullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    const el = document.getElementById('admin-content');
    if (el) el.classList.remove('designer-fullscreen');
  }
  state.designerProcessId = null;
  state.canvasMode = false;
  renderAdminContent();
}

// Salt-okunur süreç görüntüleyici (düzenleme yetkisi olmayanlar için).
// Akış diyagramı + form önizlemesini düzenlenemez şekilde modalde gösterir.
function openProcessViewer(defId) {
  const def = getDef(defId);
  if (!def) { notify('Süreç bulunamadı', 'error'); return; }
  const humanSteps = def.steps.filter(s => s.type === 'human').length;
  const systemSteps = def.steps.filter(s => s.type === 'system').length;
  const usage = state.instances.filter(i => i.defId === def.id).length;
  openModal({
    title: `${def.icon || '📄'} ${def.name}`,
    wide: true,
    body: `
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(def.description || 'Açıklama yok')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
        <span class="badge-tag ${def.active?'active':'inactive'}">${def.active?'Aktif':'Pasif'}</span>
        <span class="badge-tag human-step">${humanSteps} insan adımı</span>
        <span class="badge-tag system-step">${systemSteps} sistem adımı</span>
        <span class="badge-tag" style="background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-hi);">${def.fields.length} form alanı</span>
        <span class="badge-tag" style="background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-hi);">${usage} talep açılmış</span>
      </div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">Süreç Akışı</div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:18px;overflow:auto;">
        ${renderProcessPreview(def)}
      </div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">Talep Formu</div>
      ${renderFormPreview(def)}
    `,
    foot: `<button class="ghost-btn" onclick="closeModal()">Kapat</button>`
  });
}

// ============================================================
// GÖRSEL AKIŞ TUVALİ (sürükle-bırak)
// ============================================================

const CANVAS_NODE_TYPES = {
  'human':    { label:'İnsan onayı', icon:'👤', color:'#7F77DD', bg:'rgba(127,119,221,0.12)' },
  'system':   { label:'Sistem kararı', icon:'⚙️', color:'#378ADD', bg:'rgba(55,138,221,0.12)' },
  'parallel': { label:'Paralel onay', icon:'👥', color:'#D4537E', bg:'rgba(212,83,126,0.12)' },
  'action':   { label:'Aksiyon/Bildirim', icon:'📨', color:'#EF9F27', bg:'rgba(239,159,39,0.12)' },
  'wait':     { label:'Bekleme', icon:'⏳', color:'#D85A30', bg:'rgba(216,90,48,0.12)' },
  'monitor':  { label:'İzleme', icon:'⏰', color:'#1D9E75', bg:'rgba(29,158,117,0.12)' },
  'end-good': { label:'Bitiş ✓', icon:'✅', color:'#1D9E75', bg:'rgba(29,158,117,0.12)' },
  'end-bad':  { label:'Bitiş ✕', icon:'❌', color:'#E24B4A', bg:'rgba(226,75,74,0.12)' }
};
const CANVAS_NODE_W = 150;
const CANVAS_NODE_H = 64;

function canvasTransLabel(when) {
  const map = { approve:'onayla', reject:'reddet', pass:'doğru', fail:'yanlış', next:'devam', always:'devam', timeout:'süre doldu' };
  return map[when] || when;
}

function ensureNodePositions(def) {
  let idx = 0;
  for (const s of def.steps) {
    if (typeof s.x !== 'number' || typeof s.y !== 'number') {
      const col = idx % 3, row = Math.floor(idx / 3);
      s.x = 60 + col * 220; s.y = 50 + row * 130;
    }
    idx++;
  }
}

function openCanvas() {
  state.canvasMode = true;
  const def = getDef(state.designerProcessId);
  if (def) ensureNodePositions(def);
  renderDesignerOnly();
}
function closeCanvas() {
  state.canvasMode = false;
  state.canvasLinkFrom = null;
  state.canvasSelected = null;
  renderDesignerOnly();
}

function renderCanvas(def) {
  ensureNodePositions(def);
  const nodes = def.steps;
  const z = state.canvasZoom || 1;
  const pan = state.canvasPan || { x:0, y:0 };

  let edgesHtml = '';
  for (const t of (def.transitions || [])) {
    const from = nodes.find(n => n.id === t.from);
    const to = nodes.find(n => n.id === t.to);
    if (!from || !to) continue;
    const x1 = from.x + CANVAS_NODE_W/2, y1 = from.y + CANVAS_NODE_H;
    const x2 = to.x + CANVAS_NODE_W/2, y2 = to.y;
    const midY = (y1 + y2) / 2;
    let label = canvasTransLabel(t.when);
    // Sistem kararından çıkan doğru/yanlış oklarına koşul özetini ekle
    if (from.type === 'system' && (t.when === 'pass' || t.when === 'fail')) {
      const cond = describeRuleStatic(from.rule);
      if (cond && cond !== 'koşul yok') {
        const shortCond = cond.length > 28 ? cond.slice(0,28) + '…' : cond;
        label = t.when === 'pass' ? `✓ ${shortCond}` : `✕ değilse`;
      }
    }
    const labelColor = (t.when==='approve'||t.when==='pass') ? '#1D9E75' : (t.when==='reject'||t.when==='fail') ? '#E24B4A' : '#888';
    const path = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
    const lw = Math.max(48, label.length * 6.2 + 14); // etiket genişliği içeriğe göre
    const cx = (x1+x2)/2;
    edgesHtml += `
      <path d="${path}" fill="none" stroke="${labelColor}" stroke-width="2" marker-end="url(#cv-arrow)" opacity="0.85"
            class="cv-edge" onclick="canvasEditEdge('${t.from}','${t.when}')" style="cursor:pointer;"/>
      <rect x="${cx - lw/2}" y="${midY - 10}" width="${lw}" height="19" rx="9" fill="var(--panel)" stroke="${labelColor}" stroke-width="1" onclick="canvasEditEdge('${t.from}','${t.when}')" style="cursor:pointer;"/>
      <text x="${cx}" y="${midY + 3}" text-anchor="middle" font-size="10" fill="${labelColor}" style="pointer-events:none;">${escapeHtml(label)}</text>`;
  }

  let nodesHtml = '';
  for (const n of nodes) {
    const td = CANVAS_NODE_TYPES[n.type] || CANVAS_NODE_TYPES['human'];
    const isStart = def.startStep === n.id;
    const isSel = state.canvasSelected === n.id;
    const isLinkFrom = state.canvasLinkFrom === n.id;
    nodesHtml += `
      <g class="cv-node" data-id="${n.id}" transform="translate(${n.x},${n.y})" style="cursor:move;" oncontextmenu="canvasContextMenu(event,'${n.id}')">
        <rect width="${CANVAS_NODE_W}" height="${CANVAS_NODE_H}" rx="8"
              fill="${td.bg}" stroke="${isSel||isLinkFrom ? td.color : 'var(--border-hi)'}"
              stroke-width="${isSel||isLinkFrom ? 2.5 : 1.5}"/>
        ${isStart ? `<rect x="-3" y="-3" width="${CANVAS_NODE_W+6}" height="${CANVAS_NODE_H+6}" rx="10" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,3"/>` : ''}
        <text x="10" y="24" font-size="16">${td.icon}</text>
        <text x="34" y="22" font-size="12" font-weight="600" fill="var(--text)">${escapeHtml((n.title||'').slice(0,15))}</text>
        <text x="34" y="38" font-size="10" fill="var(--text-dim)">${td.label}</text>
        ${isStart ? `<text x="10" y="54" font-size="9" fill="#1D9E75">▶ başlangıç</text>` : ''}
        <circle class="cv-port" data-id="${n.id}" cx="${CANVAS_NODE_W/2}" cy="${CANVAS_NODE_H}" r="6" fill="${td.color}" stroke="#fff" stroke-width="1.5" style="cursor:crosshair;"/>
        <g class="cv-node-del" data-del="${n.id}" style="cursor:pointer;">
          <circle cx="${CANVAS_NODE_W-12}" cy="12" r="9" fill="#E24B4A"/>
          <text x="${CANVAS_NODE_W-12}" y="16" text-anchor="middle" font-size="12" fill="#fff" style="pointer-events:none;">✕</text>
        </g>
      </g>`;
  }

  const linkingHint = state.canvasLinkFrom
    ? `<div class="cv-hint">🔗 Hedef kutuya tıkla (ok çekmek için) · <button onclick="state.canvasLinkFrom=null;renderDesignerOnly();" style="background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;">iptal</button></div>`
    : '';

  return `
    <div class="canvas-wrap">
      <div class="canvas-toolbar">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:11px;color:var(--text-dim);margin-right:4px;">+ Kutu:</span>
          <button class="cv-add" onclick="canvasAddNode('human')">👤 İnsan</button>
          <button class="cv-add" onclick="canvasAddNode('system')">⚙️ Karar</button>
          <button class="cv-add" onclick="canvasAddNode('parallel')">👥 Paralel</button>
          <button class="cv-add" onclick="canvasAddNode('action')">📨 Aksiyon</button>
          <button class="cv-add" onclick="canvasAddNode('wait')">⏳ Bekle</button>
          <button class="cv-add" onclick="canvasAddNode('end-good')">✅ Bitiş</button>
          <button class="cv-add" onclick="canvasAddNode('end-bad')">❌ Red</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="cv-zoom" onclick="canvasUndo()" title="Geri al (Ctrl+Z)">↩</button>
          <button class="cv-zoom" onclick="canvasRedo()" title="Yinele (Ctrl+Y)">↪</button>
          <button class="cv-add" onclick="canvasAutoLayout()" title="Kutuları otomatik hizala">✨ Düzenle</button>
          <button class="cv-add" onclick="canvasValidate()" title="Akışı kontrol et">🔍 Doğrula</button>
          <span style="width:1px;height:20px;background:var(--border);margin:0 2px;"></span>
          <button class="cv-zoom" onclick="canvasZoom(-0.1)">−</button>
          <span style="font-size:11px;color:var(--text-dim);min-width:38px;text-align:center;">${Math.round(z*100)}%</span>
          <button class="cv-zoom" onclick="canvasZoom(0.1)">+</button>
          <button class="cv-zoom" onclick="canvasZoom(0)" title="Sığdır">⊡</button>
          <button class="cv-zoom" onclick="canvasFullscreen()" title="Tam ekran">⤢</button>
        </div>
      </div>
      ${linkingHint}
      <div class="canvas-stage" id="canvas-stage">
        <svg id="canvas-svg" width="100%" height="100%" style="touch-action:none;">
          <defs>
            <marker id="cv-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
              <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
            </marker>
          </defs>
          <g id="canvas-content" transform="translate(${pan.x},${pan.y}) scale(${z})">
            ${edgesHtml}
            ${nodesHtml}
          </g>
        </svg>
      </div>
      ${state.canvasSelected ? renderCanvasNodePanel(def, state.canvasSelected) : '<div class="cv-tip">💡 Kutuyu sürükle · alt yuvarlağı çekip başka kutuya tıkla = ok · kutuya tıkla = düzenle</div>'}
    </div>
  `;
}

function renderCanvasNodePanel(def, nodeId) {
  const n = def.steps.find(s => s.id === nodeId);
  if (!n) return '';
  const td = CANVAS_NODE_TYPES[n.type] || {};
  const users = state.users;
  const roles = (state.roles||[]).map(r=>r.id);
  let body = '';
  body += `<div class="cv-field"><label>Başlık</label><input value="${escapeHtml(n.title||'')}" oninput="canvasUpdateNode('${n.id}','title',this.value)"></div>`;

  if (n.type === 'human') {
    body += `<div class="cv-field"><label>Kim onaylasın?</label>
      <select onchange="canvasUpdateAssign('${n.id}','mode',this.value)">
        <option value="role" ${n.assign?.mode==='role'?'selected':''}>Role göre</option>
        <option value="requester_manager" ${n.assign?.mode==='requester_manager'?'selected':''}>Talep edenin müdürü</option>
        <option value="specific_user" ${n.assign?.mode==='specific_user'?'selected':''}>Belirli kişi</option>
      </select></div>`;
    if (n.assign?.mode === 'role' || !n.assign?.mode) {
      body += `<div class="cv-field"><label>Rol</label><select onchange="canvasUpdateAssign('${n.id}','role',this.value)">${roles.map(r=>`<option ${n.assign?.role===r?'selected':''}>${r}</option>`).join('')}</select></div>`;
    }
    if (n.assign?.mode === 'specific_user') {
      body += `<div class="cv-field"><label>Kişi</label><select onchange="canvasUpdateAssign('${n.id}','userId',this.value)">${users.map(u=>`<option value="${u.id}" ${n.assign?.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div>`;
    }
  }
  if (n.type === 'system') {
    body += `<div class="cv-field" style="flex:1;"><label>Koşul</label>
      <div style="font-size:11px;color:var(--text-dim);padding:6px 8px;background:var(--panel-2);border-radius:4px;">${escapeHtml(describeRuleStatic(n.rule))}</div>
      <button class="cv-add" style="margin-top:6px;" onclick="canvasOpenCondition('${n.id}')">✏️ Koşulu düzenle</button></div>`;
  }
  if (n.type === 'parallel') {
    body += `<div class="cv-field"><label>Mod</label>
      <select onchange="canvasUpdateNode('${n.id}','mode',this.value)">
        <option value="all" ${n.mode==='all'||!n.mode?'selected':''}>Hepsi onaylamalı</option>
        <option value="any" ${n.mode==='any'?'selected':''}>Biri yeter</option>
      </select></div>
      <div class="cv-field"><label>Onaylayacaklar (rol)</label>
      <input value="${escapeHtml((n.assignees||[]).map(a=>a.role||a.userId).join(', '))}" placeholder="manager, kalite_sefi" oninput="canvasUpdateParallel('${n.id}',this.value)"></div>`;
  }
  if (n.type === 'wait') {
    body += `<div class="cv-field"><label>Bekleme süresi (saat)</label><input type="number" min="0" value="${n.waitHours||24}" oninput="canvasUpdateNode('${n.id}','waitHours',parseFloat(this.value))"></div>
      <div style="font-size:10px;color:var(--text-mute);">Süre dolunca "süre doldu" okuyla devam eder.</div>`;
  }
  if (n.type === 'action') {
    body += `<div style="font-size:11px;color:var(--text-dim);">Aksiyon adımı: bildirim/PDF/alt süreç çalıştırıp "devam" okuyla otomatik ilerler. Detaylı aksiyon ayarı liste tasarımcısından yapılır.</div>`;
  }
  if (n.type === 'end-good' || n.type === 'end-bad') {
    body += `<div class="cv-field"><label>Mesaj</label><input value="${escapeHtml(n.message||'')}" oninput="canvasUpdateNode('${n.id}','message',this.value)"></div>`;
  }

  const isStart = def.startStep === n.id;
  const canBeStart = n.type !== 'end-good' && n.type !== 'end-bad';
  return `
    <div class="cv-panel">
      <div class="cv-panel-head">
        <span>${td.icon||''} ${td.label||n.type} <span style="color:var(--text-mute);font-size:10px;">(${n.id})</span></span>
        <button onclick="state.canvasSelected=null;renderDesignerOnly();" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;">✕</button>
      </div>
      <div class="cv-panel-body">${body}</div>
      <div class="cv-panel-foot">
        ${canBeStart ? `<button class="cv-add" onclick="canvasSetStart('${n.id}')" ${isStart?'disabled':''}>${isStart?'▶ Başlangıç':'Başlangıç yap'}</button>` : ''}
        <button class="cv-add" onclick="canvasStartLink('${n.id}')">🔗 Buradan ok çek</button>
        <button class="cv-del" onclick="canvasDeleteNode('${n.id}')">🗑 Sil</button>
      </div>
    </div>
  `;
}

function condText(c) {
  // Tek koşulu okunur metne çevir (değersiz operatörleri düzgün göster)
  const opLabels = {
    '==':'=', '!=':'≠', '>':'>', '<':'<', '>=':'≥', '<=':'≤',
    'between':'arası', 'contains':'içerir', 'not_contains':'içermez',
    'starts_with':'ile başlar', 'ends_with':'ile biter',
    'in':'şunlardan biri', 'not_in':'şunlardan biri değil',
    'empty':'boş', 'not_empty':'dolu'
  };
  const opTxt = opLabels[c.op] || c.op;
  if (c.op === 'empty' || c.op === 'not_empty') return `${c.left} ${opTxt}`;
  return `${c.left} ${opTxt} ${c.right ?? ''}`.trim();
}

function describeRuleStatic(rule) {
  if (!rule) return 'koşul yok';
  if (rule.op !== undefined) return condText(rule);
  if (Array.isArray(rule.nodes)) {
    if (rule.nodes.length === 0) return 'koşul yok';
    if (rule.type === 'not') return 'DEĞİL (' + rule.nodes.map(describeRuleStatic).join(' VE ') + ')';
    const sep = rule.type === 'any' ? ' VEYA ' : ' VE ';
    return rule.nodes.map(n => (Array.isArray(n.nodes)&&n.nodes.length>1)?`(${describeRuleStatic(n)})`:describeRuleStatic(n)).join(sep);
  }
  if (Array.isArray(rule.conditions)) {
    const sep = rule.type === 'any' ? ' VEYA ' : ' VE ';
    return rule.conditions.map(condText).join(sep);
  }
  return 'koşul yok';
}

function canvasAddNode(type) {
  const def = getDef(state.designerProcessId);
  canvasSnapshot();
  ensureNodePositions(def);
  const id = 's_' + Math.random().toString(36).substr(2,4);
  const td = CANVAS_NODE_TYPES[type];
  const n = { id, title: td ? td.label : 'Yeni', type, x: 80, y: 60 };
  if (type === 'human') n.assign = { mode:'role', role:'manager' };
  if (type === 'system') n.rule = { left:'user.seniorityYears', op:'>=', right:1 };
  if (type === 'parallel') { n.mode='all'; n.assignees=[{mode:'role',role:'manager'}]; }
  if (type === 'wait') n.waitHours = 24;
  if (type === 'end-good') n.message = 'Onaylandı';
  if (type === 'end-bad') n.message = 'Reddedildi';
  n.x = 80 + (def.steps.length % 4) * 60;
  n.y = 60 + (def.steps.length % 3) * 40;
  def.steps.push(n);
  if (!def.startStep) def.startStep = id;
  state.canvasSelected = id;
  persist();
  renderDesignerOnly();
}

function canvasUpdateNode(id, key, val) {
  const def = getDef(state.designerProcessId);
  const n = def.steps.find(s => s.id === id);
  if (!n) return;
  n[key] = val;
  persist();
}

function canvasUpdateAssign(id, key, val) {
  const def = getDef(state.designerProcessId);
  const n = def.steps.find(s => s.id === id);
  if (!n) return;
  if (!n.assign) n.assign = {};
  n.assign[key] = val;
  if (key === 'mode') {
    if (val === 'role') n.assign.role = 'manager';
    if (val === 'specific_user') n.assign.userId = state.users[0]?.id;
  }
  persist();
  renderDesignerOnly();
}

function canvasUpdateParallel(id, str) {
  const def = getDef(state.designerProcessId);
  const n = def.steps.find(s => s.id === id);
  if (!n) return;
  const parts = str.split(',').map(x=>x.trim()).filter(Boolean);
  n.assignees = parts.map(p => ({ mode:'role', role:p }));
  persist();
}

function canvasSetStart(id) {
  const def = getDef(state.designerProcessId);
  canvasSnapshot();
  def.startStep = id;
  persist();
  renderDesignerOnly();
}

function canvasDeleteNode(id) {
  const def = getDef(state.designerProcessId);
  canvasSnapshot();
  def.steps = def.steps.filter(s => s.id !== id);
  def.transitions = (def.transitions||[]).filter(t => t.from !== id && t.to !== id);
  if (def.startStep === id) def.startStep = def.steps[0]?.id || null;
  state.canvasSelected = null;
  closeContextMenu();
  persist();
  renderDesignerOnly();
  notify('Kutu silindi — geri almak için ↩ (Ctrl+Z)', 'info');
}

    <button onclick="canvasStartLink('${id}');closeContextMenu();">🔗 Buradan ok çek</button>

// Tuval klavye kısayolları (sadece tuval modunda)
document.addEventListener('keydown', (e) => {
  if (!state.canvasMode) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // yazarken karışma
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); canvasUndo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); canvasRedo(); }
