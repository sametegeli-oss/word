async function changePassword() {
  const cur = document.getElementById('cp-current').value;
  const newp = document.getElementById('cp-new').value;
  const new2 = document.getElementById('cp-new2').value;

  if (!cur || !newp || !new2) { notify('Tüm alanları doldurun', 'error'); return; }
  if (newp.length < 6) { notify('Yeni şifre en az 6 karakter olmalı', 'error'); return; }
  if (newp !== new2) { notify('Yeni şifreler aynı değil', 'error'); return; }

  const user = window.fb.auth.currentUser;
  if (!user) { notify('Oturum yok', 'error'); return; }

  try {
    // Önce mevcut şifreyle yeniden giriş yap (reauthenticate gerekiyor)
    await window.fb.signInWithEmailAndPassword(window.fb.auth, user.email, cur);

    // Şifre güncelle - Firebase SDK üzerinden
    // updatePassword fonksiyonu gerekli ama ESM'e eklemedik, dinamik import:
    const { updatePassword } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    await updatePassword(window.fb.auth.currentUser, newp);

    closeModal();
    notify('✓ Şifre değiştirildi', 'success');
  } catch (e) {
    console.error('[changePassword]', e);
    if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
      notify('Mevcut şifre hatalı', 'error');
    } else {
      notify('Hata: ' + (e.message || e.code), 'error');
    }
  }
}

// === GENEL BAKIŞ ===
function renderReportOverview(range) {
  // Talepler (instances) - bu aralıkta oluşturulanlar
  const inRange = state.instances.filter(i => i.createdAt >= range.start && i.createdAt <= range.end);
  const total = inRange.length;
  const completed = inRange.filter(i => i.status !== 'running').length;
  const approved = inRange.filter(i => i.status === 'completed').length;
  const rejected = inRange.filter(i => i.status === 'rejected').length;
  const running  = inRange.filter(i => i.status === 'running').length;

  // Görevler - bu aralıkta oluşturulanlar
  const tasksInRange = state.tasks.filter(t => t.createdAt >= range.start && t.createdAt <= range.end);
  const totalTasks = tasksInRange.length;
  const openTasks  = state.tasks.filter(t => t.status === 'open').length; // O an açık (her zamandan)

  // SLA performansı: bu aralıkta kapatılan görevler
  const closedTasks = state.tasks.filter(t => t.status === 'closed' && t.closedAt && t.closedAt >= range.start && t.closedAt <= range.end);
  let onTimeCount = 0, lateCount = 0, noSlaCount = 0;
  closedTasks.forEach(t => {
    const inst = state.instances.find(i => i.id === t.instanceId);
    if (!inst) return;
    const def = getDef(inst.defId);
    const step = def?.steps.find(s => s.id === t.stepKey);
    if (step?.slaHours && step.slaHours > 0) {
      const elapsedMs = (t.closedAt - t.createdAt);
      if (elapsedMs <= step.slaHours * 3600000) onTimeCount++;
      else lateCount++;
    } else {
      noSlaCount++;
    }
  });
  const slaTotal = onTimeCount + lateCount;
  const slaPct = slaTotal > 0 ? Math.round((onTimeCount / slaTotal) * 100) : null;

  // Süresi geçen açık görev sayısı
  const overdueCount = state.tasks.filter(t => {
    if (t.status !== 'open') return false;
    const inst = state.instances.find(i => i.id === t.instanceId);
    if (!inst) return false;
    const def = getDef(inst.defId);
    const step = def?.steps.find(s => s.id === t.stepKey);
    const sla = computeSlaStatus(t, step);
    return sla.state === 'overdue';
  }).length;

  // Üretim
  const totalOrders = (state.orders || []).length;
  const ordersInProgress = (state.orders || []).filter(o => o.status === 'in_progress').length;

  // Aktif kullanıcı: hiç talep açmış veya görev almış kullanıcılar
  const activeUserIds = new Set();
  state.instances.forEach(i => activeUserIds.add(i.ownerId));
  state.tasks.forEach(t => activeUserIds.add(t.assignee));
  const activeUsers = activeUserIds.size;

  // Ortalama tamamlanma süresi (saat)
  const doneInst = inRange.filter(i => i.status !== 'running');
  let avgHours = null;
  if (doneInst.length > 0) {
    const sum = doneInst.reduce((acc, i) => acc + (i.updatedAt - i.createdAt), 0);
    avgHours = Math.round((sum / doneInst.length) / 3600000);
  }

  return `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-card-label">Açılan talep</div>
        <div class="stat-card-value">${total}</div>
        <div class="stat-card-trend neutral">${range.label}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Tamamlanan</div>
        <div class="stat-card-value">${completed}</div>
        <div class="stat-card-trend ${completed > 0 ? 'up':'neutral'}">${total > 0 ? Math.round((completed/total)*100)+'%' : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Onaylanan</div>
        <div class="stat-card-value" style="color:var(--green);">${approved}</div>
        <div class="stat-card-trend up">${completed > 0 ? Math.round((approved/completed)*100)+'% onay':'—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Reddedilen</div>
        <div class="stat-card-value" style="color:var(--red);">${rejected}</div>
        <div class="stat-card-trend down">${completed > 0 ? Math.round((rejected/completed)*100)+'% red':'—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Halen Beklemede</div>
        <div class="stat-card-value" style="color:var(--amber);">${running}</div>
        <div class="stat-card-trend neutral">${openTasks} açık görev</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Ortalama Süre</div>
        <div class="stat-card-value">${avgHours !== null ? formatDuration(avgHours * 3600000) : '—'}</div>
        <div class="stat-card-trend neutral">tamamlanan talep</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">SLA Performansı</div>
        <div class="stat-card-value" style="color:${slaPct === null ? 'var(--text-mute)' : slaPct >= 80 ? 'var(--green)' : slaPct >= 50 ? 'var(--amber)' : 'var(--red)'};">${slaPct !== null ? slaPct + '%' : '—'}</div>
        <div class="stat-card-trend ${slaPct >= 80 ? 'up' : slaPct >= 50 ? 'neutral' : 'down'}">${onTimeCount}/${slaTotal} zamanında</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Süresi Geçen</div>
        <div class="stat-card-value" style="color:${overdueCount > 0 ? 'var(--red)' : 'var(--text)'};">${overdueCount}</div>
        <div class="stat-card-trend ${overdueCount > 0 ? 'down':'neutral'}">açık görev</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Üretim Siparişi</div>
        <div class="stat-card-value">${totalOrders}</div>
        <div class="stat-card-trend neutral">${ordersInProgress} devam ediyor</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Aktif Kullanıcı</div>
        <div class="stat-card-value">${activeUsers}</div>
        <div class="stat-card-trend neutral">/ ${state.users.length} toplam</div>
      </div>
    </div>

    <div class="rep-grid-2">
      <div class="rep-block">
        <div class="rep-block-title">
          Onay / Red Dağılımı
          <span class="rep-block-title-extra">${completed} tamamlanan talep</span>
        </div>
        ${renderDonutChart([
          { label: 'Onaylandı', value: approved, color: '#4ade80' },
          { label: 'Reddedildi', value: rejected, color: '#f87171' }
        ])}
      </div>

      <div class="rep-block">
        <div class="rep-block-title">
          Günlük Aktivite
          <span class="rep-block-title-extra">son ${REPORT_RANGES[state.reportRange].days || 'tüm'} gün</span>
        </div>
        ${renderDailyActivityChart(range, inRange)}
      </div>
    </div>
  `;
}

// === SÜREÇ RAPORU ===
function renderReportProcesses(range) {
  const inRange = state.instances.filter(i => i.createdAt >= range.start && i.createdAt <= range.end);

  // Süreç bazlı istatistikler
  const byDef = {};
  inRange.forEach(inst => {
    const def = getDef(inst.defId);
    if (!def) return;
    if (!byDef[inst.defId]) {
      byDef[inst.defId] = {
        def, total: 0, approved: 0, rejected: 0, running: 0,
        sumTimeMs: 0, doneCount: 0
      };
    }
    const b = byDef[inst.defId];
    b.total++;
    if (inst.status === 'completed') { b.approved++; b.sumTimeMs += inst.updatedAt - inst.createdAt; b.doneCount++; }
    else if (inst.status === 'rejected') { b.rejected++; b.sumTimeMs += inst.updatedAt - inst.createdAt; b.doneCount++; }
    else b.running++;
  });

  const procs = Object.values(byDef).sort((a, b) => b.total - a.total);

  if (procs.length === 0) {
    return '<div class="empty" style="padding:40px;"><div class="empty-icon">📊</div><div>Bu aralıkta süreç verisi yok</div></div>';
  }

  return `
    <div class="rep-block">
      <div class="rep-block-title">Süreç Bazlı Performans</div>
      <div class="table-wrap"><table class="rep-table">
        <thead><tr>
          <th>Süreç</th>
          <th class="num">Toplam</th>
          <th class="num">Onay</th>
          <th class="num">Red</th>
          <th class="num">Bekliyor</th>
          <th class="num">Onay Oranı</th>
          <th class="num">Ortalama Süre</th>
        </tr></thead>
        <tbody>
          ${procs.map(p => {
            const approvalRate = (p.approved + p.rejected) > 0 ? Math.round((p.approved / (p.approved + p.rejected)) * 100) : null;
            const avgMs = p.doneCount > 0 ? p.sumTimeMs / p.doneCount : 0;
            return `<tr>
              <td><span style="font-size:14px;">${p.def.icon || '📄'}</span> ${escapeHtml(p.def.name)}</td>
              <td class="num">${p.total}</td>
              <td class="num" style="color:var(--green);">${p.approved}</td>
              <td class="num" style="color:var(--red);">${p.rejected}</td>
              <td class="num" style="color:var(--amber);">${p.running}</td>
              <td class="num">${approvalRate !== null ? approvalRate + '%' : '—'}
                ${approvalRate !== null ? `<div class="progress-bar"><div style="width:${approvalRate}%;background:${approvalRate >= 70 ? 'var(--green)' : approvalRate >= 40 ? 'var(--amber)' : 'var(--red)'};"></div></div>` : ''}
              </td>
              <td class="num">${avgMs > 0 ? formatDuration(avgMs) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="rep-block">
      <div class="rep-block-title">Süreçlere Göre Dağılım</div>
      ${renderBarChart(procs.slice(0, 10).map(p => ({
        label: (p.def.icon || '') + ' ' + p.def.name,
        value: p.total,
        color: '#4a9eff'
      })))}
    </div>
  `;
}

// === KULLANICI RAPORU ===
function renderReportUsers(range) {
  const userStats = {};
  state.users.forEach(u => {
    userStats[u.id] = {
      user: u, opened: 0, approved: 0, rejected: 0,
      tasksAssigned: 0, tasksClosed: 0, sumResponseMs: 0, closedWithResponse: 0
    };
  });

  state.instances.forEach(inst => {
    if (inst.createdAt < range.start || inst.createdAt > range.end) return;
    if (userStats[inst.ownerId]) userStats[inst.ownerId].opened++;
  });

  state.tasks.forEach(t => {
    if (!userStats[t.assignee]) return;
    if (t.createdAt < range.start || t.createdAt > range.end) return;
    userStats[t.assignee].tasksAssigned++;
    if (t.status === 'closed') {
      userStats[t.assignee].tasksClosed++;
      if (t.decision === 'approve' || t.action === 'approve') userStats[t.assignee].approved++;
      else if (t.decision === 'reject' || t.action === 'reject') userStats[t.assignee].rejected++;
      if (t.closedAt) {
        userStats[t.assignee].sumResponseMs += (t.closedAt - t.createdAt);
        userStats[t.assignee].closedWithResponse++;
      }
    }
  });

  const users = Object.values(userStats)
    .filter(s => s.opened > 0 || s.tasksAssigned > 0)
    .sort((a, b) => (b.opened + b.tasksAssigned) - (a.opened + a.tasksAssigned));

  if (users.length === 0) {
    return '<div class="empty" style="padding:40px;"><div class="empty-icon">👥</div><div>Bu aralıkta kullanıcı aktivitesi yok</div></div>';
  }

  return `
    <div class="rep-block">
      <div class="rep-block-title">Kullanıcı Aktivitesi</div>
      <div class="table-wrap"><table class="rep-table">
        <thead><tr>
          <th>Kullanıcı</th>
          <th class="num">Açılan Talep</th>
          <th class="num">Atanan Görev</th>
          <th class="num">Onayladığı</th>
          <th class="num">Reddettiği</th>
          <th class="num">Ortalama Yanıt</th>
        </tr></thead>
        <tbody>
          ${users.map(s => {
            const avg = s.closedWithResponse > 0 ? s.sumResponseMs / s.closedWithResponse : 0;
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  <div class="avatar" style="width:24px;height:24px;font-size:10px;">${s.user.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
                  <span>${escapeHtml(s.user.name)}</span>
                </div>
              </td>
              <td class="num">${s.opened}</td>
              <td class="num">${s.tasksAssigned}</td>
              <td class="num" style="color:var(--green);">${s.approved}</td>
              <td class="num" style="color:var(--red);">${s.rejected}</td>
              <td class="num">${avg > 0 ? formatDuration(avg) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="rep-grid-2">
      <div class="rep-block">
        <div class="rep-block-title">En Aktif Kullanıcılar (talep açan)</div>
        ${renderBarChart(users.slice(0, 5).filter(s => s.opened > 0).map(s => ({
          label: s.user.name, value: s.opened, color: '#a78bfa'
        })))}
      </div>
      <div class="rep-block">
        <div class="rep-block-title">En Çok Onay Veren</div>
        ${renderBarChart(users.slice(0, 5).filter(s => s.tasksClosed > 0).sort((a,b) => b.tasksClosed - a.tasksClosed).map(s => ({
          label: s.user.name, value: s.tasksClosed, color: '#4ade80'
        })))}
      </div>
    </div>
  `;
}

// === SVG GRAFİKLER ===

function renderDonutChart(data) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    return '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Veri yok</div>';
  }
  const cx = 120, cy = 120, r = 80, innerR = 50;
  let currentAngle = -Math.PI / 2; // 12 saat yönünden başla
  const paths = data.map((d, i) => {
    if (d.value === 0) return null;
    const angle = (d.value / total) * Math.PI * 2;
    const endAngle = currentAngle + angle;
    const x1 = cx + r * Math.cos(currentAngle);
    const y1 = cy + r * Math.sin(currentAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const xi1 = cx + innerR * Math.cos(endAngle);
    const yi1 = cy + innerR * Math.sin(endAngle);
    const xi2 = cx + innerR * Math.cos(currentAngle);
    const yi2 = cy + innerR * Math.sin(currentAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${xi1} ${yi1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${xi2} ${yi2} Z`;
    currentAngle = endAngle;
    return `<path d="${path}" fill="${d.color}" stroke="var(--bg)" stroke-width="2"><title>${escapeHtml(d.label)}: ${d.value} (${Math.round(d.value/total*100)}%)</title></path>`;
  }).filter(Boolean).join('');

  return `
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;">
      <svg class="rep-chart" viewBox="0 0 240 240" style="max-width:240px;flex:0 0 auto;">
        ${paths}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700" font-family="var(--mono)">${total}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--text-mute)" font-size="10" letter-spacing="1.5">TOPLAM</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${data.map(d => `
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
            <div style="width:12px;height:12px;border-radius:2px;background:${d.color};"></div>
            <span style="color:var(--text);">${escapeHtml(d.label)}</span>
            <span style="font-family:var(--mono);color:var(--text-dim);margin-left:8px;">${d.value} (${total > 0 ? Math.round(d.value/total*100) : 0}%)</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderBarChart(data) {
  if (!data || data.length === 0) {
    return '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Veri yok</div>';
  }
  const maxValue = Math.max(...data.map(d => d.value), 1);
  const barHeight = 24, gap = 8;
  const width = 600;
  const labelWidth = 180;
  const valueWidth = 50;
  const chartWidth = width - labelWidth - valueWidth - 16;
  const height = data.length * (barHeight + gap);

  return `
    <svg class="rep-chart" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
      ${data.map((d, i) => {
        const y = i * (barHeight + gap);
        const barLen = (d.value / maxValue) * chartWidth;
        return `
          <text x="0" y="${y + barHeight/2 + 4}" fill="var(--text)" font-size="12" font-family="var(--sans)">${escapeHtml(String(d.label).length > 22 ? String(d.label).slice(0,22)+'…' : d.label)}</text>
          <rect x="${labelWidth}" y="${y}" width="${chartWidth}" height="${barHeight}" fill="var(--panel-2)" rx="3"></rect>
          <rect x="${labelWidth}" y="${y}" width="${barLen}" height="${barHeight}" fill="${d.color}" rx="3"></rect>
          <text x="${width - 4}" y="${y + barHeight/2 + 4}" text-anchor="end" fill="var(--text)" font-size="12" font-weight="600" font-family="var(--mono)">${d.value}</text>
        `;
      }).join('')}
    </svg>
  `;
}

function renderDailyActivityChart(range, instances) {
  // range.days null ise tüm zamana yay, değilse o kadar gün
  const days = REPORT_RANGES[state.reportRange].days || 30; // 'all' için 30 gün varsayalım son zamandan
  const dayBuckets = [];
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    d.setHours(0,0,0,0);
    const startMs = d.getTime();
    const endMs = startMs + 24 * 3600000;
    const count = instances.filter(inst => inst.createdAt >= startMs && inst.createdAt < endMs).length;
    dayBuckets.push({ date: d, count });
  }
  const maxCount = Math.max(...dayBuckets.map(b => b.count), 1);

  // SVG çizgi grafik
  const width = 600, height = 180;
  const padLeft = 30, padBottom = 30, padTop = 10, padRight = 10;
  const chartW = width - padLeft - padRight;
  const chartH = height - padTop - padBottom;
  const stepX = chartW / Math.max(1, dayBuckets.length - 1);
  const points = dayBuckets.map((b, i) => {
    const x = padLeft + i * stepX;
    const y = padTop + chartH - (b.count / maxCount) * chartH;
    return { x, y, count: b.count, date: b.date };
  });

  const pathD = 'M ' + points.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${padTop + chartH} L ${padLeft} ${padTop + chartH} Z`;

  // Y ekseni etiketleri (0, max/2, max)
  const yLabels = [0, Math.ceil(maxCount/2), maxCount];

  // X ekseni: her 5'te bir göster (yoğunluğa göre)
  const xLabelStep = Math.max(1, Math.floor(dayBuckets.length / 7));

  return `
    <svg class="rep-chart" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
      <!-- Grid çizgileri -->
      ${yLabels.map(v => {
        const y = padTop + chartH - (v / maxCount) * chartH;
        return `
          <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,2"></line>
          <text x="${padLeft - 4}" y="${y + 3}" text-anchor="end" fill="var(--text-mute)" font-size="9" font-family="var(--mono)">${v}</text>
        `;
      }).join('')}

      <!-- Alan -->
      <path d="${areaD}" fill="var(--accent)" fill-opacity="0.15"></path>
      <!-- Çizgi -->
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
      <!-- Noktalar -->
      ${points.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--accent)">
          <title>${p.date.toLocaleDateString('tr-TR')}: ${p.count} talep</title>
        </circle>
      `).join('')}

      <!-- X ekseni etiketleri -->
      ${points.map((p, i) => {
        if (i % xLabelStep !== 0 && i !== points.length - 1) return '';
        return `<text x="${p.x.toFixed(1)}" y="${height - padBottom + 14}" text-anchor="middle" fill="var(--text-mute)" font-size="9" font-family="var(--mono)">${p.date.getDate()}.${p.date.getMonth()+1}</text>`;
      }).join('')}
    </svg>
  `;
}

      ${isFiltered ? `<span class="filter-clear" onclick="clearOrderFilters()">✕ Temizle</span>` : ''}
      <span class="filter-result-count">${orders.length} / ${totalCount} sipariş</span>
    </div>
  `;

  c.innerHTML = `
    <div class="main-head">
      <h1>📋 Tüm Siparişler</h1>
    </div>
    ${filterBarHtml}
    ${orders.length === 0 ? '<div class="empty"><div class="empty-icon">∅</div><div>Bu filtrelerde sipariş yok</div></div>' : ''}
    <div>
      ${orders.map(o => renderOrderCard(o)).join('')}
    </div>
  `;
}

function setOrderFilter(key, val) {
  if (key === 'status') state.filterOrderStatus = val;
  else if (key === 'station') state.filterOrderStation = val;
  renderProdMain();
}

function clearOrderFilters() {
  state.filterOrderStatus = 'active';
  state.filterOrderStation = '';
  renderProdMain();
}

function renderOrderCard(o) {
  const isSel = state.selectedOrderId === o.id;
  const isDone = o.status === 'completed';
  const cls = ['order-card'];
  if (isSel) cls.push('selected');
  if (isDone) cls.push('done');
  const stepPills = STATIONS.map((st, idx) => {
    let pc = 'step-pill';
    if (isDone || o.currentStation > st.id) pc += ' done';
    else if (o.currentStation === st.id) pc += ' active';
    return `<div class="${pc}" title="${escapeHtml(st.name)}"></div>`;
  }).join('');
  const currentStep = isDone ? '✓ Sevk edildi' :
    `Şu an: ${escapeHtml(getStation(o.currentStation)?.name || '—')}`;
  const statusCls = isDone ? 'done' : '';
  return `
    <div class="${cls.join(' ')}" onclick="selectOrder('${o.id}')">
      <div class="order-id-row">
        <span class="order-id">${o.id}</span>
        <span class="order-qty">${o.qty.toLocaleString('tr-TR')} adet</span>
      </div>
      <div class="order-product">${escapeHtml(o.product)}</div>
      <div class="order-progress">${stepPills}</div>
      <div class="order-step-name ${statusCls}">${currentStep}</div>
    </div>
  `;
}

function renderMyStation(c) {
  const myStations = getMyStations(state.currentUser);
  if (myStations.length === 0) {
    c.innerHTML = `<div class="main-head"><h1>🛠️ İstasyonum</h1></div>
      <div class="empty"><div class="empty-icon">🛠️</div><div>Henüz bir istasyona atanmadın. Yönetici istasyon ataması yapabilir.</div></div>`;
    return;
  }

  c.innerHTML = `
    <div class="main-head">
      <h1>🛠️ İstasyonum</h1>
      <div style="font-size:12px;color:var(--text-dim);">${myStations.length} istasyon sorumlusu</div>
    </div>

}

function renderMyStationBox(st) {
  const orders = getOrdersAtStation(st.id);
  return `
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
        <div>
          <div style="font-size:11px;color:var(--text-mute);font-family:var(--mono);">İSTASYON ${st.id}</div>
          <div style="font-size:18px;font-weight:600;">${escapeHtml(st.name)}</div>
        </div>
        <div style="font-family:var(--mono);font-size:24px;font-weight:700;color:${orders.length ? 'var(--amber)' : 'var(--text-mute)'};">${orders.length}</div>
      </div>
      ${orders.length === 0 ? '<div style="font-size:13px;color:var(--text-mute);text-align:center;padding:20px;">Bekleyen iş yok</div>' :

function renderStationTask(o) {
  const task = o.currentTask;
  const isMine = task?.startedBy === state.currentUser;
  const cls = ['station-task'];
  if (isMine) cls.push('task-mine');
  let actionBtns = '';
  if (!task || task.status !== 'started') {
    actionBtns = `<button class="start" onclick="event.stopPropagation();startWorkOnOrder('${o.id}')">▶ Başla</button>`;
  } else if (isMine) {
    const elapsed = Math.floor((Date.now() - task.startedAt) / 60000);
    actionBtns = `
      <span style="font-size:11px;color:var(--amber);margin-right:8px;">⏱ ${elapsed}dk</span>
      <button onclick="event.stopPropagation();finishWorkOnOrder('${o.id}')">✓ Bittiği</button>
    `;
  } else {
    actionBtns = `<span style="font-size:11px;color:var(--text-mute);">${escapeHtml(getUser(task.startedBy)?.name || '?')} çalışıyor</span>`;
  }
  return `
    <div class="${cls.join(' ')}" onclick="selectOrder('${o.id}')">
      <div>
        <div style="font-weight:500;">${o.id} <span style="color:var(--text-mute);font-size:11px;">· ${o.qty} adet</span></div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${escapeHtml(o.product)}</div>
      </div>
      <div>${actionBtns}</div>
    </div>
  `;
}

function renderProdDetail() {
  const c = document.getElementById('prod-detail');

  // Sipariş seçili ise onu göster, değil ise istasyon detayı

function renderOrderDetail(c) {
  const o = state.orders.find(x => x.id === state.selectedOrderId);
  if (!o) { c.innerHTML = `<div class="empty"><div class="empty-icon">∅</div><div>Bulunamadı</div></div>`; return; }

  const logs = state.productionLog.filter(l => l.orderId === o.id).sort((a,b) => a.at - b.at);
  const isDone = o.status === 'completed';
  const curStation = getStation(o.currentStation);
  const canOperate = !isDone && curStation && isUserOperatorOf(curStation.id, state.currentUser);
  const isStarted = o.currentTask?.status === 'started';
  const isMine = o.currentTask?.startedBy === state.currentUser;

  let actionBar = '';
  if (canOperate) {
    if (!isStarted) {
      actionBar = `
        <div class="action-bar">
          <button class="ghost-btn" style="flex:0;padding:9px 14px;" onclick="rewindOrder('${o.id}')">↶ Geri</button>
          <button class="btn approve" onclick="startWorkOnOrder('${o.id}')">▶ Başla</button>
        </div>`;
    } else if (isMine) {
      const elapsed = Math.floor((Date.now() - o.currentTask.startedAt) / 60000);
      actionBar = `
        <div class="action-bar">
          <button class="ghost-btn" style="flex:0;padding:9px 14px;" onclick="rewindOrder('${o.id}')">↶ Geri</button>
          <button class="btn approve" onclick="finishWorkOnOrder('${o.id}')">✓ Bittiği (${elapsed}dk)</button>
        </div>`;
    }
  }

  c.innerHTML = `
    <div class="detail-head">
      <div class="detail-title">🏭 ${o.id}</div>
      <div class="detail-sub">
        <span class="status-pill ${isDone?'status-completed':'status-running'}">${isDone?'SEVK EDİLDİ':'ÜRETİMDE'}</span>
        ${isStarted ? `<span class="status-pill status-pending" style="margin-left:6px;">ÇALIŞMA AKTİF</span>`:''}
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <h4>Sipariş Bilgileri</h4>
        <div class="kv"><span class="k">Ürün</span><span class="v" style="text-align:right;">${escapeHtml(o.product)}</span></div>
        <div class="kv"><span class="k">Adet</span><span class="v">${o.qty.toLocaleString('tr-TR')}</span></div>
        <div class="kv"><span class="k">Açılış</span><span class="v">${formatDate(o.createdAt)}</span></div>
        ${isDone ? `<div class="kv"><span class="k">Sevk</span><span class="v">${formatDate(o.completedAt)}</span></div>` : `
          <div class="kv"><span class="k">Şu an</span><span class="v" style="color:var(--accent);">${escapeHtml(curStation?.name || '—')}</span></div>
        `}
      </div>
      <div class="detail-section">
        <h4>İlerleme</h4>
        <div class="order-progress" style="margin-bottom:12px;">
          ${STATIONS.map(st => {
            let pc = 'step-pill';
            if (isDone || o.currentStation > st.id) pc += ' done';
            else if (o.currentStation === st.id) pc += ' active';
            return `<div class="${pc}" title="${escapeHtml(st.name)}"></div>`;
          }).join('')}
        </div>
        ${STATIONS.map(st => {
          const passed = isDone || o.currentStation > st.id;
          const current = o.currentStation === st.id && !isDone;
          const color = passed ? 'var(--green)' : current ? 'var(--amber)' : 'var(--text-mute)';
          const icon = passed ? '✓' : current ? '●' : '○';
          return `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
            <span style="color:${color}">${icon} ${escapeHtml(st.name)}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="detail-section">
        <h4>Üretim Geçmişi</h4>
        ${logs.length === 0 ? '<div style="font-size:12px;color:var(--text-mute);padding:8px 0;">Henüz işlem yok</div>' :
        '<div class="history">' + logs.map(l => {
          const station = getStation(l.stationId);
          const user = getUser(l.by);
          const eventLabel = l.event === 'started' ? `${station?.name} - başladı` :
                             l.event === 'finished' ? `${station?.name} - tamamlandı` :
                             l.event === 'rewind' ? `${station?.name} - geri alındı` : l.event;
          const typeCls = l.event === 'finished' ? 'approve' : l.event === 'rewind' ? 'reject' : 'system';
          let duration = '';
          if (l.event === 'finished' && l.startedAt) {
            const mins = Math.floor((l.at - l.startedAt) / 60000);
            duration = ` (${mins}dk)`;
          }
          return `<div class="history-item ${typeCls}">
            <div class="history-time">${formatDate(l.at)}</div>
            <div class="history-text">${escapeHtml(eventLabel)}${duration} <span style="color:var(--text-mute)">— ${escapeHtml(user?.name || l.by)}</span></div>
          </div>`;
        }).join('') + '</div>'}
      </div>
      ${!canOperate && !isDone ? `<div style="font-size:11px;color:var(--text-mute);padding:8px;background:var(--panel-2);border-radius:4px;text-align:center;">Bu istasyonun operatörü değilsin. ${curStation?.name} operatörleri: ${getStationOperators(o.currentStation).map(id => getUser(id)?.name).join(', ') || 'atanmamış'}</div>` : ''}
    </div>
    ${actionBar}
  `;
}

// ============== GLOBAL ARAMA ==============
function onGlobalSearch(query) {
  const results = document.getElementById('search-results');
  if (!results) return;
  const q = (query || '').trim().toLowerCase();
  if (q.length < 2) {
    results.style.display = 'none';
    results.innerHTML = '';
    return;
  }

  const matches = [];
  // 1. Talepler: ID, owner adı, form içeriği
  for (const inst of state.instances) {
    if (matches.length >= 20) break;
    const def = getDef(inst.defId);
    if (!def) continue;
    const owner = getUser(inst.ownerId);
    const ownerName = (owner?.name || '').toLowerCase();
    const formStr = Object.values(inst.form || {}).map(v => String(v || '')).join(' ').toLowerCase();
    if (inst.id.toLowerCase().includes(q) ||
        ownerName.includes(q) ||
        def.name.toLowerCase().includes(q) ||
        formStr.includes(q)) {
      matches.push({
        type: 'instance', inst, def, owner,
        title: `${def.icon || '📄'} ${def.name}`,
        sub: `${inst.id} • ${owner?.name || '?'} • ${
          inst.status === 'completed' ? 'Onaylandı' :
          inst.status === 'rejected'  ? 'Reddedildi' : 'Bekliyor'
        }`
      });
    }
  }
  // 2. Kullanıcılar
  for (const u of state.users) {
    if (matches.length >= 25) break;
    if (u.name.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)) {
      matches.push({
        type: 'user', user: u,
        title: `👤 ${u.name}`,
        sub: `${u.roles.join(' · ')} • ${u.id}`
      });
    }
  }
  // 3. Süreç tanımları (admin için yararlı)
  for (const d of state.definitions) {
    if (matches.length >= 30) break;
    if (d.name.toLowerCase().includes(q)) {
      matches.push({
        type: 'def', def: d,
        title: `${d.icon || '📄'} ${d.name}`,
        sub: `Süreç tanımı • ${d.active ? 'Aktif' : 'Pasif'}`
      });
    }
  }
  // 4. Üretim siparişleri
  for (const o of (state.orders || [])) {
    if (matches.length >= 35) break;
    if (o.id.toLowerCase().includes(q) ||
        (o.product || '').toLowerCase().includes(q)) {
      matches.push({
        type: 'order', order: o,
        title: `🏭 ${o.id}`,
        sub: `${o.product || '?'} • ${o.qty || 0} adet • ${o.status}`
      });
    }
  }

  if (matches.length === 0) {
    results.innerHTML = `<div class="search-result-empty">"${escapeHtml(query)}" için sonuç yok</div>`;
  } else {
    results.innerHTML = matches.slice(0, 12).map((m, idx) => `
      <div class="search-result-item" onclick="onSearchResultClick(${idx})" data-idx="${idx}">
        <div class="search-result-info">
          <div class="search-result-title">${escapeHtml(m.title)}</div>
          <div class="search-result-sub">${escapeHtml(m.sub)}</div>
        </div>
      </div>
    `).join('');
    // Geçici matches ref
    state._searchResults = matches;
  }
  results.style.display = 'block';
}

function onSearchResultClick(idx) {
  const m = state._searchResults?.[idx];
  if (!m) return;
  document.getElementById('global-search').value = '';
  document.getElementById('search-results').style.display = 'none';
  state._searchResults = null;

  if (m.type === 'instance') {
    state.currentTop = 'work';
    state.workTab = 'all';
    state.selected = { type: 'instance', id: m.inst.id };
    renderAll();
  } else if (m.type === 'user') {
    // Admin ise yönetim → kullanıcılar; değilse rol değiştirme
    const cu = getUser(state.currentUser);
    if (cu?.roles.includes('admin')) {
      state.currentTop = 'admin';
      state.adminTab = 'users';
      renderAll();
      // Düzenle paneli açmak istersen şu satırı aç:
      // setTimeout(() => openUserEditor(m.user.id), 100);
    } else {
      // Aktif kullanıcı olarak geç (rol değiştir)
      switchUser(m.user.id);
    }
  } else if (m.type === 'def') {
    state.currentTop = 'admin';
    state.adminTab = 'processes';
    state.designerProcessId = m.def.id;
    renderAll();
  } else if (m.type === 'order') {
    state.currentTop = 'production';
    state.prodTab = 'orders';
    state.selectedOrderId = m.order.id;
    renderAll();
  }
}

function toggleMobileSidebar() {
  // Aktif modüle göre doğru sidebar'ı bul
  let sb = null;
  if (state.currentTop === 'work') sb = document.querySelector('.view-work .sidebar');
  else if (state.currentTop === 'calendar') sb = document.getElementById('cal-sidebar');
  else if (state.currentTop === 'production') sb = document.querySelector('.prod-sidebar');
  else if (state.currentTop === 'admin') sb = document.querySelector('.admin-sidebar');

  const overlay = document.getElementById('sidebar-overlay');
  if (!sb) return;

  const isOpen = sb.classList.contains('open');
  if (isOpen) {
    sb.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    sb.classList.add('open');
    overlay.classList.add('open');
  }
}

function closeMobileSidebar() {
  document.querySelectorAll('.sidebar, #cal-sidebar, .prod-sidebar, .admin-sidebar').forEach(sb => {
    sb.classList.remove('open');
  });
  const overlay = document.getElementById('sidebar-overlay');
  if (overlay) overlay.classList.remove('open');
}

    if (e.clientY - rect.top < 44) {

// ============== YARDIMCI ==============

function formatAge(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'şimdi';
  if (m < 60) return m + 'dk önce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'sa önce';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'g önce';
  return new Date(ts).toLocaleDateString('tr-TR');
}
function formatDate(ts) {
  return new Date(ts).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function notify(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2500);
  setTimeout(() => t.remove(), 3000);
}

// ============== SESLİ İLETİŞİM (Web Speech API) ==============
// Tarayıcının yerleşik konuşma tanıma + sesli okuma motoru. Harici servis/anahtar gerekmez.
const VOICE = {
  recognition: null,
  listeningTarget: null,   // o an dinlenen input elemanı
  ttsEnabled: false,       // sesli cevap varsayılan KAPALI
  supportsSTT: ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window),
  supportsTTS: ('speechSynthesis' in window)
};

function getRecognition() {
  if (VOICE.recognition) return VOICE.recognition;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'tr-TR';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;
  VOICE.recognition = r;
  return r;
}

// Bir input/textarea için sesli dikteyi başlat/durdur (mikrofon düğmesi buna bağlı)
function toggleVoiceInput(targetId, btnId) {
  if (!VOICE.supportsSTT) { notify('Bu tarayıcı sesli girişi desteklemiyor (Chrome önerilir)', 'error'); return; }
  const target = document.getElementById(targetId);
  const btn = btnId ? document.getElementById(btnId) : null;
  const r = getRecognition();
  if (!r) { notify('Sesli giriş başlatılamadı', 'error'); return; }

  // Zaten bu hedefi dinliyorsa: durdur
  if (VOICE.listeningTarget === target) { try { r.stop(); } catch(e) {} return; }
  // Başka bir hedefi dinliyorsa önce onu durdur
  if (VOICE.listeningTarget) { try { r.stop(); } catch(e) {} }

  VOICE.listeningTarget = target;
  if (btn) { btn.classList.add('listening'); btn.textContent = '⏺'; btn.title = 'Dinleniyor — durdurmak için tıklayın'; }
  const baseText = target ? (target.value || '') : '';

  r.onresult = (ev) => {
    let finalT = '', interimT = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const tr = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalT += tr; else interimT += tr;
    }
    if (!target) return;
    const sep = baseText && !baseText.endsWith(' ') ? ' ' : '';
    target.value = baseText + sep + (finalT || interimT);
    if (target.tagName === 'INPUT' && typeof onGlobalSearch === 'function' && target.id === 'global-search') {
      onGlobalSearch(target.value);
    }
  };
  r.onerror = (ev) => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      notify('Mikrofon izni reddedildi. Tarayıcı ayarlarından izin verin.', 'error');
    } else if (ev.error !== 'aborted' && ev.error !== 'no-speech') {
      notify('Sesli giriş hatası: ' + ev.error, 'error');
    }
  };
  r.onend = () => {
    if (btn) { btn.classList.remove('listening'); btn.textContent = '🎤'; btn.title = 'Sesli giriş'; }
    VOICE.listeningTarget = null;
  };
  try { r.start(); } catch(e) { /* arka arkaya start çağrısı */ }
}

// AI cevabını sesli oku (yalnızca ttsEnabled açıksa)
function speak(text) {
  if (!VOICE.ttsEnabled || !VOICE.supportsTTS || !text) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 600));
    u.lang = 'tr-TR';
    u.rate = 1.0;
    const trVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
    if (trVoice) u.voice = trVoice;
    window.speechSynthesis.speak(u);
  } catch(e) { /* sessiz geç */ }
}

// Sesli cevabı aç/kapat (hoparlör düğmesi)
function toggleTTS(btnId) {
  VOICE.ttsEnabled = !VOICE.ttsEnabled;
  const btn = btnId ? document.getElementById(btnId) : null;
  if (btn) {
    btn.textContent = VOICE.ttsEnabled ? '🔊' : '🔇';
    btn.title = VOICE.ttsEnabled ? 'Sesli cevap açık' : 'Sesli cevap kapalı';
    btn.classList.toggle('active', VOICE.ttsEnabled);
  }
  if (!VOICE.ttsEnabled && VOICE.supportsTTS) window.speechSynthesis.cancel();
  notify(VOICE.ttsEnabled ? 'Sesli cevap açıldı' : 'Sesli cevap kapatıldı', 'success');
}
window.toggleVoiceInput = toggleVoiceInput;
window.toggleTTS = toggleTTS;
window.speak = speak;

AI_TOOLS.kullaniciDetay = {

  risk: 'safe',
  perm: 'admin_users_view',
  run: ({ ad = '', id = null }) => {
    const hedef = (ad || id || '').toString().toLocaleLowerCase('tr-TR').trim();

    const u = state.users.find(x => x.id === hedef || String(x.name).toLocaleLowerCase('tr-TR').includes(hedef));

AI_TOOLS.talepDetay = {
  desc: 'Tek bir talebin detayını ve hangi adımda olduğunu verir. Parametre: instanceId',
  risk: 'safe',
  perm: 'workflows_view',
  run: ({ instanceId }) => {

    const i = state.instances.find(x => x.id === instanceId);
    if (!i) throw new Error('Talep bulunamadı: ' + instanceId);

      id: i.id, surec: def?.name || i.defId, durum: i.status,
      sahip: getUser(i.ownerId)?.name || i.ownerId,
      suandakiAdim: adim?.title || i.currentStep || '-',
      acilis: new Date(i.createdAt).toLocaleString('tr-TR'),
      gunSayisi: Math.floor((Date.now() - i.createdAt) / 86400000)
    };
  }
};

AI_TOOLS.enYukluKisiler = {
  desc: 'Üzerinde en çok açık görev olan kişileri sıralar. Parametre: limit (varsayılan 5)',
  risk: 'safe',
  perm: 'workflows_view',
  run: ({ limit = 5 }) => {
    const sayac = {};
    (state.tasks || []).filter(t => t.status === 'open' && t.assigneeId).forEach(t => { sayac[t.assigneeId] = (sayac[t.assigneeId] || 0) + 1; });
    const sirali = Object.entries(sayac).sort((a, b) => b[1] - a[1]).slice(0, Math.max(1, limit));
    return { count: sirali.length, items: sirali.map(([uid, n]) => ({ kisi: getUser(uid)?.name || uid, acikGorev: n })) };
  }
};

AI_TOOLS.izinliler = {
  desc: 'Belirtilen tarihte (varsayılan bugün) izinli olan kişileri listeler. Parametre: tarih (YYYY-AA-GG, opsiyonel)',
  risk: 'safe',
  perm: 'admin_users_view',
  run: ({ tarih = null }) => {
    const gun = tarih ? new Date(tarih) : new Date();
    const gunStr = gun.toISOString().slice(0, 10);
    const izinli = (state.users || []).filter(u => (u.absences || []).some(a => {
      const bas = (a.start || a.from || '').slice(0, 10);
      const bit = (a.end || a.to || a.start || a.from || '').slice(0, 10);
      return bas && gunStr >= bas && gunStr <= bit;
    }));
    return { tarih: gunStr, count: izinli.length, items: izinli.map(u => ({ kisi: u.name })) };
  }
};


// ---- Yerel çoklu-tablo analiz araçları (Gemini/OpenAI gerekmeden çalışır) ----
function aiDayStart(ts) { const d = ts ? new Date(ts) : new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function aiMonthStart(ts) { const d = ts ? new Date(ts) : new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function aiSafeDateMs(v) { if (!v) return 0; if (typeof v === 'number') return v; const d = new Date(v); return isNaN(d.getTime()) ? 0 : d.getTime(); }
function aiUserName(uid) { return getUser(uid)?.name || uid || '-'; }
function aiRoleName(rid) { return (state.roles || []).find(r => r.id === rid)?.name || rid || '-'; }
function aiDefName(did) { return getDef(did)?.name || did || '-'; }
function aiOpenTasks() { return (state.tasks || []).filter(t => t.status === 'open'); }
function aiRunningInstances() { return (state.instances || []).filter(i => i.status === 'running'); }

}};

AI_TOOLS.rolBazliKullanicilar = { desc:'Rollere göre kullanıcıları isimleriyle listeler.', risk:'safe', perm:'admin_users_view', run: () => {
  const byRole = {};
  (state.roles || []).forEach(r => { byRole[r.id] = { rolId:r.id, rol:r.name || r.id, kullaniciSayisi:0, kullanicilar:[] }; });
  (state.users || []).forEach(u => {
    const roles = Array.isArray(u.roles) && u.roles.length ? u.roles : ['__rol_yok__'];
    roles.forEach(rid => {
      if (!byRole[rid]) byRole[rid] = { rolId:rid, rol: rid === '__rol_yok__' ? 'Rolü yok' : aiRoleName(rid), kullaniciSayisi:0, kullanicilar:[] };
      byRole[rid].kullaniciSayisi++;
      byRole[rid].kullanicilar.push(u.name || u.id);
    });
  });
  const items = Object.values(byRole).map(x => ({ rol:x.rol, kullaniciSayisi:x.kullaniciSayisi, kullanicilar:x.kullanicilar.join(', ') || '-' })).sort((a,b)=>b.kullaniciSayisi-a.kullaniciSayisi || String(a.rol).localeCompare(String(b.rol),'tr'));
  return { count: items.length, items };
}};

AI_TOOLS.gorevsizAmaTalebiOlanlar = { desc:'Açık görevi olmayan ama açık talebi bulunan kullanıcıları listeler.', risk:'safe', perm:'workflows_view', run: () => {

AI_TOOLS.hangiRolTalepAcmamis = { desc:'Hangi rolün kullanıcıları hiç talep açmamış analiz eder.', risk:'safe', perm:'admin_roles_view', run: () => {

// ---- Serbest sorgu aracı: YZ kendi sorgusunu yazar (SALT-OKUMA, güvenli) ----
// İzinli koleksiyonlar ve gerektirdikleri yetki. Buraya olmayan koleksiyon sorgulanamaz.
const QUERY_COLLECTIONS = {
  users:        { perm: 'admin_users_view', alanlar: ['id','name','email','roles','dahili','cep','manager','hireDate'] },
  instances:    { perm: 'workflows_view',   alanlar: ['id','defId','status','ownerId','currentStep','createdAt','data'] },
  tasks:        { perm: 'workflows_view',   alanlar: ['id','instanceId','title','status','assigneeId','createdAt'] },
  definitions:  { perm: 'workflows_view',   alanlar: ['id','name','active','description'] },
  roles:        { perm: 'admin_roles_view', alanlar: ['id','name','description'] },
  orders:       { perm: 'production_view',  alanlar: ['id','status','createdAt'] }
};

// Tek bir filtre koşulunu uygula. op: eq, ne, gt, gte, lt, lte, contains, in, exists
function applyQueryFilter(row, f) {
  const v = row ? row[f.field] : undefined;
  const t = f.value;
  switch ((f.op || 'eq')) {
    case 'eq':  return v === t;
    case 'ne':  return v !== t;
    case 'gt':  return v > t;
    case 'gte': return v >= t;
    case 'lt':  return v < t;
    case 'lte': return v <= t;
    case 'contains':
      if (Array.isArray(v)) return v.includes(t);
      return String(v ?? '').toLocaleLowerCase('tr-TR').includes(String(t).toLocaleLowerCase('tr-TR'));
    case 'in':  return Array.isArray(t) && t.includes(v);
    case 'exists': return (v !== undefined && v !== null && v !== '');
    default: throw new Error('Bilinmeyen operatör: ' + f.op);
  }
}

AI_TOOLS.sorgu = {
  desc: 'Sistemdeki bir tabloda (koleksiyon) salt-okuma sorgu çalıştırır. Parametre: koleksiyon (' + Object.keys(QUERY_COLLECTIONS).join('|') + '), filtreler (dizi: {field, op, value}; op=eq|ne|gt|gte|lt|lte|contains|in|exists), grupla (bir alana göre sayım yapar, ör. "roles" veya "status"), alanlar (döndürülecek alanlar), siralaAlan, siralaYon (asc|desc), limit. Yalnızca okuma yapar.',
  risk: 'safe',
  perm: null, // yetki koleksiyon bazında kontrol edilir
  run: ({ koleksiyon, filtreler = [], grupla = null, alanlar = null, siralaAlan = null, siralaYon = 'asc', limit = 100 }) => {
    const def = QUERY_COLLECTIONS[koleksiyon];
    if (!def) throw new Error('Sorgulanamayan/bilinmeyen tablo: ' + koleksiyon + '. İzinli tablolar: ' + Object.keys(QUERY_COLLECTIONS).join(', '));
    if (def.perm && !hasPermission(state.currentUser, def.perm)) throw new Error('Bu tabloyu görme yetkiniz yok: ' + koleksiyon);

    let rows = Array.isArray(state[koleksiyon]) ? state[koleksiyon].slice() : [];

    // Filtreler — yalnızca izinli alanlar üzerinde
    (filtreler || []).forEach(f => {
      if (!f || !f.field) return;
      if (!def.alanlar.includes(f.field)) throw new Error(`"${f.field}" alanı ${koleksiyon} için sorgulanamaz. İzinli alanlar: ${def.alanlar.join(', ')}`);
      rows = rows.filter(r => applyQueryFilter(r, f));
    });

    // --- GRUPLAMA / SAYIM: "en fazla hangi rolde kullanıcı var" gibi sorular için ---
    if (grupla) {
      if (!def.alanlar.includes(grupla)) throw new Error(`"${grupla}" alanına göre gruplanamaz. İzinli alanlar: ${def.alanlar.join(', ')}`);
      const sayac = {};
      rows.forEach(r => {
        let v = r[grupla];
        const ekle = (key) => { const k = (key === undefined || key === null || key === '') ? '(boş)' : String(key); sayac[k] = (sayac[k] || 0) + 1; };
        if (Array.isArray(v)) { if (v.length === 0) ekle(''); else v.forEach(ekle); } // roles gibi dizi alanlar
        else ekle(v);
      });
      // roles için id->ad çevirisi (okunabilirlik)
      const cevir = (key) => {
        if (koleksiyon === 'users' && grupla === 'roles') return (state.roles || []).find(x => x.id === key)?.name || key;
        if (grupla === 'defId') return getDef(key)?.name || key;
        if (grupla === 'ownerId' || grupla === 'assigneeId') return getUser(key)?.name || key;
        return key;
      };
      let gruplar = Object.entries(sayac).map(([k, n]) => ({ deger: cevir(k), sayi: n })).sort((a, b) => b.sayi - a.sayi);
      return { koleksiyon, gruplandi: grupla, toplamKayit: rows.length, enYuksek: gruplar[0] || null, gruplar };
    }

    // Sıralama
    if (siralaAlan && def.alanlar.includes(siralaAlan)) {
      rows.sort((a, b) => {
        const av = a[siralaAlan], bv = b[siralaAlan];
        if (av === bv) return 0;
        const cmp = av > bv ? 1 : -1;
        return siralaYon === 'desc' ? -cmp : cmp;
      });
    }

    const toplam = rows.length;
    const lim = Math.min(Math.max(1, limit || 100), 200);
    rows = rows.slice(0, lim);

    // Yalnızca izinli alanları döndür (alanlar verilmişse onları, yoksa hepsini izinli set içinden)
    const seclilAlanlar = (Array.isArray(alanlar) && alanlar.length ? alanlar : def.alanlar).filter(a => def.alanlar.includes(a));
    const items = rows.map(r => {
      const o = {};
      seclilAlanlar.forEach(a => { o[a] = r[a]; });
      return o;
    });
    return { koleksiyon, toplam, donen: items.length, alanlar: seclilAlanlar, items };
  }
};

// ===== GITHUB SORGU KATALOĞU =====
// Geliştiricinin (senin) hazırladığı sorgular GitHub'da bir JSON dosyasında tutulur.
// Uygulama açılışta bunları çeker ve kayıtlı sorgulara (salt-okuma) ekler.
// URL, AI ayarlarında saklanır: cfg.queryCatalogUrl
const QUERY_CATALOG_KEY = 'fabrika_query_catalog_url';

function getQueryCatalogUrl() {
  try { return localStorage.getItem(QUERY_CATALOG_KEY) || ''; } catch (_) { return ''; }
}
function setQueryCatalogUrl(url) {
  try { localStorage.setItem(QUERY_CATALOG_KEY, (url || '').trim()); } catch (_) {}
}

// GitHub raw URL'inden sorgu kataloğunu çek ve state.savedQueries'e (source:'github') ekle
async function loadQueryCatalogFromGitHub(showNotif = false) {
  const url = getQueryCatalogUrl();
  if (!url) { if (showNotif) notify('Önce GitHub katalog URL\'i ayarlayın', 'info'); return 0; }
  try {
    // Önbelleği atlamak için zaman damgası ekle
    const bust = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const res = await fetch(bust, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (Array.isArray(data.queries) ? data.queries : []);
    if (!list.length) { if (showNotif) notify('Katalogda sorgu bulunamadı', 'info'); return 0; }

    // Önceki github kaynaklı sorguları temizle, yenilerini ekle (Firestore'a YAZILMAZ; salt-okuma)
    state.savedQueries = (state.savedQueries || []).filter(q => q.source !== 'github');
    let n = 0;
    list.forEach(item => {
      if (!item || !item.name || !item.params || !item.params.koleksiyon) return;
      if (!QUERY_COLLECTIONS[item.params.koleksiyon]) return; // bilinmeyen tabloyu atla
      const id = 'gh_' + (typeof slugifyTR === 'function' ? slugifyTR(item.name) : item.name.toLowerCase()).replace(/-/g, '_').replace(/[^a-z0-9_]/g, '');
      state.savedQueries.push({
        id, name: item.name, aciklama: item.aciklama || item.description || '',
        params: item.params, source: 'github', createdAt: item.createdAt || Date.now()
      });
      n++;
    });
    if (showNotif) notify(`✓ ${n} sorgu GitHub kataloğundan yüklendi`, 'success');
    if (typeof renderAdminContent === 'function' && state.adminTab === 'saved-queries') renderAdminContent();
    return n;
  } catch (e) {
    console.warn('[loadQueryCatalogFromGitHub]', e.message);
    if (showNotif) notify('Katalog yüklenemedi: ' + e.message, 'error');
    return 0;
  }
}
window.loadQueryCatalogFromGitHub = loadQueryCatalogFromGitHub;

// YZ bir komutu işleyemediğinde buraya kaydedilir; yönetici dışa aktarıp geliştiriciye verir.
let _lastLoggedUnanswered = ''; // aynı metni üst üste loglamayı önle
async function logUnansweredCommand(userText, reason) {
  try {
    const text = (userText || '').trim();
    if (!text || text.length < 2) return;
    // Yardım/selamlama gibi kasıtlı boş dönüşleri loglama
    if (/^(yard[ıi]m|selam|merhaba|te[şs]ekk[üu]r|sa[ğg] ?ol|tamam|evet|hay[ıi]r)$/i.test(text)) return;
    if (text === _lastLoggedUnanswered) return;
    _lastLoggedUnanswered = text;
    const rec = {
      id: 'lq_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      text,
      reason: reason || 'eşleşmedi',
      user: state.currentUser || '?',
      model: (typeof aiActiveModelLabel === 'function') ? aiActiveModelLabel() : '',
      at: Date.now(),
      status: 'open'  // open | resolved
    };
    if (!Array.isArray(state.aiLearningQueue)) state.aiLearningQueue = [];
    // Aynı metin zaten açık kayıttaysa tekrar ekleme (gürültüyü azalt)
    if (state.aiLearningQueue.some(q => q.status === 'open' && String(q.text).toLocaleLowerCase('tr-TR') === text.toLocaleLowerCase('tr-TR'))) return;
    state.aiLearningQueue.push(rec);
    if (window.fb && window.fb.db) {
      const payload = typeof sanitize === 'function' ? sanitize(rec) : rec;
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'aiLearningQueue', rec.id), payload);
    }
  } catch (e) {
    console.warn('[logUnansweredCommand]', e.message);
  }
}

// ===== KAYITLI SORGULAR (ortak; yetkili yazar, herkes çalıştırır) =====
const SAVED_QUERY_EDIT_PERM = 'admin_processes_edit'; // kaydetme/silme yetkisi

function slugQueryId(name) {
  const base = (typeof slugifyTR === 'function' ? slugifyTR(name) : String(name).toLowerCase()).replace(/-/g, '_').replace(/[^a-z0-9_]/g, '') || 'sorgu';
  let id = base, n = 1;
  const mevcut = new Set((state.savedQueries || []).map(q => q.id));
  while (mevcut.has(id)) { id = base + '_' + (++n); }
  return id;
}

// Kayıtlı sorguyu Firestore'a yaz (ortak koleksiyon)
async function persistSavedQuery(q) {
  if (window.fb && window.fb.db) {
    const payload = typeof sanitize === 'function' ? sanitize(q) : q;
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'savedQueries', q.id), payload);
  }
}

// Yeni kayıtlı sorgu oluştur (params = sorgu aracının parametreleri)
async function saveNamedQuery(name, params, aciklama = '') {
  if (!hasPermission(state.currentUser, SAVED_QUERY_EDIT_PERM)) throw new Error('Sorgu kaydetme yetkiniz yok');
  if (!name || !name.trim()) throw new Error('Sorguya bir isim verin');
  if (!params || !params.koleksiyon) throw new Error('Geçersiz sorgu: koleksiyon belirtilmemiş');
  if (!QUERY_COLLECTIONS[params.koleksiyon]) throw new Error('Bilinmeyen tablo: ' + params.koleksiyon);
  const q = {
    id: slugQueryId(name),
    name: name.trim(),
    aciklama: (aciklama || '').trim(),
    params,
    createdBy: state.currentUser,
    createdAt: Date.now()
  };
  if (!Array.isArray(state.savedQueries)) state.savedQueries = [];
  state.savedQueries.push(q);
  await persistSavedQuery(q);
  return q;
}

async function deleteNamedQuery(id) {
  if (!hasPermission(state.currentUser, SAVED_QUERY_EDIT_PERM)) throw new Error('Sorgu silme yetkiniz yok');
  const idx = (state.savedQueries || []).findIndex(q => q.id === id);
  if (idx < 0) throw new Error('Sorgu bulunamadı: ' + id);
  state.savedQueries.splice(idx, 1);
  if (window.fb && window.fb.db) {
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'savedQueries', id));
  }
}

// Kayıtlı sorguyu isim veya id ile bul
function findSavedQuery(nameOrId) {
  const t = String(nameOrId || '').toLocaleLowerCase('tr-TR').trim();
  if (!t) return null;
  return (state.savedQueries || []).find(q =>
    q.id === t || String(q.name).toLocaleLowerCase('tr-TR') === t || String(q.name).toLocaleLowerCase('tr-TR').includes(t)
  ) || null;
}

// Bir aracı yetki + onay mantığıyla çalıştır
async function runAITool(name, params) {
  const tool = AI_TOOLS[name];
  if (!tool) throw new Error('Bilinmeyen araç: ' + name);
  // Yetki kontrolü (her zaman kodda)
  if (tool.perm && !hasPermission(state.currentUser, tool.perm)) {
    throw new Error('Bu işlem için yetkiniz yok: ' + name);
  }
  // Geri dönülmez işlemler: onay iste
  if (tool.risk === 'confirm') {
    const ozet = tool.summarize ? tool.summarize(params || {}) : (name + ' çalıştırılacak.');
    const ok = confirm('⚠️ Onay gerekiyor:\n\n' + ozet + '\n\nDevam edilsin mi?');
    if (!ok) return { iptal: true, mesaj: 'Kullanıcı onaylamadı, işlem yapılmadı.' };
  }
  return await tool.run(params || {});
}

// Modelin verdiği yakın/yanlış araç adını gerçek araca çevir (emniyet katmanı)
function resolveToolAlias(name) {

  const ALIASES = {
    createuser: 'kullaniciOlusturmaEkraniAc', adduser: 'kullaniciOlusturmaEkraniAc',
    newuser: 'kullaniciOlusturmaEkraniAc', kullaniciolustur: 'kullaniciOlusturmaEkraniAc',
    kullaniciekle: 'kullaniciOlusturmaEkraniAc', personelekle: 'kullaniciOlusturmaEkraniAc',
    createrole: 'rolOlustur', addrole: 'rolOlustur', newrole: 'rolOlustur', rolekle: 'rolOlustur',
    listusers: 'listeKullanicilar', getusers: 'listeKullanicilar', users: 'listeKullanicilar',
    listrequests: 'listeTalepler', listtasks: 'listeTalepler', requests: 'listeTalepler',
    listprocesses: 'listeSurecler', processes: 'listeSurecler', forms: 'listeSurecler',
    summary: 'ozet', overview: 'ozet', dashboard: 'ozet',
    overdue: 'gecikenTalepler', laterequests: 'gecikenTalepler', delayed: 'gecikenTalepler',
    sendreminder: 'hatirlatmaGonder', remind: 'hatirlatmaGonder',
    bulkreminder: 'topluHatirlatma', sendreminders: 'topluHatirlatma',
    userdetail: 'kullaniciDetay', getuser: 'kullaniciDetay',
    requestdetail: 'talepDetay', taskdetail: 'talepDetay',
    usertasks: 'kisininGorevleri', persontasks: 'kisininGorevleri',
    busiest: 'enYukluKisiler', topworkload: 'enYukluKisiler',
    onleave: 'izinliler', absent: 'izinliler',
    analyze: 'analizYap', bottleneck: 'surecTikaniklikAnalizi', analysis: 'analizYap',
    unusedroles: 'kullanilmayanRoller', userswithouttasks: 'gorevsizKullanicilar', userswithoutrequests: 'talepAcmayanKullanicilar',
    workload: 'enYukluKisilerDetayli', capacity: 'bosKapasiteAnalizi', distribute: 'isDagitimOnerisi', sla: 'slaAsanlar',
    thisweek: 'buHaftaAcilanlar', thismonth: 'buAyAcilanlar', today: 'bugunAcilanlar'
  };
  if (ALIASES[n]) return ALIASES[n];
  // Tam ada büyük/küçük harf duyarsız eşleşme (model sadece harf farkı yaptıysa)

// Direktifi AI'a gönder, hangi aracı çağıracağını JSON olarak iste
async function interpretCommand(userText) {
  const cfg = (typeof getAISettings === 'function') ? getAISettings() : { provider: 'local' };
  const sys = getEffectiveAIPrompt('command', buildSystemPrompt('command'));

  // Yardım/yönlendirme niyeti: sağlayıcı açık olsa bile LLM'e gitmeden doğrudan
  // komut listesini göster. ("nasıl komut girerim", "ne yapabilirsin" vb.)
  const sLow = (userText || '').toLocaleLowerCase('tr-TR');
  if (/yard[ıi]m|ne yapabil|neler yapabil|nas[ıi]l komut|komut.*(listesi|göster|gir|ver|yaz|kullan)|hangi komut|komutlar.*(ne|var|liste|göster)|nas[ıi]l kullan|ne.*söyleyebil|örnek.*(komut|kullan)|seni nas[ıi]l|sana nas[ıi]l|yönlendir/.test(sLow)) {
    return { tool: null, isHelp: true, explain: (typeof aiHelpText === 'function' ? aiHelpText() : 'Komut listesi alınamadı.') };
  }

  // Önce yerel komut motorunu dene.
  // Basit/raporlanabilir fabrika soruları (açık talepler, tıkanan süreçler,
  // en yüklü kişiler vb.) Gemini/OpenAI/Groq çağrısı gerektirmez.
  // Böylece dış AI 503 verse bile günlük sorgular çalışmaya devam eder.
  const localPlan = localInterpret(userText);
  if (localPlan && (localPlan.tool || localPlan.isHelp)) return localPlan;

  if (cfg.provider === 'local') {
    // AI kapalıysa sadece yerel sonuç dön.
    return localPlan;
  }

  let plan;
  try {
    // Komut yorumlama, form üretiminden FARKLI bir iştir: küçük JSON ({tool,params,explain})
    // döndürür. Bu yüzden ayrı, hafif bir JSON çağrısı kullanıyoruz.
    plan = await aiInterpretCall(sys, userText, cfg);
  } catch (e) {
    // LLM başarısız olursa yerel motora düş — kullanıcı tamamen takılı kalmasın
    console.warn('[interpretCommand] LLM hatası, yerel motora düşülüyor:', e.message);
    const fallback = localInterpret(userText);
    if (fallback && fallback.tool) {
      fallback.explain = (fallback.explain || '') + ' (AI erişilemedi, yerel motor kullanıldı.)';
      return fallback;
    }
    throw e;
  }

  // --- Dönen planı doğrula: model var olmayan/yanlış bir araç adı uydurabilir ---
  if (!plan || typeof plan !== 'object') {
    return localInterpret(userText);
  }
  if (plan.tool === null || plan.tool === undefined || plan.tool === '' || plan.tool === 'null') {
    return { tool: null, explain: plan.explain || 'Bu komutu bir işleme bağlayamadım.' };
  }
  if (!AI_TOOLS[plan.tool]) {
    // Model yakın ama yanlış bir ad verdiyse (İngilizce/uydurma): takma ad tablosuyla çözmeyi dene
    const alias = resolveToolAlias(plan.tool);
    if (alias && AI_TOOLS[alias]) {
      plan.tool = alias;
    } else {
      // Yereli dene, o da bulamazsa kullanıcıya açıkla
      const fallback = localInterpret(userText);
      if (fallback && fallback.tool) return fallback;
      const mevcut = Object.keys(AI_TOOLS).join(', ');
      return { tool: null, explain: `Komutu tanımlı bir araca eşleyemedim (model "${plan.tool}" önerdi). Kullanılabilir işlemler: ${mevcut}` };
    }
  }
  plan.params = (plan.params && typeof plan.params === 'object') ? plan.params : {};
  plan.explain = plan.explain || ('Çalıştırılıyor: ' + plan.tool);
  return plan;
}

// Komut yorumlama için ayrılmış hafif JSON çağrısı.
// buildProcessWithExternalAI form şeması üretmek içindir; burada küçük bir
// {tool,params,explain} nesnesi istiyoruz, bu yüzden düşük token ve JSON modu kullanıyoruz.
async function aiInterpretCall(sys, userText, cfg) {
  cfg = cfg || getAISettings();
  const provider = cfg.provider;
  const key = cfg.keys?.[provider];
  let model = cfg.models?.[provider] || (typeof AI_PROVIDERS !== 'undefined' ? AI_PROVIDERS[provider]?.model : '') || '';
  if (typeof GROQ_MODEL_REMAP !== 'undefined' && provider === 'groq' && GROQ_MODEL_REMAP[model]) model = GROQ_MODEL_REMAP[model];
  if (AI_PROVIDERS[provider]?.needsKey && !key) throw new Error('API anahtarı girilmedi');

  let text = '';
  if (provider === 'openai' || provider === 'groq') {
    const url = provider === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: model || (provider === 'groq' ? 'llama-3.3-70b-versatile' : 'gpt-4o-mini'),
        temperature: 0.1, max_tokens: 800, response_format: { type: 'json_object' },
        messages: [{ role: 'system', content: sys }, { role: 'user', content: userText }]
      })
    });
    if (!res.ok) { const b = await res.text().catch(() => ''); throw new Error(provider + ' hata: ' + res.status + (b ? ' - ' + b.slice(0, 200) : '')); }
    const d = await res.json();
    text = d.choices?.[0]?.message?.content || '';
  } else if (provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: model || 'claude-3-5-haiku-latest', max_tokens: 800, temperature: 0.1, system: sys, messages: [{ role: 'user', content: userText }] })
    });
    if (!res.ok) { const b = await res.text().catch(() => ''); throw new Error('Claude hata: ' + res.status + (b ? ' - ' + b.slice(0, 200) : '')); }
    const d = await res.json();
    text = d.content?.map(x => x.text || '').join('') || '';
  } else if (provider === 'gemini') {
    const u = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(remapGeminiModel(model) || 'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sys + '\n\nKullanıcı direktifi:\n' + userText }] }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json' } }) });
    if (!res.ok) throw new Error('Gemini hata: ' + res.status);
    const d = await res.json();
    text = d.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  } else if (provider === 'custom') {
    if (!cfg.customUrl) throw new Error('Özel API URL girilmedi');
    const res = await fetch(cfg.customUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify({ prompt: userText, system: sys, model }) });
    if (!res.ok) throw new Error('Özel API hata: ' + res.status);
    const d = await res.json();
    if (d && typeof d === 'object' && (d.tool !== undefined)) return d;
    text = d.text || d.content || JSON.stringify(d);
  } else {
    throw new Error('Bu sağlayıcı komut yorumlamayı desteklemiyor');
  }
  return parseAIJSON(text);
}

// AI olmadan da çalışan basit yerel yorumlayıcı (yedek)
