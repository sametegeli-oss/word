// ============== 2) KALICILIK (FIRESTORE) ==============
// localStorage tamamen kaldırıldı - tüm veri Firestore'da

// Debounce timer
let _persistTimer = null;
let _persistInProgress = false;

// persist() çağrıldığında 500ms debounce ile Firestore'a yazar
function persist() {
  if (_persistTimer) clearTimeout(_persistTimer);
  _persistTimer = setTimeout(() => persistNow(), 500);
}

// Her koleksiyonun son yazılan hash'ini tut - sadece değişeni Firestore'a yaz
let _lastPersistedHashes = {
  definitions: null,
  instances: null,
  tasks: null,
  orders: null,
  notifications: null,
  comments: null,
  roles: null,
  meta: null
};

// Append-only koleksiyonlarda (comments, notifications) zaten yazılmış doc ID'leri.
// Firestore kuralı bu koleksiyonlarda update'i kısıtlar; mevcut dökümanları yeniden
// set etmek yerine SADECE yeni ID'leri yazarız.
let _persistedCommentIds = new Set();
let _persistedNotifIds = new Set();

// Basit hash: koleksiyondaki tüm id'lerin ve son güncellemenin md5 benzeri özeti
function hashCollection(items) {
  if (!items || items.length === 0) return 'empty';
  // Her kaydın id + size kombinasyonu
  return items.map(it => {
    if (!it) return '';
    const id = String(it.id || '');
    const json = JSON.stringify(it);
    return id + ':' + json.length + ':' + (json.charCodeAt(0) || 0) + (json.charCodeAt(json.length-1) || 0);
  }).sort().join('|') + ':' + items.length;
}

// Asıl yazma işlemi - SADECE değişen koleksiyonları yazar
async function persistNow() {
  if (_persistInProgress) {
    setTimeout(persistNow, 200);
    return;
  }
  if (!window.fb || !window.fb.auth.currentUser) {
    console.warn('[Firestore] Auth yok, yazılamadı');
    return;
  }

  _persistInProgress = true;
  const db = window.fb.db;

  try {
    const collections = {
      definitions: state.definitions || [],
      instances: state.instances || [],
      tasks: state.tasks || [],
      orders: state.orders || [],
      notifications: state.notifications || [],
      comments: state.comments || [],
      roles: state.roles || []
    };

    // 1) Her koleksiyon için: hash değişti mi?
    const changedCollections = {};
    for (const [colName, items] of Object.entries(collections)) {
      const hash = hashCollection(items);
      if (_lastPersistedHashes[colName] !== hash) {
        changedCollections[colName] = items;
        _lastPersistedHashes[colName] = hash;
      }
    }

    // 2) Meta için hash
    const metaPayload = {
      history: state.history || [],
      productionLog: state.productionLog || [],
      stationAssignments: state.stationAssignments || [],
      roleVersion: state.roleVersion || 0
    };
    const metaHash = hashCollection(metaPayload.history) + '|' + hashCollection(metaPayload.productionLog);

    if (Object.keys(changedCollections).length === 0 && _lastPersistedHashes.meta === metaHash) {
      // Hiçbir şey değişmedi
      _persistInProgress = false;
      return;
    }

    // 3) Değişen koleksiyonları yaz (ayrı ayrı, batch yerine)
    // Her koleksiyon için yazma denenir; biri fail olursa diğerleri etkilenmez
    let writeCount = 0;
    let failedCollections = [];

    for (const [colName, items] of Object.entries(changedCollections)) {
      try {
        const batch = window.fb.writeBatch(db);
        let count = 0;
        // Append-only koleksiyonlar: sadece daha önce yazılmamış yeni dökümanları yaz.
        // (Firestore kuralı bunlarda update'i kısıtlar; mevcutları set etmek reddedilir.)
        const isAppendOnly = (colName === 'comments' || colName === 'notifications');
        const seenSet = colName === 'comments' ? _persistedCommentIds
                      : colName === 'notifications' ? _persistedNotifIds : null;
        const newlyWritten = [];
        for (const item of items) {
          if (!item || !item.id) continue;
          if (isAppendOnly && seenSet && seenSet.has(String(item.id))) continue; // zaten yazıldı
          batch.set(window.fb.doc(db, colName, String(item.id)), sanitize(item));
          newlyWritten.push(String(item.id));
          count++;
          if (count >= 450) break;  // Batch limit
        }
        if (count > 0) {
          await batch.commit();
          writeCount += count;
          // Append-only ID'leri başarıyla yazıldı olarak işaretle
          if (seenSet) newlyWritten.forEach(id => seenSet.add(id));
        }
      } catch (e) {
        // Bu koleksiyon yazılamadı (büyük olasılıkla yetki yok)
        // Hash'i geri al ki bir sonraki seferinde tekrar denenebilsin
        _lastPersistedHashes[colName] = null;
        failedCollections.push({ name: colName, error: e.message || e.code });
        console.warn(`[Firestore] ${colName} yazılamadı (yetki yok olabilir):`, e.code || e.message);
      }
    }

    // 4) Meta verileri ayrı yaz
    if (_lastPersistedHashes.meta !== metaHash) {
      try {
        await window.fb.setDoc(window.fb.doc(db, 'meta', 'main'), metaPayload);
        _lastPersistedHashes.meta = metaHash;
      } catch (e) {
        _lastPersistedHashes.meta = null;
        failedCollections.push({ name: 'meta', error: e.message });
        console.warn('[Firestore] meta yazılamadı:', e.code || e.message);
      }
    }

    if (writeCount > 0) {
      console.log(`[Firestore] Persisted: ${writeCount} kayıt (${Object.keys(changedCollections).join(', ')})`);
    }

    // Sadece tüm yazımlar fail olduysa kullanıcıya bildir
    if (failedCollections.length > 0 && writeCount === 0) {
      console.error('[Firestore] Tüm yazımlar fail:', failedCollections);
      if (typeof notify === 'function') {
        notify('Veri kaydedilemedi: yetki sorunu', 'error');
      }
    }
  } catch (e) {
    console.error('[Firestore] Beklenmedik hata:', e);
    if (typeof notify === 'function') notify('Veri kaydedilemedi: ' + (e.message || e.code), 'error');
  } finally {
    _persistInProgress = false;
  }
}

// Firestore yazımı için undefined alanları temizle
function sanitize(obj) {
  if (obj === undefined || obj === null) return null;
  if (typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(sanitize).filter(x => x !== undefined);
  const out = {};
  for (const k in obj) {
    if (obj[k] !== undefined) out[k] = sanitize(obj[k]);
  }
  return out;
}

// Built-in rollerin yetkilerini güncel koda eşitler. Tek seferlik, SADECE admin çalıştırır
// (roles + meta yazma yetkisi gerekir). Özel rollere ve isim/ikon/renk alanlarına DOKUNMAZ.
const ROLE_PERM_VERSION = 2;
async function runRoleMigrationIfAdmin() {
  if (!window.fb || !window.fb.db) return;
  const u = getUser(state.currentUser);
  if (!u || !u.roles || !u.roles.includes('admin')) return; // sadece admin yazabilir
  if ((state.roleVersion || 0) >= ROLE_PERM_VERSION) return; // zaten güncel
  const db = window.fb.db;
  console.log(`[Firestore] Rol yetki migration: v${state.roleVersion||0} → v${ROLE_PERM_VERSION}`);
  const defaults = defaultRoles();
  let changed = 0;
  for (const def of defaults) {
    const existing = state.roles.find(r => r.id === def.id && r.isBuiltIn);
    if (existing) {
      existing.permissions = def.permissions; // sadece yetkileri yenile
      try {
        await window.fb.setDoc(window.fb.doc(db, 'roles', existing.id), sanitize(existing));
        changed++;
      } catch (e) { console.warn(`[Firestore] ${existing.id} rolü güncellenemedi:`, e.code || e.message); }
    }
  }
  state.roleVersion = ROLE_PERM_VERSION;
  try {
    await window.fb.setDoc(window.fb.doc(db, 'meta', 'main'), { roleVersion: ROLE_PERM_VERSION }, { merge: true });
  } catch (e) { console.warn('[Firestore] roleVersion yazılamadı:', e.code || e.message); }
  console.log(`[Firestore] ${changed} built-in rol yetkileri güncellendi`);
}

    ]);

    // Users — Firebase'den gelen email tabanlı ID (örn: 'fatma') ile eşle
    state.users = usersSnap.docs.map(d => {
      const data = d.data();
      // Eğer 'email' alanı yoksa, ID olarak Firebase UID kullanılır

      let shortId;
      if (data.email) {
        shortId = data.email.split('@')[0].toLowerCase();
      } else {
        shortId = d.id;  // Fallback: Firebase UID
        console.warn('[Firestore] Kullanıcının email alanı yok:', d.id);
      }
      return { id: shortId, firebaseUid: d.id, ...data };
    });
    console.log('[Firestore] Yüklenen kullanıcılar:', state.users.map(u => `${u.id}(${u.roles?.join(',')})`).join(', '));

    state.definitions = defsSnap.docs.map(d => d.data());
    state.instances = instSnap.docs.map(d => d.data());
    state.tasks = tasksSnap.docs.map(d => d.data());
    state.orders = ordersSnap.docs.map(d => d.data());
    state.notifications = notifsSnap.docs.map(d => d.data());
    state.comments = commentsSnap.docs.map(d => d.data());
    state.roles = rolesSnap.docs.map(d => d.data());

    // İlk açılış - roller boşsa varsayılan 5 rolü kur
    if (state.roles.length === 0) {
      console.log('[Firestore] Roller boş, varsayılan 5 rol yazılıyor');
      state.roles = defaultRoles();
      // Firestore'a yaz
      for (const r of state.roles) {
        await window.fb.setDoc(window.fb.doc(db, 'roles', r.id), sanitize(r));
      }
    }

    // ---- roleVersion'ı oku (migration giriş sonrası admin ile çalışır) ----
    state.roleVersion = (metaSnap.exists() && metaSnap.data().roleVersion) || 0;

    // Meta
    if (metaSnap.exists()) {
      const m = metaSnap.data();
      state.history = m.history || [];
      state.productionLog = m.productionLog || [];
      state.stationAssignments = m.stationAssignments || defaultStationAssignments();
    } else {
      state.history = [];
      state.productionLog = [];
      state.stationAssignments = defaultStationAssignments();
    }

    // İlk açılış - süreç tanımları boşsa varsayılan 10 şablonu kur
    if (state.definitions.length === 0) {
      console.log('[Firestore] Süreç tanımları boş, varsayılan 10 şablon yazılıyor');
      state.definitions = defaultDefinitions();
      await persistNow();
    }

    // Yüklenen veriyle persist hash'lerini eşitle: aksi halde ilk persist'te
    // tüm koleksiyonlar "değişti" sanılıp yeniden yazılır (manager definitions/roles
    // yazamaz, comments update kuralına takılır → permission-denied).
    _lastPersistedHashes.definitions = hashCollection(state.definitions);
    _lastPersistedHashes.instances = hashCollection(state.instances);
    _lastPersistedHashes.tasks = hashCollection(state.tasks);
    _lastPersistedHashes.orders = hashCollection(state.orders);
    _lastPersistedHashes.notifications = hashCollection(state.notifications);
    _lastPersistedHashes.comments = hashCollection(state.comments);
    _lastPersistedHashes.roles = hashCollection(state.roles);
    _lastPersistedHashes.meta = hashCollection(state.history) + '|' + hashCollection(state.productionLog);

    // Append-only koleksiyonların mevcut ID'lerini kaydet (yeniden yazılmasınlar)
    _persistedCommentIds = new Set((state.comments || []).map(c => String(c.id)));
    _persistedNotifIds = new Set((state.notifications || []).map(n => String(n.id)));

    console.log(`[Firestore] Yüklendi: ${state.users.length} kullanıcı, ${state.definitions.length} süreç, ${state.instances.length} talep, ${state.tasks.length} görev, ${state.orders.length} sipariş, ${state.notifications.length} bildirim, ${state.comments.length} yorum, ${state.roles.length} rol`);
  } catch (e) {
    console.error('[Firestore] Yükleme hatası:', e);
    if (typeof notify === 'function') notify('Veriler yüklenemedi: ' + e.message, 'error');
  }
}

function seedSampleData() {
  const original = state.currentUser;

  // İlk olarak: TÜM şablonları aktif tanım olarak ekle
  // (defaultDefinitions'da sadece 2 var: izin, bakım. Diğerlerini de etkinleştirelim.)
  const existingDefIds = new Set(state.definitions.map(d => d.id));
  PROCESS_TEMPLATES.forEach(tpl => {
    if (existingDefIds.has(tpl.templateId)) return;
    const newDef = JSON.parse(JSON.stringify(tpl.template));
    newDef.id = tpl.templateId;
    newDef.active = true;
    state.definitions.push(newDef);
  });

  // ============== YARDIMCI ÜRETİCİLER ==============
  // Seedde randomlu ama deterministik benzer veri için basit pseudo-random
  let _rngSeed = 42;
  function rng() { _rngSeed = (_rngSeed * 9301 + 49297) % 233280; return _rngSeed / 233280; }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function rngInt(min, max) { return Math.floor(rng() * (max - min + 1)) + min; }

  // Belirli sayıda gün öncesi YYYY-MM-DD
  function dateBack(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  }
  function dateFwd(days) { return dateOffset(days); }

  const WORKERS = ['ahmet', 'veli', 'hasan', 'ayse'];
  const ALL_USERS = ['ahmet', 'veli', 'hasan', 'ayse', 'mehmet', 'fatma'];

  // Bir talep yaratıp belirli sayıda gün öncesinde başlatılmış gibi göster + adımları çalıştır
  // outcomes: ['approve', 'approve'] gibi - sırayla insan adımları için kararlar
  // 'reject' geldiğinde zincir kırılır (red sonu, kalan onaylar yapılmaz)
  // daysAgo: bu talep kaç gün önce başladı
  function seedRequest(defId, ownerId, formData, daysAgo, outcomes, taskOffsetHoursEach) {
    state.currentUser = ownerId;
    try {
      startProcess(defId, ownerId, formData, true);
    } catch(e) {
      return null;
    }
    const inst = state.instances[state.instances.length - 1];
    // Geriye al
    const createdAtBack = Date.now() - daysAgo * 24 * 3600 * 1000;
    inst.createdAt = createdAtBack;
    inst.updatedAt = createdAtBack;
    // İlk task'ın createdAt'ini de geri al
    let openTask = state.tasks.find(t => t.instanceId === inst.id && t.status === 'open');
    if (openTask) openTask.createdAt = createdAtBack;

    // History kayıtlarını geri al (sadece bu talebe ait olanlar)
    state.history.filter(h => h.instanceId === inst.id).forEach(h => { h.at = createdAtBack; });

    // Outcomes uygula
    let elapsed = 0;
    for (const outcome of outcomes) {
      const t = state.tasks.find(tk => tk.instanceId === inst.id && tk.status === 'open');
      if (!t) break;
      // Bu görev belli süre sonra cevaplanmış gibi
      const hoursToRespond = taskOffsetHoursEach || (rngInt(2, 30));
      elapsed += hoursToRespond;
      const closedAt = createdAtBack + elapsed * 3600 * 1000;
      // O an kullanıcı olarak görevi atayanı geç
      state.currentUser = t.assignee;
      completeTask(t.id, outcome, '', true);
      // Yeni kapatılan task'ın closedAt'ini ayarla
      t.closedAt = closedAt;
      // History kayıtları da güncellensin
      const newHist = state.history.filter(h => h.instanceId === inst.id && h.at > closedAt);
      newHist.forEach(h => { h.at = closedAt; });
      if (outcome === 'reject') break;
    }
    // Son updatedAt'i son işleme yansıt
    if (inst.status !== 'running') {
      inst.updatedAt = createdAtBack + elapsed * 3600 * 1000;
    }

    // Eğer talep hala bekliyorsa, açık task'ın createdAt'ini doğru zamana getir
    openTask = state.tasks.find(t => t.instanceId === inst.id && t.status === 'open');

function uid(prefix) { return prefix + '-' + Math.random().toString(36).substr(2, 6).toUpperCase(); }

function getDef(id) { return state.definitions.find(d => d.id === id); }
function getUser(id) { return state.users.find(u => u.id === id); }

function getSeniorityYears(user) {
  if (!user.hireDate) return 0;
  return (Date.now() - new Date(user.hireDate)) / (365.25 * 24 * 3600 * 1000);
}

function startProcess(defId, ownerId, formData, silent=false) {
  const def = getDef(defId);
  if (!def) throw new Error('Süreç tanımı bulunamadı: ' + defId);
  if (!def.active) throw new Error('Süreç pasif: ' + defId);

  const instance = {
    id: uid('TR'),
    defId, ownerId,
    form: { ...formData },
    state: def.startStep,
    status: 'running',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    triggeredReminders: []  // Tetiklenmiş hatırlatma id'leri: "fieldId:reminderId"
  };
  state.instances.push(instance);
  recordHistory(instance.id, 'system', `${getUser(ownerId).name} ${def.name} talebi açtı`);

  advance(instance.id);

  if (!silent) { persist(); }
  return instance;
}

function advance(instanceId) {
  const inst = state.instances.find(i => i.id === instanceId);
  if (!inst || inst.status !== 'running') return;
  const def = getDef(inst.defId);

  for (let i = 0; i < 50; i++) {
    const stepKey = inst.state;
    const step = def.steps.find(s => s.id === stepKey);
    if (!step) { console.warn('Adım yok:', stepKey); return; }

    if (step.type === 'end-good' || step.type === 'end-bad') {
      inst.status = step.type === 'end-good' ? 'completed' : 'rejected';
      inst.updatedAt = Date.now();
      recordHistory(inst.id, step.type === 'end-good' ? 'approve' : 'reject',
        step.message || step.title);
      pushNotif(inst.ownerId, `${def.icon} ${def.name} (${inst.id}) — ${step.message || step.title}`, inst.id);
      return;
    }

    if (step.type === 'system') {
      const result = evalRule(step.rule, inst);
      const detail = describeRule(step.rule, inst);
      const passLabel = result ? 'pass' : 'fail';
      recordHistory(inst.id, 'system', `${step.title}: ${detail} → ${result ? 'GEÇTİ' : 'KALDI'}`);
      const trans = def.transitions.find(t => t.from === stepKey && t.when === passLabel);
      if (!trans) { console.warn('Geçiş yok:', stepKey, passLabel); return; }
      inst.state = trans.to;
      inst.updatedAt = Date.now();
      continue;
    }

    // Aktif izleme adımı: görev/onay oluşturmaz, instance 'running' kalır.
    // Hatırlatıcılar (Takip Kaydı, Araç Kaydı) için: onay beklemeden aktif izlemede durur.
    if (step.type === 'monitor') {
      recordHistory(inst.id, 'system', step.message || step.title || 'Aktif izlemede — tarihler takip ediliyor');
      pushNotif(inst.ownerId, `${def.icon} ${def.name} (${inst.id}) — ${step.message || 'tarihler izleniyor'}`, inst.id);
      // running durumunda kal, dur (görev yok)
      inst.updatedAt = Date.now();
      return;
    }

    if (step.type === 'human') {
      const resolved = resolveAssignee(step.assign, inst, step);
      if (!resolved || !resolved.userId) {
        recordHistory(inst.id, 'system', `Görev atanamadı: ${step.title} — kullanıcı bulunamadı`);
        return;
      }
      const assignee = resolved.userId;
      const chain = resolved.chain || [];
      const isDelegated = chain.length > 0;
      // Asıl atanması gereken kişi (zincir varsa zincirin başı, yoksa direkt assignee)
      const originalAssignee = isDelegated ? chain[0].userId : assignee;

      const task = {
        id: uid('GR'),
        instanceId: inst.id,
        stepKey, stepTitle: step.title,
        assignee,
        originalAssignee,
        delegationChain: chain.map(c => ({ userId: c.userId, reason: c.absence?.reason || 'İzinde' })),
        status: 'open',
        createdAt: Date.now()
      };
      state.tasks.push(task);

      if (isDelegated) {
        const origName = getUser(originalAssignee)?.name;
        const reason = chain[0].absence?.reason || 'izinde';
        recordHistory(inst.id, 'system',
          `Görev oluşturuldu: ${step.title} → ${getUser(assignee).name} (🔁 ${origName} ${reason.toLowerCase()})`);
        pushNotif(assignee, `🔁 ${origName} izinli olduğu için: ${def.icon} ${def.name} (${inst.id}) sizden onay bekliyor`, inst.id);
      } else {
        recordHistory(inst.id, 'system', `Görev oluşturuldu: ${step.title} → ${getUser(assignee).name}`);
        pushNotif(assignee, `${def.icon} ${def.name} (${inst.id}) onayınızı bekliyor`, inst.id);
      }

      // onStart eylemlerini tetikle (adım atandığında)
      if (step.actions?.onStart?.length > 0) {
        const ctx = buildActionContext(inst, def, assignee);
        executeActions(step.actions.onStart, ctx, 'onStart');
      }

      inst.updatedAt = Date.now();
      return;
    }
  }
}

// Bir kullanıcının verilen tarihte izinde olup olmadığını kontrol et
// Eğer izindeyse, aktif izin objesini döndürür (vekili öğrenmek için), değilse null
function getActiveAbsence(userId, atTimestamp) {
  const user = getUser(userId);
  if (!user || !user.absences || user.absences.length === 0) return null;
  const today = (atTimestamp ? new Date(atTimestamp) : new Date()).toISOString().slice(0, 10);
  return user.absences.find(a => a.from <= today && today <= a.to) || null;
}

// Vekil zincirini takip ederek geçerli atayı bul.
// Eğer ana kişi izinde ise, vekiline → vekil de izinde ise, onun vekiline...
// Max 3 hop, döngü algılaması var. 
// Sonuç: { userId, chain: [{userId, absence}] } veya { userId, chain: [] }
function resolveDelegate(originalUserId) {
  const chain = [];
  let cur = originalUserId;
  const seen = new Set();
  for (let i = 0; i < 3; i++) {
    if (seen.has(cur)) break; // döngü
    seen.add(cur);
    const absence = getActiveAbsence(cur);
    if (!absence) {
      return { userId: cur, chain };
    }
    // İzinde ve vekil tanımlı değilse zincir kırılır
    if (!absence.delegateTo) {
      return { userId: cur, chain }; // izindeyse de o kişiye git, başka şansımız yok
    }
    chain.push({ userId: cur, absence });
    cur = absence.delegateTo;
  }
  // Zincir aşıldı
  return { userId: cur, chain };
}

function resolveAssignee(assign, inst, step) {
  if (!assign) return null;
  let primary = null;
  if (assign.mode === 'specific_user') primary = assign.userId;
  else if (assign.mode === 'requester_manager') {
    const owner = getUser(inst.ownerId);
    primary = owner && owner.manager ? owner.manager : null;
  }
  else if (assign.mode === 'role') {
    const u = state.users.find(u => u.roles.includes(assign.role));
    primary = u ? u.id : null;
  }
  if (!primary) return null;

  // Vekil yönlendirmesi açık mı? Varsayılan: açık.
  // Adım seviyesinde noDelegate=true ise atla.
  if (step && step.noDelegate) return { userId: primary, chain: [] };

  return resolveDelegate(primary);
}

function completeTask(taskId, action, comment, silent=false) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || task.status !== 'open') return;

  task.status = 'closed';
  task.action = action;
  task.comment = comment || '';
  task.closedAt = Date.now();
  task.closedBy = state.currentUser;

  const inst = state.instances.find(i => i.id === task.instanceId);
  const def = getDef(inst.defId);
  const step = def.steps.find(s => s.id === task.stepKey);

  recordHistory(inst.id,
    action === 'approve' ? 'approve' : 'reject',
    `${getUser(state.currentUser).name} — ${step.title}: ${action === 'approve' ? 'onayladı' : 'reddetti'}`,
    comment);

  // SLA kontrolü - eğer adımın hedef süresi varsa, aşıldı mı kontrol et
  if (step.slaHours && step.slaHours > 0) {
    const elapsedMs = (task.closedAt || Date.now()) - task.createdAt;
    const slaMs = step.slaHours * 3600 * 1000;
    if (elapsedMs > slaMs) {
      const overByMs = elapsedMs - slaMs;
      recordHistory(inst.id, 'system',
        `⏰ Hedef süre aşıldı: hedef ${step.slaHours}sa, gerçekleşen ${formatDuration(elapsedMs)} (${formatDuration(overByMs)} fazla)`);
    } else {
      recordHistory(inst.id, 'system',
        `⏱ Süresinde tamamlandı: ${formatDuration(elapsedMs)} / ${step.slaHours}sa`);
    }
  }

  // onComplete eylemlerini tetikle (adım kapandığında, advance'tan önce)
  if (step.actions?.onComplete?.length > 0) {
    const ctx = buildActionContext(inst, def, state.currentUser);
    ctx.actionTaken = action; // approve/reject bilgisi
    executeActions(step.actions.onComplete, ctx, 'onComplete');
  }

  const trans = def.transitions.find(t => t.from === task.stepKey && t.when === action);
  if (!trans) { console.warn('Geçiş yok'); return; }
  inst.state = trans.to;
  inst.updatedAt = Date.now();
  advance(inst.id);

  if (!silent) persist();
}

function recordHistory(instanceId, type, text, comment) {
  state.history.push({
    id: uid('H'), instanceId, type, text,
    comment: comment || '', at: Date.now(),
    actor: state.currentUser
  });
}

// ============== EYLEM (ACTION) MOTORU ==============
// Mock altyapı — Firebase migrasyonu sonrası gerçek API çağrılarına dönüşür

// Şablon değişkenlerini çöz: "Sayın {{user.name}}, {{form.startDate}}..." → gerçek değerler
function resolveTemplate(template, context) {
  if (!template) return '';
  return String(template).replace(/\{\{([^}]+)\}\}/g, (match, path) => {
    const key = path.trim();
    const val = resolveTemplateValue(key, context);
    return val !== undefined && val !== null ? String(val) : match;
  });
}

function resolveTemplateValue(path, ctx) {
  // ctx: { instance, def, owner, approver?, form }
  if (!path) return null;
  if (path === 'instance.id') return ctx.instance?.id;
  if (path === 'instance.createdAt') return formatDate(ctx.instance?.createdAt);
  if (path === 'process.name') return ctx.def?.name;
  if (path === 'process.icon') return ctx.def?.icon;
  if (path === 'user.name' || path === 'owner.name') return ctx.owner?.name;
  if (path === 'user.id'   || path === 'owner.id')   return ctx.owner?.id;
  if (path === 'approver.name') return ctx.approver?.name || '—';
  if (path === 'approver.id')   return ctx.approver?.id   || '—';
  if (path === 'today') return new Date().toLocaleDateString('tr-TR');
  if (path.startsWith('form.')) {
    const fname = path.slice(5);
    return ctx.instance?.form?.[fname];
  }
  return null;
}

// Alıcı tipini gerçek user'a çevir
function resolveRecipient(recipient, ctx) {
  if (!recipient || !recipient.type) return null;
  if (recipient.type === 'owner') return ctx.owner;
  if (recipient.type === 'approver') return ctx.approver;
  if (recipient.type === 'role') {
    return state.users.find(u => u.roles.includes(recipient.role));
  }
  if (recipient.type === 'specific') {
    return getUser(recipient.userId);
  }
  if (recipient.type === 'manager') {
    if (!ctx.owner?.manager) return null;
    return getUser(ctx.owner.manager);
  }
  return null;
}

// Bir adımın eylemlerini çalıştır - "onStart" veya "onComplete" tetikleyicisinde
function executeActions(actions, ctx, triggerName) {
  if (!Array.isArray(actions) || actions.length === 0) return;
  for (const action of actions) {
    try {
      executeAction(action, ctx, triggerName);
    } catch(e) {
      recordHistory(ctx.instance.id, 'system', `⚠ Eylem hatası (${action.type}): ${e.message}`);
    }
  }
}

function executeAction(action, ctx, triggerName) {
  const type = action.type;

  if (type === 'send_email') {
    const recip = resolveRecipient(action.recipient, ctx);
    const subject = resolveTemplate(action.subject || '', ctx);
    const body = resolveTemplate(action.body || '', ctx);
    if (!recip) {
      recordHistory(ctx.instance.id, 'system', `⚠ E-posta gönderilemedi: alıcı bulunamadı`);
      return;
    }
    const previewBody = body.length > 80 ? body.slice(0, 78) + '…' : body;
    recordHistory(ctx.instance.id, 'system',
      `📧 [Simülasyon] E-posta → ${recip.name}: "${subject}" — ${previewBody}`);
    // Alıcıya da uygulama içi bildirim düş
    pushNotif(recip.id, `📧 [Sim] E-posta: ${subject}`, ctx.instance.id);
    return;
  }

  if (type === 'send_sms') {
    const recip = resolveRecipient(action.recipient, ctx);
    const body = resolveTemplate(action.body || '', ctx);
    if (!recip) {
      recordHistory(ctx.instance.id, 'system', `⚠ SMS gönderilemedi: alıcı bulunamadı`);
      return;
    }
    recordHistory(ctx.instance.id, 'system',
      `📱 [Simülasyon] SMS → ${recip.name}: ${body.slice(0,100)}`);
    pushNotif(recip.id, `📱 [Sim] SMS: ${body.slice(0,60)}`, ctx.instance.id);
    return;
  }

  if (type === 'send_whatsapp') {
    const recip = resolveRecipient(action.recipient, ctx);
    const body = resolveTemplate(action.body || '', ctx);
    if (!recip) {
      recordHistory(ctx.instance.id, 'system', `⚠ WhatsApp gönderilemedi: alıcı bulunamadı`);
      return;
    }
    recordHistory(ctx.instance.id, 'system',
      `💬 [Simülasyon] WhatsApp → ${recip.name}: ${body.slice(0,100)}`);
    pushNotif(recip.id, `💬 [Sim] WhatsApp: ${body.slice(0,60)}`, ctx.instance.id);
    return;
  }

  if (type === 'generate_pdf') {
    const filename = resolveTemplate(action.filename || 'belge.pdf', ctx);
    const title = resolveTemplate(action.title || ctx.def.name, ctx);
    recordHistory(ctx.instance.id, 'system',
      `📄 [Simülasyon] PDF üretildi: "${filename}" (${title})`);
    return;
  }

  if (type === 'start_process') {
    const targetDefId = action.targetDefId;
    const targetDef = getDef(targetDefId);
    if (!targetDef) {
      recordHistory(ctx.instance.id, 'system', `⚠ Süreç tetiklenemedi: ${targetDefId} bulunamadı`);
      return;
    }
    // Tetiklenen sürecin form verisi: action.formMap ile eski formdan kopyala
    const newForm = {};
    if (action.formMap && typeof action.formMap === 'object') {
      for (const [targetField, sourceExpr] of Object.entries(action.formMap)) {
        newForm[targetField] = resolveTemplate(sourceExpr, ctx);
      }
    }
    // Tetikleyen sürecin sahibi, hedefin de sahibi olsun (basit demo)
    try {
      recordHistory(ctx.instance.id, 'system',
        `🔗 [Simülasyon] Bağlı süreç tetikleniyor: ${targetDef.name}`);
      startProcess(targetDefId, ctx.instance.ownerId, newForm, true);
    } catch(e) {
      recordHistory(ctx.instance.id, 'system', `⚠ Süreç tetiklenemedi: ${e.message}`);
    }
    return;
  }

  recordHistory(ctx.instance.id, 'system', `⚠ Bilinmeyen eylem türü: ${type}`);
}

function buildActionContext(instance, def, approverId) {
  return {
    instance,
    def,
    owner: getUser(instance.ownerId),
    approver: approverId ? getUser(approverId) : null,
    form: instance.form
  };
}

// ============== HATIRLATMA SCHEDULER ==============
// Her tarih alanı (type === 'date') şu yapıda hatırlatmalar tanımlayabilir:
// field.reminders = [{
//   id: 'r1',                                       // hatırlatma kimliği (benzersiz, alan içinde)
//   daysBefore: 7,                                  // kaç gün önce (0 = tarih geldiğinde, negatif = sonra)
//   actions: [{ type:'send_email', recipient:{type:'owner'}, subject:'...', body:'...' }, ...]
// }]
//
// instance.triggeredReminders dizisinde "fieldId:reminderId" formatında tutulur,
// bir hatırlatma sadece bir kez tetiklenir.

// Tüm açık talepleri tarayıp tetiklenmesi gereken hatırlatmaları çalıştır
function scanAndFireReminders() {
  const now = Date.now();
  let fired = 0;
  for (const inst of state.instances) {
    // Sadece çalışan veya tamamlanmış olanları kontrol et (red edilmişler atla)
    if (inst.status === 'rejected') continue;
    const def = getDef(inst.defId);
    if (!def) continue;
    if (!inst.triggeredReminders) inst.triggeredReminders = [];

    // Her tarih alanını gez
    for (const field of def.fields) {
      if (field.type !== 'date') continue;
      if (!Array.isArray(field.reminders) || field.reminders.length === 0) continue;

      const dateStr = inst.form[field.id];
      if (!dateStr) continue;
      const targetDate = new Date(dateStr);
      if (isNaN(targetDate.getTime())) continue;
      // Hedef tarihin günü (UTC dikkate alınmaz, yerel)
      const targetMs = targetDate.getTime();

      for (const r of field.reminders) {
        const reminderKey = `${field.id}:${r.id}`;
        if (inst.triggeredReminders.includes(reminderKey)) continue;
        // daysBefore sabit sayı olabilir VEYA "form.xxx" referansı (kullanıcının girdiği gün)
        let daysRaw = r.daysBefore;
        if (typeof daysRaw === 'string' && daysRaw.startsWith('form.')) {
          daysRaw = inst.form[daysRaw.slice(5)];
        }
        const daysBefore = parseFloat(daysRaw);
        if (isNaN(daysBefore)) continue; // gün girilmemişse bu hatırlatmayı atla
        // Hatırlatma tarihi: targetDate - daysBefore gün
        const reminderMs = targetMs - daysBefore * 24 * 3600 * 1000;
        if (now >= reminderMs) {
          // Tetikle
          try {
            const ctx = buildActionContext(inst, def, null);
            // Reminder bağlamına bilgileri ekle
            ctx.reminder = {
              fieldId: field.id,
              fieldLabel: field.label,
              targetDate: dateStr,
              daysBefore: daysBefore
            };
            // Hatırlatma kaydı geçmişe
            const daysLabel = daysBefore === 0 ? 'bugün' :
                              daysBefore > 0 ? `${daysBefore} gün öncesinden` :
                              `${Math.abs(daysBefore)} gün geçmiş`;
            recordHistory(inst.id, 'system',
              `⏰ Hatırlatma tetiklendi: ${field.label} (${dateStr}) — ${daysLabel}`);
            // Eylemleri çalıştır
            if (Array.isArray(r.actions)) {
              executeActions(r.actions, ctx, 'reminder');
            }
            inst.triggeredReminders.push(reminderKey);
            fired++;
          } catch(e) {
            console.error('Hatırlatma hatası:', e);
          }
        }
      }
    }
  }
  if (fired > 0) {
    persist();
  }
  return fired;
}

// Açık taleplerdeki bir tarih alanı için "ne kadar kaldı/geçti" bilgisi
// state: 'past' | 'today' | 'soon' (<=7g) | 'upcoming' (<=30g) | 'far' (>30g)
function getDateStatus(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr);
  if (isNaN(target.getTime())) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const targetDay = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  const diffDays = Math.round((targetDay - today) / (24 * 3600 * 1000));
  let state, color, label;
  if (diffDays < 0) {
    state = 'past'; color = 'var(--red)';
    label = `${Math.abs(diffDays)} gün geçti`;
  } else if (diffDays === 0) {
    state = 'today'; color = 'var(--red)';
    label = 'Bugün';
  } else if (diffDays <= 7) {
    state = 'soon'; color = 'var(--amber)';
    label = `${diffDays} gün kaldı`;
  } else if (diffDays <= 30) {
    state = 'upcoming'; color = 'var(--accent)';
    label = `${diffDays} gün kaldı`;
  } else {
    state = 'far'; color = 'var(--text-mute)';
    label = `${diffDays} gün kaldı`;
  }
  return { state, color, label, diffDays, targetDate: target };
}

// Tüm açık taleplerdeki tarih alanlarını topla (yaklaşan tarihler listesi için)
function getAllUpcomingDates() {
  const result = [];
  for (const inst of state.instances) {
    if (inst.status === 'rejected') continue;
    const def = getDef(inst.defId);
    if (!def) continue;
    for (const field of def.fields) {
      if (field.type !== 'date') continue;
      const dateStr = inst.form[field.id];
      if (!dateStr) continue;
      const status = getDateStatus(dateStr);
      if (!status) continue;
      result.push({
        instance: inst,
        def: def,
        field: field,
        dateStr: dateStr,
        ...status,
        hasReminders: Array.isArray(field.reminders) && field.reminders.length > 0
      });
    }
  }
  // Sırala: en yakın üstte (geçmiş tarihler en altta)
  result.sort((a, b) => a.diffDays - b.diffDays);
  return result;
}

// ============== TAKVİM MOTORU ==============
// Tüm kaynaklardan olayları toplar, normalize eder. UI buradan çeker.
//
// Bir takvim olayı:
// {
//   id, type, title, subtitle, date (start), endDate (opsiyonel - aralık için),
//   color, icon, userId, instanceId (varsa), category, allDay
// }
//
// Türler:
//   'absence'      - kullanıcı izin dönemi (aralık)
//   'date_alarm'   - form içindeki tarihli alan (vize, sigorta, vb.)
//   'task_open'    - bekleyen görev (SLA sonu)
//   'task_done'    - tamamlanmış görev
//   'instance_open' - açık talep (oluşturulduğu gün)
//   'instance_done' - tamamlanmış talep (kapatıldığı gün)
//   'order'        - üretim siparişi (oluşturulduğu gün)

const EVENT_TYPES = {
  absence:        { label:'İzin Dönemleri',  color:'#4ade80', icon:'🌴', defaultOn:true },
  date_alarm:     { label:'Tarih Alarmları', color:'#f87171', icon:'⏰', defaultOn:true },
  task_open:      { label:'Bekleyen Görevler', color:'#fbbf24', icon:'📋', defaultOn:true },
  task_done:      { label:'Tamamlanan Görevler', color:'#94a3b8', icon:'✓', defaultOn:false },
  instance_open:  { label:'Açık Talepler', color:'#4a9eff', icon:'📄', defaultOn:false },
  instance_done:  { label:'Tamamlanmış Talepler', color:'#a78bfa', icon:'✅', defaultOn:false },
  order:          { label:'Üretim Siparişleri', color:'#f97316', icon:'🏭', defaultOn:true }
};

// Verilen tarih aralığı (start-end) için tüm olayları topla
// Filtreler: { types: Set, scope: 'mine'|'team'|'all' }
function getCalendarEvents(rangeStart, rangeEnd, filters) {
  const events = [];
  const types = filters?.types || new Set(Object.keys(EVENT_TYPES));
  const scope = filters?.scope || 'all';
  const currentUserId = state.currentUser;
  const currentUser = getUser(currentUserId);

  function isInScope(userId) {
    if (scope === 'all') return true;
    if (scope === 'mine') return userId === currentUserId;
    if (scope === 'team') {
      if (userId === currentUserId) return true;
      // Aynı müdürün altındakiler veya bu kullanıcı müdürse onun ekibi
      const u = getUser(userId);
      if (!u) return false;
      if (u.manager === currentUserId) return true; // ekipte
      if (currentUser?.manager === u.manager && currentUser?.manager) return true; // aynı müdür
      return false;
    }
    return true;
  }

  function inRange(dateMs) {
    return dateMs >= rangeStart && dateMs <= rangeEnd;
  }
  function inRangeOverlap(startMs, endMs) {
    return endMs >= rangeStart && startMs <= rangeEnd;
  }

  // 1) İzin dönemleri (absences)
  if (types.has('absence')) {
    state.users.forEach(u => {
      if (!isInScope(u.id)) return;
      (u.absences || []).forEach(a => {
        if (!a.from || !a.to) return;
        const fromMs = new Date(a.from).getTime();
        const toMs = new Date(a.to).getTime();
        if (!inRangeOverlap(fromMs, toMs)) return;
        const delegateName = a.delegateTo ? getUser(a.delegateTo)?.name : null;
        events.push({
          id: `abs_${u.id}_${a.id || a.from}`,
          type: 'absence',
          title: `🌴 ${u.name}`,
          subtitle: a.reason || 'İzinli',
          date: fromMs,
          endDate: toMs,
          color: EVENT_TYPES.absence.color,
          icon: EVENT_TYPES.absence.icon,
          userId: u.id,
          allDay: true,
          extra: { reason: a.reason, delegate: delegateName, absence: a }
        });
      });
    });
  }

  // 2) Form tarih alarmları
  if (types.has('date_alarm')) {
    state.instances.forEach(inst => {
      if (inst.status === 'rejected') return;
      if (!isInScope(inst.ownerId)) return;
      const def = getDef(inst.defId);
      if (!def) return;
      def.fields.forEach(field => {
        if (field.type !== 'date') return;
        const val = inst.form[field.id];
        if (!val) return;
        const ms = new Date(val).getTime();
        if (isNaN(ms)) return;
        if (!inRange(ms)) return;
        events.push({
          id: `da_${inst.id}_${field.id}`,
          type: 'date_alarm',
          title: `${def.icon||'📄'} ${field.label}`,
          subtitle: getInstanceShortDesc(inst, def),
          date: ms,
          color: EVENT_TYPES.date_alarm.color,
          icon: EVENT_TYPES.date_alarm.icon,
          userId: inst.ownerId,
          instanceId: inst.id,
          allDay: true,
          extra: { fieldId: field.id, fieldLabel: field.label, hasReminders: (field.reminders||[]).length > 0 }
        });
      });
    });
  }

  // 3) Bekleyen görevler
  if (types.has('task_open')) {
    state.tasks.forEach(task => {
      if (task.status !== 'open') return;
      if (!isInScope(task.assignee)) return;
      const inst = state.instances.find(i => i.id === task.instanceId);
      if (!inst) return;
      const def = getDef(inst.defId);
      if (!def) return;
      const step = def.steps.find(s => s.id === task.stepKey);
      // Bekleyen görevi oluşturulduğu gün takvime koy, SLA varsa hedef günü de
      const createdMs = task.createdAt;
      if (inRange(createdMs)) {
        events.push({
          id: `to_${task.id}_open`,
          type: 'task_open',
          title: `📋 ${task.stepTitle}`,
          subtitle: `${getUser(task.assignee)?.name} bekliyor`,
          date: createdMs,
          color: EVENT_TYPES.task_open.color,
          icon: EVENT_TYPES.task_open.icon,
          userId: task.assignee,
          instanceId: inst.id,
          allDay: false,
          extra: { taskId: task.id }
        });
      }
      // SLA hedef tarihi varsa
      if (step?.slaHours && step.slaHours > 0) {
        const slaDueMs = createdMs + step.slaHours * 3600000;
        if (inRange(slaDueMs) && slaDueMs !== createdMs) {
          events.push({
            id: `to_${task.id}_sla`,
            type: 'task_open',
            title: `⏰ Hedef: ${task.stepTitle}`,
            subtitle: `SLA süresi doluyor`,
            date: slaDueMs,
            color: '#f87171', // SLA'lar daha kırmızı
            icon: '⏰',
            userId: task.assignee,
            instanceId: inst.id,
            allDay: false,
            extra: { taskId: task.id, isSlaTarget: true }
          });
        }
      }
    });
  }

  // 4) Tamamlanmış görevler
  if (types.has('task_done')) {
    state.tasks.forEach(task => {
      if (task.status !== 'closed') return;
      if (!isInScope(task.assignee)) return;
      const inst = state.instances.find(i => i.id === task.instanceId);
      if (!inst) return;
      const def = getDef(inst.defId);
      if (!def) return;
      const closedMs = task.closedAt || task.createdAt;
      if (!inRange(closedMs)) return;
      events.push({
        id: `td_${task.id}`,
        type: 'task_done',
        title: `✓ ${task.stepTitle}`,
        subtitle: `${getUser(task.assignee)?.name} tamamladı`,
        date: closedMs,
        color: EVENT_TYPES.task_done.color,
        icon: EVENT_TYPES.task_done.icon,
        userId: task.assignee,
        instanceId: inst.id,
        allDay: false,
        extra: { taskId: task.id, decision: task.decision }
      });
    });
  }

  // 5) Açık talepler (oluşturulduğu gün)
  if (types.has('instance_open')) {
    state.instances.forEach(inst => {
      if (inst.status !== 'running') return;
      if (!isInScope(inst.ownerId)) return;
      const def = getDef(inst.defId);
      if (!def) return;
      if (!inRange(inst.createdAt)) return;
      events.push({
        id: `io_${inst.id}`,
        type: 'instance_open',
        title: `${def.icon||'📄'} ${def.name} açıldı`,
        subtitle: getUser(inst.ownerId)?.name,
        date: inst.createdAt,
        color: EVENT_TYPES.instance_open.color,
        icon: EVENT_TYPES.instance_open.icon,
        userId: inst.ownerId,
        instanceId: inst.id,
        allDay: false
      });
    });
  }

  // 6) Tamamlanmış talepler
  if (types.has('instance_done')) {
    state.instances.forEach(inst => {
      if (inst.status === 'running') return;
      if (!isInScope(inst.ownerId)) return;
      const def = getDef(inst.defId);
      if (!def) return;
      const doneMs = inst.updatedAt;
      if (!inRange(doneMs)) return;
      events.push({
        id: `id_${inst.id}`,
        type: 'instance_done',
        title: `${def.icon||'📄'} ${def.name} ${inst.status==='completed'?'onaylandı':'reddedildi'}`,
        subtitle: getUser(inst.ownerId)?.name,
        date: doneMs,
        color: inst.status === 'completed' ? EVENT_TYPES.instance_done.color : '#94a3b8',
        icon: inst.status === 'completed' ? '✅' : '❌',
        userId: inst.ownerId,
        instanceId: inst.id,
        allDay: false
      });
    });
  }

  // 7) Üretim siparişleri
  if (types.has('order') && Array.isArray(state.orders)) {
    state.orders.forEach(order => {
      if (!order.createdAt) return;
      if (!inRange(order.createdAt)) return;
      // Sipariş için scope - tüm operatörlere açık varsayalım (kişiye bağlı değil)
      events.push({
        id: `or_${order.id}`,
        type: 'order',
        title: `🏭 ${order.id}`,
        subtitle: order.product || order.id,
        date: order.createdAt,
        color: EVENT_TYPES.order.color,
        icon: EVENT_TYPES.order.icon,
        userId: null,
        allDay: false,
        extra: { orderId: order.id, qty: order.qty, status: order.status }
      });
    });
  }

  return events;
}

// ============== 4) KURAL DEĞERLENDİRİCİ ==============

function getRuleValue(path, inst) {
  if (!path) return null;
  const user = getUser(inst.ownerId);
  if (path === 'user.seniorityYears') return getSeniorityYears(user);
  if (path === 'user.id') return user.id;
  if (path === 'user.name') return user.name;
  if (path.startsWith('form.')) {
    const fname = path.slice(5);
    return inst.form[fname];
  }
  return null;
}

// Tek bir koşulu değerlendir
function evalCondition(cond, inst) {
  if (!cond || !cond.op) return true;
  const left = getRuleValue(cond.left, inst);
  let right = cond.right;
  const nLeft = parseFloat(left);
  const nRight = parseFloat(right);
  const bothNumeric = !isNaN(nLeft) && !isNaN(nRight);
  switch (cond.op) {
    case '==': return bothNumeric ? nLeft === nRight : String(left) === String(right);
    case '!=': return bothNumeric ? nLeft !== nRight : String(left) !== String(right);
    case '>=': return bothNumeric && nLeft >= nRight;
    case '<=': return bothNumeric && nLeft <= nRight;
    case '>':  return bothNumeric && nLeft > nRight;
    case '<':  return bothNumeric && nLeft < nRight;
    case 'contains': return String(left || '').toLowerCase().includes(String(right || '').toLowerCase());
    default: return false;
  }
}

// Bir kural objesini değerlendir. Geriye uyumlu:
// Eski format: { left, op, right } - tek koşul
// Yeni format: { type:'all'|'any', conditions: [cond, cond, ...] }
function evalRule(rule, inst) {
  if (!rule) return true;
  // Eski tek koşul formatı
  if (rule.op !== undefined) return evalCondition(rule, inst);
  // Yeni çoklu koşul formatı
  if (rule.conditions && Array.isArray(rule.conditions)) {
    if (rule.conditions.length === 0) return true;
    const results = rule.conditions.map(c => evalCondition(c, inst));
    if (rule.type === 'any') return results.some(r => r);
    return results.every(r => r); // varsayılan: all (VE)
  }
  return true;
}

function describeCondition(cond, inst) {
  if (!cond || !cond.op) return '';
  const left = getRuleValue(cond.left, inst);
  let leftDisp = left;
  if (typeof left === 'number') leftDisp = Number.isInteger(left) ? left : left.toFixed(2);
  if (leftDisp === undefined || leftDisp === null) leftDisp = '∅';
  return `${cond.left}=${leftDisp} ${cond.op} ${cond.right}`;
}

function describeRule(rule, inst) {
  if (!rule) return 'kural yok';
  if (rule.op !== undefined) return describeCondition(rule, inst);
  if (rule.conditions && rule.conditions.length > 0) {
    const sep = rule.type === 'any' ? ' VEYA ' : ' VE ';
    return rule.conditions.map(c => describeCondition(c, inst)).join(sep);
  }
  return 'kural yok';
}

// Form alanlarının dropdown seçenekleri için
function getRuleFieldOptions(def) {
  const opts = [
    { value:'user.seniorityYears', label:'Talep edenin kıdemi (yıl)' },
    { value:'user.id', label:'Talep eden kullanıcı id' }
  ];
  for (const f of (def.fields||[])) {
    opts.push({ value:'form.'+f.id, label:`Form: ${f.label}` });
  }
  return opts;
}
