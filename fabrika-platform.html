function useTemplate(templateId) {
  const tpl = PROCESS_TEMPLATES.find(t => t.templateId === templateId);
  if (!tpl) { notify('Şablon bulunamadı', 'error'); return; }

  // Yeni id ata, ama şablondaki içeriği bire bir kopyala (deep clone)
  const newId = 'p_' + Math.random().toString(36).substr(2, 6);
  const newDef = JSON.parse(JSON.stringify(tpl.template));
  newDef.id = newId;
  newDef.active = false; // Yeni gelen pasif - kullanıcı tasarımcıda düzenleyip aktifleştirsin
  state.definitions.push(newDef);
  persist();
  closeModal();
  openDesigner(newId);
  notify(`"${tpl.name}" şablonu yüklendi — özelleştirip kaydedin`, 'success');
}

// ============== SÜREÇ KURMA SİHİRBAZI ==============

// Sihirbaz durumu - geçici, kapatılırsa kaybolur
function newWizardState() {
  return {
    step: 1,           // 1=tanım+şekil, 2=alanlar, 3=onaylar+önizleme
    name: '',
    icon: '📄',
    description: '',
    shape: null,       // 'single' | 'sequential' | 'conditional' | 'expert'
    fields: [],        // {id, label, type, required}
    approvers: [],     // [{ mode, role?, userId? }] - şekle göre 1 veya 2 eleman
    condition: null    // koşullu için: { fieldId, op, value, ifTrueApprover, ifFalseApprovers }
  };
}

const PRESET_FIELDS = [
  { key:'date_single', icon:'📅', label:'Tek tarih', field: { id:'date', label:'Tarih', type:'date', required:true } },
  { key:'date_range',  icon:'📅', label:'Tarih aralığı', fields: [
      { id:'startDate', label:'Başlangıç tarihi', type:'date', required:true },
      { id:'endDate',   label:'Bitiş tarihi', type:'date', required:true }
    ] },
  { key:'hours',       icon:'⏱️', label:'Saat / süre', field: { id:'hours', label:'Süre (saat)', type:'number', required:true } },
  { key:'amount',      icon:'💰', label:'Tutar', field: { id:'amount', label:'Tutar (TL)', type:'number', required:true } },
  { key:'short_text',  icon:'📝', label:'Kısa metin', field: { id:'title', label:'Başlık', type:'text', required:true } },
  { key:'description', icon:'📄', label:'Uzun açıklama', field: { id:'description', label:'Açıklama', type:'textarea', required:false } },
  { key:'select',      icon:'📋', label:'Seçim listesi', field: { id:'choice', label:'Seçim', type:'select', required:true,
      options: [ {value:'opt1',label:'Seçenek 1'}, {value:'opt2',label:'Seçenek 2'} ] } }
];

function startWizard() {
  state._wizard = newWizardState();
  closeModal();
  setTimeout(() => renderWizard(), 50);
}

function renderWizard() {
  const w = state._wizard;
  if (!w) return;
  let body = '';
  let footer = '';

  // Progress bar
  const progressHtml = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:11px;">
      ${[1,2,3].map(n => `
        <div style="flex:1;display:flex;align-items:center;gap:6px;">
          <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;${w.step >= n ? 'background:var(--accent);color:#000;' : 'background:var(--panel-2);color:var(--text-mute);border:1px solid var(--border);'}">${n}</div>
          <span style="${w.step === n ? 'color:var(--accent);font-weight:600;' : 'color:var(--text-mute);'}">${['Şekil','Alanlar','Onaylar'][n-1]}</span>
          ${n < 3 ? `<div style="flex:1;height:1px;background:${w.step > n ? 'var(--accent)' : 'var(--border)'};"></div>` : ''}
        </div>
      `).join('')}
    </div>
  `;

  if (w.step === 1) {
    body = progressHtml + renderWizardStep1(w);
    footer = `
      <button class="ghost-btn" onclick="closeWizard()">İptal</button>
      <button class="btn approve" style="flex:0;padding:7px 14px;" onclick="wizardNext()">İleri →</button>
    `;
  } else if (w.step === 2) {
    body = progressHtml + renderWizardStep2(w);
    footer = `
      <button class="ghost-btn" onclick="wizardPrev()">← Geri</button>
      <button class="btn approve" style="flex:0;padding:7px 14px;margin-left:auto;" onclick="wizardNext()">İleri →</button>
    `;
  } else if (w.step === 3) {
    body = progressHtml + renderWizardStep3(w);
    footer = `
      <button class="ghost-btn" onclick="wizardPrev()">← Geri</button>
      <button class="btn approve" style="flex:0;padding:7px 14px;margin-left:auto;" onclick="wizardFinish()">✓ Süreci Oluştur</button>
    `;
  }

  openModal({
    title: '🪄 Süreç Sihirbazı',
    body,
    foot: footer,
    wide: true
  });
}

function renderWizardStep1(w) {
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Süreç Bilgileri</h4>
        <div class="form-field">
          <label>İkon</label>
          <input type="text" id="wiz-icon" value="${escapeHtml(w.icon)}" maxlength="2" oninput="state._wizard.icon=this.value" style="text-align:center;font-size:18px;width:60px;">
          <div class="hint">İstediğin emoji'yi seç (örn: 🌴 🔧 💰 📋)</div>
        </div>
        <div class="form-field">
          <label>İsim <span class="req">*</span></label>
          <input type="text" id="wiz-name" value="${escapeHtml(w.name)}" placeholder="Örn: Mazeret İzni Talebi" oninput="state._wizard.name=this.value">
        </div>
        <div class="form-field">
          <label>Kısa açıklama</label>
          <textarea id="wiz-desc" placeholder="Bu süreç ne için kullanılacak?" oninput="state._wizard.description=this.value">${escapeHtml(w.description)}</textarea>
        </div>
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Onay Şekli Seç</h4>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${[
            { id:'single',       icon:'🚀', name:'Tek onaylayıcı', desc:'En hızlı: çalışan formu doldurur, 1 kişi onaylar' },
            { id:'sequential',   icon:'📋', name:'İki kademeli sıralı', desc:'Çalışan → 1. onaylayıcı → 2. onaylayıcı → bitti' },
            { id:'conditional',  icon:'🔀', name:'Koşullu dallanma', desc:'Belli bir değere göre farklı yol (örn. tutar küçükse kısa yol)' },
            { id:'expert',       icon:'🛠️', name:'Bunlar yetmez', desc:'Doğrudan tasarımcıya git, kendim kuracağım' }
          ].map(s => {
            const selected = w.shape === s.id;
            return `
              <div onclick="wizardSelectShape('${s.id}')" style="border:1px solid ${selected ? 'var(--accent)' : 'var(--border)'};background:${selected ? 'var(--panel-3)' : 'var(--panel-2)'};border-radius:6px;padding:11px;cursor:pointer;transition:all 0.15s;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <div style="font-size:22px;">${s.icon}</div>
                  <div style="flex:1;">
                    <div style="font-weight:600;font-size:13px;color:${selected ? 'var(--accent)' : 'var(--text)'};">${s.name}</div>
                    <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${s.desc}</div>
                  </div>
                  ${selected ? '<div style="color:var(--accent);font-size:18px;">✓</div>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function wizardSelectShape(shape) {
  state._wizard.shape = shape;
  // Onaylayıcı sayısını şekle göre ayarla
  if (shape === 'single') {
    state._wizard.approvers = [{ mode: 'requester_manager' }];
  } else if (shape === 'sequential') {
    state._wizard.approvers = [{ mode: 'requester_manager' }, { mode: 'role', role: 'hr' }];
  } else if (shape === 'conditional') {
    state._wizard.condition = state._wizard.condition || { fieldId: '', op: '<=', value: 5000 };
    state._wizard.approvers = [{ mode: 'role', role: 'hr' }, { mode: 'requester_manager' }];
  }
  renderWizard();
}

function renderWizardStep2(w) {
  // Mevcut seçili presetler
  const selectedKeys = new Set();
  w.fields.forEach(f => {
    // Hangi preset'ten geldiğini ID'den çıkar
    const preset = PRESET_FIELDS.find(p =>
      p.field?.id === f.id ||
      p.fields?.some(pf => pf.id === f.id)
    );
    if (preset) selectedKeys.add(preset.key);
  });

  return `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Talep edenin dolduracağı alanlar</h4>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Bir veya birkaç hazır alan seç. Sağda canlı önizleme.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${PRESET_FIELDS.map(p => {
            const selected = selectedKeys.has(p.key);
            return `
              <div onclick="wizardToggleField('${p.key}')" style="border:1px solid ${selected ? 'var(--accent)' : 'var(--border)'};background:${selected ? 'var(--panel-3)' : 'var(--panel-2)'};border-radius:6px;padding:10px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <div style="font-size:18px;">${p.icon}</div>
                  <div style="flex:1;font-size:12px;font-weight:500;">${p.label}</div>
                  <div style="font-size:14px;color:${selected ? 'var(--accent)' : 'var(--text-mute)'};">${selected ? '✓' : '+'}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:20px 0 8px;">Eklenen alanlar (${w.fields.length})</h4>
        ${w.fields.length === 0 ?
          '<div style="font-size:12px;color:var(--text-mute);padding:12px;background:var(--panel-2);border-radius:4px;text-align:center;">Yukarıdan en az bir alan seç</div>' :
          w.fields.map((f, i) => `
            <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;margin-bottom:4px;font-size:12px;">
              <span style="color:var(--text);">${escapeHtml(f.label)}</span>
              <span class="badge-tag">${f.type}</span>
              ${f.required ? '<span class="badge-tag" style="color:var(--red);">zorunlu</span>' : ''}
              <button class="icon-btn delete" onclick="wizardRemoveField('${f.id}')" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
            </div>
          `).join('')
        }
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">📋 Form Önizleme</h4>
        <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:10px;">${w.icon} ${escapeHtml(w.name || 'Süreç Adı')}</div>
          ${w.fields.length === 0 ?
            '<div style="font-size:11px;color:var(--text-mute);padding:20px;text-align:center;">Henüz alan yok</div>' :
            w.fields.map(f => `
              <div style="margin-bottom:10px;">
                <label style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:3px;">${escapeHtml(f.label)} ${f.required?'<span style="color:var(--red);">*</span>':''}</label>
                ${f.type === 'textarea' ?
                  '<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);min-height:36px;">[uzun metin alanı]</div>' :
                  f.type === 'select' ?
                  '<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);">[seçim listesi]</div>' :
                  `<div style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:6px;font-size:11px;color:var(--text-mute);">[${f.type} girişi]</div>`
                }
              </div>
            `).join('')
          }
          <div style="margin-top:12px;text-align:right;">
            <span style="background:var(--accent);color:#000;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;">Gönder</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wizardToggleField(presetKey) {
  const w = state._wizard;
  const preset = PRESET_FIELDS.find(p => p.key === presetKey);
  if (!preset) return;
  // Bu preset şu an seçili mi?
  const fieldIds = preset.field ? [preset.field.id] : preset.fields.map(f => f.id);
  const currentlySelected = fieldIds.every(id => w.fields.some(f => f.id === id));
  if (currentlySelected) {
    // Kaldır
    w.fields = w.fields.filter(f => !fieldIds.includes(f.id));
  } else {
    // Ekle (deep clone)
    if (preset.field) {
      w.fields.push(JSON.parse(JSON.stringify(preset.field)));
    } else {
      preset.fields.forEach(f => w.fields.push(JSON.parse(JSON.stringify(f))));
    }
  }
  renderWizard();
}

function wizardRemoveField(fid) {
  const w = state._wizard;
  w.fields = w.fields.filter(f => f.id !== fid);
  renderWizard();
}

function renderWizardStep3(w) {
  if (w.shape === 'conditional') {
    return renderWizardStep3Conditional(w);
  }
  // single veya sequential
  const approvers = w.approvers || [];
  const labels = w.shape === 'single' ? ['Onaylayıcı'] : ['1. Onaylayıcı', '2. Onaylayıcı'];

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Kim onaylayacak?</h4>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">${w.shape === 'single' ? 'Bu süreçte tek onay var.' : 'Önce 1. kişi onaylar, sonra 2. kişi onaylar.'}</div>

        ${approvers.map((a, i) => `
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;">${labels[i]}</div>
            ${renderApproverPicker(i, a)}
          </div>
        `).join('')}
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
        ${renderWizardPreview(w)}
      </div>
    </div>
  `;
}

function renderWizardStep3Conditional(w) {
  const cond = w.condition || { fieldId: '', op: '<=', value: 5000 };
  // Sayısal alanları (number, date) koşul için seçilebilir yap
  const numericFields = w.fields.filter(f => f.type === 'number' || f.type === 'date' || f.type === 'select');
  if (!cond.fieldId && numericFields.length > 0) cond.fieldId = numericFields[0].id;

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">Koşullu Akış</h4>
        ${numericFields.length === 0 ?
          '<div style="font-size:12px;color:var(--amber);background:rgba(251,191,36,0.1);border:1px solid var(--amber);padding:10px;border-radius:4px;">⚠ Koşul için sayı/tarih/seçim alanı gerekli. Geri dönüp en az bir tane ekleyin.</div>' :
          `
          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">EĞER (koşul)</div>
            <div style="display:flex;gap:6px;align-items:center;">
              <select onchange="state._wizard.condition.fieldId=this.value;renderWizard();" style="flex:1;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
                ${numericFields.map(f => `<option value="${f.id}" ${cond.fieldId===f.id?'selected':''}>${escapeHtml(f.label)}</option>`).join('')}
              </select>
              <select onchange="state._wizard.condition.op=this.value;renderWizard();" style="width:60px;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
                ${['<=','<','==','!=','>','>='].map(op => `<option ${cond.op===op?'selected':''}>${op}</option>`).join('')}
              </select>
              <input type="text" value="${escapeHtml(String(cond.value))}" oninput="state._wizard.condition.value=this.value;" style="width:90px;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;" placeholder="değer">
            </div>
          </div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;border-left:3px solid var(--green);">
            <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:8px;">✓ KOŞUL DOĞRUYSA — Hızlı yol (tek onay)</div>
            ${renderApproverPicker(0, w.approvers[0] || { mode:'role', role:'hr' })}
          </div>

          <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;border-left:3px solid var(--amber);">
            <div style="font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px;">↳ KOŞUL YANLIŞSA — Uzun yol (müdür sonra İK)</div>
            <div style="font-size:11px;color:var(--text-dim);">Müdür onayı, ardından İK onayı (sabit)</div>
          </div>
          `
        }
      </div>

      <div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">🔍 Süreç Önizleme</h4>
        ${renderWizardPreview(w)}
      </div>
    </div>
  `;
}

function renderApproverPicker(idx, approver) {
  approver = approver || { mode: 'requester_manager' };
  const isRole = approver.mode === 'role';
  const isSpecific = approver.mode === 'specific_user';
  return `
    <div style="display:flex;gap:6px;align-items:center;">
      <select onchange="wizardUpdateApprover(${idx},'mode',this.value)" style="flex:1;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
        <option value="requester_manager" ${approver.mode==='requester_manager'?'selected':''}>Talep edenin müdürü</option>
        <option value="role" ${isRole?'selected':''}>Belirli bir rol</option>
        <option value="specific_user" ${isSpecific?'selected':''}>Belirli bir kişi</option>
      </select>
      ${isRole ? `
        <select onchange="wizardUpdateApprover(${idx},'role',this.value)" style="background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
          ${['manager','hr','admin'].map(r => `<option value="${r}" ${approver.role===r?'selected':''}>${r}</option>`).join('')}
        </select>
      ` : ''}
      ${isSpecific ? `
        <select onchange="wizardUpdateApprover(${idx},'userId',this.value)" style="background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;">
          ${state.users.map(u => `<option value="${u.id}" ${approver.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
        </select>
      ` : ''}
    </div>
  `;
}

function wizardUpdateApprover(idx, key, val) {
  const w = state._wizard;
  if (!w.approvers[idx]) w.approvers[idx] = {};
  w.approvers[idx][key] = val;
  if (key === 'mode') {
    if (val === 'role') w.approvers[idx].role = 'manager';
    if (val === 'specific_user') w.approvers[idx].userId = state.users[0]?.id;
  }
  renderWizard();
}

function renderWizardPreview(w) {
  // Mini ASCII-style akış önizleme
  let steps = [];
  steps.push({ label: '▶ Talep', color: 'var(--accent)' });

  if (w.shape === 'conditional') {
    steps.push({ label: 'Koşul kontrolü', color: 'var(--purple)' });
  }

  if (w.shape === 'single') {
    steps.push({ label: describeApprover(w.approvers[0]), color: 'var(--accent)' });
  } else if (w.shape === 'sequential') {
    steps.push({ label: describeApprover(w.approvers[0]), color: 'var(--accent)' });
    steps.push({ label: describeApprover(w.approvers[1]), color: 'var(--accent)' });
  } else if (w.shape === 'conditional') {
    steps.push({ label: 'Koşul doğru → ' + describeApprover(w.approvers[0]), color: 'var(--green)' });
    steps.push({ label: 'veya Koşul yanlış → Müdür + İK', color: 'var(--amber)' });
  }

  steps.push({ label: '✓ Tamamlandı', color: 'var(--green)' });

  return `
    <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;">
      ${steps.map((s, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-left:3px solid ${s.color};border-radius:3px;margin-bottom:${i < steps.length - 1 ? '4px' : '0'};font-size:12px;">
          ${escapeHtml(s.label)}
        </div>
        ${i < steps.length - 1 ? '<div style="text-align:center;color:var(--text-mute);font-size:14px;margin:2px 0;">↓</div>' : ''}
      `).join('')}
    </div>
    <div style="font-size:11px;color:var(--text-mute);margin-top:10px;text-align:center;">Sihirbazdan sonra detayları tasarımcıdan ekleyebilirsiniz</div>
  `;
}

function describeApprover(approver) {
  if (!approver) return '?';
  if (approver.mode === 'requester_manager') return '👔 Müdür onayı';
  if (approver.mode === 'role') {
    const labels = { manager:'👔 Yönetici', hr:'🧑‍💼 İK', admin:'⚙️ Admin', worker:'👷 Çalışan' };
    return (labels[approver.role] || approver.role) + ' onayı';
  }
  if (approver.mode === 'specific_user') {
    const u = getUser(approver.userId);
    return `👤 ${u?.name || '?'} onayı`;
  }
  return '?';
}

function wizardNext() {
  const w = state._wizard;
  // Validasyon
  if (w.step === 1) {
    if (!w.name?.trim()) { notify('Süreç adı zorunlu', 'error'); return; }
    if (!w.shape) { notify('Bir onay şekli seçin', 'error'); return; }
    // Expert seçildiyse direkt tasarımcıya
    if (w.shape === 'expert') {
      wizardCreateAndOpen({ skipWizard: true });
      return;
    }
  }
  if (w.step === 2) {
    if (w.fields.length === 0) {
      if (!confirm('Hiç form alanı eklemediniz. Yine de devam etmek ister misiniz?')) return;
    }
  }
  if (w.step < 3) w.step++;
  renderWizard();
}

function wizardPrev() {
  if (state._wizard.step > 1) state._wizard.step--;
  renderWizard();
}

function closeWizard() {
  state._wizard = null;
  closeModal();
}

function wizardFinish() {
  // Aktivasyon onayı
  const w = state._wizard;
  if (!w) return;
  if (confirm(`"${w.name}" sürecini hemen AKTİFLEŞTİRİP kullanıcıların erişimine açayım mı?\n\nEvet: Aktif olarak yaratılır, çalışanlar hemen "Yeni Talep Aç" menüsünde görür.\nHayır: Pasif yaratılır, tasarımcıdan inceleyip sonra aktifleştirirsin.`)) {
    wizardCreateAndOpen({ skipWizard: false, activate: true });
  } else {
    wizardCreateAndOpen({ skipWizard: false, activate: false });
  }
}

// Sihirbaz cevaplarından gerçek süreç tanımı üret ve tasarımcıyı aç
function wizardCreateAndOpen(opts) {
  const w = state._wizard;
  if (!w) return;
  const newId = 'p_' + Math.random().toString(36).substr(2, 6);

  let newDef;
  if (opts.skipWizard) {
    // Expert: tasarımcıya direkt boş süreç gönder
    newDef = {
      id: newId,
      name: w.name || 'Yeni Süreç',
      icon: w.icon || '📄',
      description: w.description || '',
      active: false,
      fields: w.fields.length > 0 ? JSON.parse(JSON.stringify(w.fields)) : [],
      startStep: 's1',
      steps: [
        { id:'s1', title:'İlk onay', type:'human', assign:{ mode:'role', role:'manager' } },
        { id:'s_done', title:'Tamamlandı', type:'end-good', message:'Onaylandı' },
        { id:'s_rej',  title:'Reddedildi', type:'end-bad', message:'Reddedildi' }
      ],
      transitions: [
        { from:'s1', when:'approve', to:'s_done' },
        { from:'s1', when:'reject', to:'s_rej' }
      ]
    };
  } else if (w.shape === 'single') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_approve',
      steps: [
        { id:'s_approve', title:'Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej',  title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' }
      ],
      transitions: [
        { from:'s_approve', when:'approve', to:'s_done' },
        { from:'s_approve', when:'reject',  to:'s_rej' }
      ]
    };
  } else if (w.shape === 'sequential') {
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_approve1',
      steps: [
        { id:'s_approve1', title:'1. Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_approve2', title:'2. Onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[1])) },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej1', title:'1. Onayda reddedildi', type:'end-bad', message:'1. onaylayıcı reddetti' },
        { id:'s_rej2', title:'2. Onayda reddedildi', type:'end-bad', message:'2. onaylayıcı reddetti' }
      ],
      transitions: [
        { from:'s_approve1', when:'approve', to:'s_approve2' },
        { from:'s_approve1', when:'reject',  to:'s_rej1' },
        { from:'s_approve2', when:'approve', to:'s_done' },
        { from:'s_approve2', when:'reject',  to:'s_rej2' }
      ]
    };
  } else if (w.shape === 'conditional') {
    const cond = w.condition;
    const valNum = parseFloat(cond.value);
    const rightVal = !isNaN(valNum) ? valNum : cond.value;
    newDef = {
      id: newId,
      name: w.name,
      icon: w.icon,
      description: w.description,
      active: false,
      fields: JSON.parse(JSON.stringify(w.fields)),
      startStep: 's_check',
      steps: [
        { id:'s_check', title:'Koşul kontrolü', type:'system',
          rule: { left:'form.'+cond.fieldId, op:cond.op, right:rightVal } },
        { id:'s_fast', title:'Hızlı onay', type:'human', assign: JSON.parse(JSON.stringify(w.approvers[0])) },
        { id:'s_slow_mgr', title:'Müdür onayı (uzun yol)', type:'human', assign:{ mode:'requester_manager' } },
        { id:'s_slow_hr',  title:'İK onayı (uzun yol)', type:'human', assign:{ mode:'role', role:'hr' } },
        { id:'s_done', title:'Onaylandı', type:'end-good', message:'Talep onaylandı' },
        { id:'s_rej', title:'Reddedildi', type:'end-bad', message:'Talep reddedildi' }
      ],
      transitions: [
        { from:'s_check', when:'pass', to:'s_fast' },
        { from:'s_check', when:'fail', to:'s_slow_mgr' },
        { from:'s_fast', when:'approve', to:'s_done' },
        { from:'s_fast', when:'reject',  to:'s_rej' },
        { from:'s_slow_mgr', when:'approve', to:'s_slow_hr' },
        { from:'s_slow_mgr', when:'reject',  to:'s_rej' },
        { from:'s_slow_hr', when:'approve', to:'s_done' },
        { from:'s_slow_hr', when:'reject',  to:'s_rej' }
      ]
    };
  }

  // Aktivasyon kararını uygula
  if (opts.activate === true) {
    newDef.active = true;
  }

  state.definitions.push(newDef);
  state._wizard = null;
  persist();
  closeModal();
  openDesigner(newId);
  if (newDef.active) {
    notify(`"${newDef.name}" sihirbazla oluşturuldu ve AKTİF — kullanıcılar artık talep açabilir`, 'success');
  } else {
    notify(`"${newDef.name}" PASİF olarak yaratıldı — aktifleştirmek için Aktifleştir butonuna basın`, 'success');
  }
}

function openDesigner(defId) {
  state.designerProcessId = defId;

  renderAdminContent();

// Salt-okunur süreç görüntüleyici (düzenleme yetkisi olmayanlar için).
// Akış diyagramı + form önizlemesini düzenlenemez şekilde modalde gösterir.
function openProcessViewer(defId) {
  const def = getDef(defId);
  if (!def) { notify('Süreç bulunamadı', 'error'); return; }
  const humanSteps = def.steps.filter(s => s.type === 'human').length;
  const systemSteps = def.steps.filter(s => s.type === 'system').length;
  const usage = state.instances.filter(i => i.defId === def.id).length;
  openModal({
    title: `${def.icon || '📄'} ${def.name}`,
    wide: true,
    body: `
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(def.description || 'Açıklama yok')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
        <span class="badge-tag ${def.active?'active':'inactive'}">${def.active?'Aktif':'Pasif'}</span>
        <span class="badge-tag human-step">${humanSteps} insan adımı</span>
        <span class="badge-tag system-step">${systemSteps} sistem adımı</span>
        <span class="badge-tag" style="background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-hi);">${def.fields.length} form alanı</span>
        <span class="badge-tag" style="background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-hi);">${usage} talep açılmış</span>
      </div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">Süreç Akışı</div>
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:18px;overflow:auto;">
        ${renderProcessPreview(def)}
      </div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">Talep Formu</div>
      ${renderFormPreview(def)}
    `,
    foot: `<button class="ghost-btn" onclick="closeModal()">Kapat</button>`
  });
}

// Tasarımcı içindeki küçük güncellemelerde tüm sayfayı render etmek yerine sadece tasarımcı
function renderDesignerOnly() {
  const c = document.getElementById('admin-content');
  if (c) renderDesigner(c);
}

function updateDef(field, value) {
  const def = getDef(state.designerProcessId);
  def[field] = value;
  persist();
  // Sadece önizleme ve başlangıç dropdown'ını güncelle
  updatePreview();
}

function updatePreview() {
  const a = document.getElementById('preview-area');
  if (a) a.innerHTML = renderDesignerPreview(getDef(state.designerProcessId));
}

// -- FORM ALANLARI --
function renderFieldsList(def) {
  return def.fields.map((f, idx) => `
    <div style="margin-bottom:8px;">
      <div class="field-row" style="margin-bottom:0;">
        <div class="ord">${idx+1}.</div>
        <input type="text" placeholder="Alan adı (label)" value="${escapeHtml(f.label)}" oninput="updateField('${f.id}','label',this.value)">
        <input type="text" placeholder="Yardım metni" value="${escapeHtml(f.placeholder||'')}" oninput="updateField('${f.id}','placeholder',this.value)">
        <select onchange="updateField('${f.id}','type',this.value)">
          ${['text','textarea','number','date','select'].map(t =>
            `<option value="${t}" ${f.type === t ? 'selected':''}>${t}</option>`
          ).join('')}
        </select>
        <button class="icon-btn" title="Zorunlu" onclick="updateField('${f.id}','required',${!f.required})" style="${f.required?'background:var(--red);color:#000;border-color:var(--red);':''}">*</button>
        <button class="icon-btn delete" title="Sil" onclick="removeField('${f.id}')">×</button>
      </div>
      ${f.type === 'date' ? renderFieldReminders(f) : ''}
    </div>
  `).join('');
}

  document.getElementById('fields-list').innerHTML = renderFieldsList(def);

  s[key] = val;

function updateStepAssign(sid, key, val) {

// ============== ÇOKLU KOŞUL RULE BUILDER ==============

// Bir adımın kuralını normalleştir: eski tek koşul -> yeni çoklu koşul formatı
// Sadece editleme için kullanılır; motor zaten iki formatı da tanıyor (geri uyum)
function normalizeRuleForEdit(rule) {
  if (!rule) return { type: 'all', conditions: [] };
  if (rule.op !== undefined) {
    // Eski tek koşul - çoklu formatta tek koşullu olarak göster
    return { type: 'all', conditions: [{ left: rule.left, op: rule.op, right: rule.right }] };
  }
  return {
    type: rule.type || 'all',
    conditions: Array.isArray(rule.conditions) ? rule.conditions.slice() : []
  };
}

function renderRuleBuilder(s, def) {
  const rule = normalizeRuleForEdit(s.rule);
  const fieldOpts = getRuleFieldOptions(def);
  const ops = ['==','!=','>=','<=','>','<','contains'];

  // Tek koşul olduysa eski stildeki kompakt görünüm + "+ koşul ekle"
  // Birden fazla koşul varsa VE/VEYA seçici ile birlikte
  const isMulti = rule.conditions.length > 1;
  const condRows = rule.conditions.map((c, idx) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">
      ${isMulti && idx === 0 ? '<span class="lbl" style="min-width:28px;">EĞER</span>' :
        isMulti ? `<span class="lbl" style="min-width:28px;font-weight:600;color:var(--accent);">${rule.type==='any'?'VEYA':'VE'}</span>` :
        '<span class="lbl">EĞER</span>'}
      <select onchange="updateRuleCondition('${s.id}',${idx},'left',this.value)" style="flex:1;">
        ${fieldOpts.map(o => `<option value="${o.value}" ${c.left===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
      </select>
      <select onchange="updateRuleCondition('${s.id}',${idx},'op',this.value)" style="width:60px;">
        ${ops.map(op => `<option ${c.op===op?'selected':''}>${op}</option>`).join('')}
      </select>
      <input type="text" value="${escapeHtml(String(c.right!==undefined?c.right:''))}" oninput="updateRuleCondition('${s.id}',${idx},'right',this.value)" style="width:80px;" placeholder="değer">
      ${rule.conditions.length > 1 ? `<button class="icon-btn delete" onclick="removeRuleCondition('${s.id}',${idx})" type="button" title="Koşulu sil" style="width:22px;height:22px;font-size:11px;">×</button>` : ''}
    </div>
  `).join('');

  const groupSelector = isMulti ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border);">
      <span class="lbl">Koşullar arası:</span>
      <select onchange="updateRuleType('${s.id}',this.value)" style="width:auto;padding:3px 6px;">
        <option value="all" ${rule.type==='all'?'selected':''}>HEPSİ (VE)</option>
        <option value="any" ${rule.type==='any'?'selected':''}>HERHANGİ BİRİ (VEYA)</option>
      </select>
      <span class="lbl" style="margin-left:auto;font-size:10px;">${rule.conditions.length} koşul</span>
    </div>
  ` : '';

  return `
    <div class="rule-builder" style="flex-direction:column;align-items:stretch;padding:8px 10px;">
      ${groupSelector}
      ${condRows || '<div style="font-size:11px;color:var(--text-mute);padding:4px;">Koşul yok</div>'}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
        <button class="add-mini" onclick="addRuleCondition('${s.id}')" type="button" style="font-size:10px;padding:3px 8px;">+ Koşul ekle</button>
        <span class="lbl" style="font-size:10px;">→ pass / fail</span>
      </div>
    </div>
  `;
}

function getNormalizedRule(s) {
  if (!s.rule) s.rule = { type: 'all', conditions: [] };
  // Eski tek koşul formatındaysa yeni formata çevir
  if (s.rule.op !== undefined) {
    const old = s.rule;
    s.rule = {
      type: 'all',
      conditions: [{ left: old.left, op: old.op, right: old.right }]
    };
  }
  if (!s.rule.conditions) s.rule.conditions = [];
  if (!s.rule.type) s.rule.type = 'all';
  return s.rule;
}

function updateRuleCondition(sid, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  if (!rule.conditions[idx]) return;
  if (key === 'right' && val !== '' && !isNaN(parseFloat(val))) {
    rule.conditions[idx][key] = parseFloat(val);
  } else {
    rule.conditions[idx][key] = val;
  }
  persist();
  updatePreview();
}

function addRuleCondition(sid) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  const fieldOpts = getRuleFieldOptions(def);
  rule.conditions.push({
    left: fieldOpts[0]?.value || 'user.seniorityYears',
    op: '>=',
    right: 1
  });
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

function removeRuleCondition(sid, idx) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  rule.conditions.splice(idx, 1);
  // Eğer tek koşul kaldıysa eski formata geri çevirme - yeni formatta tutalım, motor zaten anlıyor
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

function updateRuleType(sid, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === sid);
  if (!s) return;
  const rule = getNormalizedRule(s);
  rule.type = val;
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
  updatePreview();
}

// ============== EYLEM EDİTÖRÜ (Tasarımcı tarafı) ==============

function getStepActions(s) {
  if (!s.actions) s.actions = { onStart: [], onComplete: [] };
  if (!s.actions.onStart) s.actions.onStart = [];
  if (!s.actions.onComplete) s.actions.onComplete = [];
  return s.actions;
}

function renderStepActions(s) {
  const actions = getStepActions(s);
  const onStartCount = actions.onStart.length;
  const onCompleteCount = actions.onComplete.length;
  const expanded = state._expandedActions === s.id;

  if (!expanded) {
    // Kapalı: özet + Aç butonu
    return `
      <div class="rule-builder" style="background:var(--panel-2);padding:6px 10px;border:1px dashed var(--border-hi);">
        <span class="lbl">🎬 Eylemler:</span>
        <span class="lbl" style="color:var(--text);">${onStartCount} atanınca · ${onCompleteCount} tamamlanınca</span>
        <button class="add-mini" onclick="toggleStepActions('${s.id}')" type="button" style="margin-left:auto;font-size:10px;padding:3px 8px;">Yapılandır ▾</button>
      </div>
    `;
  }

  // Açık: tam editör
  return `
    <div class="rule-builder" style="flex-direction:column;align-items:stretch;background:var(--panel-2);padding:10px;border:1px dashed var(--accent);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:600;font-size:11px;color:var(--accent);">🎬 EYLEMLER</span>
        <button class="add-mini" onclick="toggleStepActions(null)" type="button" style="font-size:10px;padding:3px 8px;">Kapat ▴</button>
      </div>

      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span class="lbl" style="font-weight:600;color:var(--text);">▶ Adım atanınca (${onStartCount})</span>
          <div style="display:flex;gap:3px;">
            <button class="add-mini" onclick="addAction('${s.id}','onStart','send_email')" type="button" style="font-size:10px;padding:2px 6px;">+ ✉️</button>
            <button class="add-mini" onclick="addAction('${s.id}','onStart','send_sms')" type="button" style="font-size:10px;padding:2px 6px;">+ 📱</button>
            <button class="add-mini" onclick="addAction('${s.id}','onStart','send_whatsapp')" type="button" style="font-size:10px;padding:2px 6px;">+ 💬</button>
            <button class="add-mini" onclick="addAction('${s.id}','onStart','generate_pdf')" type="button" style="font-size:10px;padding:2px 6px;">+ 📄</button>
            <button class="add-mini" onclick="addAction('${s.id}','onStart','start_process')" type="button" style="font-size:10px;padding:2px 6px;">+ 🔗</button>
          </div>
        </div>
        ${actions.onStart.length === 0 ?
          '<div style="font-size:10px;color:var(--text-mute);padding:4px 8px;">Eylem yok</div>' :
          actions.onStart.map((a, idx) => renderActionRow(s.id, 'onStart', idx, a)).join('')}
      </div>

      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span class="lbl" style="font-weight:600;color:var(--text);">✓ Adım tamamlanınca (${onCompleteCount})</span>
          <div style="display:flex;gap:3px;">
            <button class="add-mini" onclick="addAction('${s.id}','onComplete','send_email')" type="button" style="font-size:10px;padding:2px 6px;">+ ✉️</button>
            <button class="add-mini" onclick="addAction('${s.id}','onComplete','send_sms')" type="button" style="font-size:10px;padding:2px 6px;">+ 📱</button>
            <button class="add-mini" onclick="addAction('${s.id}','onComplete','send_whatsapp')" type="button" style="font-size:10px;padding:2px 6px;">+ 💬</button>
            <button class="add-mini" onclick="addAction('${s.id}','onComplete','generate_pdf')" type="button" style="font-size:10px;padding:2px 6px;">+ 📄</button>
            <button class="add-mini" onclick="addAction('${s.id}','onComplete','start_process')" type="button" style="font-size:10px;padding:2px 6px;">+ 🔗</button>
          </div>
        </div>
        ${actions.onComplete.length === 0 ?
          '<div style="font-size:10px;color:var(--text-mute);padding:4px 8px;">Eylem yok</div>' :
          actions.onComplete.map((a, idx) => renderActionRow(s.id, 'onComplete', idx, a)).join('')}
      </div>

      <div style="margin-top:8px;padding:6px 8px;background:var(--bg);border-radius:3px;font-size:10px;color:var(--text-mute);">
        💡 İpucu: Mesaj/konu içinde değişken kullanın: <code style="color:var(--accent);">{{user.name}}</code> {{form.startDate}} {{instance.id}} {{approver.name}}
      </div>
    </div>
  `;
}

const ACTION_TYPE_LABELS = {
  send_email: { icon: '✉️', name: 'E-posta' },
  send_sms: { icon: '📱', name: 'SMS' },
  send_whatsapp: { icon: '💬', name: 'WhatsApp' },
  generate_pdf: { icon: '📄', name: 'PDF üret' },
  start_process: { icon: '🔗', name: 'Süreç tetikle' }
};

function renderActionRow(stepId, trigger, idx, action) {
  const meta = ACTION_TYPE_LABELS[action.type] || { icon: '?', name: action.type };

  if (action.type === 'send_email' || action.type === 'send_sms' || action.type === 'send_whatsapp') {
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <span class="lbl" style="margin-left:6px;">Alıcı:</span>
          ${renderRecipientPicker(stepId, trigger, idx, action.recipient)}
          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
        </div>
        ${action.type === 'send_email' ? `
          <input type="text" value="${escapeHtml(action.subject||'')}" placeholder="Konu (örn: İzin talebiniz onayınızı bekliyor)" oninput="updateAction('${stepId}','${trigger}',${idx},'subject',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;margin-bottom:4px;font-family:var(--sans);">
        ` : ''}
        <textarea placeholder="Mesaj... (değişken örneği: Sayın {{user.name}}, {{form.startDate}} tarihli izin talebiniz...)" oninput="updateAction('${stepId}','${trigger}',${idx},'body',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;min-height:40px;font-family:var(--sans);resize:vertical;">${escapeHtml(action.body||'')}</textarea>
      </div>
    `;
  }

  if (action.type === 'generate_pdf') {
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
        </div>
        <input type="text" value="${escapeHtml(action.filename||'')}" placeholder="Dosya adı (örn: izin-{{instance.id}}.pdf)" oninput="updateAction('${stepId}','${trigger}',${idx},'filename',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;margin-bottom:4px;font-family:var(--sans);">
        <input type="text" value="${escapeHtml(action.title||'')}" placeholder="Belge başlığı" oninput="updateAction('${stepId}','${trigger}',${idx},'title',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;width:100%;font-family:var(--sans);">
      </div>
    `;
  }

  if (action.type === 'start_process') {
    const otherDefs = state.definitions.filter(d => d.id !== state.designerProcessId);
    return `
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span style="font-size:13px;">${meta.icon}</span>
          <span style="font-size:11px;color:var(--text);font-weight:500;">${meta.name}</span>
          <span class="lbl" style="margin-left:6px;">Hedef süreç:</span>
          <select onchange="updateAction('${stepId}','${trigger}',${idx},'targetDefId',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;flex:1;">
            <option value="">— Seç —</option>
            ${otherDefs.map(d => `<option value="${d.id}" ${action.targetDefId===d.id?'selected':''}>${d.icon||''} ${escapeHtml(d.name)}</option>`).join('')}
          </select>
          <button class="icon-btn delete" onclick="removeAction('${stepId}','${trigger}',${idx})" type="button" style="margin-left:auto;width:20px;height:20px;font-size:10px;">×</button>
        </div>
        <div style="font-size:10px;color:var(--text-mute);padding:4px;">Yeni süreç aynı talep sahibi için açılır</div>
      </div>
    `;
  }

  return `<div style="font-size:10px;color:var(--text-mute);">Bilinmeyen eylem: ${action.type}</div>`;
}

function renderRecipientPicker(stepId, trigger, idx, recipient) {
  recipient = recipient || { type: 'owner' };
  const isSpecific = recipient.type === 'specific';
  const isRole = recipient.type === 'role';
  return `
    <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'type',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
      <option value="owner" ${recipient.type==='owner'?'selected':''}>Talep sahibi</option>
      <option value="approver" ${recipient.type==='approver'?'selected':''}>Onaylayan kişi</option>
      <option value="manager" ${recipient.type==='manager'?'selected':''}>Talep sahibinin müdürü</option>
      <option value="role" ${isRole?'selected':''}>Rol</option>
      <option value="specific" ${isSpecific?'selected':''}>Belirli kişi</option>
    </select>
    ${isRole ? `
      <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'role',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
        ${['worker','manager','hr','admin'].map(r => `<option value="${r}" ${recipient.role===r?'selected':''}>${r}</option>`).join('')}
      </select>
    ` : ''}
    ${isSpecific ? `
      <select onchange="updateActionRecipient('${stepId}','${trigger}',${idx},'userId',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;">
        <option value="">— Seç —</option>
        ${state.users.map(u => `<option value="${u.id}" ${recipient.userId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
      </select>
    ` : ''}
  `;
}

function toggleStepActions(sid) {
  state._expandedActions = state._expandedActions === sid ? null : sid;
  const def = getDef(state.designerProcessId);
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function addAction(stepId, trigger, type) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  const newAction = { type, recipient: { type: 'owner' } };
  // Tip bazlı varsayılan içerik
  if (type === 'send_email') {
    newAction.subject = `${def.name} - ${s.title}`;
    newAction.body = `Sayın {{user.name}},\n\n{{instance.id}} numaralı talebinizle ilgili durum: ${s.title}.\n\nİyi günler.`;
  } else if (type === 'send_sms' || type === 'send_whatsapp') {
    newAction.body = `{{user.name}}, {{instance.id}} - ${s.title}`;
  } else if (type === 'generate_pdf') {
    newAction.filename = `belge-{{instance.id}}.pdf`;
    newAction.title = def.name;
  } else if (type === 'start_process') {
    newAction.targetDefId = '';
  }
  actions[trigger].push(newAction);
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function removeAction(stepId, trigger, idx) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  actions[trigger].splice(idx, 1);
  persist();
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function updateAction(stepId, trigger, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  if (!actions[trigger][idx]) return;
  actions[trigger][idx][key] = val;
  persist();
  // Bu input/textarea, re-render tetiklersek odak kaybolur - sadece persist
}

function updateActionRecipient(stepId, trigger, idx, key, val) {
  const def = getDef(state.designerProcessId);
  const s = def.steps.find(x => x.id === stepId);
  if (!s) return;
  const actions = getStepActions(s);
  if (!actions[trigger][idx]) return;
  if (!actions[trigger][idx].recipient) actions[trigger][idx].recipient = {};
  actions[trigger][idx].recipient[key] = val;
  // Tip değiştiğinde ek alanları resetle
  if (key === 'type') {
    if (val === 'role') actions[trigger][idx].recipient.role = 'manager';
    if (val === 'specific') actions[trigger][idx].recipient.userId = state.users[0]?.id || '';
  }
  persist();
  // Sadece bu adımın eylem alanını yeniden render et - tüm listeyi yenilesek odak kaybolur
  // Basit çözüm: tüm steps-list yenile (eylem editörü zaten açık)
  document.getElementById('steps-list').innerHTML = renderStepsList(def);
}

function removeStep(sid) {
  const def = getDef(state.designerProcessId);
  def.steps = def.steps.filter(s => s.id !== sid);
  // Bu adıma referans veren geçişleri sil
  def.transitions = def.transitions.filter(t => t.from !== sid && t.to !== sid);
  // Başlangıç bu ise yenile
  if (def.startStep === sid) {
    const first = def.steps.find(s => s.type !== 'end-good' && s.type !== 'end-bad');
    def.startStep = first ? first.id : null;
  }
  persist();
  renderDesignerOnly();
}

// -- GEÇİŞLER --
function renderTransitionsList(def) {
  if (def.transitions.length === 0) {
    return '<div style="font-size:12px;color:var(--text-mute);padding:8px;">Henüz geçiş yok. Adımlar arası akışı tanımlayın.</div>';
  }
  return def.transitions.map((t, idx) => `
    <div class="trans-row" data-idx="${idx}">
      <select onchange="updateTransition(${idx},'from',this.value)">
        ${def.steps.filter(s => s.type !== 'end-good' && s.type !== 'end-bad').map(s =>
          `<option value="${s.id}" ${t.from===s.id?'selected':''}>${escapeHtml(s.title)}</option>`
        ).join('')}
      </select>
      <div class="trans-arrow">+</div>
      <select onchange="updateTransition(${idx},'when',this.value)">
        ${['approve','reject','pass','fail'].map(w => `<option ${t.when===w?'selected':''}>${w}</option>`).join('')}
      </select>
      <div class="trans-arrow">→</div>
      <select onchange="updateTransition(${idx},'to',this.value)">
        ${def.steps.map(s => `<option value="${s.id}" ${t.to===s.id?'selected':''}>${escapeHtml(s.title)}</option>`).join('')}
      </select>
      <button class="icon-btn delete" onclick="removeTransition(${idx})">×</button>
    </div>
  `).join('');
}

function addTransition() {
  const def = getDef(state.designerProcessId);
  const nonEnd = def.steps.filter(s => s.type !== 'end-good' && s.type !== 'end-bad');
  if (nonEnd.length === 0) { notify('Önce adım ekleyin', 'error'); return; }
  def.transitions.push({ from: nonEnd[0].id, when: 'approve', to: def.steps[def.steps.length-1].id });
  persist();
  document.getElementById('trans-list').innerHTML = renderTransitionsList(def);
  updatePreview();
}

function updateTransition(idx, key, val) {
  const def = getDef(state.designerProcessId);
  if (!def.transitions[idx]) return;
  def.transitions[idx][key] = val;
  persist();
  updatePreview();
}

function removeTransition(idx) {
  const def = getDef(state.designerProcessId);
  def.transitions.splice(idx, 1);
  persist();
  document.getElementById('trans-list').innerHTML = renderTransitionsList(def);
  updatePreview();
}

function saveAndClose() {
  // Validasyon
  const def = getDef(state.designerProcessId);
  if (!def.name || def.name === 'Yeni Süreç') {
    if (!confirm('Süreç adı varsayılan. Yine de kaydedeyim mi?')) return;
  }
  if (def.steps.length === 0) { notify('En az bir adım gerekli', 'error'); return; }
  if (!def.startStep) { notify('Başlangıç adımı seçilmemiş', 'error'); return; }
  persist();
  closeDesigner();
  notify('Süreç kaydedildi', 'success');
}

function saveActivateAndClose(defId) {
  const def = getDef(defId);
  if (!def) return;
  // Validasyon
  if (!def.name || def.name === 'Yeni Süreç') {
    if (!confirm('Süreç adı varsayılan. Yine de aktifleştirip kaydedeyim mi?')) return;
  }
  if (def.steps.length === 0) { notify('En az bir adım gerekli', 'error'); return; }
  if (!def.startStep) { notify('Başlangıç adımı seçilmemiş', 'error'); return; }
  // Aktif et + kaydet
  def.active = true;
  persist();
  closeDesigner();
  notify(`"${def.name}" aktifleştirildi ve kaydedildi`, 'success');
}

// Önizleme sekmesi - Akış / Form
function setPreviewTab(tab) {
  state._previewTab = tab;
  renderDesignerOnly();
}

// Önizleme alanı render - aktif sekmeye göre
function renderDesignerPreview(def) {
  const tab = state._previewTab || 'flow';
  if (tab === 'form') return renderFormPreview(def);
  return `
    ${renderProcessPreview(def)}
    <div class="preview-note">Akışı düzenledikçe diyagram otomatik güncellenir</div>
  `;
}

// Çalışanın göreceği gerçek form önizlemesi
function renderFormPreview(def) {
  if (!def.fields || def.fields.length === 0) {
    return `
      <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">
        Henüz form alanı yok. Sol panelden ekleyin.
      </div>
      <div class="preview-note">Bu, çalışanın talep açarken göreceği formdur</div>
    `;
  }

  const fieldsHtml = def.fields.map(f => {
    let inputHtml = '';
    if (f.type === 'date') {
      inputHtml = `<input type="date" disabled style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;cursor:default;">`;
    } else if (f.type === 'number') {
      inputHtml = `<input type="number" disabled placeholder="${escapeHtml(f.placeholder||'0')}" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;cursor:default;">`;
    } else if (f.type === 'textarea') {
      inputHtml = `<textarea disabled placeholder="${escapeHtml(f.placeholder||'')}" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;min-height:50px;font-family:var(--sans);cursor:default;"></textarea>`;
    } else if (f.type === 'select') {
      const opts = (f.options||[]).map(o => `<option>${escapeHtml(o.label)}</option>`).join('');
      inputHtml = `<select disabled style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;cursor:default;"><option>Seçin...</option>${opts}</select>`;
    } else {
      inputHtml = `<input type="text" disabled placeholder="${escapeHtml(f.placeholder||'')}" style="width:100%;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;cursor:default;">`;
    }
    return `
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px;font-weight:500;">
          ${escapeHtml(f.label)} ${f.required ? '<span style="color:var(--red);">*</span>' : ''}
        </label>
        ${inputHtml}

// ============== 7) DİYAGRAM ÖNİZLEME ==============

function renderProcessPreview(def) {
  if (!def || def.steps.length === 0) {
    return `<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Henüz adım yok</div>`;
  }

  // Adımları "katman" mantığıyla yerleştir (topological düzen)
  const layers = computeLayers(def);
  if (!layers) {
    return `<div style="padding:20px;color:var(--amber);font-size:11px;">Akışta döngü veya bağlantısız adım var. Yine de gösteriliyor:</div>` + renderRawPreview(def);
  }

  const W = 340, ROW = 80;
  const layerCount = layers.length;
  const H = Math.max(layerCount * ROW + 20, 120);

  // Her adımın pozisyonunu hesapla
  const positions = {};
  layers.forEach((layer, li) => {
    const y = 20 + li * ROW;
    const xStep = W / (layer.length + 1);
    layer.forEach((sid, si) => {
      positions[sid] = { x: xStep * (si + 1), y };
    });
  });

  // Adımı dikdörtgen olarak çiz
  let nodes = '';
  for (const sid in positions) {
    const p = positions[sid];
    const s = def.steps.find(x => x.id === sid);
    if (!s) continue;
    const color = s.type === 'system' ? '#a78bfa' :
                  s.type === 'human' ? '#4a9eff' :
                  s.type === 'end-good' ? '#4ade80' : '#f87171';
    const bg = s.type === 'system' ? 'rgba(167,139,250,0.15)' :
               s.type === 'human' ? 'rgba(74,158,255,0.15)' :
               s.type === 'end-good' ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
    const w = 110, h = 38;
    const title = s.title.length > 18 ? s.title.slice(0, 16) + '…' : s.title;
    const isStart = sid === def.startStep;
    nodes += `
      <g>
        <rect x="${p.x - w/2}" y="${p.y - h/2}" width="${w}" height="${h}" rx="5"
              fill="${bg}" stroke="${color}" stroke-width="${isStart ? 2 : 1}"/>
        <text x="${p.x}" y="${p.y + 4}" text-anchor="middle"
              fill="${color}" font-size="11" font-family="system-ui" font-weight="500">${escapeHtml(title)}</text>
        ${isStart ? `<circle cx="${p.x - w/2 - 6}" cy="${p.y}" r="3" fill="${color}"/>` : ''}
      </g>
    `;
  }

  // Geçişleri çiz
  let edges = '';
  def.transitions.forEach(t => {
    const from = positions[t.from];
    const to = positions[t.to];
    if (!from || !to) return;
    const isPositive = t.when === 'approve' || t.when === 'pass';
    const color = isPositive ? '#4ade80' : '#f87171';
    const dy = to.y - from.y;
    // Sadece düz aşağı veya çok kavisli
    let path;
    if (Math.abs(to.x - from.x) < 5) {
      path = `M ${from.x} ${from.y + 19} L ${to.x} ${to.y - 19}`;
    } else {
      const my = (from.y + to.y) / 2;
      path = `M ${from.x} ${from.y + 19} C ${from.x} ${my}, ${to.x} ${my}, ${to.x} ${to.y - 19}`;
    }
    edges += `
      <path d="${path}" stroke="${color}" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity="0.7"/>
      <text x="${(from.x + to.x)/2}" y="${(from.y + to.y)/2}" text-anchor="middle"
            fill="${color}" font-size="9" font-family="monospace" opacity="0.9"
            style="paint-order:stroke;stroke:var(--panel);stroke-width:3px;">${t.when}</text>
    `;
  });

  return `
    <svg class="preview-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-height:${H + 20}px;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      ${edges}
      ${nodes}
    </svg>
    <div style="display:flex;gap:10px;font-size:10px;color:var(--text-dim);margin-top:10px;flex-wrap:wrap;">
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(167,139,250,0.3);border:1px solid #a78bfa;vertical-align:middle;margin-right:3px;"></span>Sistem</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(74,158,255,0.3);border:1px solid #4a9eff;vertical-align:middle;margin-right:3px;"></span>İnsan</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(74,222,128,0.3);border:1px solid #4ade80;vertical-align:middle;margin-right:3px;"></span>Son ✓</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(248,113,113,0.3);border:1px solid #f87171;vertical-align:middle;margin-right:3px;"></span>Son ✕</span>
      <span style="margin-left:auto;"><span style="display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;vertical-align:middle;margin-right:3px;"></span>Başlangıç</span>
    </div>
  `;
}

// Adımları "kaç adım uzaklıkta" olduklarına göre katmanlara yerleştir
function computeLayers(def) {
  if (!def.startStep) return null;
  const depths = { [def.startStep]: 0 };
  const queue = [def.startStep];
  let maxIter = 200;
  while (queue.length && maxIter--) {
    const cur = queue.shift();
    const outs = def.transitions.filter(t => t.from === cur);
    for (const t of outs) {
      const proposed = depths[cur] + 1;
      if (depths[t.to] === undefined || depths[t.to] < proposed) {
        depths[t.to] = proposed;
        queue.push(t.to);
      }
    }
  }
  // Eklenmemiş adımları (bağlantısız) sona koy
  let maxDepth = 0;
  Object.values(depths).forEach(d => { if (d > maxDepth) maxDepth = d; });
  def.steps.forEach(s => {
    if (depths[s.id] === undefined) depths[s.id] = maxDepth + 1;
  });
  // Katmanlara grupla
  const layers = [];
  Object.entries(depths).forEach(([sid, d]) => {
    if (!layers[d]) layers[d] = [];
    layers[d].push(sid);
  });
  return layers.filter(Boolean);
}

function renderRawPreview(def) {
  return `<div style="font-size:12px;padding:10px;">
    ${def.steps.map(s => `<div style="padding:4px 0;">→ ${escapeHtml(s.title)} <span style="color:var(--text-mute);font-size:10px;">[${s.type}]</span></div>`).join('')}
  </div>`;
}

function getStation(id) { return STATIONS.find(s => s.id === id); }

function getStationOperators(stationId) {
  const a = state.stationAssignments.find(x => x.stationId === stationId);
  return a ? a.operatorIds : [];
}

function isUserOperatorOf(stationId, userId) {
  return getStationOperators(stationId).includes(userId);
}

// Kullanıcının sorumlu olduğu istasyonları döndür
function getMyStations(userId) {
  return state.stationAssignments
    .filter(a => a.operatorIds.includes(userId))
    .map(a => getStation(a.stationId))
    .filter(Boolean);
}

function getOrdersAtStation(stationId) {
  return state.orders.filter(o => o.currentStation === stationId && o.status === 'in_progress');
}

// Operatör "başla" der → durum aktif olur
function startWorkOnOrder(orderId) {
  if (!hasPermission(state.currentUser, 'production_start_task')) {
    notify('Üretim başlatma yetkiniz yok', 'error');
    return;
  }
  const o = state.orders.find(o => o.id === orderId);
  if (!o) return;
  if (o.currentTask && o.currentTask.status === 'started') {
    notify('Bu siparişte zaten başlamış bir iş var', 'error'); return;
  }
  o.currentTask = {
    startedBy: state.currentUser,
    startedAt: Date.now(),
    status: 'started'
  };
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: o.currentStation,
    event: 'started',
    by: state.currentUser,
    at: Date.now()
  });
  persist();
  renderAll();
  notify(`${orderId} — ${getStation(o.currentStation).name} başladı`, 'success');
}

// Operatör "bittiği" der → bir sonraki istasyona geçer
function finishWorkOnOrder(orderId) {
  if (!hasPermission(state.currentUser, 'production_finish_task')) {
    notify('Üretim tamamlama yetkiniz yok', 'error');
    return;
  }
  const o = state.orders.find(o => o.id === orderId);
  if (!o) return;
  const fromStation = o.currentStation;
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: fromStation,
    event: 'finished',
    by: state.currentUser,
    at: Date.now(),
    startedAt: o.currentTask?.startedAt
  });

  if (fromStation >= STATIONS.length) {
    // Son istasyondaydı → tamamlandı
    o.status = 'completed';
    o.currentStation = STATIONS.length + 1;
    o.completedAt = Date.now();
    o.currentTask = null;
    notify(`${orderId} sevk edildi!`, 'success');
    // Müdüre bildirim
    state.users.filter(u => u.roles.includes('manager')).forEach(m => {
      pushNotif(m.id, `🏭 ${orderId} sevk edildi (${o.product})`, null);
    });
  } else {
    // Bir sonraki istasyona geç
    o.currentStation += 1;
    o.currentTask = null;
    notify(`${orderId} → ${getStation(o.currentStation).name}`, 'success');
    // Yeni istasyon operatörlerine bildirim
    getStationOperators(o.currentStation).forEach(opId => {
      pushNotif(opId, `🏭 ${orderId} (${o.product}) - ${getStation(o.currentStation).name} adımına geldi`, null);
    });
  }
  persist();
  renderAll();
}

// Operatör "geri al" der → bir önceki istasyona geri
function rewindOrder(orderId) {
  const o = state.orders.find(o => o.id === orderId);
  if (!o || o.currentStation <= 1) return;
  if (!confirm(`${orderId} bir önceki istasyona geri alınsın mı?`)) return;
  o.currentStation -= 1;
  o.currentTask = null;
  o.status = 'in_progress';
  state.productionLog.push({
    id: uid('PL'),
    orderId,
    stationId: o.currentStation,
    event: 'rewind',
    by: state.currentUser,
    at: Date.now()
  });
  persist();
  renderAll();
  notify(`${orderId} geri alındı`, 'success');
}

function saveNewOrder() {

  if (!o) return;
  if (!confirm(`${orderId} silinsin mi?`)) return;

  persist();
  renderAll();
  notify('Sipariş silindi', 'success');
