<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabrika Platformu — MVP v0.4 Firebase</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --panel-2: #232a34;
    --panel-3: #2d3540;
    --border: #2d3540;
    --border-hi: #3d4854;
    --text: #e4e8ee;
    --text-dim: #8a95a3;
    --text-mute: #5a6470;
    --accent: #4a9eff;
    --accent-soft: #1e3a5f;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --teal: #5eead4;
    --mono: 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-rows: 56px 40px 1fr;
    height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand-mark {
    width: 28px; height: 28px;
    background: var(--accent); color: #000;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-family: var(--mono);
  }
  .brand-sub { font-size: 11px; color: var(--text-mute); font-weight: 400; margin-left: 6px; }

  .role-switch {
    display: flex;
    background: var(--bg); border-radius: 8px;
    padding: 3px; border: 1px solid var(--border-hi);
    flex-shrink: 1; overflow-x: auto;
  }
  .role-btn {
    background: transparent; border: none;
    color: var(--text-dim);
    padding: 6px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: var(--sans);
    display: flex; align-items: center; gap: 6px;
  }
  .role-btn:hover { color: var(--text); }
  .role-btn.active { background: var(--accent); color: #000; font-weight: 600; }
  .role-btn .badge {
    background: var(--panel-2); color: var(--text-dim);
    font-size: 10px; padding: 1px 6px; border-radius: 10px;
    font-family: var(--mono); min-width: 18px; text-align: center;
  }
  .role-btn.active .badge { background: rgba(0,0,0,0.25); color: #000; }

  /* HEADER ARAMA */
  .header-search {
    flex: 0 1 320px; position: relative;
  }
  .header-search input {
    width: 100%; padding: 7px 12px;
    background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: 6px; color: var(--text); font-size: 12px;
    font-family: var(--sans); transition: border 0.15s;
  }
  .header-search input:focus {
    outline: none; border-color: var(--accent);
  }
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--border-hi);
    border-radius: 6px; max-height: 400px; overflow-y: auto;
    z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .search-result-item {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .search-result-item:hover { background: var(--panel-2); }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-icon { font-size: 16px; flex: 0 0 auto; }
  .search-result-info { flex: 1; min-width: 0; }
  .search-result-title { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-result-sub { font-size: 10px; color: var(--text-mute); margin-top: 2px; }
  .search-result-empty { padding: 14px; text-align: center; color: var(--text-mute); font-size: 11px; }

  /* FİLTRE BARI - main üstünde */
  .filter-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 0 12px;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .filter-bar select {
    background: var(--panel-2); border: 1px solid var(--border-hi);
    color: var(--text); padding: 5px 8px; border-radius: 4px;
    font-size: 11px; font-family: var(--sans); cursor: pointer;
  }
  .filter-bar select:focus { outline: none; border-color: var(--accent); }
  .filter-bar .filter-label {
    font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1px;
    margin-right: 4px;
  }
  .filter-bar .filter-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel-2); border: 1px solid var(--border-hi);
    color: var(--text-dim); padding: 4px 10px; border-radius: 12px;
    font-size: 11px; cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .filter-bar .filter-chip:hover { color: var(--text); border-color: var(--accent); }
  .filter-bar .filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  .filter-bar .filter-clear {
    color: var(--accent); cursor: pointer; font-size: 11px; padding: 4px 8px;
    margin-left: auto;
  }
  .filter-bar .filter-result-count {
    color: var(--text-mute); font-size: 11px; margin-left: 8px;
  }

  /* "ŞU ANDA KİMDE" KUTUSU */
  .who-box {
    background: linear-gradient(135deg, rgba(74,158,255,0.12), rgba(74,158,255,0.06));
    border: 1px solid var(--accent); border-radius: 6px;
    padding: 12px 14px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .who-box.completed {
    background: linear-gradient(135deg, rgba(74,222,128,0.1), rgba(74,222,128,0.04));
    border-color: var(--green);
  }
  .who-box.rejected {
    background: linear-gradient(135deg, rgba(248,113,113,0.1), rgba(248,113,113,0.04));
    border-color: var(--red);
  }
  .who-box-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #000;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .who-box-info { flex: 1; }
  .who-box-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 2px; }
  .who-box-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .who-box-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .bell {
    position: relative;
    background: transparent; border: 1px solid var(--border-hi);
    color: var(--text);
    width: 34px; height: 34px; border-radius: 7px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .bell:hover { background: var(--panel-2); }
  .bell .count {
    position: absolute; top: -4px; right: -4px;
    background: var(--red); color: #000;
    font-size: 10px; font-weight: 700;
    width: 16px; height: 16px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
  }

  /* TOP TABS */
  .top-tabs {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px;
  }
  .top-tab {
    background: transparent; border: none;
    color: var(--text-dim); padding: 0 16px;
    height: 100%;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--sans);
    border-bottom: 2px solid transparent;
  }
  .top-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .top-tab:hover:not(.active) { color: var(--text); }

  /* VIEW (içerik) */
  .view {
    overflow: hidden;
    display: grid;
  }
  .view-work {
    grid-template-columns: 280px 1fr 340px;
  }
  .view-admin {
    grid-template-columns: 240px 1fr;
  }
  .view-calendar {
    grid-template-columns: 240px 1fr;
  }
  .view-reports {
    grid-template-columns: 1fr;
  }
  .view-notifications {
    grid-template-columns: 1fr;
  }
  .view-profile {
    grid-template-columns: 1fr;
  }
  .view-home {
    grid-template-columns: 1fr;
  }

  /* RAPORLAR */
  .rep-wrap { padding: 16px 24px; overflow-y: auto; height: 100%; }
  .rep-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
  }
  .rep-head h2 { font-size: 20px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  .rep-tabs { display: flex; gap: 4px; background: var(--panel-2); border-radius: 6px; padding: 3px; border: 1px solid var(--border); }
  .rep-tabs button {
    background: transparent; border: none; color: var(--text-dim);
    padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  .rep-tabs button.active { background: var(--accent); color: #000; font-weight: 600; }

  .rep-range { display: flex; gap: 2px; background: var(--panel-2); border-radius: 4px; padding: 2px; border: 1px solid var(--border); margin-left: auto; }
  .rep-range button {
    background: transparent; border: none; color: var(--text-dim);
    padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;
  }
  .rep-range button.active { background: var(--panel-3); color: var(--accent); }

  /* Sayı kartları */
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; transition: border 0.15s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .stat-card-value {
    font-size: 28px; font-weight: 700; font-family: var(--mono); color: var(--text);
    line-height: 1;
  }
  .stat-card-trend { font-size: 11px; margin-top: 6px; }
  .stat-card-trend.up { color: var(--green); }
  .stat-card-trend.down { color: var(--red); }
  .stat-card-trend.neutral { color: var(--text-mute); }

  /* Grafik bloku */
  .rep-block {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .rep-block-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rep-block-title-extra { font-size: 11px; color: var(--text-mute); font-weight: 400; }

  /* Tablo */
  .rep-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .rep-table th { text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
  .rep-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
  .rep-table tr:hover td { background: var(--panel-2); }
  .rep-table td.num { font-family: var(--mono); text-align: right; }
  .rep-table .progress-bar {
    height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 4px;
  }
  .rep-table .progress-bar > div { height: 100%; background: var(--accent); }

  /* SVG grafikler */
  .rep-chart { width: 100%; height: auto; }
  .rep-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1000px) { .rep-grid-2 { grid-template-columns: 1fr; } }

  /* TAKVİM */
  .cal-wrap { display: flex; flex-direction: column; height: 100%; padding: 16px 20px; overflow: hidden; }
  .cal-head {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .cal-head h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-nav button {
    background: var(--panel-2); border: 1px solid var(--border-hi); color: var(--text);
    width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  .cal-nav button:hover { background: var(--panel-3); border-color: var(--accent); }
  .cal-period {
    font-size: 14px; font-weight: 600; color: var(--text);
    padding: 0 12px; min-width: 160px; text-align: center;
  }
  .cal-view-switch { display: flex; gap: 2px; background: var(--panel-2); border-radius: 4px; padding: 2px; border: 1px solid var(--border); margin-left: auto; }
  .cal-view-switch button {
    background: transparent; border: none; color: var(--text-dim);
    padding: 4px 12px; border-radius: 3px; font-size: 11px; cursor: pointer; font-weight: 500;
  }
  .cal-view-switch button.active { background: var(--accent); color: #000; }
  .cal-body { flex: 1; overflow: auto; }

  /* Aylık görünüm */
  .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; height: 100%; min-height: 600px; }
  .cal-month-header {
    background: var(--panel-2); padding: 6px 8px; text-align: center;
    font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase;
  }
  .cal-month-cell {
    background: var(--bg); padding: 4px 6px; min-height: 90px;
    display: flex; flex-direction: column; cursor: pointer; transition: background 0.15s;
  }
  .cal-month-cell:hover { background: var(--panel-2); }
  .cal-month-cell.other-month { opacity: 0.4; }
  .cal-month-cell.today { background: rgba(74,158,255,0.08); border: 1px solid var(--accent); }
  .cal-day-num { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .cal-month-cell.today .cal-day-num { color: var(--accent); }
  .cal-event-chip {
    font-size: 10px; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px;
    background: var(--panel-2); color: var(--text); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 2px solid var(--accent);
  }
  .cal-event-chip:hover { background: var(--panel-3); }
  .cal-more-link { font-size: 10px; color: var(--accent); cursor: pointer; padding: 2px 5px; }

  /* Haftalık görünüm */
  .cal-week { display: grid; grid-template-columns: 50px repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; }
  .cal-week-header { background: var(--panel-2); padding: 6px 8px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-dim); }
  .cal-week-header.today { color: var(--accent); }
  .cal-week-hour { background: var(--bg); padding: 4px 6px; font-size: 10px; color: var(--text-mute); text-align: right; }
  .cal-week-cell { background: var(--bg); min-height: 32px; padding: 2px 4px; position: relative; }

  /* Günlük görünüm */
  .cal-day-list { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
  .cal-day-event {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; cursor: pointer;
  }
  .cal-day-event:hover { border-color: var(--accent); }
  .cal-day-event-icon { font-size: 18px; }
  .cal-day-event-title { font-weight: 500; font-size: 13px; }
  .cal-day-event-subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .cal-day-event-time { font-family: var(--mono); font-size: 11px; color: var(--text-mute); margin-left: auto; }

  /* Ajanda görünümü */
  .cal-agenda { display: flex; flex-direction: column; gap: 16px; padding: 12px; }
  .cal-agenda-day { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .cal-agenda-day-head {
    background: var(--panel-3); padding: 8px 12px; font-size: 12px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cal-agenda-day-head.today { background: rgba(74,158,255,0.15); color: var(--accent); }
  .cal-agenda-event {
    padding: 8px 12px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .cal-agenda-event:hover { background: var(--bg); }
  .cal-agenda-event:first-of-type { border-top: none; }

  /* Filtre paneli */
  .cal-filters { padding: 12px; }
  .cal-filter-group { margin-bottom: 14px; }
  .cal-filter-title {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .cal-filter-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 3px;
    cursor: pointer; font-size: 12px; color: var(--text); transition: background 0.15s;
  }
  .cal-filter-item:hover { background: var(--panel-2); }
  .cal-filter-item input { width: auto; cursor: pointer; }
  .cal-filter-color {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .cal-filter-count {
    margin-left: auto; font-size: 10px; color: var(--text-mute);
    background: var(--panel-2); padding: 1px 6px; border-radius: 8px;
  }

  /* SIDEBAR (work view) */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 10px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 12px;
  }
  .new-request-btn {
    width: 100%;
    background: var(--accent); color: #000;
    border: none; padding: 11px;
    border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--sans);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .new-request-btn:hover { background: #6bb1ff; }
  .process-pick {
    display: flex; flex-direction: column; gap: 6px;
    margin-top: 10px; max-height: 0; overflow: hidden;
    transition: max-height 0.25s;
  }
  .process-pick.open { max-height: 400px; }
  .process-pick button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-hi);
    padding: 8px 10px; border-radius: 4px;
    font-size: 12px; cursor: pointer; text-align: left;
    font-family: var(--sans);
  }
  .process-pick button:hover { border-color: var(--accent); background: var(--panel-3); }

  /* FAB varsayılan gizli (masaüstü dahil); sadece mobilde body.show-fab açar */
  .fab-new-request { display: none; }

  /* Modal süreç seçici (FAB) liste stilleri */
  .picker-list { display: flex; flex-direction: column; gap: 8px; }
  .picker-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-hi);
    padding: 14px 14px; border-radius: 8px;
    font-size: 15px; cursor: pointer; text-align: left;
    font-family: var(--sans); width: 100%;
  }
  .picker-row:hover { border-color: var(--accent); background: var(--panel-3); }
  .picker-row .picker-icon { font-size: 20px; }
  .picker-row .picker-name { flex: 1; font-weight: 500; }
  .picker-row .picker-arrow { color: var(--text-dim); font-size: 20px; }

  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
  }
  .user-name { font-size: 13px; font-weight: 500; }
  .user-role { font-size: 11px; color: var(--text-dim); }

  .stat-row {
    display: flex; justify-content: space-between;
    padding: 6px 0;
    font-size: 12px; color: var(--text-dim);
  }
  .stat-row strong { color: var(--text); font-family: var(--mono); font-weight: 600; }

  /* MAIN (work view) */
  main {
    background: var(--bg);
    overflow-y: auto;
    padding: 20px 24px;
  }
  .main-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .main-head h1 { font-size: 18px; font-weight: 600; }
  .sub-tabs {
    display: flex; gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sub-tab {
    background: transparent; border: none;
    color: var(--text-dim); padding: 10px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: var(--sans);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .sub-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .sub-tab .count {
    background: var(--panel-2); color: var(--text-dim);
    font-size: 11px; padding: 1px 6px; border-radius: 8px;
    font-family: var(--mono); margin-left: 6px;
  }
  .sub-tab.active .count { background: var(--accent); color: #000; }

  .item-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 8px;
    position: relative;
  }
  .item-card:hover { border-color: var(--border-hi); background: var(--panel-2); }
  .item-card.selected { border-color: var(--accent); background: var(--panel-2); }
  .item-card.task-urgent { border-left: 3px solid var(--amber); }
  .item-row1 {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .item-title {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .item-id {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-mute);
    background: var(--panel-2);
    padding: 2px 6px; border-radius: 3px;
  }
  .item-time { font-family: var(--mono); font-size: 11px; color: var(--text-mute); }
  .item-meta {
    font-size: 12px; color: var(--text-dim);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .status-pill {
    display: inline-block;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase;
  }
  .status-running { background: rgba(74,158,255,0.15); color: var(--accent); }
  .status-completed { background: rgba(74,222,128,0.15); color: var(--green); }
  .status-rejected { background: rgba(248,113,113,0.15); color: var(--red); }
  .status-pending { background: rgba(251,191,36,0.15); color: var(--amber); }

  .empty { text-align: center; padding: 48px 24px; color: var(--text-mute); font-size: 13px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

  /* DETAIL PANEL */
  .detail {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .detail-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .detail-sub { font-size: 12px; color: var(--text-dim); }
  .detail-body { padding: 16px; flex: 1; overflow-y: auto; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 {
    font-size: 10px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 10px;
  }
  .kv {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { color: var(--text); font-family: var(--mono); font-size: 12px; text-align: right; max-width: 60%; word-break: break-word; }

  .history { position: relative; padding-left: 20px; }
  .history::before {
    content: ''; position: absolute;
    left: 5px; top: 8px; bottom: 8px;
    width: 1px; background: var(--border-hi);
  }
  .history-item { position: relative; padding: 6px 0 14px 0; font-size: 12px; }
  .history-item::before {
    content: ''; position: absolute;
    left: -19px; top: 10px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--text-mute);
  }
  .history-item.approve::before { border-color: var(--green); background: var(--green); }
  .history-item.reject::before { border-color: var(--red); background: var(--red); }
  .history-item.system::before { border-color: var(--accent); }
  .history-time { font-family: var(--mono); font-size: 10px; color: var(--text-mute); }
  .history-text { color: var(--text); margin-top: 2px; }
  .history-comment {
    margin-top: 4px; padding: 6px 8px;
    background: var(--panel-2); border-radius: 4px;
    color: var(--text-dim); font-style: italic; font-size: 11px;
  }

  .action-bar {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; gap: 8px;
  }
  .btn {
    flex: 1; padding: 10px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--sans);
    border: 1px solid var(--border-hi);
    background: var(--panel-2); color: var(--text);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover:not(:disabled) { background: var(--panel-3); }
  .btn.approve { background: var(--green); color: #0a1410; border-color: var(--green); }
  .btn.approve:hover { background: #5deb8d; }
  .btn.reject { background: var(--red); color: #1a0606; border-color: var(--red); }
  .btn.reject:hover { background: #fa8989; }
  .btn-sm { padding: 6px 10px; font-size: 12px; flex: 0; }

  /* ============= ADMIN VIEW ============= */
  .admin-nav {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
  }
  .admin-nav-title {
    font-size: 10px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim);
    padding: 0 8px; margin-bottom: 10px;
  }
  .admin-nav-item {
    display: block; width: 100%;
    background: transparent; border: none;
    color: var(--text-dim); text-align: left;
    padding: 9px 10px; border-radius: 5px;
    font-size: 13px; cursor: pointer;
    font-family: var(--sans);
    margin-bottom: 2px;
  }
  .admin-nav-item:hover { background: var(--panel-2); color: var(--text); }
  .admin-nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  .admin-content {
    background: var(--bg);
    overflow-y: auto;
    padding: 24px;
  }
  .admin-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .admin-head h2 { font-size: 18px; font-weight: 600; }
  .admin-head p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .primary-btn {
    background: var(--accent); color: #000;
    border: none; padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--sans);
  }
  .primary-btn:hover { background: #6bb1ff; }
  .ghost-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-hi);
    padding: 7px 12px; border-radius: 5px;
    font-size: 12px; cursor: pointer;
    font-family: var(--sans);
  }
  .ghost-btn:hover { background: var(--panel-3); }
  .danger-btn {
    background: transparent; color: var(--red);
    border: 1px solid var(--red); 
    padding: 7px 12px; border-radius: 5px;
    font-size: 12px; cursor: pointer; font-family: var(--sans);
  }
  .danger-btn:hover { background: rgba(248,113,113,0.1); }

  /* Tablo */
  .data-table {
    width: 100%; border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .data-table th {
    text-align: left;
    padding: 11px 14px;
    background: var(--panel-2);
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .data-table td {
    padding: 12px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--panel-2); }
  .data-table .actions {
    display: flex; gap: 6px; justify-content: flex-end;
  }
  .table-empty {
    padding: 36px; text-align: center; color: var(--text-mute);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }

  /* PROCESS DESIGNER */
  .designer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .designer-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .designer-head .title-row {
    display: flex; align-items: center; gap: 10px;
  }
  .designer-head input.title-input {
    background: var(--bg);
    border: 1px solid var(--border-hi);
    color: var(--text);
    padding: 8px 12px; border-radius: 5px;
    font-size: 15px; font-weight: 600;
    font-family: var(--sans);
    min-width: 260px;
  }
  .designer-head input.icon-input {
    width: 50px;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border-hi);
    color: var(--text);
    padding: 8px;
    border-radius: 5px;
    font-size: 16px;
  }
  .designer-body {
    display: grid;
    grid-template-columns: 1fr 380px;
    min-height: 500px;
  }
  .designer-left {
    padding: 18px 20px;
    border-right: 1px solid var(--border);
  }
  .designer-right {
    background: var(--bg);
    padding: 18px 20px;
    overflow-y: auto;
    max-height: calc(100vh - 240px);
  }
  .designer-section {
    margin-bottom: 24px;
  }
  .designer-section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .designer-section-head h3 {
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .add-mini {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: var(--sans);
  }
  .add-mini:hover { background: var(--accent); color: #000; }

  .field-row, .step-row, .trans-row {
    background: var(--bg);
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: grid;
    align-items: center; gap: 10px;
  }
  .field-row { grid-template-columns: 24px 1fr 1fr 110px 26px 26px; }
  .step-row { grid-template-columns: 24px 1fr 1fr 1fr 26px 26px; }
  .trans-row { grid-template-columns: 1fr 28px 1fr 28px 1fr 26px; }

  .field-row .ord, .step-row .ord {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-mute); text-align: center;
  }
  .field-row input, .field-row select,
  .step-row input, .step-row select,
  .trans-row select, .trans-row input {
    background: var(--panel); 
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px; border-radius: 4px;
    font-size: 12px; font-family: var(--sans);
    width: 100%;
  }
  .field-row input:focus, .field-row select:focus,
  .step-row input:focus, .step-row select:focus,
  .trans-row select:focus, .trans-row input:focus {
    outline: none; border-color: var(--accent);
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--border-hi);
    color: var(--text-dim);
    width: 26px; height: 26px; border-radius: 4px;
    cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-hi); }
  .icon-btn.delete:hover { color: var(--red); border-color: var(--red); }
  .trans-arrow { color: var(--text-mute); text-align: center; }

  .step-row.system { border-left: 3px solid var(--purple); }
  .step-row.human { border-left: 3px solid var(--accent); }
  .step-row.end-good { border-left: 3px solid var(--green); }
  .step-row.end-bad { border-left: 3px solid var(--red); }

  .rule-builder {
    background: var(--panel-2);
    padding: 8px 10px;
    border-radius: 4px;
    margin-top: 6px;
    display: flex; gap: 6px; align-items: center;
    grid-column: 1 / -1;
    font-size: 11px;
  }
  .rule-builder .lbl { color: var(--text-mute); font-size: 11px; }
  .rule-builder select, .rule-builder input {
    background: var(--bg); 
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px; border-radius: 3px;
    font-size: 11px; font-family: var(--sans);
  }

  .designer-foot {
    background: var(--panel-2);
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .designer-foot .left { display: flex; gap: 8px; }

  /* SVG preview */
  .preview-svg {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .preview-note {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 8px; text-align: center;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    width: 480px; max-width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal.wide { width: 720px; }
  .modal-head {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { font-size: 15px; font-weight: 600; }
  .modal-close {
    background: transparent; border: none;
    color: var(--text-dim); font-size: 18px; cursor: pointer;
  }
  .modal-body { padding: 20px; }
  .modal-foot {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .form-field { margin-bottom: 14px; }
  .form-field label {
    display: block;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim);
    margin-bottom: 5px; font-weight: 500;
  }
  .form-field label .req { color: var(--red); margin-left: 2px; }
  .field-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .form-field input, .form-field textarea, .form-field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-hi);
    color: var(--text);
    padding: 9px 11px; border-radius: 5px;
    font-family: var(--sans); font-size: 13px;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
    outline: none; border-color: var(--accent);
  }
  .form-field textarea { resize: vertical; min-height: 60px; }
  .form-field .hint { font-size: 11px; color: var(--text-mute); margin-top: 3px; }

  .notif-pop {
    position: absolute;
    top: 50px; right: 20px;
    width: 360px; max-height: 400px;
    background: var(--panel);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    overflow-y: auto;
    z-index: 50; display: none;
  }
  .notif-pop.show { display: block; }
  .notif-pop-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 13px;
    display: flex; justify-content: space-between;
  }
  .notif-pop-head button {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 11px; cursor: pointer;
  }
  .notif-item {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; cursor: pointer;
  }
  .notif-item.unread { background: rgba(74,158,255,0.05); }
  .notif-time { font-family: var(--mono); font-size: 10px; color: var(--text-mute); margin-top: 2px; }
  .notif-pop-foot {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    text-align: center;
    background: var(--panel-2);
    position: sticky;
    bottom: 0;
  }
  .notif-see-all {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 10px;
    font-weight: 500;
  }
  .notif-see-all:hover {
    text-decoration: underline;
  }

  .toast-container {
    position: fixed; bottom: 20px; right: 20px;
    z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    padding: 12px 16px; min-width: 280px;
    font-size: 13px;
    animation: slidein 0.2s;
    border-left: 3px solid var(--accent);
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  @keyframes slidein {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }

  .badge-tag {
    display: inline-block;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 3px;
    background: var(--panel-2); color: var(--text-dim);
    font-family: var(--mono);
  }
  .badge-tag.active { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-tag.inactive { background: rgba(248,113,113,0.10); color: var(--text-mute); }
  .badge-tag.system-step { background: rgba(167,139,250,0.15); color: var(--purple); }
  .badge-tag.human-step { background: rgba(74,158,255,0.15); color: var(--accent); }

  /* ========== ÜRETİM MODÜLÜ ========== */
  .view-production {
    grid-template-columns: 300px 1fr 320px;
  }
  .prod-sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .prod-main {
    background: var(--bg);
    overflow-y: auto;
    padding: 20px 24px;
  }
  .prod-detail {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
  }
  .order-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .order-card:hover { border-color: var(--border-hi); background: var(--panel-3); }
  .order-card.selected { border-color: var(--accent); background: var(--panel-3); }
  .order-card.done { opacity: 0.6; }
  .order-id-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .order-id { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); }
  .order-qty { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .order-product { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .order-progress { display: flex; gap: 2px; margin-bottom: 6px; }
  .step-pill { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
  .step-pill.done { background: var(--green); }
  .step-pill.active { background: var(--amber); animation: pulse-step 2s infinite; }
  @keyframes pulse-step { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .order-step-name {
    font-size: 11px;
    color: var(--amber);
    font-weight: 500;
  }
  .order-step-name.done { color: var(--green); }

  .stations-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .station-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    transition: all 0.2s;
    position: relative;
  }
  .station-box.highlighted {
    border-color: var(--accent);
    background: var(--panel-2);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .station-box.has-work::before {
    content: '';
    position: absolute;
    top: 8px; right: 8px;
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 50%;
    animation: pulse-step 2s infinite;
  }
  .station-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-mute);
    margin-bottom: 3px;
  }
  .station-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .station-count {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .station-count.zero { color: var(--text-mute); }
  .station-sub {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .station-chips {
    margin-top: 8px;
    display: flex; flex-wrap: wrap; gap: 3px;
  }
  .station-chip {
    font-family: var(--mono);
    font-size: 9px;
    background: var(--bg);
    color: var(--text-dim);
    padding: 1px 5px;
    border-radius: 2px;
    border: 1px solid var(--border);
  }
  .station-chip.current {
    background: var(--accent); color: #000; border-color: var(--accent);
    font-weight: 600;
  }
  .prod-kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .kpi-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .kpi-label {
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .kpi-value {
    font-family: var(--mono);
    font-size: 20px; font-weight: 700;
  }
  .kpi-sub { font-size: 10px; color: var(--text-mute); margin-top: 2px; }

  .order-op-bar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-radius: 0 0 6px 6px;
  }
  .station-task-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .station-task {
    background: var(--bg);
    border: 1px solid var(--border-hi);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex; justify-content: space-between;
    align-items: center;
  }
  .station-task.task-mine {
    border-color: var(--amber);
  }
  .station-task .task-id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .station-task button {
    background: var(--green);
    color: #0a1410;
    border: none;
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  .station-task button.start { background: var(--accent); color: #000; }
  .station-task button:hover { opacity: 0.85; }

  /* ============================================ */
  /* MOBİL RESPONSIVE — FAZ 1: TEMEL ALTYAPI       */
  /* ============================================ */

  /* TABLET (768-1024px) */
  @media (max-width: 1024px) {
    .view-work {
      grid-template-columns: 240px 1fr;  /* Detay panelini gizle */
    }
    .view-work .detail {
      position: fixed;
      top: 0; right: 0;
      width: 360px;
      height: 100vh;
      z-index: 50;
      box-shadow: -4px 0 16px rgba(0,0,0,0.4);
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .view-work .detail.open {
      transform: translateX(0);
    }
  }

  /* MOBİL (< 768px) */
  @media (max-width: 768px) {
    /* HEADER — Sıkıştır */
    header {
      padding: 8px 10px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 13px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      font-size: 12px;
    }
    .brand-sub {
      display: none;  /* "platform v0.3" yazısını gizle */
    }
    .role-switch {
      max-width: 100%;
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .role-btn {
      font-size: 10px;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .header-search {
      order: 10;        /* Search'ı satırın sonuna it */
      flex: 1 1 100%;   /* Tek başına satır kaplasın */
      margin-top: 4px;
    }
    .header-search input {
      font-size: 13px;
      padding: 6px 10px;
    }
    .bell {
      font-size: 18px;
    }

    /* ÜST SEKMELER — yatay scroll */
    .top-tabs {
      overflow-x: auto;
      overflow-y: hidden;
      flex-wrap: nowrap;
      padding: 0 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;  /* Firefox */
    }
    .top-tabs::-webkit-scrollbar {
      display: none;  /* Chrome/Safari */
    }
    .top-tab {
      font-size: 12px;
      padding: 8px 12px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* VIEW — tek sütun */
    .view-work,
    .view-admin,
    .view-calendar {
      grid-template-columns: 1fr;
    }
    .view-reports {
      grid-template-columns: 1fr;
    }

    /* SIDEBAR — drawer (mobil yan menü) */
    .sidebar,
    #cal-sidebar,
    .prod-sidebar,
    .admin-sidebar {
      position: fixed;
      top: 96px;   /* header + top-tabs altında */
      left: 0;
      width: 280px;
      max-width: 85vw;
      height: calc(100vh - 96px);
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 16px rgba(0,0,0,0.4);
    }
    .sidebar.open,
    #cal-sidebar.open,
    .prod-sidebar.open,
    .admin-sidebar.open {
      transform: translateX(0);
    }

    /* Sidebar overlay (drawer açıkken arka plan koyu) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      z-index: 35;
    }
    .sidebar-overlay.open {
      display: block;
    }

    /* Mobil drawer butonları (header'a eklenecek) */
    .mobile-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-2);
      border: 1px solid var(--border-hi);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    @media (min-width: 769px) {
      .mobile-menu-btn { display: none; }
    }

    /* Mobil FAB — Yeni Talep Aç (sadece İş Akışları sekmesinde gösterilir, JS ile) */
    .fab-new-request {
      position: fixed;
      right: 18px;
      bottom: 22px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      z-index: 55;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .fab-new-request:active { transform: scale(0.92); }
    body.show-fab .fab-new-request { display: inline-flex; }

    /* DETAY PANEL — mobilde fullscreen modal */
    .view-work .detail {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 60;
    }
    .view-work .detail.open {
      transform: translateY(0);
    }
    /* Mobilde detay paneli üstüne kapatma butonu */
    .view-work .detail::before {
      content: '✕ Kapat';
      display: block;
      padding: 10px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    /* MODAL'lar mobilde fullwidth */
    .modal-content {
      max-width: 100vw !important;
      width: 100vw !important;
      max-height: 95vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
    }

    /* FORM girişleri büyük (parmak için) */
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="email"],
    textarea,
    select {
      font-size: 16px !important;  /* iOS zoom'u önler */
      min-height: 38px;
    }

    /* TOUCH HEDEFLERİ büyük */
    button,
    .filter-chip,
    .sub-tab,
    .top-tab,
    .role-btn {
      min-height: 36px;
    }

    /* FİLTRE BARI yatay scroll */
    .filter-bar {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .filter-bar::-webkit-scrollbar {
      height: 4px;
    }
    .filter-bar > * {
      flex-shrink: 0;
    }

    /* MAIN içerik padding daraltma */
    main {
      padding: 12px !important;
    }
    .main-head h1 {
      font-size: 18px !important;
    }

    /* SUB-TABS - yatay scroll */
    .sub-tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .sub-tab {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 12px;
    }

    /* STATUS CARDLARI rep-cards single col */
    .stat-cards {
      grid-template-columns: 1fr 1fr !important;  /* 2 sütun mobil */
    }
    @media (max-width: 480px) {
      .stat-cards {
        grid-template-columns: 1fr !important;  /* en darda tek */
      }
    }
  }

  /* DAR MOBİL (< 480px) — extra kompakt */
  @media (max-width: 480px) {
    header {
      gap: 4px;
    }
    .brand {
      font-size: 12px;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
    }
    .top-tab {
      font-size: 11px;
      padding: 7px 10px;
    }
    .role-btn {
      font-size: 9px;
      padding: 3px 6px;
    }
  }

  /* MOBİL — FAZ 2: İŞ AKIŞLARI CİLA                */
  /* ============================================ */
  @media (max-width: 768px) {
    /* TALEP / GÖREV KARTLARI */
    .item-card {
      padding: 12px 14px;
      margin-bottom: 8px;
    }

      flex-direction: column;

    /* SIDEBAR İÇERİĞİ (drawer açıkken) */

    .sidebar h2,
    .sidebar h3 {
      font-size: 12px;
    }
    .sidebar .process-btn {
      padding: 10px 12px;
      font-size: 13px;

    /* DETAY PANEL İÇERİĞİ */
    .view-work .detail .detail-head {

    /* AKSIYON BUTONLARI (Onayla/Reddet) - yan yana, kompakt */

    .action-bar .btn {
      flex: 1;

    }

    /* Tekrar Aç / Geri Çek butonları */
    .ghost-btn {

      font-size: 12px;

    }

    /* SÜREÇ GEÇMİŞİ (timeline) */
    .history-item {

    }

      font-size: 10px;

    /* FİLTRE BAR — daha sıkı düzen */
    .filter-bar {

    }

    .filter-bar .filter-chip {

    .form-field textarea,

    /* YAKLAŞAN TARİHLER kart düzeni */
    .upcoming-date-card {

    .upcoming-date-card .date-title {

    }
    .upcoming-date-card .date-meta {

    }

    /* MODAL içeriği */
    .modal-content .modal-head {
      padding: 14px;
      font-size: 14px;
    }
    .modal-content .modal-body {

      max-height: calc(95vh - 120px);

  @media (max-width: 1024px) {
    .view-production {
      grid-template-columns: 260px 1fr;
    }
    .prod-detail {
      position: fixed;
      top: 96px;
      right: 0;
      width: 320px;
      max-width: 90vw;
      height: calc(100vh - 96px);
      z-index: 50;
      box-shadow: -4px 0 16px rgba(0,0,0,0.4);

    }
    .prod-detail.open {
      transform: translateX(0);
    }
  }

    .rep-head {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding-bottom: 12px;
    }
    .rep-head h2 {
      font-size: 17px;
    }
    .rep-tabs {
      width: 100%;
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .rep-tabs button {
      padding: 6px 12px;
      font-size: 11px;
      flex: 1;
      white-space: nowrap;
    }
    .rep-range {
      width: 100%;
      margin-left: 0;
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .rep-range button {
      padding: 5px 10px;
      font-size: 10px;
      flex: 1;
      min-height: 32px;
    }

    /* Sayı kartları - 2 sütun */
    .stat-cards {
      gap: 8px;
      grid-template-columns: 1fr 1fr !important;
    }
    .stat-card {
      padding: 10px 12px;
    }
    .stat-card-label {
      font-size: 9px;
    }
    .stat-card-value {
      font-size: 22px;
    }
    .stat-card-trend {
      font-size: 10px;
    }

    /* Rapor blokları */
    .rep-block {
      padding: 12px;
      margin-bottom: 12px;
    }
    .rep-block-title {
      font-size: 12px;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .rep-block-title-extra {
      font-size: 10px;
    }
    .rep-grid-2 {
      grid-template-columns: 1fr !important;
      gap: 10px;
    }

    /* SVG GRAFİKLER - dynamic width */
    .rep-chart {
      width: 100% !important;
      max-width: 100% !important;
      height: auto;
    }
    /* SVG'ler viewBox sayesinde otomatik scale olur */

    /* TABLO - mobilde kart benzeri */
    .rep-table {
      font-size: 11px;
    }
    .rep-table th {
      font-size: 9px;
      padding: 6px 4px;
      letter-spacing: 0.5px;
    }
    .rep-table td {
      padding: 6px 4px;
    }
    /* Mobilde tabloyu yatay scroll'a hazırla */
    .rep-block .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }

  /* DAR MOBİL */
  @media (max-width: 480px) {
    .stat-cards {
      grid-template-columns: 1fr !important;  /* tek sütun */
    }
    .stat-card-value {
      font-size: 20px;
    }
    /* Rapor tabloları çok dar olur, scroll'la kullan */
    .rep-table {
      min-width: 480px;  /* yatay scroll devreye girer */
    }
  }

  /* ============================================ */
  /* MOBİL — FAZ 5: YÖNETİM + TASARIMCI             */
  /* ============================================ */
  @media (max-width: 768px) {
    /* Yönetim sidebar (drawer açıkken) */
    .admin-sidebar {
      padding: 14px 12px;
    }
    .admin-nav-item {
      padding: 12px 14px;
      font-size: 13px;
      min-height: 44px;
    }

    /* Yönetim ana panel */
    .admin-main {
      padding: 12px !important;
    }

    /* SÜREÇ KARTLARI (Süreçler sekmesi) */
    .process-card,
    .definition-card {
      padding: 12px;
      margin-bottom: 8px;
    }
    .process-card h4,
    .definition-card h4 {
      font-size: 14px;
    }
    .process-card .meta,
    .definition-card .meta {
      font-size: 11px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .process-card button,
    .definition-card button {
      font-size: 12px;
      padding: 8px 12px;
      min-height: 36px;
    }

    /* KULLANICI KARTLARI */
    .user-card {
      padding: 12px;
      margin-bottom: 8px;
    }
    .user-card .user-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .user-card .user-name {
      font-size: 14px;
    }
    .user-card .user-roles {
      font-size: 11px;
      flex-wrap: wrap;
    }
    .user-card button {
      width: 100%;
      margin-top: 8px;
      min-height: 38px;
    }

    /* TASARIMCI - mobilde tek sütun (önizleme alta) */
    .designer-head {
      padding: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .designer-head .title-row {
      flex: 1 1 100%;
    }
    .designer-head input.title-input {
      font-size: 16px;
      padding: 8px;
    }
    .designer-head input.icon-input {
      width: 50px;
      font-size: 18px;
    }
    .designer-body {
      grid-template-columns: 1fr;  /* tek sütun */
      min-height: auto;
    }
    .designer-left {
      padding: 12px;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .designer-right {
      padding: 12px;
      max-height: none;
    }
    .designer-section {
      margin-bottom: 16px;
    }
    .designer-section-head h3 {
      font-size: 12px;
    }
    .designer-foot {
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .designer-foot .left,
    .designer-foot .right {
      width: 100%;
      flex-direction: column;
      gap: 6px;
    }
    .designer-foot button {
      width: 100%;
      min-height: 42px;
    }

    /* FORM ALAN EDITÖRÜ (field-row) - mobilde dikey */
    .field-row {
      grid-template-columns: 24px 1fr 1fr;
      gap: 4px;
      padding: 6px;
    }
    .field-row input,
    .field-row select {
      font-size: 12px;
      padding: 6px;
      min-height: 36px;
    }
    .field-row .icon-btn {
      width: 32px;
      height: 32px;
      font-size: 14px;
    }

    /* ADIM EDITÖRÜ (step-row) */
    .step-row {
      grid-template-columns: 24px 1fr 1fr 1fr;
      gap: 4px;
      padding: 6px;
    }
    .step-row input,
    .step-row select {
      font-size: 12px;
      min-height: 36px;
    }

    /* GEÇIŞ EDITÖRÜ (trans-row) */
    .trans-row {
      grid-template-columns: 1fr 28px 1fr 28px 1fr 26px;
      gap: 4px;
      padding: 6px;
      font-size: 12px;
    }
    .trans-row select {
      font-size: 11px;
      min-height: 34px;
    }

    /* ÖNİZLEME SEKMELERİ (Akış / Form) */
    .preview-tabs {
      flex-wrap: wrap;
    }
    .preview-tab {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      min-height: 38px;
    }
    .preview-content {
      min-height: 300px;
      padding: 10px;
    }
    /* Akış diyagramı SVG'sini scale et */
    .preview-content svg {
      max-width: 100%;
      height: auto;
    }

    /* SİHİRBAZ (3 adımlı) */
    .wizard-steps {
      gap: 6px;
      padding: 12px;
    }
    .wizard-step {
      flex: 1;
      font-size: 10px;
      padding: 6px;
    }
    .wizard-shape-grid {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .wizard-shape {
      padding: 12px;
    }
    .wizard-shape svg {
      width: 60px;
      height: 60px;
    }
    .wizard-shape h4 {
      font-size: 12px;
    }
    .wizard-shape p {
      font-size: 10px;
    }
    .wizard-foot {
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }
    .wizard-foot button {
      width: 100%;
      min-height: 42px;
    }

    /* ŞABLON SEÇİCİ */
    .template-picker-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .template-card {
      padding: 12px;
    }
    .template-card h4 {
      font-size: 13px;
    }
    .template-card p {
      font-size: 11px;
    }

    /* HATIRLATMA EDITÖRÜ - mobilde sade */
    .reminder-editor-section {
      padding: 10px;
    }
    .reminder-rule {
      padding: 10px;
      margin-bottom: 8px;
    }
    .reminder-rule input,
    .reminder-rule select {
      font-size: 12px;
      min-height: 36px;
    }
    .reminder-action {
      padding: 8px;
      margin-top: 6px;
    }

    /* PROCESS-LIST */
    .process-list-item {
      padding: 10px 12px;
      flex-wrap: wrap;
    }
    .process-list-item .name {
      font-size: 13px;
      flex: 1 1 100%;
      margin-bottom: 6px;
    }
    .process-list-item .actions {
      gap: 6px;
      width: 100%;
      justify-content: flex-end;
    }
    .process-list-item button {
      font-size: 11px;
      padding: 6px 10px;
      min-height: 34px;
    }
  }

  /* DAR MOBİL - tasarımcı için */
  @media (max-width: 480px) {
    /* Field-row daha sıkışık */
    .field-row {
      grid-template-columns: 20px 1fr 1fr;
      gap: 3px;
      padding: 5px;
    }
    .step-row {
      grid-template-columns: 20px 1fr 1fr 1fr;
      gap: 3px;
    }
    .trans-row {
      grid-template-columns: 1fr 24px 1fr 24px 1fr 24px;
      font-size: 11px;
    }
  }

  /* ============================================ */
  /* MOBİL — GENEL CİLA + DÜZELTMELER               */
  /* ============================================ */
  @media (max-width: 768px) {
    /* HTML & BODY scroll - mobile fix */
    html, body {
      overflow-x: hidden;
    }

    /* APP grid'i mobilde dikey */
    .app {
      grid-template-rows: auto auto 1fr !important;
    }

    /* Tüm container'lar taşmasın */
    main, aside, .view > * {
      max-width: 100%;
      overflow-x: hidden;
    }
    /* Ama dışarı scroll edenler (tablolar, filter-bar) hariç */
    .filter-bar, .table-wrap, .top-tabs, .sub-tabs,
    .rep-tabs, .rep-range, .cal-view-switch {
      max-width: 100%;
      overflow-x: auto;
    }

    /* Bildirim popup mobile */
    .notif-pop {
      position: fixed;
      top: 60px;
      right: 8px;
      left: 8px;
      width: auto !important;
      max-width: none !important;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* Arama sonuçları mobilde geniş */
    .search-results {
      max-height: 60vh;
    }

    /* Empty state'ler mobilde küçült */
    .empty {
      padding: 40px 20px;
    }
    .empty-icon {
      font-size: 32px;
    }

    /* Notify popup (toast) mobilde alt */
    .notify-popup {
      bottom: 20px !important;
      left: 12px !important;
      right: 12px !important;
      max-width: none !important;
    }

    /* Detay panelinin scroll'u smooth */
    .view-work .detail.open,
    .prod-detail.open {
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }

    /* Yatay form rows mobilde dikey */
    .form-row {
      flex-direction: column !important;
      gap: 8px;
    }
    .form-row > * {
      width: 100% !important;
    }

    /* Sub-tab count badge'leri */
    .sub-tab .count {
      font-size: 9px;
      padding: 2px 5px;
      margin-left: 4px;
    }
  }

  /* ============================================ */
  /* LOGIN EKRANI (Firebase Auth)                  */
  /* ============================================ */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
  }
  #login-screen.hidden {
    display: none;
  }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .login-box .login-brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-box .login-brand-mark {
    width: 56px;
    height: 56px;
    background: var(--accent);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    margin: 0 auto 12px;
  }
  .login-box h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .login-box .login-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .login-box .login-field {
    margin-bottom: 14px;
  }
  .login-box .login-field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .login-box .login-field input {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    box-sizing: border-box;
    font-family: var(--sans);
  }
  .login-box .login-field input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .login-box .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    font-family: var(--sans);
  }
  .login-box .login-btn:hover {
    opacity: 0.9;
  }
  .login-box .login-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .login-box .login-error {
    background: rgba(248,113,113,0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
  }
  .login-box .login-error.show {
    display: block;
  }
  .login-box .login-info {
    background: rgba(74,158,255,0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 14px;
  }
  .login-box .login-info b {
    display: block;
    margin-bottom: 4px;
  }
  .login-box .login-info code {
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }
  .login-box .login-loading {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
  }
  .login-foot {
    text-align: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
  }
  .login-foot button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 11px;
    text-decoration: underline;
    font-family: var(--sans);
  }

  /* APP başlangıçta gizli, auth sonrası gösterilir */
  .app.hidden {
    display: none;
  }

  /* Kullanıcı bilgi kutusu (header'da, role-switch yerine) */
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .user-info:hover {
    background: var(--panel-3);
  }
  .user-info-role {
    font-size: 18px;
    line-height: 1;
  }
  .user-info-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }
  .user-info-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .user-info-sub {
    font-size: 10px;
    color: var(--text-dim);
  }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-left: 4px;
  }
  .logout-btn:hover {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }
  @media (max-width: 768px) {
    .user-info {
      padding: 4px 8px;
      gap: 6px;
    }
    .user-info-name { font-size: 11px; }
    .user-info-sub { font-size: 9px; }
    .logout-btn { width: 26px; height: 26px; }
  }

  /* BİLDİRİMLER SAYFASI                            */

    max-width: 900px;
    margin: 0 auto;
    height: 100%;
    overflow-y: auto;
  }

    align-items: flex-start;

    flex-wrap: wrap;
    gap: 12px;
  }
  .notif-page-head h2 {
    margin: 0;
    font-size: 22px;
  }
  .notif-page-head p {
    margin: 4px 0 0;
    font-size: 12px;

  }

    display: flex;

  .notif-page-filters {

    gap: 8px;

    padding: 6px 12px;
    font-size: 12px;

    border: 1px solid var(--border);
    border-radius: 6px;

  }

    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .notif-page-item:hover {
    background: var(--panel-2);
  }
  .notif-page-item.unread {

  }
  .notif-page-item:last-child {
    border-bottom: none;
  }
  .notif-page-item-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;

  .notif-page-item-dot.unread {

  }
  .notif-page-item-dot.read {
    background: var(--border);
  }
  .notif-page-item-body {
    flex: 1;
    min-width: 0;
  }
  .notif-page-item-msg {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .notif-page-item-time {
    font-size: 11px;
    color: var(--text-dim);
  }
  .notif-page-item-link {
    color: var(--accent);
    font-family: var(--mono);
  }
  .notif-page-item-mark {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;

  .notif-page-item-mark:hover {

  .empty-mini {

    margin: 0 auto;
    height: 100%;
    overflow-y: auto;
  }
  .profile-head {

    gap: 20px;

    padding: 24px;

    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .profile-avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: #000;

    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    flex-shrink: 0;

  .profile-info h1 {

    font-size: 22px;

    margin-top: 2px;
  }

    color: var(--text);

  }
  .profile-absence {

    font-size: 12px;

    border: 1px solid var(--border);

    grid-template-columns: repeat(2, 1fr);

    padding: 12px;
    border-radius: 6px;
    text-align: center;
  }
  .profile-stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .profile-stat-label {

// ============== FIREBASE AUTH HANDLERS ==============

// Kullanıcı giriş yaptığında çağrılır (Firebase'den)
window.handleAuthLogin = async function(firebaseUser) {
  try {
    console.log('[Auth] Giriş yapıldı, Firestore yükleniyor:', firebaseUser.email);

    // state hazır mı? Yoksa bekle
    if (typeof state === 'undefined') {
      setTimeout(() => window.handleAuthLogin(firebaseUser), 100);
      return;
    }

    // Tüm verileri Firestore'dan çek (users, definitions, instances, tasks, vb.)
    await loadStateFromFirestore();

    // Mevcut kullanıcıyı bul (email üzerinden)
    const shortId = firebaseUser.email.split('@')[0].toLowerCase();
    let sysUser = state.users.find(u => u.id === shortId);

    if (!sysUser) {
      // Önce Firestore'da Firebase UID ile profil var mı kontrol et
      // (loadStateFromFirestore email tabanlı ID kullanır, ama belki UID ile var ama email yok)
      const userDocSnap = await window.fb.getDoc(
        window.fb.doc(window.fb.db, 'users', firebaseUser.uid)
      );

      if (userDocSnap.exists()) {
        // Profil Firestore'da var ama state'e gelmedi - sebep: email field eksik veya format farklı
        const data = userDocSnap.data();
        sysUser = {
          id: shortId,
          firebaseUid: firebaseUser.uid,
          ...data,
          email: data.email || firebaseUser.email  // email yoksa Firebase'den al
        };
        state.users.push(sysUser);
        console.log('[Auth] Profil Firestore\'da bulundu (UID ile):', sysUser);
      } else {
        // Gerçekten yok - varsayılan worker profili yaz
        console.warn('[Auth] Kullanıcı Firestore\'da YOK, varsayılan profil yazılıyor');
        const userData = {
          id: shortId,
          firebaseUid: firebaseUser.uid,
          name: firebaseUser.email.split('@')[0],
          email: firebaseUser.email,
          roles: ['worker'],
          manager: null,
          hireDate: new Date().toISOString().split('T')[0],
          absences: []
        };
        await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', firebaseUser.uid), {
          name: userData.name,
          email: userData.email,
          roles: userData.roles,
          manager: userData.manager,
          hireDate: userData.hireDate,
          absences: userData.absences
        });
        state.users.push(userData);
        sysUser = userData;
      }
    }

    state.currentUser = sysUser.id;
    state.currentTop = 'home';  // Giriş yapınca anasayfa

    // Built-in rol yetki migration (sadece admin yazabilir, tek seferlik)
    await runRoleMigrationIfAdmin();

    // App'i göster
    document.getElementById('login-screen').classList.add('hidden');
    document.querySelector('.app').classList.remove('hidden');

    // Real-time listener'ları aktif et
    setupRealtimeListeners();

    // Ana renderı çalıştır
    if (typeof renderAll === 'function') {
      renderAll();
    }
  } catch (e) {
    console.error('[Auth] handleAuthLogin hata:', e);
    showLoginError('Sistem yüklenemedi: ' + e.message);
  }
};

// Real-time listener'lar - bir cihazda değişen veri diğerlerinde görünsün
let _realtimeUnsubscribers = [];
function setupRealtimeListeners() {
  // Eskileri temizle
  _realtimeUnsubscribers.forEach(u => { try { u(); } catch(e){} });
  _realtimeUnsubscribers = [];

  if (!window.fb || !window.fb.auth.currentUser) return;
  const db = window.fb.db;

  // 5 ana koleksiyon için listener
  const collections = ['definitions', 'instances', 'tasks', 'orders', 'notifications', 'comments', 'roles'];
  for (const colName of collections) {
    const unsub = window.fb.onSnapshot(
      window.fb.collection(db, colName),
      (snap) => {
        // Sadece kendi yazdığımız değil, başka cihaz/kullanıcının yaptıkları
        if (snap.metadata.hasPendingWrites) return;  // kendi yazdığımız
        const items = snap.docs.map(d => d.data());
        state[colName] = items;
        // Sadece kullanıcı bir input alanında yazmıyorsa yenile
        const tag = document.activeElement?.tagName;
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        const modalOpen = document.getElementById('modal')?.classList.contains('show');
        if (!isTyping && !modalOpen && typeof renderAll === 'function') {
          renderAll();
        }
      },
      (err) => console.error(`[Realtime ${colName}] hata:`, err)
    );
    _realtimeUnsubscribers.push(unsub);
  }
  console.log('[Firestore] Real-time listeners aktif');
}

window.setupRealtimeListeners = setupRealtimeListeners;

// Kullanıcı çıkış yaptığında
window.handleAuthLogout = function() {
  // Real-time listener'ları kapat
  if (typeof _realtimeUnsubscribers !== 'undefined') {
    _realtimeUnsubscribers.forEach(u => { try { u(); } catch(e){} });
    _realtimeUnsubscribers = [];
  }
  document.getElementById('login-screen').classList.remove('hidden');
  const app = document.querySelector('.app');
  if (app) app.classList.add('hidden');
};

// Login butonuna basıldığında
window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');

  if (!email || !password) {
    showLoginError('E-posta ve şifre gerekli');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Giriş yapılıyor...';
  hideLoginError();

  try {
    await window.fb.signInWithEmailAndPassword(window.fb.auth, email, password);
    // Başarılı - onAuthStateChanged handler'ı app'i gösterir
  } catch (e) {
    console.error('[Auth] Giriş hatası:', e);
    let msg = e.message;
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
      msg = 'E-posta veya şifre hatalı';
    } else if (e.code === 'auth/invalid-email') {
      msg = 'Geçersiz e-posta adresi';
    } else if (e.code === 'auth/too-many-requests') {
      msg = 'Çok fazla deneme. Lütfen sonra tekrar deneyin';
    }
    showLoginError(msg);
    btn.disabled = false;
    btn.textContent = 'Giriş Yap';
  }
};

// Çıkış
window.doLogout = async function() {
  if (!confirm('Çıkış yapmak istiyor musunuz?')) return;
  try {
    await window.fb.signOut(window.fb.auth);
    // App'i temizle
    if (typeof state !== 'undefined') {

  } catch (e) {
    console.error('[Auth] Çıkış hatası:', e);

};

        Object.fromEntries(allPermissions().map(p => [p, true]))
      )
    }
  ];
}

// Bir kullanıcının belirli bir yetkisi var mı?
function hasPermission(userIdOrUser, permId) {
  const u = typeof userIdOrUser === 'string' ? getUser(userIdOrUser) : userIdOrUser;
  if (!u) return false;
  // Hiç rol yoksa false
  if (!u.roles || u.roles.length === 0) return false;
  // Tüm rollerini birleştir (union)
  for (const roleId of u.roles) {
    const role = (state.roles || []).find(r => r.id === roleId);
    if (role && role.permissions && role.permissions[permId] === true) return true;
  }
  return false;
}

// Yardımcı: kullanıcının rol etiketlerini döndür (görsel)
function getUserRoleLabels(userIdOrUser) {
  const u = typeof userIdOrUser === 'string' ? getUser(userIdOrUser) : userIdOrUser;
  if (!u || !u.roles) return [];
  return u.roles.map(roleId => {
    const role = (state.roles || []).find(r => r.id === roleId);
    return role || { id: roleId, name: roleId, icon: '?', color: '#666', isBuiltIn: false };
  });
}

// Rolleri öncelik sırasına göre dizer (primary rol ilk gelir).
// Bilinen roller önceliklendirilir, diğerleri (özel roller) sona eklenir.
const ROLE_PRIORITY = ['admin', 'hr', 'manager', 'kalite_sefi', 'operator', 'worker'];
function getUserRoleLabelsSorted(userIdOrUser) {
  const labels = getUserRoleLabels(userIdOrUser);
  return labels.slice().sort((a, b) => {
    let ia = ROLE_PRIORITY.indexOf(a.id); if (ia === -1) ia = ROLE_PRIORITY.length;
    let ib = ROLE_PRIORITY.indexOf(b.id); if (ib === -1) ib = ROLE_PRIORITY.length;
    return ia - ib;
  });
}
// İkon: ilk (primary) rolden. İsim: tüm roller " · " ile birleşik.
function getUserRoleDisplay(userIdOrUser) {
  const sorted = getUserRoleLabelsSorted(userIdOrUser);
  if (!sorted.length) return { icon: '👤', text: '—', roles: [] };
  return {
    icon: (sorted[0].icon && sorted[0].icon !== '?') ? sorted[0].icon : '👤',
    text: sorted.map(r => r.name).join(' · '),
    roles: sorted
  };
}
