  const taskCount = state.tasks.filter(t => t.assignee === state.currentUser && t.status === 'open').length;
  const myCount = state.instances.filter(i => i.ownerId === state.currentUser).length;
  const allCount = state.instances.length;
  const upcomingDates = getAllUpcomingDates();
  // Yaklaşan: 30 gün içindekiler (geçmiş dahil)
  const upcomingCount = upcomingDates.filter(d => d.diffDays <= 30).length;

  // YETKİ KONTROLÜ
  const canViewAll = hasPermission(u, 'workflows_view_all');
  const canViewTeam = hasPermission(u, 'workflows_view_team');
  const canViewOwn = hasPermission(u, 'workflows_view_own');
  const canViewAssigned = hasPermission(u, 'workflows_view_assigned');

  // Manager'ın ekibi (kendisine bağlı olanlar)
  const teamIds = state.users.filter(usr => usr.manager === u.id).map(usr => usr.id);
  // Yöneticinin ekibi de kendi içinde alt ekipler içerebilir (1 seviye yeter şimdilik)

  // Yetki bazlı sekmeler
  let tabs = [];
  if (canViewAssigned) tabs.push({ id:'tasks', label:'Görevlerim', count: taskCount });
  if (canViewAll || canViewTeam) {
    const label = canViewAll ? 'Tüm Talepler' : 'Ekip Talepleri';
    tabs.push({ id:'all', label, count: 0 }); // count aşağıda hesaplanacak
  }
  if (canViewOwn) tabs.push({ id:'mine', label:'Kendi Taleplerim', count: myCount });
  tabs.push({ id:'dates', label:'📅 Yaklaşan Tarihler', count: upcomingCount });

  // Eğer aktif tab geçersizse ilkine geç
  if (!tabs.find(t => t.id === state.workTab)) state.workTab = tabs[0].id;

  let items = [];
  let mode = 'instance';
  let title = 'İş Akışları';
  let filterBarHtml = '';

  if (state.workTab === 'tasks') {
    items = state.tasks.filter(t => t.assignee === state.currentUser && t.status === 'open');
    mode = 'task'; title = 'Görevlerim';
  } else if (state.workTab === 'mine') {
    items = state.instances.filter(i => i.ownerId === state.currentUser);
    title = 'Taleplerim';
    filterBarHtml = renderInstanceFilterBar(items, true);
    items = applyInstanceFilters(items);
  } else if (state.workTab === 'dates') {
    title = 'Yaklaşan Tarihler';
    mode = 'dates';
    filterBarHtml = renderDatesFilterBar(upcomingDates);
    upcomingDates = applyDatesFilter(upcomingDates);
  } else {
    // "Tüm Talepler" / "Ekip Talepleri" — yetki bazlı filtreleme
    if (canViewAll) {
      items = state.instances.slice();
      title = 'Tüm Talepler';
    } else if (canViewTeam) {
      // Sadece ekibinin (kendisine bağlı olan kullanıcıların) talepleri + kendisinin
      items = state.instances.filter(i =>
        i.ownerId === u.id || teamIds.includes(i.ownerId)
      );
      title = 'Ekip Talepleri';
    } else {
      items = [];
      title = 'Talepler';
    }
    // Count'u güncelle
    const allTab = tabs.find(t => t.id === 'all');
    if (allTab) allTab.count = items.length;
    filterBarHtml = renderInstanceFilterBar(items, false);
    items = applyInstanceFilters(items);
  }
  if (mode === 'instance') {
    items = applyInstanceSort(items);
  } else if (mode === 'task') {
    items.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  const tabsHtml = tabs.map(t =>
    `<button class="sub-tab ${state.workTab === t.id ? 'active':''}" onclick="setWorkTab('${t.id}')">${t.label}<span class="count">${t.count}</span></button>`
  ).join('');

  let listHtml;
  if (mode === 'dates') {
    listHtml = renderUpcomingDatesList(upcomingDates);
  } else if (items.length === 0) {
    listHtml = `<div class="empty"><div class="empty-icon">∅</div><div>Burada henüz bir şey yok</div></div>`;
  } else {
    listHtml = items.map(it => mode === 'task' ? renderTaskCard(it) : renderInstanceCard(it)).join('');
  }

  main.innerHTML = `
    <div class="main-head"><h1>${title}</h1></div>
    <div class="sub-tabs">${tabsHtml}</div>
    ${filterBarHtml}
    <div>${listHtml}</div>
  `;
}

// ============== FILTER BAR (Tüm Talepler / Taleplerim) ==============
function renderInstanceFilterBar(allItems, isMine) {
  // İlgili tüm süreç türleri
  const defIdSet = new Set();
  allItems.forEach(i => defIdSet.add(i.defId));
  const usedDefs = state.definitions.filter(d => defIdSet.has(d.id));

  // Aktif filtreler ile sonuç sayısı
  const filtered = applyInstanceFilters(allItems);
  const totalCount = allItems.length;
  const filteredCount = filtered.length;
  const isFiltered = state.filterAllStatus !== 'all' || state.filterAllDefId !== '' || state.filterAllSort !== 'newest';

  return `
    <div class="filter-bar">
      <span class="filter-label">Durum:</span>
      <span class="filter-chip ${state.filterAllStatus === 'active' ? 'active':''}" onclick="setInstanceFilter('status','active')">⏳ Bekleyen</span>
      <span class="filter-chip ${state.filterAllStatus === 'completed' ? 'active':''}" onclick="setInstanceFilter('status','completed')">✓ Tamamlanan</span>
      <span class="filter-chip ${state.filterAllStatus === 'rejected' ? 'active':''}" onclick="setInstanceFilter('status','rejected')">✕ Reddedilen</span>
      <span class="filter-chip ${state.filterAllStatus === 'all' ? 'active':''}" onclick="setInstanceFilter('status','all')">Hepsi</span>

      ${usedDefs.length > 1 ? `
        <span class="filter-label" style="margin-left:10px;">Süreç:</span>
        <select onchange="setInstanceFilter('defId', this.value)">
          <option value="">Hepsi (${usedDefs.length} tür)</option>
          ${usedDefs.map(d => `<option value="${d.id}" ${state.filterAllDefId === d.id ? 'selected':''}>${d.icon||''} ${escapeHtml(d.name)}</option>`).join('')}
        </select>
      ` : ''}

      <span class="filter-label" style="margin-left:10px;">Sırala:</span>
      <select onchange="setInstanceFilter('sort', this.value)">
        <option value="newest" ${state.filterAllSort === 'newest' ? 'selected':''}>En yeni</option>
        <option value="oldest" ${state.filterAllSort === 'oldest' ? 'selected':''}>En eski</option>
      </select>

      ${isFiltered ? `<span class="filter-clear" onclick="clearInstanceFilters()">✕ Temizle</span>` : ''}
      <span class="filter-result-count">${filteredCount} / ${totalCount} sonuç</span>
    </div>
  `;
}

function applyInstanceFilters(items) {
  let result = items;
  // Durum filtresi
  if (state.filterAllStatus === 'active') {
    result = result.filter(i => i.status === 'running');
  } else if (state.filterAllStatus === 'completed') {
    result = result.filter(i => i.status === 'completed');
  } else if (state.filterAllStatus === 'rejected') {
    result = result.filter(i => i.status === 'rejected');
  }
  // Süreç türü
  if (state.filterAllDefId) {
    result = result.filter(i => i.defId === state.filterAllDefId);
  }
  return result;
}

function applyInstanceSort(items) {
  const sorted = items.slice();
  if (state.filterAllSort === 'oldest') {
    sorted.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  } else {
    sorted.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  return sorted;
}

function setInstanceFilter(key, val) {
  if (key === 'status') state.filterAllStatus = val;
  else if (key === 'defId') state.filterAllDefId = val;
  else if (key === 'sort') state.filterAllSort = val;
  renderWorkMain();
}

function clearInstanceFilters() {
  state.filterAllStatus = 'active';
  state.filterAllDefId = '';
  state.filterAllSort = 'newest';
  renderWorkMain();
}

// ============== FILTER BAR (Yaklaşan Tarihler) ==============
function renderDatesFilterBar(dates) {
  const pastCount = dates.filter(d => d.state === 'past').length;
  const upcomingCount = dates.length - pastCount;
  return `
    <div class="filter-bar">
      <span class="filter-label">Görünüm:</span>
      <span class="filter-chip ${state.filterDatesShowPast ? 'active' : ''}" onclick="state.filterDatesShowPast=true;renderWorkMain();">Hepsi (geçmiş dahil)</span>
      <span class="filter-chip ${!state.filterDatesShowPast ? 'active' : ''}" onclick="state.filterDatesShowPast=false;renderWorkMain();">Sadece yaklaşan</span>
      <span class="filter-result-count">${pastCount} geçmiş · ${upcomingCount} yaklaşan</span>
    </div>
  `;
}

function applyDatesFilter(dates) {
  if (state.filterDatesShowPast) return dates;
  return dates.filter(d => d.state !== 'past');
}

function setWorkTab(id) {
  state.workTab = id;
  state.selected = null;
  renderAll();
}

// SLA durum hesabı: { state, label, color }
// state: 'none' | 'ok' | 'warn' | 'overdue' | 'done_late'
function computeSlaStatus(task, step) {
  if (!step || !step.slaHours || step.slaHours <= 0) return { state: 'none' };
  const slaMs = step.slaHours * 3600 * 1000;
  const isClosed = task.status === 'closed';
  if (isClosed) {
    const elapsed = (task.closedAt || task.createdAt) - task.createdAt;
    if (elapsed > slaMs) return { state: 'done_late', label: `Süre aşıldı (${Math.round((elapsed - slaMs) / 3600000)}sa fazla)`, color: 'var(--red)' };
    return { state: 'done_ok', label: `Süresinde tamamlandı`, color: 'var(--green)' };
  }
  const elapsed = Date.now() - task.createdAt;
  const remaining = slaMs - elapsed;
  if (remaining <= 0) {
    const overBy = Math.abs(remaining);
    return { state: 'overdue', label: `Süre doldu (${formatDuration(overBy)} aşıldı)`, color: 'var(--red)' };
  }
  // %25'ten az kaldıysa warn
  if (remaining < slaMs * 0.25) {
    return { state: 'warn', label: `${formatDuration(remaining)} kaldı`, color: 'var(--amber)' };
  }
  return { state: 'ok', label: `${formatDuration(remaining)} kaldı`, color: 'var(--green)' };
}

// Süreyi okunabilir biçimde formatla
function formatDuration(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + 'dk';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'sa';
  const d = Math.floor(h / 24);
  return d + 'g' + (h % 24 ? (h % 24) + 'sa' : '');
}

function renderUpcomingDatesList(dates) {
  if (!dates || dates.length === 0) {
    return `<div class="empty"><div class="empty-icon">📅</div><div>Yaklaşan tarih yok</div></div>`;
  }
  // Grupla: bugün, bu hafta, bu ay, sonra, geçmiş
  const groups = {
    past:    { label:'⏰ Geçmiş',    items:[] },
    today:   { label:'🔴 Bugün',     items:[] },
    soon:    { label:'🟡 Bu hafta',   items:[] },
    upcoming:{ label:'🔵 Bu ay',      items:[] },
    far:     { label:'⚪ İleride',    items:[] }
  };
  dates.forEach(d => groups[d.state].items.push(d));

  return Object.entries(groups)
    .filter(([k,g]) => g.items.length > 0)
    .map(([k,g]) => `
      <div style="margin-bottom:20px;">
        <h3 style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);">
          ${g.label} <span style="color:var(--text-mute);font-weight:400;">(${g.items.length})</span>
        </h3>
        ${g.items.map(d => renderUpcomingDateCard(d)).join('')}
      </div>
    `).join('');
}

function renderUpcomingDateCard(d) {
  const owner = getUser(d.instance.ownerId);
  const dateStr = new Date(d.dateStr).toLocaleDateString('tr-TR');
  return `
    <div class="item-card" style="border-left:3px solid ${d.color};" onclick="state.selected={type:'instance',id:'${d.instance.id}'};setWorkTab('all');">
      <div class="item-row1">
        <div class="item-title">
          ${d.def.icon} ${escapeHtml(d.field.label)}
          <span class="item-id">${d.instance.id}</span>
        </div>
        <div class="item-time" style="color:${d.color};font-weight:600;">${escapeHtml(d.label)}</div>
      </div>
      <div class="item-meta">
        <span>📅 ${dateStr}</span>
        <span>👤 ${escapeHtml(owner?.name || '?')}</span>
        <span>📄 ${escapeHtml(d.def.name)}</span>
        ${d.hasReminders ? `<span class="status-pill" style="background:rgba(74,158,255,0.15);color:var(--accent);">⏰ ${d.field.reminders.length} hatırlatma kuralı</span>` : ''}
      </div>
    </div>
  `;
}

function renderTaskCard(task) {
  const inst = state.instances.find(i => i.id === task.instanceId);
  const def = getDef(inst.defId);
  const owner = getUser(inst.ownerId);
  const isSel = state.selected && state.selected.type === 'task' && state.selected.id === task.id;
  const isDelegated = task.delegationChain && task.delegationChain.length > 0;
  const delegateTag = isDelegated ? `<span class="status-pill status-pending" title="Vekil olarak atandı: ${task.delegationChain.map(c => getUser(c.userId)?.name).join(' → ')}">🔁 VEKİL</span>` : '';

  // SLA durumu
  const step = def.steps.find(s => s.id === task.stepKey);
  const sla = computeSlaStatus(task, step);
  let slaTag = '';
  let cardExtraStyle = '';
  if (sla.state === 'overdue') {
    slaTag = `<span class="status-pill" style="background:rgba(248,113,113,0.2);color:var(--red);">⏰ ${escapeHtml(sla.label)}</span>`;
    cardExtraStyle = 'border-left:3px solid var(--red);animation:pulse-step 2s infinite;';
  } else if (sla.state === 'warn') {
    slaTag = `<span class="status-pill" style="background:rgba(251,191,36,0.2);color:var(--amber);">⏱ ${escapeHtml(sla.label)}</span>`;
    cardExtraStyle = 'border-left:3px solid var(--amber);';
  } else if (sla.state === 'ok') {
    slaTag = `<span class="status-pill" style="background:rgba(74,222,128,0.15);color:var(--green);">⏱ ${escapeHtml(sla.label)}</span>`;
  }

  // Fallback: SLA yoksa eski "task-urgent" mantığı (24sa eski)
  const age = (Date.now() - task.createdAt) / 3600000;
  const urgFallback = (sla.state === 'none' && age > 24) ? ' task-urgent' : '';

  return `
    <div class="item-card ${isSel?'selected':''}${urgFallback}" style="${cardExtraStyle}" onclick="selectTask('${task.id}')">
      <div class="item-row1">
        <div class="item-title">${def.icon} ${escapeHtml(task.stepTitle)}<span class="item-id">${inst.id}</span></div>
        <div class="item-time">${formatAge(task.createdAt)}</div>
      </div>
      <div class="item-meta">
        <span>👤 ${escapeHtml(owner.name)}</span>
        <span>📄 ${escapeHtml(def.name)}</span>
        <span class="status-pill status-pending">ONAY BEKLİYOR</span>
        ${delegateTag}
        ${slaTag}
      </div>
    </div>
  `;
}

function renderInstanceCard(inst) {
  const def = getDef(inst.defId);
  const owner = getUser(inst.ownerId);
  const isSel = state.selected && state.selected.type === 'instance' && state.selected.id === inst.id;
  const step = def.steps.find(s => s.id === inst.state);
  const stepTitle = step ? step.title : inst.state;
  const statusCls = inst.status === 'completed' ? 'status-completed' :
                    inst.status === 'rejected'  ? 'status-rejected'  : 'status-running';
  const statusText = inst.status === 'completed' ? 'TAMAMLANDI' :
                     inst.status === 'rejected'  ? 'REDDEDİLDİ'  : 'DEVAM EDİYOR';
  return `
    <div class="item-card ${isSel?'selected':''}" onclick="selectInstance('${inst.id}')">
      <div class="item-row1">
        <div class="item-title">${def.icon} ${escapeHtml(def.name)}<span class="item-id">${inst.id}</span></div>
        <div class="item-time">${formatAge(inst.createdAt)}</div>
      </div>
      <div class="item-meta">
        <span>👤 ${escapeHtml(owner.name)}</span>
        <span>📍 ${escapeHtml(stepTitle)}</span>
        <span class="status-pill ${statusCls}">${statusText}</span>
      </div>
    </div>
  `;
}

function selectTask(id) {
  state.selected = { type:'task', id };
  renderWorkMain(); renderDetail();
  if (window.innerWidth <= 768) openMobileDetail();
}
function selectInstance(id) {
  state.selected = { type:'instance', id };
  renderWorkMain(); renderDetail();
  if (window.innerWidth <= 768) openMobileDetail();
}

function renderDetail() {
  const d = document.getElementById('detail');
  if (!d) return;
  if (!state.selected) {
    d.innerHTML = `<div class="empty"><div class="empty-icon">→</div><div>Detay için bir öğe seçin</div></div>`;
    return;
  }
  let instance, task = null;
  if (state.selected.type === 'task') {
    task = state.tasks.find(t => t.id === state.selected.id);
    if (task) instance = state.instances.find(i => i.id === task.instanceId);
  } else {
    instance = state.instances.find(i => i.id === state.selected.id);
  }
  if (!instance) {
    state.selected = null;
    d.innerHTML = `<div class="empty"><div class="empty-icon">∅</div><div>Bulunamadı</div></div>`;
    return;
  }

  // YETKİ KONTROLÜ — bu talebi görmeye yetkili mi?
  const u = getUser(state.currentUser);
  if (u) {
    const canViewAll = hasPermission(u, 'workflows_view_all');
    const canViewTeam = hasPermission(u, 'workflows_view_team');
    const canViewOwn = hasPermission(u, 'workflows_view_own');
    const canViewAssigned = hasPermission(u, 'workflows_view_assigned');
    const isOwner = instance.ownerId === u.id;
    const teamIds = state.users.filter(x => x.manager === u.id).map(x => x.id);
    const isTeamMember = teamIds.includes(instance.ownerId);
    const isAssigned = task && task.assignee === u.id;
    const canAccess = canViewAll ||
                      (canViewTeam && (isTeamMember || isOwner)) ||
                      (canViewOwn && isOwner) ||
                      (canViewAssigned && isAssigned);
    if (!canAccess) {
      d.innerHTML = `<div class="empty"><div class="empty-icon">🔒</div><div>Bu talebi görüntüleme yetkiniz yok</div></div>`;
      return;
    }
  }
  const def = getDef(instance.defId);
  const owner = getUser(instance.ownerId);
  const histItems = state.history.filter(h => h.instanceId === instance.id).sort((a,b) => a.at - b.at);

  const formRows = def.fields.map(f => {
    let v = instance.form[f.id] || '—';
    if (f.type === 'select' && f.options) {
      const opt = f.options.find(o => o.value === v);
      if (opt) v = opt.label;
    }
    return `<div class="kv"><span class="k">${escapeHtml(f.label)}</span><span class="v">${escapeHtml(String(v))}</span></div>`;
  }).join('');

  const statusText = instance.status === 'completed' ? 'TAMAMLANDI' :
                     instance.status === 'rejected'  ? 'REDDEDİLDİ'  : 'DEVAM EDİYOR';
  const statusCls  = instance.status === 'completed' ? 'status-completed' :
                     instance.status === 'rejected'  ? 'status-rejected'  : 'status-running';

  let actionBar = '';
  if (task && task.status === 'open' && task.assignee === state.currentUser && hasPermission(state.currentUser, 'workflows_approve')) {
    actionBar = `
      <div class="action-bar">
        <button class="btn reject" onclick="actOnTask('${task.id}','reject')">✕ Reddet</button>
        <button class="btn approve" onclick="actOnTask('${task.id}','approve')">✓ Onayla</button>
      </div>`;
  }

  // ============== "ŞU ANDA KİMDE?" KUTUSU ==============
  let whoBox = '';
  if (instance.status === 'running') {
    // Açık görev var mı?
    const openTask = state.tasks.find(t => t.instanceId === instance.id && t.status === 'open');
    if (openTask) {
      const assignee = getUser(openTask.assignee);
      const ageMs = Date.now() - openTask.createdAt;
      const ageStr = formatDuration(ageMs);
      const initials = (assignee?.name || '?').split(' ').map(x=>x[0]).join('').slice(0,2);
      const stepLabel = openTask.stepTitle || 'onay';
      whoBox = `
        <div class="who-box">
          <div class="who-box-avatar">${initials}</div>
          <div class="who-box-info">
            <div class="who-box-label">ŞU ANDA</div>
            <div class="who-box-name">${escapeHtml(assignee?.name || '?')}</div>
            <div class="who-box-sub">${escapeHtml(stepLabel)} • ${ageStr} beklemede</div>
          </div>
        </div>
      `;
    } else {
      // Açık görev yok = aktif izleme adımı (hatırlatıcı). Onay beklemiyor.
      whoBox = `
        <div class="who-box">
          <div class="who-box-avatar" style="background:var(--accent);">⏰</div>
          <div class="who-box-info">
            <div class="who-box-label">AKTİF İZLEMEDE</div>
            <div class="who-box-name">Tarihler takip ediliyor</div>
            <div class="who-box-sub">Tarih yaklaşınca otomatik bildirim alırsınız</div>
          </div>
        </div>
      `;
    }
  } else if (instance.status === 'completed') {
    const lastHist = histItems.slice().reverse().find(h => h.type === 'approve');
    const actorName = lastHist?.actor ? getUser(lastHist.actor)?.name : null;
    whoBox = `
      <div class="who-box completed">
        <div class="who-box-avatar" style="background:var(--green);">✓</div>
        <div class="who-box-info">
          <div class="who-box-label">TAMAMLANDI</div>
          <div class="who-box-name">Onaylandı</div>
          <div class="who-box-sub">${actorName ? escapeHtml(actorName) + ' tarafından' : ''} ${formatAge(instance.updatedAt)}</div>
        </div>
      </div>
    `;
  } else if (instance.status === 'rejected') {
    const lastHist = histItems.slice().reverse().find(h => h.type === 'reject');
    const actorName = lastHist?.actor ? getUser(lastHist.actor)?.name : null;
    whoBox = `
      <div class="who-box rejected">
        <div class="who-box-avatar" style="background:var(--red);">✕</div>
        <div class="who-box-info">
          <div class="who-box-label">REDDEDİLDİ</div>
          <div class="who-box-name">İptal edildi</div>
          <div class="who-box-sub">${actorName ? escapeHtml(actorName) + ' tarafından' : ''} ${formatAge(instance.updatedAt)}</div>
        </div>
      </div>
    `;
  }

  // ============== EK AKSIYON BUTONLARI (Tekrar Aç / Geri Çek) ==============
  let extraActions = '';
  // Tekrar Aç: Talep sahibiyim ve talep reddedildi
  if (instance.ownerId === state.currentUser && instance.status === 'rejected') {
    extraActions += `<button class="ghost-btn" onclick="reopenInstance('${instance.id}')" style="margin-right:6px;">🔄 Aynı bilgilerle yeni talep aç</button>`;
  }
  // Geri Çek: Talep sahibiyim ve hala bekliyor
  if (instance.ownerId === state.currentUser && instance.status === 'running') {
    extraActions += `<button class="ghost-btn" onclick="withdrawInstance('${instance.id}')" style="margin-right:6px;color:var(--red);border-color:var(--red);">🚫 Talebi Geri Çek</button>`;
  }

  // Vekil bilgisi (sadece görev seçiliyse ve vekil zinciri varsa)
  let delegationInfo = '';
  if (task && task.delegationChain && task.delegationChain.length > 0) {
    const chainStr = task.delegationChain.map(c => `${escapeHtml(getUser(c.userId)?.name || c.userId)} (${escapeHtml(c.reason)})`).join(' → ');
    delegationInfo = `
      <div class="detail-section" style="background:rgba(251,191,36,0.08);padding:10px 12px;border-radius:6px;border-left:3px solid var(--amber);">
        <h4 style="margin-bottom:6px;">🔁 Vekil Bilgisi</h4>
        <div style="font-size:12px;color:var(--text);">
          Bu görev <strong style="color:var(--amber);">${escapeHtml(getUser(task.originalAssignee)?.name || task.originalAssignee)}</strong> izinde olduğu için <strong>${escapeHtml(getUser(task.assignee)?.name || task.assignee)}</strong>'a vekil olarak atandı.
        </div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">Zincir: ${chainStr} → <strong>${escapeHtml(getUser(task.assignee)?.name)}</strong></div>
      </div>
    `;
  }

  d.innerHTML = `
    <div class="detail-head">
      <div class="detail-title">${def.icon} ${escapeHtml(def.name)}</div>
      <div class="detail-sub">
        <span class="item-id">${instance.id}</span>
        <span style="margin-left:8px;" class="status-pill ${statusCls}">${statusText}</span>
      </div>
    </div>
    <div class="detail-body">
      ${whoBox}
      ${delegationInfo}
      ${extraActions ? `<div style="margin-bottom:14px;">${extraActions}</div>` : ''}
      <div class="detail-section">
        <h4>Talep Bilgileri</h4>
        <div class="kv"><span class="k">Talep eden</span><span class="v">${escapeHtml(owner.name)}</span></div>
        <div class="kv"><span class="k">Açılış</span><span class="v">${formatDate(instance.createdAt)}</span></div>
        ${formRows}
      </div>
      <div class="detail-section">
        <h4>Süreç Geçmişi</h4>
        <div class="history">
          ${histItems.map(h => `
            <div class="history-item ${h.type}">
              <div class="history-time">${formatDate(h.at)}</div>
              <div class="history-text">${escapeHtml(h.text)}</div>
              ${h.comment ? `<div class="history-comment">"${escapeHtml(h.comment)}"</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
      ${renderCommentsSection(instance.id)}
    </div>
    ${actionBar}
  `;
}

// ============== YORUMLAR (her talepte) ==============

function renderCommentsSection(instanceId) {
  // Yorumları görme yetkisi
  if (!hasPermission(state.currentUser, 'comments_view')) {
    return '';  // hiç yorum bölümü gösterme
  }

  const comments = (state.comments || [])
    .filter(c => c.instanceId === instanceId)
    .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));

  const canDeleteAny = hasPermission(state.currentUser, 'comments_delete_any');
  const canDeleteOwn = hasPermission(state.currentUser, 'comments_delete_own');
  const canCreate = hasPermission(state.currentUser, 'comments_create');

  const commentsHtml = comments.length === 0
    ? `<div class="comments-empty">Henüz yorum yok.${canCreate ? ' İlk yorumu siz yazın.' : ''}</div>`
    : comments.map(c => {
        const author = getUser(c.authorId);
        const isMine = c.authorId === state.currentUser;
        const initials = (author?.name || '?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
        // Mention render: @userN -> highlighted span
        const textHtml = escapeHtml(c.text || '').replace(/@(user\d+|[a-z0-9_]+)/g,
          (m, u) => `<span class="comment-mention">@${u}</span>`);
        const canDeleteThis = (isMine && canDeleteOwn) || canDeleteAny;
        return `
          <div class="comment-item ${isMine ? 'mine' : ''}">
            <div class="comment-avatar">${initials}</div>
            <div class="comment-body">
              <div class="comment-head">
                <span class="comment-author">${escapeHtml(author?.name || c.authorId)}</span>
                <span class="comment-time">${formatAge(c.createdAt || 0)}</span>
                ${canDeleteThis ? `<button class="comment-delete" onclick="deleteComment('${c.id}')" title="Yorumu sil">✕</button>` : ''}
              </div>
              <div class="comment-text">${textHtml}</div>
            </div>
          </div>
        `;
      }).join('');

  return `
    <div class="detail-section comments-section">
      <h4>💬 Yorumlar ${comments.length > 0 ? `<span class="comment-count">${comments.length}</span>` : ''}</h4>
      <div class="comments-list">
        ${commentsHtml}
      </div>
      ${canCreate ? `
        <div class="comment-input-box">
          <textarea id="comment-textarea-${instanceId}" placeholder="Yorum yazın... @user1 ile bahsedebilirsiniz" rows="2"></textarea>
          <button class="comment-submit-btn" onclick="addComment('${instanceId}')">📤 Gönder</button>
        </div>
        <div class="comment-hint">İpucu: <code>@user1</code> yazarak başkalarına bildirim yollayabilirsiniz</div>
      ` : ''}
    </div>
  `;
}

function addComment(instanceId) {
  if (!hasPermission(state.currentUser, 'comments_create')) {
    notify('Yorum yazma yetkiniz yok', 'error');
    return;
  }
  const textarea = document.getElementById('comment-textarea-' + instanceId);
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) { notify('Yorum boş olamaz', 'error'); return; }
  if (text.length > 2000) { notify('Yorum çok uzun (max 2000 karakter)', 'error'); return; }

  // Mention'ları çıkar
  const mentionMatches = text.match(/@(user\d+|[a-z0-9_]+)/g) || [];
  const mentions = mentionMatches.map(m => m.substring(1)).filter(u =>
    state.users.find(usr => usr.id === u)
  );

  const commentId = 'C-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const newComment = {
    id: commentId,
    instanceId: instanceId,
    authorId: state.currentUser,
    text: text,
    createdAt: Date.now(),
    mentions: mentions
  };

  state.comments.push(newComment);

  // Mention'lara bildirim gönder
  const author = getUser(state.currentUser);
  const inst = state.instances.find(i => i.id === instanceId);
  for (const userId of mentions) {
    if (userId !== state.currentUser) {  // kendine bildirim gönderme
      pushNotif(userId, `💬 ${author?.name || 'Biri'} ${instanceId} talebinde sizden bahsetti`, instanceId);
    }
  }

  // Talep sahibine de bildirim (eğer yorum yapan başkasıysa)
  if (inst && inst.ownerId !== state.currentUser && !mentions.includes(inst.ownerId)) {
    pushNotif(inst.ownerId, `💬 ${author?.name || 'Biri'} ${instanceId} talebinize yorum yazdı`, instanceId);
  }

  persist();
  textarea.value = '';
  renderDetail();
  notify('Yorum eklendi', 'success');
}

function deleteComment(commentId) {
  const c = state.comments.find(x => x.id === commentId);
  if (!c) return;
  const isMine = c.authorId === state.currentUser;
  const canDeleteOwn = hasPermission(state.currentUser, 'comments_delete_own');
  const canDeleteAny = hasPermission(state.currentUser, 'comments_delete_any');

  if (!canDeleteAny && !(isMine && canDeleteOwn)) {
    notify('Bu yorumu silmek için yetkiniz yok', 'error');
    return;
  }
  if (!confirm('Yorum silinsin mi?')) return;
  state.comments = state.comments.filter(x => x.id !== commentId);
  _persistedCommentIds.delete(String(commentId));
  _lastPersistedHashes.comments = hashCollection(state.comments); // hash'i eşitle, persist tekrar yazmaya çalışmasın
  // Firestore'dan gerçek silme (append-only persist silmeyi yapmaz)
  if (window.fb && window.fb.db) {
    window.fb.deleteDoc(window.fb.doc(window.fb.db, 'comments', String(commentId)))
      .catch(e => console.warn('[Firestore] yorum silinemedi:', e.code || e.message));
  }
  renderDetail();
  notify('Yorum silindi', 'success');
}

function actOnTask(taskId, action) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const inst = state.instances.find(i => i.id === task.instanceId);
  const def = getDef(inst.defId);
  const required = action === 'reject';
  openModal({
    title: (action === 'approve' ? 'Onayla' : 'Reddet') + ' — ' + def.name,
    body: `
      <div class="form-field">
        <label>Yorum / Gerekçe ${required ? '<span class="req">*</span>' : ''}</label>
        <textarea id="comment-input" placeholder="${required ? 'Reddetme nedenini yazın...' : 'İsteğe bağlı not...'}"></textarea>
        <div class="hint">${required ? 'Reddetmek için gerekçe girmelisiniz' : 'Boş bırakabilirsiniz'}</div>
      </div>
    `,
    foot: `
      <button class="ghost-btn" onclick="closeModal()">İptal</button>
      <button class="btn ${action === 'approve' ? 'approve' : 'reject'}" style="flex:0;padding:7px 14px;" onclick="confirmTaskAction('${taskId}','${action}')">
        ${action === 'approve' ? '✓ Onayla' : '✕ Reddet'}
      </button>
    `
  });
  setTimeout(() => document.getElementById('comment-input').focus(), 50);
}

function confirmTaskAction(taskId, action) {
  const c = document.getElementById('comment-input').value.trim();
  if (action === 'reject' && !c) { notify('Reddetmek için gerekçe girin', 'error'); return; }
  completeTask(taskId, action, c);
  closeModal();
  state.selected = null;
  renderAll();
  notify(`Görev ${action === 'approve' ? 'onaylandı' : 'reddedildi'}`, 'success');
}

// Reddedilmiş bir talebi yeniden açma (form önceden dolu gelir)
function reopenInstance(instanceId) {
  const inst = state.instances.find(i => i.id === instanceId);
  if (!inst) return;
  const def = getDef(inst.defId);
  if (!def) return;
  if (!def.active) {
    notify('Bu süreç şu an pasif, tekrar açılamaz', 'error');
    return;
  }
  // Yeni talep formunu önceki form değerleriyle aç
  openModal({
    title: def.icon + ' ' + def.name + ' — Tekrar Aç',
    body: `
      <div style="background:rgba(74,158,255,0.08);border:1px solid var(--accent);border-radius:4px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--text);">
        📋 Bilgiler eski talepten getirildi (${inst.id}). İstediğinizi değiştirebilirsiniz.
      </div>
      ${def.fields.map(f => {
        const oldVal = inst.form?.[f.id];
        return renderField(f, oldVal);
      }).join('')}
    `,
    foot: `
      <button class="ghost-btn" onclick="closeModal()">İptal</button>
      <button class="btn approve" style="flex:0;padding:7px 14px;" onclick="submitNewRequest('${def.id}')">Yeni Talebi Gönder</button>
    `
  });
}

// Bekleyen bir talebi geri çek (iptal et)
function withdrawInstance(instanceId) {
  const inst = state.instances.find(i => i.id === instanceId);
  if (!inst) return;
  if (inst.ownerId !== state.currentUser) {
    notify('Sadece kendi talebinizi geri çekebilirsiniz', 'error');
    return;
  }
  if (inst.status !== 'running') {
    notify('Sadece bekleyen talepler geri çekilebilir', 'error');
    return;
  }
  if (!confirm(`"${getDef(inst.defId)?.name}" (${inst.id}) talebini geri çekmek istediğinize emin misiniz?\n\nBu işlem geri alınamaz.`)) return;

  // Talep statüsünü "withdrawn" yapmak yerine "rejected" işaretle ve özel bir geçmiş kaydı ekle
  inst.status = 'rejected';
  inst.updatedAt = Date.now();
  // Açık görevleri kapat
  state.tasks.filter(t => t.instanceId === inst.id && t.status === 'open').forEach(t => {
    t.status = 'closed';
    t.action = 'withdraw';
    t.closedAt = Date.now();
    t.closedBy = state.currentUser;
  });
  recordHistory(inst.id, 'reject', `${getUser(state.currentUser).name} talebi geri çekti`);
  persist();
  state.selected = null;
  renderAll();
  notify('Talep geri çekildi', 'success');
}

function openNewRequest(defId) {
  const def = getDef(defId);
  openModal({
    title: def.icon + ' ' + def.name,
    body: `
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(def.description||'')}</div>
      ${def.fields.map(f => renderField(f)).join('')}
    `,
    foot: `
      <button class="ghost-btn" onclick="closeModal()">İptal</button>
      <button class="btn approve" style="flex:0;padding:7px 14px;" onclick="submitNewRequest('${defId}')">Gönder</button>
    `
  });
  const pp = document.getElementById('process-pick');
  if (pp) pp.classList.remove('open');
}

function renderField(f, oldVal) {
  const req = f.required ? '<span class="req">*</span>' : '';
  const valAttr = (oldVal !== undefined && oldVal !== null && oldVal !== '') ? ` value="${escapeAttr(String(oldVal))}"` : '';
  let input = '';
  if (f.type === 'text' || f.type === 'date' || f.type === 'number') {
    const minAttr = (f.type === 'number' && f.min !== undefined) ? ` min="${f.min}"` : '';
    input = `<input type="${f.type}" id="f-${f.id}" placeholder="${escapeHtml(f.placeholder||'')}"${minAttr}${valAttr}>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="f-${f.id}" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(oldVal || '')}</textarea>`;
  } else if (f.type === 'select') {
    const opts = (f.options||[]).map(o => `<option value="${escapeHtml(o.value)}" ${o.value === oldVal ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('');
    input = `<select id="f-${f.id}"><option value="">Seçin...</option>${opts}</select>`;
  }
  const hint = f.hint ? `<div class="field-hint">${escapeHtml(f.hint)}</div>` : '';
  return `<div class="form-field"><label>${escapeHtml(f.label)} ${req}</label>${input}${hint}</div>`;
}

function submitNewRequest(defId) {
  const def = getDef(defId);
  const data = {};
  for (const f of def.fields) {
    const el = document.getElementById('f-' + f.id);
    const v = el ? el.value.trim() : '';
    if (f.required && !v) { notify(`"${f.label}" zorunlu`, 'error'); el && el.focus(); return; }
    // Number alanlarında min kontrolü (ör. "kaç gün önce" negatif olamaz)
    if (f.type === 'number' && v !== '' && f.min !== undefined && parseFloat(v) < f.min) {
      notify(`"${f.label}" en az ${f.min} olmalı`, 'error'); el && el.focus(); return;
    }
    data[f.id] = v;
  }
  if (data.startDate && data.endDate && data.endDate < data.startDate) {
    notify('Bitiş tarihi başlangıçtan önce olamaz', 'error'); return;
  }
  try {
    startProcess(defId, state.currentUser, data);
  } catch(e) { notify(e.message, 'error'); return; }
  closeModal();
  state.workTab = 'mine';
  renderAll();
  notify('Talep oluşturuldu', 'success');
}

function toggleProcessPick() {
  document.getElementById('process-pick').classList.toggle('open');
}

// Modal tabanlı süreç seçici — mobil FAB için (drawer'a girmeden talep açma).
function openNewRequestPicker() {
  if (!hasPermission(state.currentUser, 'workflows_create')) {
    notify('Talep açma yetkiniz yok', 'error');
    return;
  }
  const activeDefs = state.definitions.filter(d => d.active);
  if (activeDefs.length === 0) {
    notify('Açık süreç bulunmuyor', 'error');
    return;
  }
  const list = activeDefs.map(d =>
    `<button class="picker-row" onclick="openNewRequest('${d.id}')">
       <span class="picker-icon">${d.icon || '📄'}</span>
       <span class="picker-name">${escapeHtml(d.name)}</span>
       <span class="picker-arrow">›</span>
     </button>`
  ).join('');
  openModal({
    title: '+ Yeni Talep Aç',
    body: `<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Hangi süreç için talep açmak istiyorsunuz?</div>
           <div class="picker-list">${list}</div>`,
    foot: `<button class="ghost-btn" onclick="closeModal()">İptal</button>`
  });
}

function renderAdminView(v) {
  const u = getUser(state.currentUser);
  const canProcesses = hasPermission(u, 'admin_processes_view');
  const canUsers = hasPermission(u, 'admin_users_view');
  const canRoles = hasPermission(u, 'admin_roles_view');

  // Aktif sekme yetkisiz ise ilk yetkili sekmeye geç
  if ((state.adminTab === 'processes' && !canProcesses) ||
      (state.adminTab === 'users' && !canUsers) ||
      (state.adminTab === 'roles' && !canRoles)) {
    if (canProcesses) state.adminTab = 'processes';
    else if (canUsers) state.adminTab = 'users';

  v.innerHTML = `
    <aside class="admin-nav">
      <div class="admin-nav-title">Yönetim</div>
      ${canProcesses ? `<button class="admin-nav-item ${state.adminTab === 'processes' ? 'active':''}" onclick="setAdminTab('processes')">📋 Süreçler</button>` : ''}
      ${canUsers ? `<button class="admin-nav-item ${state.adminTab === 'users' ? 'active':''}" onclick="setAdminTab('users')">👥 Kullanıcılar</button>` : ''}

function setAdminTab(id) {
  state.adminTab = id;
  state.designerProcessId = null;
  state.editingRoleId = null;
  // Sol menüdeki "active" durumunu güncellemek için tüm admin view'ı yeniden render et

  if (v) renderAdminView(v);
  else renderAdminContent();
}

function renderAdminContent() {
  const c = document.getElementById('admin-content');
  if (!c) return;
  if (state.adminTab === 'users') renderUsersAdmin(c);

}

function renderAbsencesList(userId) {
  const absences = state._editingAbsences || [];
  if (absences.length === 0) {
    return `<div style="font-size:12px;color:var(--text-mute);padding:12px;background:var(--panel-2);border-radius:4px;text-align:center;">
      Henüz tanımlı izin dönemi yok
    </div>`;
  }
  const others = state.users.filter(x => x.id !== userId);
  return absences.map((a, idx) => `
    <div style="background:var(--bg);border:1px solid var(--border-hi);border-radius:6px;padding:10px;margin-bottom:6px;">
      <div style="display:grid;grid-template-columns:1fr 1fr 26px;gap:8px;align-items:center;margin-bottom:6px;">
        <div>
          <div style="font-size:10px;color:var(--text-mute);margin-bottom:2px;">BAŞLANGIÇ</div>
          <input type="date" value="${a.from||''}" onchange="updateAbsence(${idx},'from',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:3px;font-size:12px;width:100%;">
        </div>
        <div>
          <div style="font-size:10px;color:var(--text-mute);margin-bottom:2px;">BİTİŞ</div>
          <input type="date" value="${a.to||''}" onchange="updateAbsence(${idx},'to',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:3px;font-size:12px;width:100%;">
        </div>
        <button class="icon-btn delete" onclick="removeAbsence(${idx})" type="button" style="margin-top:14px;">×</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px;">
        <div>
          <div style="font-size:10px;color:var(--text-mute);margin-bottom:2px;">VEKİL</div>
          <select onchange="updateAbsence(${idx},'delegateTo',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:3px;font-size:12px;width:100%;">
            <option value="">— Yok —</option>
            ${others.map(o => `<option value="${o.id}" ${a.delegateTo===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <div style="font-size:10px;color:var(--text-mute);margin-bottom:2px;">SEBEP</div>
          <input type="text" value="${escapeHtml(a.reason||'')}" placeholder="Yıllık izin, hastalık..." onchange="updateAbsence(${idx},'reason',this.value)" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:3px;font-size:12px;width:100%;">
        </div>
      </div>
      ${isAbsenceActive(a) ? '<div style="font-size:10px;color:var(--amber);margin-top:6px;">⚠ Şu anda aktif</div>' : ''}
    </div>
  `).join('');
}

function isAbsenceActive(a) {
  if (!a.from || !a.to) return false;
  const today = new Date().toISOString().slice(0,10);
  return a.from <= today && today <= a.to;
}

function addAbsence(userId) {
  if (!state._editingAbsences) state._editingAbsences = [];
  const today = new Date().toISOString().slice(0,10);
  state._editingAbsences.push({
    id: 'ab_' + Math.random().toString(36).substr(2, 5),
    from: today,
    to: today,
    delegateTo: null,
    reason: ''
  });
  document.getElementById('absences-list').innerHTML = renderAbsencesList(userId);
}

async function saveUser(originalId) {
  const isNew = !originalId;
  const id = document.getElementById('u-id').value.trim().toLowerCase();
  const name = document.getElementById('u-name').value.trim();
  const mgr = document.getElementById('u-mgr').value || null;
  const hire = document.getElementById('u-hire').value || null;
  // Dinamik: tüm rollerden işaretli olanları al
  const roles = (state.roles || []).filter(r => {
    const cb = document.getElementById('u-r-' + r.id);
    return cb && cb.checked;
  }).map(r => r.id);
  const absences = (state._editingAbsences || []).filter(a => a.from && a.to);

  if (!id) { notify('Kullanıcı adı gerekli', 'error'); return; }
  if (!/^[a-z0-9_]+$/.test(id)) { notify('Kullanıcı adı küçük harf, sayı veya _ olabilir', 'error'); return; }
  if (!name) { notify('Ad Soyad gerekli', 'error'); return; }
  if (roles.length === 0) { notify('En az bir rol seçin', 'error'); return; }
  if (isNew && state.users.find(u => u.id === id)) { notify('Bu kullanıcı adı zaten kullanımda', 'error'); return; }
  for (const a of absences) {
    if (a.to < a.from) { notify('Bir izin döneminde bitiş başlangıçtan önce', 'error'); return; }
  }

  const email = id + '@fabrika.com';

  if (isNew) {
    const password = document.getElementById('u-password').value.trim();
    if (!password || password.length < 6) { notify('Şifre en az 6 karakter olmalı', 'error'); return; }

    // Firebase Auth'a ekle
    notify('Kullanıcı oluşturuluyor...', 'info');
    try {
      // Mevcut admin'in oturumunu kaybetmemek için secondary app kullan
      // Basit yaklaşım: createUser çağrısı ana auth'ta çalışır, sonra mevcut admin'e geri dön
      const currentUserEmail = window.fb.auth.currentUser?.email;
      const currentUserPwd = prompt('Güvenlik gereği şu anki şifrenizi tekrar girin:\n(Yeni kullanıcı oluşturduktan sonra otomatik geri dönüş için)');
      if (!currentUserPwd) {
        notify('İşlem iptal edildi', 'error');
        return;
      }

      // Yeni kullanıcıyı oluştur
      const cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, password);
      const newUid = cred.user.uid;

      // Firestore'a profil yaz
      const profile = {
        username: id,
        name: name,
        email: email,
        roles: roles,
        manager: mgr,
        hireDate: hire,
        absences: absences
      };
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', newUid), profile);

      // Şimdi mevcut admin'e geri dön
      await window.fb.signOut(window.fb.auth);
      await window.fb.signInWithEmailAndPassword(window.fb.auth, currentUserEmail, currentUserPwd);

      // state.users'a ekle (auth listener tekrar yükleyecek ama hızlı olsun diye)
      state.users.push({
        id, firebaseUid: newUid, username: id, name, roles, manager: mgr, hireDate: hire, absences, email
      });

      state._editingAbsences = [];
      closeModal();
      renderAll();
      notify(`✓ Kullanıcı oluşturuldu: ${name} (${email} / ${password})`, 'success');
    } catch (e) {
      console.error('[saveUser] Hata:', e);
      if (e.code === 'auth/email-already-in-use') {
        notify(`Bu kullanıcı adı zaten Firebase'de var: ${email}`, 'error');
      } else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
        notify('Yanlış şifre - lütfen tekrar deneyin. Yeni kullanıcı oluşturuldu ama sizin oturumunuz kaybolmuş olabilir.', 'error');
      } else {
        notify('Hata: ' + (e.message || e.code), 'error');
      }
    }
    return;
  }

  // GÜNCELLEME (mevcut kullanıcı)
  const u = getUser(originalId);
  if (!u) { notify('Kullanıcı bulunamadı', 'error'); return; }

  u.name = name; u.roles = roles; u.manager = mgr; u.hireDate = hire; u.absences = absences;

  // Firestore'a yaz
  if (u.firebaseUid) {
    try {
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', u.firebaseUid), {
        username: u.id,
        name: u.name,
        email: u.email || u.id + '@fabrika.com',
        roles: u.roles,
        manager: u.manager,
        hireDate: u.hireDate,
        absences: u.absences
      });
    } catch (e) {
      console.error('[saveUser] Firestore yazma hatası:', e);
      notify('Firestore yazma hatası: ' + e.message, 'error');
      return;
    }
  }

  state._editingAbsences = [];
  closeModal();
  renderAll();
  notify('Kullanıcı güncellendi', 'success');
}

async function deleteUser(id) {
  if (id === state.currentUser) { notify('Aktif kullanıcıyı silemezsiniz', 'error'); return; }
  const u = getUser(id);
  if (!u) return;
  // Diğer kullanıcıların müdürü ise sil önce
  const dependents = state.users.filter(x => x.manager === id);
  let msg = `${u.name} silinsin mi?`;
  if (dependents.length) msg += `\n(${dependents.length} kullanıcının müdürü)`;
  msg += '\n\nNOT: Kullanıcı sistemden silinir ama Firebase Auth hesabı kalır (giriş yapamaz çünkü Firestore profili silinir).';
  if (!confirm(msg)) return;

  // Firestore'dan sil
  if (u.firebaseUid) {
    try {
      await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'users', u.firebaseUid));
    } catch (e) {
      console.error('[deleteUser] Firestore silme hatası:', e);
      notify('Firestore silinemedi: ' + e.message, 'error');
      return;
    }
  }

  // state'ten sil
  state.users = state.users.filter(x => x.id !== id);
  state.users.forEach(x => { if (x.manager === id) x.manager = null; });
  // Müdür kalmayanlar için Firestore'a yaz
  for (const x of state.users) {
    if (x.firebaseUid && x.manager === null) {
      try {
        await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', x.firebaseUid), {
          username: x.id, name: x.name, email: x.email || x.id+'@fabrika.com',
          roles: x.roles, manager: null, hireDate: x.hireDate, absences: x.absences || []
        });
      } catch(e) { console.error(e); }
    }
  }

  renderAll();
  notify('Kullanıcı silindi', 'success');
}

async function saveRole() {
  const r = state._editingRole;
  if (!r) return;
  const isNew = !state.roles.find(x => x.id === r.id) && r.id !== '';

  // ID kontrolü (yeni rol)
  if (isNew || r.id === '') {
    const idInput = document.getElementById('role-id');
    if (idInput) r.id = idInput.value.trim().toLowerCase();
    if (!r.id) { notify('Rol ID gerekli', 'error'); return; }
    if (!/^[a-z0-9_-]+$/.test(r.id)) { notify('ID küçük harf, sayı, tire (-) veya alt çizgi (_) içerebilir', 'error'); return; }
    if (state.roles.find(x => x.id === r.id)) { notify('Bu ID zaten kullanımda', 'error'); return; }
  }

  if (!r.name || !r.name.trim()) {
    const nameInput = document.getElementById('role-name');
    if (nameInput) r.name = nameInput.value.trim();
    if (!r.name) { notify('Rol adı gerekli', 'error'); return; }
  }

  // Temizle ve kaydet
  const toSave = {
    id: r.id,
    name: r.name,
    icon: r.icon || '🎭',
    color: r.color || '#666',
    description: r.description || '',
    isBuiltIn: r.isBuiltIn || false,
    permissions: r.permissions || {}
  };

  // State'ten ekle/güncelle
  const existing = state.roles.findIndex(x => x.id === toSave.id);
  if (existing >= 0) {
    state.roles[existing] = toSave;
  } else {
    state.roles.push(toSave);
  }

  // Firestore'a yaz
  try {
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'roles', toSave.id), sanitize(toSave));
    notify(isNew ? 'Rol oluşturuldu' : 'Rol güncellendi', 'success');
    state.editingRoleId = null;
    state._editingRole = null;
    renderAdminContent();
  } catch (e) {
    console.error('[saveRole]', e);
    notify('Kayıt başarısız: ' + e.message, 'error');
  }
}

async function deleteRole(roleId) {
  const r = state.roles.find(x => x.id === roleId);
  if (!r) return;
  if (r.isBuiltIn) { notify('Sistem rolleri silinemez', 'error'); return; }

  // Kullanan kullanıcı sayısı
  const usingUsers = (state.users || []).filter(u => (u.roles || []).includes(roleId));

  let msg = `"${r.name}" rolü silinsin mi?`;
  if (usingUsers.length > 0) {
    msg += `\n\n⚠️ Bu rol ${usingUsers.length} kullanıcıda var: ${usingUsers.map(u => u.name).join(', ')}.\nSilinirse bu kullanıcılardan rol kaldırılır.`;
  }
  if (!confirm(msg)) return;

  try {
    // Firestore'dan sil
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'roles', roleId));
    // State'ten sil
    state.roles = state.roles.filter(x => x.id !== roleId);
    // Kullanıcılardan kaldır + Firestore'a yaz
    for (const u of usingUsers) {
      u.roles = (u.roles || []).filter(rid => rid !== roleId);
      if (u.firebaseUid) {
        await window.fb.setDoc(window.fb.doc(window.fb.db, 'users', u.firebaseUid), {
          username: u.id, name: u.name, email: u.email || u.id+'@fabrika.com',
          roles: u.roles, manager: u.manager, hireDate: u.hireDate, absences: u.absences || []
        });
      }
    }
    state.editingRoleId = null;
    state._editingRole = null;
    renderAdminContent();
    notify('Rol silindi', 'success');
  } catch (e) {
    console.error('[deleteRole]', e);
    notify('Silme başarısız: ' + e.message, 'error');
  }
}

              ${canEdit ? `<button class="ghost-btn" onclick="toggleActive('${d.id}')">${d.active?'Pasifleştir':'Aktifleştir'}</button>` : ''}
              ${canEdit ? `<button class="ghost-btn" onclick="openDesigner('${d.id}')">Düzenle</button>` : `<button class="ghost-btn" onclick="openProcessViewer('${d.id}')">Görüntüle</button>`}
              ${canEdit ? `<button class="danger-btn" onclick="deleteProcess('${d.id}')">Sil</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;
}

function toggleActive(defId) {
  if (!hasPermission(state.currentUser, 'admin_processes_edit')) {
    notify('Süreç düzenleme yetkiniz yok', 'error');
    return;
  }
  const d = getDef(defId);
  d.active = !d.active;
  persist(); renderAdminContent();
  notify(d.active ? 'Süreç aktif edildi' : 'Süreç pasifleştirildi', 'success');
}

function deleteProcess(defId) {
  if (!hasPermission(state.currentUser, 'admin_processes_edit')) {
    notify('Süreç silme yetkiniz yok', 'error');
    return;
  }
  const usage = state.instances.filter(i => i.defId === defId).length;
  let msg = `${getDef(defId).name} silinsin mi?`;
  if (usage) msg += `\n${usage} mevcut talep var, onların da geçmişi kalmaya devam edecek ama süreç tanımı silinecek.`;
  if (!confirm(msg)) return;
  state.definitions = state.definitions.filter(d => d.id !== defId);
  persist(); renderAdminContent();
  notify('Süreç silindi', 'success');
}

                subject:'Araç muayenesi yaklaşıyor - {{form.plate}}',
                body:'{{form.plate}} muayene tarihi: {{form.inspectionDate}} (14 gün kaldı)' }
            ]}
          ]
        },
        { id:'notes', label:'Notlar', type:'textarea', required:false, placeholder:'Ek bilgi...' }
      ],
      startStep: 's_active',
      steps: [
        { id:'s_active', title:'Kayıt aktif - tarihler izleniyor', type:'human',
          assign:{ mode:'role', role:'admin' },
          slaHours: 0
        },
        { id:'s_archived', title:'Arşivlendi', type:'end-good', message:'Araç kaydı arşivlendi' }
      ],
      transitions: [
        { from:'s_active', when:'approve', to:'s_archived' },
        { from:'s_active', when:'reject', to:'s_archived' }
      ]
    }
  }
];

// Şablonları kategoriye göre gruplama
function getTemplatesByCategory() {
  const groups = {};
  PROCESS_TEMPLATES.forEach(t => {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });
  return groups;
}

function createNewProcess() {
  if (!hasPermission(state.currentUser, 'admin_processes_edit')) {
    notify('Süreç oluşturma yetkiniz yok', 'error');
    return;
  }
  // Eski davranış yerine şablon seçim modali aç
  openTemplatePicker();
}

  const body = `

    <!-- SİHİRBAZ KARTI - ÜSTTE ÖNE ÇIKARILMIŞ -->
    <div style="margin-bottom:20px;">
      <div onclick="startWizard()" style="background:linear-gradient(135deg,var(--accent-soft),rgba(74,158,255,0.15));border:1px solid var(--accent);border-radius:8px;padding:16px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='#6bb1ff';this.style.transform='translateY(-1px)';" onmouseout="this.style.borderColor='var(--accent)';this.style.transform='translateY(0)';">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="font-size:32px;">🪄</div>

            <div style="font-weight:600;font-size:15px;color:var(--accent);margin-bottom:2px;">Sihirbaz ile Kur</div>

          </div>
          <div style="font-size:18px;color:var(--accent);">→</div>
        </div>
      </div>
    </div>

    <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);">Hazır Şablonlar</div>

    ${Object.keys(groups).map(cat => `
      <div style="margin-bottom:18px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-mute);margin-bottom:8px;">${escapeHtml(cat)}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;">
          ${groups[cat].map(t => `
            <div onclick="useTemplate('${t.templateId}')" style="background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:12px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--panel-3)';" onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--panel-2)';">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                <div style="font-size:22px;">${t.icon}</div>
                <div style="font-weight:600;font-size:13px;">${escapeHtml(t.name)}</div>

              <div style="display:flex;gap:8px;margin-top:8px;font-size:10px;color:var(--text-mute);">

                <span class="badge-tag">${t.template.steps.filter(s=>s.type==='human').length} insan adımı</span>
