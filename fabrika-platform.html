// ============== TAKVİM VIEW ==============

function getActiveFilterTypes() {
  // Eğer kullanıcı bir kez bile değişiklik yaptıysa state.calFilterTypes Set olarak tutulur
  if (state.calFilterTypes instanceof Set) return state.calFilterTypes;
  // İlk kez ise default'lardan üret
  const s = new Set();
  Object.entries(EVENT_TYPES).forEach(([k, v]) => { if (v.defaultOn) s.add(k); });
  state.calFilterTypes = s;
  return s;
}

function toggleCalFilter(typeKey) {
  const types = getActiveFilterTypes();
  if (types.has(typeKey)) types.delete(typeKey);
  else types.add(typeKey);
  state.calFilterTypes = types;
  renderCalendarMain();
}

function setCalScope(scope) {
  state.calFilterScope = scope;
  renderCalendarMain();
}

function setCalView(view) {
  state.calView = view;
  renderCalendarMain();
}

function calNav(direction) {
  // direction: -1 (geri), 0 (bugün), 1 (ileri)
  const c = new Date(state.calCursor);
  if (direction === 0) {
    state.calCursor = Date.now();
  } else if (state.calView === 'month') {
    c.setMonth(c.getMonth() + direction);
    state.calCursor = c.getTime();
  } else if (state.calView === 'week') {
    c.setDate(c.getDate() + direction * 7);
    state.calCursor = c.getTime();
  } else if (state.calView === 'day') {
    c.setDate(c.getDate() + direction);
    state.calCursor = c.getTime();
  } else if (state.calView === 'agenda') {
    c.setDate(c.getDate() + direction * 14);
    state.calCursor = c.getTime();
  }
  renderCalendarMain();
}

function renderCalendarView(v) {
  v.innerHTML = `
    <aside class="sidebar" id="cal-sidebar"></aside>
    <main id="cal-main"></main>
  `;
  renderCalendarSidebar();
  renderCalendarMain();
}

function renderCalendarSidebar() {
  const c = document.getElementById('cal-sidebar');
  if (!c) return;
  const types = getActiveFilterTypes();
  const user = getUser(state.currentUser);
  // YETKİ BAZLI: hangi kapsamı görebileceğine bak
  const canViewSelf = hasPermission(user, 'calendar_view_self');
  const canViewTeam = hasPermission(user, 'calendar_view_team');
  const canViewAll = hasPermission(user, 'calendar_view_all');

  // Mevcut scope yetkisiz ise düzelt
  if (state.calFilterScope === 'all' && !canViewAll) {
    state.calFilterScope = canViewTeam ? 'team' : 'mine';
  }
  if (state.calFilterScope === 'team' && !canViewTeam) {
    state.calFilterScope = canViewAll ? 'all' : 'mine';
  }

  // Her tip için ne kadar olay var (geniş aralık - yıllık) — sayım
  // Performans için sadece görünür aralığın 2 katı kadar bakalım
  const cursor = new Date(state.calCursor);
  const rangeStart = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1).getTime();
  const rangeEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 2, 0, 23, 59, 59).getTime();
  const counts = {};
  Object.keys(EVENT_TYPES).forEach(k => {
    const sample = getCalendarEvents(rangeStart, rangeEnd, {
      types: new Set([k]),
      scope: state.calFilterScope
    });
    counts[k] = sample.length;
  });

  c.innerHTML = `
    <div class="cal-filters">
      <div class="cal-filter-group">
        <div class="cal-filter-title">Görünüm Kapsamı</div>
        ${canViewSelf ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'mine' ? 'checked':''} onchange="setCalScope('mine')">
          <span>Sadece benim</span>
        </label>` : ''}
        ${canViewTeam ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'team' ? 'checked':''} onchange="setCalScope('team')">
          <span>Ekibim</span>
        </label>` : ''}
        ${canViewAll ? `
        <label class="cal-filter-item">
          <input type="radio" name="cal-scope" ${state.calFilterScope === 'all' ? 'checked':''} onchange="setCalScope('all')">
          <span>Tüm şirket</span>
        </label>` : ''}
      </div>

      <div class="cal-filter-group">
        <div class="cal-filter-title">Olay Türleri</div>
        ${Object.entries(EVENT_TYPES).map(([key, meta]) => `
          <label class="cal-filter-item">
            <input type="checkbox" ${types.has(key) ? 'checked':''} onchange="toggleCalFilter('${key}')">
            <span class="cal-filter-color" style="background:${meta.color};"></span>
            <span>${meta.icon} ${meta.label}</span>
            <span class="cal-filter-count">${counts[key] || 0}</span>
          </label>
        `).join('')}
      </div>

      <div class="cal-filter-group">
        <div class="cal-filter-title">Hızlı İşlem</div>
        <button class="ghost-btn" onclick="calNav(0)" style="width:100%;">🎯 Bugüne git</button>
      </div>
    </div>
  `;
}

function renderCalendarMain() {
  const m = document.getElementById('cal-main');
  if (!m) return;
  const cursor = new Date(state.calCursor);
  const periodLabel = getCalendarPeriodLabel(cursor, state.calView);

  m.innerHTML = `
    <div class="cal-wrap">
      <div class="cal-head">
        <div class="cal-nav">
          <button onclick="calNav(-1)" title="Önceki">◀</button>
          <button onclick="calNav(0)" title="Bugün">⊙</button>
          <button onclick="calNav(1)" title="Sonraki">▶</button>
        </div>
        <div class="cal-period">${periodLabel}</div>

        <div class="cal-view-switch">
          ${['month','week','day','agenda'].map(v => `
            <button class="${state.calView === v ? 'active':''}" onclick="setCalView('${v}')">${
              v === 'month' ? 'Aylık' :
              v === 'week'  ? 'Haftalık' :
              v === 'day'   ? 'Günlük' : 'Ajanda'
            }</button>
          `).join('')}
        </div>
      </div>

      <div class="cal-body" id="cal-body">
        ${renderCalendarBody()}
      </div>
    </div>
  `;
  // Sidebar'daki sayıları da yenile
  renderCalendarSidebar();
}

function getCalendarPeriodLabel(cursor, view) {
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  if (view === 'month') {
    return `${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`;
  } else if (view === 'week') {
    const start = new Date(cursor);
    const day = start.getDay();
    const diff = day === 0 ? -6 : 1 - day; // Pazartesi başlasın
    start.setDate(start.getDate() + diff);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return `${start.getDate()} ${monthNames[start.getMonth()]} - ${end.getDate()} ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
  } else if (view === 'day') {
    const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    return `${days[cursor.getDay()]}, ${cursor.getDate()} ${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`;
  } else {
    return `Önümüzdeki 14 gün (${cursor.getDate()} ${monthNames[cursor.getMonth()]}'dan)`;
  }
}

function renderCalendarBody() {
  if (state.calView === 'month') return renderMonthView();
  if (state.calView === 'week') return renderWeekView();
  if (state.calView === 'day') return renderDayView();
  if (state.calView === 'agenda') return renderAgendaView();
  return '';
}

// AYLIK GÖRÜNÜM
function renderMonthView() {
  const cursor = new Date(state.calCursor);
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Pazartesi=0
  const gridStart = new Date(year, month, 1 - startDay);
  // 6 hafta = 42 hücre
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridStart.getDate() + 41);
  gridEnd.setHours(23,59,59);

  const events = getCalendarEvents(gridStart.getTime(), gridEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Olayları gün gün dağıt - aralıklı olaylar her güne basılır
  const dayMap = {}; // 'YYYY-MM-DD' -> [events]
  events.forEach(ev => {
    const start = new Date(ev.date);
    const end = ev.endDate ? new Date(ev.endDate) : start;
    // Her güne ekle
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while (cur <= endDay) {
      const key = formatDateKey(cur);
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  // Grid HTML
  const dayHeaders = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let html = '<div class="cal-month">';
  dayHeaders.forEach(d => html += `<div class="cal-month-header">${d}</div>`);

  const today = new Date();
  const todayKey = formatDateKey(today);

  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const isOtherMonth = cellDate.getMonth() !== month;
    const isToday = formatDateKey(cellDate) === todayKey;
    const key = formatDateKey(cellDate);
    const dayEvents = dayMap[key] || [];
    const shown = dayEvents.slice(0, 3);
    const moreCount = dayEvents.length - shown.length;

    html += `<div class="cal-month-cell ${isOtherMonth?'other-month':''} ${isToday?'today':''}" onclick="onCalDayClick('${cellDate.toISOString()}')">
      <div class="cal-day-num">${cellDate.getDate()}</div>
      ${shown.map(ev => `
        <div class="cal-event-chip" style="border-left-color:${ev.color};background:${ev.color}22;" onclick="event.stopPropagation();showCalEventDetail('${escapeAttr(ev.id)}')">
          ${ev.icon || ''} ${escapeHtml(ev.title)}
        </div>
      `).join('')}
      ${moreCount > 0 ? `<div class="cal-more-link" onclick="event.stopPropagation();onCalDayClick('${cellDate.toISOString()}')">+ ${moreCount} daha</div>` : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

// HAFTALIK GÖRÜNÜM
function renderWeekView() {
  const cursor = new Date(state.calCursor);
  const day = cursor.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const weekStart = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + diff);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  weekEnd.setHours(23,59,59);

  const events = getCalendarEvents(weekStart.getTime(), weekEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Günleri grupla
  const byDay = {};
  events.forEach(ev => {
    const start = new Date(ev.date);
    const end = ev.endDate ? new Date(ev.endDate) : start;
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while (cur <= endDay) {
      const key = formatDateKey(cur);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  const todayKey = formatDateKey(new Date());
  const dayNames = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];

  let html = '<div class="cal-week">';
  // Başlık satırı
  html += '<div class="cal-week-header"></div>';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const isToday = formatDateKey(d) === todayKey;
    html += `<div class="cal-week-header ${isToday?'today':''}">${dayNames[i]}<br>${d.getDate()}.${d.getMonth()+1}</div>`;
  }
  // Tek satır: tüm günün olayları
  html += '<div class="cal-week-hour" style="background:var(--panel-2);">Tüm gün</div>';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const key = formatDateKey(d);
    const dayEvents = byDay[key] || [];
    html += `<div class="cal-week-cell" onclick="onCalDayClick('${d.toISOString()}')">
      ${dayEvents.map(ev => `
        <div class="cal-event-chip" style="border-left-color:${ev.color};background:${ev.color}22;font-size:11px;margin:2px 0;" onclick="event.stopPropagation();showCalEventDetail('${escapeAttr(ev.id)}')">
          ${ev.icon || ''} ${escapeHtml(ev.title)}
        </div>
      `).join('')}
    </div>`;
  }
  html += '</div>';
  return html;
}

// GÜNLÜK GÖRÜNÜM
function renderDayView() {
  const cursor = new Date(state.calCursor);
  const dayStart = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  const dayEnd = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), 23,59,59);

  const events = getCalendarEvents(dayStart.getTime(), dayEnd.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Tüm gün olayları + aralık olayları (bu gün içine girenler)
  const allEvents = events.slice();
  state.users.forEach(u => {
    if (!getActiveFilterTypes().has('absence')) return;
    (u.absences || []).forEach(a => {
      if (!a.from || !a.to) return;
      const f = new Date(a.from).getTime();
      const t = new Date(a.to).getTime();
      if (f <= dayEnd.getTime() && t >= dayStart.getTime()) {
        // events listesinde zaten olabilir, filtreliyoruz
        if (!allEvents.find(e => e.id === `abs_${u.id}_${a.id || a.from}`)) {
          // (Aslında getCalendarEvents zaten ekliyor olmalı, bu sigorta)
        }
      }
    });
  });

  events.sort((a,b) => a.date - b.date);

  if (events.length === 0) {
    return '<div class="cal-day-list"><div class="empty"><div class="empty-icon">📅</div><div>Bu günde olay yok</div></div></div>';
  }

  return '<div class="cal-day-list">' + events.map(ev => {
    const timeLabel = ev.allDay ? 'Tüm gün' : new Date(ev.date).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="cal-day-event" style="border-left:3px solid ${ev.color};" onclick="showCalEventDetail('${escapeAttr(ev.id)}')">
        <div class="cal-day-event-icon">${ev.icon || '•'}</div>
        <div style="flex:1;">
          <div class="cal-day-event-title">${escapeHtml(ev.title)}</div>
          ${ev.subtitle ? `<div class="cal-day-event-subtitle">${escapeHtml(ev.subtitle)}</div>` : ''}
        </div>
        <div class="cal-day-event-time">${timeLabel}</div>
      </div>
    `;
  }).join('') + '</div>';
}

// AJANDA GÖRÜNÜMÜ
function renderAgendaView() {
  const start = new Date(state.calCursor);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 14);
  end.setHours(23,59,59);

  const events = getCalendarEvents(start.getTime(), end.getTime(), {
    types: getActiveFilterTypes(),
    scope: state.calFilterScope
  });

  // Gün gün grupla
  const byDay = {};
  events.forEach(ev => {
    const d = new Date(ev.date);
    const key = formatDateKey(d);
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(ev);
  });

  const todayKey = formatDateKey(new Date());
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const dayNames = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];

  let html = '<div class="cal-agenda">';
  for (let i = 0; i < 14; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = formatDateKey(d);
    const dayEvents = byDay[key] || [];
    if (dayEvents.length === 0) continue;
    const isToday = key === todayKey;
    html += `<div class="cal-agenda-day">
      <div class="cal-agenda-day-head ${isToday?'today':''}">
        <span>${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]}${isToday ? ' (Bugün)' : ''}</span>
        <span style="font-weight:400;color:var(--text-mute);">${dayEvents.length} olay</span>
      </div>
      ${dayEvents.map(ev => `
        <div class="cal-agenda-event" style="border-left:3px solid ${ev.color};" onclick="showCalEventDetail('${escapeAttr(ev.id)}')">
          <div style="font-size:16px;">${ev.icon || '•'}</div>
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:500;">${escapeHtml(ev.title)}</div>
            ${ev.subtitle ? `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${escapeHtml(ev.subtitle)}</div>` : ''}
          </div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text-mute);">${ev.allDay ? 'Tüm gün' : new Date(ev.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      `).join('')}
    </div>`;
  }
  html += '</div>';
  if (Object.keys(byDay).length === 0) {
    html = '<div class="empty" style="padding:40px;"><div class="empty-icon">📅</div><div>Önümüzdeki 14 günde olay yok</div></div>';
  }
  return html;
}

// Olay detayını modal'da göster
function showCalEventDetail(eventId) {
  // Olayı bul - tarihten geri arama yapamayacağımız için tüm geniş aralıkta ara
  const rangeStart = Date.now() - 365 * 24 * 3600000;
  const rangeEnd = Date.now() + 365 * 24 * 3600000;
  const all = getCalendarEvents(rangeStart, rangeEnd, {
    types: new Set(Object.keys(EVENT_TYPES)),
    scope: 'all'
  });
  const ev = all.find(e => e.id === eventId);
  if (!ev) { notify('Olay bulunamadı', 'error'); return; }

  const user = ev.userId ? getUser(ev.userId) : null;
  const dateStr = new Date(ev.date).toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const endStr = ev.endDate ? new Date(ev.endDate).toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : null;

  let extraDetail = '';
  if (ev.extra?.reason) extraDetail += `<div class="kv"><span class="k">Sebep</span><span class="v">${escapeHtml(ev.extra.reason)}</span></div>`;
  if (ev.extra?.delegate) extraDetail += `<div class="kv"><span class="k">Vekil</span><span class="v">${escapeHtml(ev.extra.delegate)}</span></div>`;
  if (ev.extra?.qty) extraDetail += `<div class="kv"><span class="k">Miktar</span><span class="v">${escapeHtml(String(ev.extra.qty))}</span></div>`;
  if (ev.extra?.status) extraDetail += `<div class="kv"><span class="k">Durum</span><span class="v">${escapeHtml(ev.extra.status)}</span></div>`;

  let actionBtn = '';
  if (ev.instanceId) {
    actionBtn = `<button class="primary-btn" onclick="closeModal();state.currentTop='work';state.selected={type:'instance',id:'${ev.instanceId}'};state.workTab='all';renderAll();">İlgili talebi aç →</button>`;
  }

  openModal({
    title: `${ev.icon || '📅'} ${ev.title}`,
    body: `
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">
        ${escapeHtml(EVENT_TYPES[ev.type]?.label || ev.type)}
      </div>
      <div class="detail-section">
        <div class="kv"><span class="k">Tarih</span><span class="v">${dateStr}</span></div>
        ${endStr ? `<div class="kv"><span class="k">Bitiş</span><span class="v">${endStr}</span></div>` : ''}
        ${user ? `<div class="kv"><span class="k">Kullanıcı</span><span class="v">${escapeHtml(user.name)}</span></div>` : ''}
        ${ev.subtitle ? `<div class="kv"><span class="k">Detay</span><span class="v">${escapeHtml(ev.subtitle)}</span></div>` : ''}
        ${extraDetail}
      </div>
    `,
    foot: `
      <button class="ghost-btn" onclick="closeModal()">Kapat</button>
      ${actionBtn}
    `
  });
}

// Yardımcı: YYYY-MM-DD anahtarı üret
function formatDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeAttr(s) {
  return String(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

const REPORT_RANGES = {
  '7d':   { label:'Son 7 gün',   days: 7 },
  '30d':  { label:'Son 30 gün',  days: 30 },
  '90d':  { label:'Son 90 gün',  days: 90 },
  '365d': { label:'Son 1 yıl',   days: 365 },
  'all':  { label:'Tümü',        days: null }
};

function getReportRangeMs() {
  const r = REPORT_RANGES[state.reportRange] || REPORT_RANGES['30d'];
  if (r.days === null) return { start: 0, end: Date.now(), label: r.label };
  return { start: Date.now() - r.days * 24 * 3600 * 1000, end: Date.now(), label: r.label };
}

}

function renderNotificationsView(v) {

  let allNotifs = (state.notifications || []).filter(n => n.userId === me);

          <button class="danger-btn" onclick="clearReadNotifications()">Okunmuşları sil</button>
        </div>
      </div>

      <div class="notif-page-filters">
        <button class="filter-chip ${filter==='all'?'active':''}" onclick="setNotifFilter('all')">Tümü <span class="count">${allNotifs.length}</span></button>
        <button class="filter-chip ${filter==='unread'?'active':''}" onclick="setNotifFilter('unread')">Okunmamış <span class="count">${unreadCount}</span></button>
        <button class="filter-chip ${filter==='read'?'active':''}" onclick="setNotifFilter('read')">Okunmuş <span class="count">${allNotifs.length - unreadCount}</span></button>

      <div class="notif-page-list">
        ${filtered.length === 0 ? `<div class="empty"><div class="empty-icon">🔔</div><div>${filter === 'unread' ? 'Okunmamış bildirim yok' : filter === 'read' ? 'Okunmuş bildirim yok' : 'Henüz bildiriminiz yok'}</div></div>` :

            <div class="notif-page-item-dot ${n.read ? 'read' : 'unread'}"></div>
            <div class="notif-page-item-body">

              <div class="notif-page-item-time">${formatAge(n.ts || 0)}${n.instanceId ? ` · <span class="notif-page-item-link">${n.instanceId}</span>` : ''}</div>
            </div>
            ${!n.read ? '<button class="notif-page-item-mark" onclick="event.stopPropagation();markNotifRead(\'' + n.id + '\');renderAll();">Okundu</button>' : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function markNotifRead(notifId) {
  const n = state.notifications.find(x => x.id === notifId);
  if (n) { n.read = true; persist(); }
}

function handleNotifClick(notifId, instanceId) {
  markNotifRead(notifId);
  if (instanceId) {
    state.currentTop = 'work';
    state.selected = { type: 'instance', id: instanceId };
    renderAll();
  } else {
    renderAll();
  }
}

function clearReadNotifications() {
  if (!confirm('Okunmuş bildirimler silinsin mi?')) return;
  const me = state.currentUser;
  state.notifications = state.notifications.filter(n => n.userId !== me || !n.read);
  persist();
  renderAll();
  notify('Okunmuş bildirimler silindi', 'success');
}

async function changePassword() {
  const cur = document.getElementById('cp-current').value;
  const newp = document.getElementById('cp-new').value;
  const new2 = document.getElementById('cp-new2').value;

  if (!cur || !newp || !new2) { notify('Tüm alanları doldurun', 'error'); return; }
  if (newp.length < 6) { notify('Yeni şifre en az 6 karakter olmalı', 'error'); return; }
  if (newp !== new2) { notify('Yeni şifreler aynı değil', 'error'); return; }

  const user = window.fb.auth.currentUser;
  if (!user) { notify('Oturum yok', 'error'); return; }

  try {
    // Önce mevcut şifreyle yeniden giriş yap (reauthenticate gerekiyor)
    await window.fb.signInWithEmailAndPassword(window.fb.auth, user.email, cur);

    // Şifre güncelle - Firebase SDK üzerinden
    // updatePassword fonksiyonu gerekli ama ESM'e eklemedik, dinamik import:
    const { updatePassword } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    await updatePassword(window.fb.auth.currentUser, newp);

    closeModal();
    notify('✓ Şifre değiştirildi', 'success');
  } catch (e) {
    console.error('[changePassword]', e);
    if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
      notify('Mevcut şifre hatalı', 'error');
    } else {
      notify('Hata: ' + (e.message || e.code), 'error');
    }
  }
}

// === GENEL BAKIŞ ===
function renderReportOverview(range) {
  // Talepler (instances) - bu aralıkta oluşturulanlar
  const inRange = state.instances.filter(i => i.createdAt >= range.start && i.createdAt <= range.end);
  const total = inRange.length;
  const completed = inRange.filter(i => i.status !== 'running').length;
  const approved = inRange.filter(i => i.status === 'completed').length;
  const rejected = inRange.filter(i => i.status === 'rejected').length;
  const running  = inRange.filter(i => i.status === 'running').length;

  // Görevler - bu aralıkta oluşturulanlar
  const tasksInRange = state.tasks.filter(t => t.createdAt >= range.start && t.createdAt <= range.end);
  const totalTasks = tasksInRange.length;
  const openTasks  = state.tasks.filter(t => t.status === 'open').length; // O an açık (her zamandan)

  // SLA performansı: bu aralıkta kapatılan görevler
  const closedTasks = state.tasks.filter(t => t.status === 'closed' && t.closedAt && t.closedAt >= range.start && t.closedAt <= range.end);
  let onTimeCount = 0, lateCount = 0, noSlaCount = 0;
  closedTasks.forEach(t => {
    const inst = state.instances.find(i => i.id === t.instanceId);
    if (!inst) return;
    const def = getDef(inst.defId);
    const step = def?.steps.find(s => s.id === t.stepKey);
    if (step?.slaHours && step.slaHours > 0) {
      const elapsedMs = (t.closedAt - t.createdAt);
      if (elapsedMs <= step.slaHours * 3600000) onTimeCount++;
      else lateCount++;
    } else {
      noSlaCount++;
    }
  });
  const slaTotal = onTimeCount + lateCount;
  const slaPct = slaTotal > 0 ? Math.round((onTimeCount / slaTotal) * 100) : null;

  // Süresi geçen açık görev sayısı
  const overdueCount = state.tasks.filter(t => {
    if (t.status !== 'open') return false;
    const inst = state.instances.find(i => i.id === t.instanceId);
    if (!inst) return false;
    const def = getDef(inst.defId);
    const step = def?.steps.find(s => s.id === t.stepKey);
    const sla = computeSlaStatus(t, step);
    return sla.state === 'overdue';
  }).length;

  // Üretim
  const totalOrders = (state.orders || []).length;
  const ordersInProgress = (state.orders || []).filter(o => o.status === 'in_progress').length;

  // Aktif kullanıcı: hiç talep açmış veya görev almış kullanıcılar
  const activeUserIds = new Set();
  state.instances.forEach(i => activeUserIds.add(i.ownerId));
  state.tasks.forEach(t => activeUserIds.add(t.assignee));
  const activeUsers = activeUserIds.size;

  // Ortalama tamamlanma süresi (saat)
  const doneInst = inRange.filter(i => i.status !== 'running');
  let avgHours = null;
  if (doneInst.length > 0) {
    const sum = doneInst.reduce((acc, i) => acc + (i.updatedAt - i.createdAt), 0);
    avgHours = Math.round((sum / doneInst.length) / 3600000);
  }

  return `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-card-label">Açılan talep</div>
        <div class="stat-card-value">${total}</div>
        <div class="stat-card-trend neutral">${range.label}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Tamamlanan</div>
        <div class="stat-card-value">${completed}</div>
        <div class="stat-card-trend ${completed > 0 ? 'up':'neutral'}">${total > 0 ? Math.round((completed/total)*100)+'%' : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Onaylanan</div>
        <div class="stat-card-value" style="color:var(--green);">${approved}</div>
        <div class="stat-card-trend up">${completed > 0 ? Math.round((approved/completed)*100)+'% onay':'—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Reddedilen</div>
        <div class="stat-card-value" style="color:var(--red);">${rejected}</div>
        <div class="stat-card-trend down">${completed > 0 ? Math.round((rejected/completed)*100)+'% red':'—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Halen Beklemede</div>
        <div class="stat-card-value" style="color:var(--amber);">${running}</div>
        <div class="stat-card-trend neutral">${openTasks} açık görev</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Ortalama Süre</div>
        <div class="stat-card-value">${avgHours !== null ? formatDuration(avgHours * 3600000) : '—'}</div>
        <div class="stat-card-trend neutral">tamamlanan talep</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">SLA Performansı</div>
        <div class="stat-card-value" style="color:${slaPct === null ? 'var(--text-mute)' : slaPct >= 80 ? 'var(--green)' : slaPct >= 50 ? 'var(--amber)' : 'var(--red)'};">${slaPct !== null ? slaPct + '%' : '—'}</div>
        <div class="stat-card-trend ${slaPct >= 80 ? 'up' : slaPct >= 50 ? 'neutral' : 'down'}">${onTimeCount}/${slaTotal} zamanında</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Süresi Geçen</div>
        <div class="stat-card-value" style="color:${overdueCount > 0 ? 'var(--red)' : 'var(--text)'};">${overdueCount}</div>
        <div class="stat-card-trend ${overdueCount > 0 ? 'down':'neutral'}">açık görev</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Üretim Siparişi</div>
        <div class="stat-card-value">${totalOrders}</div>
        <div class="stat-card-trend neutral">${ordersInProgress} devam ediyor</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Aktif Kullanıcı</div>
        <div class="stat-card-value">${activeUsers}</div>
        <div class="stat-card-trend neutral">/ ${state.users.length} toplam</div>
      </div>
    </div>

    <div class="rep-grid-2">
      <div class="rep-block">
        <div class="rep-block-title">
          Onay / Red Dağılımı
          <span class="rep-block-title-extra">${completed} tamamlanan talep</span>
        </div>
        ${renderDonutChart([
          { label: 'Onaylandı', value: approved, color: '#4ade80' },
          { label: 'Reddedildi', value: rejected, color: '#f87171' }
        ])}
      </div>

      <div class="rep-block">
        <div class="rep-block-title">
          Günlük Aktivite
          <span class="rep-block-title-extra">son ${REPORT_RANGES[state.reportRange].days || 'tüm'} gün</span>
        </div>
        ${renderDailyActivityChart(range, inRange)}
      </div>
    </div>
  `;
}

// === SÜREÇ RAPORU ===
function renderReportProcesses(range) {
  const inRange = state.instances.filter(i => i.createdAt >= range.start && i.createdAt <= range.end);

  // Süreç bazlı istatistikler
  const byDef = {};
  inRange.forEach(inst => {
    const def = getDef(inst.defId);
    if (!def) return;
    if (!byDef[inst.defId]) {
      byDef[inst.defId] = {
        def, total: 0, approved: 0, rejected: 0, running: 0,
        sumTimeMs: 0, doneCount: 0
      };
    }
    const b = byDef[inst.defId];
    b.total++;
    if (inst.status === 'completed') { b.approved++; b.sumTimeMs += inst.updatedAt - inst.createdAt; b.doneCount++; }
    else if (inst.status === 'rejected') { b.rejected++; b.sumTimeMs += inst.updatedAt - inst.createdAt; b.doneCount++; }
    else b.running++;
  });

  const procs = Object.values(byDef).sort((a, b) => b.total - a.total);

  if (procs.length === 0) {
    return '<div class="empty" style="padding:40px;"><div class="empty-icon">📊</div><div>Bu aralıkta süreç verisi yok</div></div>';
  }

  return `
    <div class="rep-block">
      <div class="rep-block-title">Süreç Bazlı Performans</div>
      <div class="table-wrap"><table class="rep-table">
        <thead><tr>
          <th>Süreç</th>
          <th class="num">Toplam</th>
          <th class="num">Onay</th>
          <th class="num">Red</th>
          <th class="num">Bekliyor</th>
          <th class="num">Onay Oranı</th>
          <th class="num">Ortalama Süre</th>
        </tr></thead>
        <tbody>
          ${procs.map(p => {
            const approvalRate = (p.approved + p.rejected) > 0 ? Math.round((p.approved / (p.approved + p.rejected)) * 100) : null;
            const avgMs = p.doneCount > 0 ? p.sumTimeMs / p.doneCount : 0;
            return `<tr>
              <td><span style="font-size:14px;">${p.def.icon || '📄'}</span> ${escapeHtml(p.def.name)}</td>
              <td class="num">${p.total}</td>
              <td class="num" style="color:var(--green);">${p.approved}</td>
              <td class="num" style="color:var(--red);">${p.rejected}</td>
              <td class="num" style="color:var(--amber);">${p.running}</td>
              <td class="num">${approvalRate !== null ? approvalRate + '%' : '—'}
                ${approvalRate !== null ? `<div class="progress-bar"><div style="width:${approvalRate}%;background:${approvalRate >= 70 ? 'var(--green)' : approvalRate >= 40 ? 'var(--amber)' : 'var(--red)'};"></div></div>` : ''}
              </td>
              <td class="num">${avgMs > 0 ? formatDuration(avgMs) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="rep-block">
      <div class="rep-block-title">Süreçlere Göre Dağılım</div>
      ${renderBarChart(procs.slice(0, 10).map(p => ({
        label: (p.def.icon || '') + ' ' + p.def.name,
        value: p.total,
        color: '#4a9eff'
      })))}
    </div>
  `;
}

function renderReportUsers(range) {
  const userStats = {};
  state.users.forEach(u => {
    userStats[u.id] = {
      user: u, opened: 0, approved: 0, rejected: 0,
      tasksAssigned: 0, tasksClosed: 0, sumResponseMs: 0, closedWithResponse: 0
    };
  });

  state.instances.forEach(inst => {
    if (inst.createdAt < range.start || inst.createdAt > range.end) return;
    if (userStats[inst.ownerId]) userStats[inst.ownerId].opened++;
  });

  state.tasks.forEach(t => {
    if (!userStats[t.assignee]) return;
    if (t.createdAt < range.start || t.createdAt > range.end) return;
    userStats[t.assignee].tasksAssigned++;
    if (t.status === 'closed') {
      userStats[t.assignee].tasksClosed++;
      if (t.decision === 'approve' || t.action === 'approve') userStats[t.assignee].approved++;
      else if (t.decision === 'reject' || t.action === 'reject') userStats[t.assignee].rejected++;
      if (t.closedAt) {
        userStats[t.assignee].sumResponseMs += (t.closedAt - t.createdAt);
        userStats[t.assignee].closedWithResponse++;
      }
    }
  });

  const users = Object.values(userStats)
    .filter(s => s.opened > 0 || s.tasksAssigned > 0)
    .sort((a, b) => (b.opened + b.tasksAssigned) - (a.opened + a.tasksAssigned));

  if (users.length === 0) {
    return '<div class="empty" style="padding:40px;"><div class="empty-icon">👥</div><div>Bu aralıkta kullanıcı aktivitesi yok</div></div>';
  }

  return `
    <div class="rep-block">
      <div class="rep-block-title">Kullanıcı Aktivitesi</div>
      <div class="table-wrap"><table class="rep-table">
        <thead><tr>
          <th>Kullanıcı</th>
          <th class="num">Açılan Talep</th>
          <th class="num">Atanan Görev</th>
          <th class="num">Onayladığı</th>
          <th class="num">Reddettiği</th>
          <th class="num">Ortalama Yanıt</th>
        </tr></thead>
        <tbody>
          ${users.map(s => {
            const avg = s.closedWithResponse > 0 ? s.sumResponseMs / s.closedWithResponse : 0;
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  <div class="avatar" style="width:24px;height:24px;font-size:10px;">${s.user.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
                  <span>${escapeHtml(s.user.name)}</span>
                </div>
              </td>
              <td class="num">${s.opened}</td>
              <td class="num">${s.tasksAssigned}</td>
              <td class="num" style="color:var(--green);">${s.approved}</td>
              <td class="num" style="color:var(--red);">${s.rejected}</td>
              <td class="num">${avg > 0 ? formatDuration(avg) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="rep-grid-2">
      <div class="rep-block">
        <div class="rep-block-title">En Aktif Kullanıcılar (talep açan)</div>
        ${renderBarChart(users.slice(0, 5).filter(s => s.opened > 0).map(s => ({
          label: s.user.name, value: s.opened, color: '#a78bfa'
        })))}
      </div>

        <div class="rep-block-title">En Çok Onay Veren</div>

// === SVG GRAFİKLER ===

function renderDonutChart(data) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    return '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Veri yok</div>';
  }
  const cx = 120, cy = 120, r = 80, innerR = 50;
  let currentAngle = -Math.PI / 2; // 12 saat yönünden başla
  const paths = data.map((d, i) => {
    if (d.value === 0) return null;
    const angle = (d.value / total) * Math.PI * 2;
    const endAngle = currentAngle + angle;
    const x1 = cx + r * Math.cos(currentAngle);
    const y1 = cy + r * Math.sin(currentAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const xi1 = cx + innerR * Math.cos(endAngle);
    const yi1 = cy + innerR * Math.sin(endAngle);
    const xi2 = cx + innerR * Math.cos(currentAngle);
    const yi2 = cy + innerR * Math.sin(currentAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${xi1} ${yi1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${xi2} ${yi2} Z`;
    currentAngle = endAngle;
    return `<path d="${path}" fill="${d.color}" stroke="var(--bg)" stroke-width="2"><title>${escapeHtml(d.label)}: ${d.value} (${Math.round(d.value/total*100)}%)</title></path>`;
  }).filter(Boolean).join('');

  return `
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;">
      <svg class="rep-chart" viewBox="0 0 240 240" style="max-width:240px;flex:0 0 auto;">
        ${paths}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700" font-family="var(--mono)">${total}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--text-mute)" font-size="10" letter-spacing="1.5">TOPLAM</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${data.map(d => `
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
            <div style="width:12px;height:12px;border-radius:2px;background:${d.color};"></div>
            <span style="color:var(--text);">${escapeHtml(d.label)}</span>
            <span style="font-family:var(--mono);color:var(--text-dim);margin-left:8px;">${d.value} (${total > 0 ? Math.round(d.value/total*100) : 0}%)</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderBarChart(data) {
  if (!data || data.length === 0) {
    return '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:12px;">Veri yok</div>';
  }
  const maxValue = Math.max(...data.map(d => d.value), 1);
  const barHeight = 24, gap = 8;
  const width = 600;
  const labelWidth = 180;
  const valueWidth = 50;
  const chartWidth = width - labelWidth - valueWidth - 16;
  const height = data.length * (barHeight + gap);

  return `
    <svg class="rep-chart" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
      ${data.map((d, i) => {
        const y = i * (barHeight + gap);
        const barLen = (d.value / maxValue) * chartWidth;
        return `
          <text x="0" y="${y + barHeight/2 + 4}" fill="var(--text)" font-size="12" font-family="var(--sans)">${escapeHtml(String(d.label).length > 22 ? String(d.label).slice(0,22)+'…' : d.label)}</text>
          <rect x="${labelWidth}" y="${y}" width="${chartWidth}" height="${barHeight}" fill="var(--panel-2)" rx="3"></rect>
          <rect x="${labelWidth}" y="${y}" width="${barLen}" height="${barHeight}" fill="${d.color}" rx="3"></rect>
          <text x="${width - 4}" y="${y + barHeight/2 + 4}" text-anchor="end" fill="var(--text)" font-size="12" font-weight="600" font-family="var(--mono)">${d.value}</text>
        `;
      }).join('')}
    </svg>
  `;
}

function renderDailyActivityChart(range, instances) {
  // range.days null ise tüm zamana yay, değilse o kadar gün
  const days = REPORT_RANGES[state.reportRange].days || 30; // 'all' için 30 gün varsayalım son zamandan
  const dayBuckets = [];
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    d.setHours(0,0,0,0);
    const startMs = d.getTime();
    const endMs = startMs + 24 * 3600000;
    const count = instances.filter(inst => inst.createdAt >= startMs && inst.createdAt < endMs).length;
    dayBuckets.push({ date: d, count });
  }
  const maxCount = Math.max(...dayBuckets.map(b => b.count), 1);

  // SVG çizgi grafik
  const width = 600, height = 180;
  const padLeft = 30, padBottom = 30, padTop = 10, padRight = 10;
  const chartW = width - padLeft - padRight;
  const chartH = height - padTop - padBottom;
  const stepX = chartW / Math.max(1, dayBuckets.length - 1);
  const points = dayBuckets.map((b, i) => {
    const x = padLeft + i * stepX;
    const y = padTop + chartH - (b.count / maxCount) * chartH;
    return { x, y, count: b.count, date: b.date };
  });

  const pathD = 'M ' + points.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${padTop + chartH} L ${padLeft} ${padTop + chartH} Z`;

  // Y ekseni etiketleri (0, max/2, max)
  const yLabels = [0, Math.ceil(maxCount/2), maxCount];

  // X ekseni: her 5'te bir göster (yoğunluğa göre)
  const xLabelStep = Math.max(1, Math.floor(dayBuckets.length / 7));

  return `
    <svg class="rep-chart" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
      <!-- Grid çizgileri -->
      ${yLabels.map(v => {
        const y = padTop + chartH - (v / maxCount) * chartH;
        return `
          <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,2"></line>
          <text x="${padLeft - 4}" y="${y + 3}" text-anchor="end" fill="var(--text-mute)" font-size="9" font-family="var(--mono)">${v}</text>
        `;
      }).join('')}

      <!-- Alan -->
      <path d="${areaD}" fill="var(--accent)" fill-opacity="0.15"></path>
      <!-- Çizgi -->
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
      <!-- Noktalar -->
      ${points.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--accent)">
          <title>${p.date.toLocaleDateString('tr-TR')}: ${p.count} talep</title>
        </circle>
      `).join('')}

      <!-- X ekseni etiketleri -->
      ${points.map((p, i) => {
        if (i % xLabelStep !== 0 && i !== points.length - 1) return '';
        return `<text x="${p.x.toFixed(1)}" y="${height - padBottom + 14}" text-anchor="middle" fill="var(--text-mute)" font-size="9" font-family="var(--mono)">${p.date.getDate()}.${p.date.getMonth()+1}</text>`;
      }).join('')}
    </svg>
  `;
}

        <div class="kpi-label">Ortalama İlerleme</div>
        <div class="kpi-value">${avgProgress}%</div>
        <div class="kpi-sub">tüm siparişler</div>
      </div>
      <div class="kpi-box">
        <div class="kpi-label">Dar Boğaz</div>
        <div class="kpi-value" style="font-size:14px;">${escapeHtml(bottleneck)}</div>
        <div class="kpi-sub">en yoğun istasyon</div>
      </div>
    </div>

    <div class="stations-grid">
      ${STATIONS.map(st => renderStationBox(st, selectedOrder)).join('')}
    </div>
  `;
}

function renderStationBox(st, selectedOrder) {
  const ordersHere = getOrdersAtStation(st.id);
  const isSelectedHere = selectedOrder && selectedOrder.currentStation === st.id;
  const hasWork = ordersHere.length > 0;
  const cls = ['station-box'];
  if (isSelectedHere) cls.push('highlighted');
  if (hasWork) cls.push('has-work');
  const operators = getStationOperators(st.id).map(id => getUser(id)?.name.split(' ')[0]).filter(Boolean).join(', ');
  const chips = ordersHere.map(o => {
    const isCur = selectedOrder && o.id === selectedOrder.id;
    return `<span class="station-chip ${isCur?'current':''}" onclick="event.stopPropagation();state.selectedOrderId='${o.id}';renderAll();">${o.id.split('-').pop()}</span>`;
  }).join('');
  return `
    <div class="${cls.join(' ')}" onclick="selectStation(${st.id})">
      <div class="station-num">İSTASYON ${st.id}</div>
      <div class="station-name">${escapeHtml(st.name)}</div>
      <div class="station-count ${ordersHere.length === 0 ? 'zero' : ''}">${ordersHere.length}</div>
      <div class="station-sub">bekleyen iş</div>
      ${operators ? `<div style="font-size:10px;color:var(--text-mute);margin-top:6px;">👤 ${escapeHtml(operators)}</div>` : ''}
      <div class="station-chips">${chips}</div>
    </div>
  `;
}

function renderAllOrders(c) {
  const allOrders = state.orders.slice();
  const totalCount = allOrders.length;

  // Filtreler uygula
  let orders = allOrders.slice();
  if (state.filterOrderStatus === 'active') {
    orders = orders.filter(o => o.status === 'in_progress' || o.status === 'pending');
  } else if (state.filterOrderStatus === 'completed') {
    orders = orders.filter(o => o.status === 'completed');
  } else if (state.filterOrderStatus === 'pending') {
    orders = orders.filter(o => o.status === 'pending');
  }
  if (state.filterOrderStation) {
    orders = orders.filter(o => String(o.currentStation) === String(state.filterOrderStation));
  }
  orders.sort((a,b) => b.createdAt - a.createdAt);

  const isFiltered = state.filterOrderStatus !== 'active' || state.filterOrderStation !== '';

  const filterBarHtml = `
    <div class="filter-bar">
      <span class="filter-label">Durum:</span>
      <span class="filter-chip ${state.filterOrderStatus === 'active' ? 'active':''}" onclick="setOrderFilter('status','active')">🔄 Devam edenler</span>
      <span class="filter-chip ${state.filterOrderStatus === 'pending' ? 'active':''}" onclick="setOrderFilter('status','pending')">⏳ Bekleyenler</span>
      <span class="filter-chip ${state.filterOrderStatus === 'completed' ? 'active':''}" onclick="setOrderFilter('status','completed')">✓ Tamamlananlar</span>
      <span class="filter-chip ${state.filterOrderStatus === 'all' ? 'active':''}" onclick="setOrderFilter('status','all')">Hepsi</span>

      <span class="filter-label" style="margin-left:10px;">İstasyon:</span>
      <select onchange="setOrderFilter('station', this.value)">
        <option value="">Hepsi</option>
        ${STATIONS.map(s => `<option value="${s.id}" ${String(state.filterOrderStation) === String(s.id) ? 'selected':''}>${s.id}. ${escapeHtml(s.name)}</option>`).join('')}
      </select>

      ${isFiltered ? `<span class="filter-clear" onclick="clearOrderFilters()">✕ Temizle</span>` : ''}
      <span class="filter-result-count">${orders.length} / ${totalCount} sipariş</span>
    </div>
  `;

  c.innerHTML = `
    <div class="main-head">
      <h1>📋 Tüm Siparişler</h1>
    </div>
    ${filterBarHtml}
    ${orders.length === 0 ? '<div class="empty"><div class="empty-icon">∅</div><div>Bu filtrelerde sipariş yok</div></div>' : ''}
    <div>
      ${orders.map(o => renderOrderCard(o)).join('')}
    </div>
  `;
}

function setOrderFilter(key, val) {
  if (key === 'status') state.filterOrderStatus = val;
  else if (key === 'station') state.filterOrderStation = val;
  renderProdMain();
}

function clearOrderFilters() {
  state.filterOrderStatus = 'active';
  state.filterOrderStation = '';
  renderProdMain();
}

function renderOrderCard(o) {
  const isSel = state.selectedOrderId === o.id;
  const isDone = o.status === 'completed';
  const cls = ['order-card'];
  if (isSel) cls.push('selected');
  if (isDone) cls.push('done');
  const stepPills = STATIONS.map((st, idx) => {
    let pc = 'step-pill';
    if (isDone || o.currentStation > st.id) pc += ' done';
    else if (o.currentStation === st.id) pc += ' active';
    return `<div class="${pc}" title="${escapeHtml(st.name)}"></div>`;
  }).join('');
  const currentStep = isDone ? '✓ Sevk edildi' :
    `Şu an: ${escapeHtml(getStation(o.currentStation)?.name || '—')}`;
  const statusCls = isDone ? 'done' : '';
  return `
    <div class="${cls.join(' ')}" onclick="selectOrder('${o.id}')">
      <div class="order-id-row">
        <span class="order-id">${o.id}</span>
        <span class="order-qty">${o.qty.toLocaleString('tr-TR')} adet</span>
      </div>
      <div class="order-product">${escapeHtml(o.product)}</div>
      <div class="order-progress">${stepPills}</div>
      <div class="order-step-name ${statusCls}">${currentStep}</div>
    </div>
  `;
}

function renderMyStation(c) {
  const myStations = getMyStations(state.currentUser);
  if (myStations.length === 0) {
    c.innerHTML = `<div class="main-head"><h1>🛠️ İstasyonum</h1></div>
      <div class="empty"><div class="empty-icon">🛠️</div><div>Henüz bir istasyona atanmadın. Yönetici istasyon ataması yapabilir.</div></div>`;
    return;
  }

  c.innerHTML = `
    <div class="main-head">
      <h1>🛠️ İstasyonum</h1>
      <div style="font-size:12px;color:var(--text-dim);">${myStations.length} istasyon sorumlusu</div>
    </div>

function renderMyStationBox(st) {

  return `
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;">

function renderStationTask(o) {
  const task = o.currentTask;
  const isMine = task?.startedBy === state.currentUser;
  const cls = ['station-task'];
  if (isMine) cls.push('task-mine');
  let actionBtns = '';
  if (!task || task.status !== 'started') {
    actionBtns = `<button class="start" onclick="event.stopPropagation();startWorkOnOrder('${o.id}')">▶ Başla</button>`;
  } else if (isMine) {
    const elapsed = Math.floor((Date.now() - task.startedAt) / 60000);
    actionBtns = `
      <span style="font-size:11px;color:var(--amber);margin-right:8px;">⏱ ${elapsed}dk</span>
      <button onclick="event.stopPropagation();finishWorkOnOrder('${o.id}')">✓ Bittiği</button>
    `;
  } else {
    actionBtns = `<span style="font-size:11px;color:var(--text-mute);">${escapeHtml(getUser(task.startedBy)?.name || '?')} çalışıyor</span>`;
  }
  return `
    <div class="${cls.join(' ')}" onclick="selectOrder('${o.id}')">
      <div>
        <div style="font-weight:500;">${o.id} <span style="color:var(--text-mute);font-size:11px;">· ${o.qty} adet</span></div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${escapeHtml(o.product)}</div>
      </div>
      <div>${actionBtns}</div>
    </div>
  `;
}

  // Sipariş seçili ise onu göster, değil ise istasyon detayı
  if (state.selectedOrderId) {

  if (state.selectedStationIdx) {
    return renderStationDetail(c);
  }
  c.innerHTML = `<div class="empty"><div class="empty-icon">→</div><div>Detay için sipariş veya istasyon seçin</div></div>`;
}

function renderOrderDetail(c) {
  const o = state.orders.find(x => x.id === state.selectedOrderId);
  if (!o) { c.innerHTML = `<div class="empty"><div class="empty-icon">∅</div><div>Bulunamadı</div></div>`; return; }

  const logs = state.productionLog.filter(l => l.orderId === o.id).sort((a,b) => a.at - b.at);
  const isDone = o.status === 'completed';
  const curStation = getStation(o.currentStation);
  const canOperate = !isDone && curStation && isUserOperatorOf(curStation.id, state.currentUser);
  const isStarted = o.currentTask?.status === 'started';
  const isMine = o.currentTask?.startedBy === state.currentUser;

  let actionBar = '';
  if (canOperate) {
    if (!isStarted) {
      actionBar = `
        <div class="action-bar">
          <button class="ghost-btn" style="flex:0;padding:9px 14px;" onclick="rewindOrder('${o.id}')">↶ Geri</button>
          <button class="btn approve" onclick="startWorkOnOrder('${o.id}')">▶ Başla</button>
        </div>`;
    } else if (isMine) {
      const elapsed = Math.floor((Date.now() - o.currentTask.startedAt) / 60000);
      actionBar = `
        <div class="action-bar">
          <button class="ghost-btn" style="flex:0;padding:9px 14px;" onclick="rewindOrder('${o.id}')">↶ Geri</button>
          <button class="btn approve" onclick="finishWorkOnOrder('${o.id}')">✓ Bittiği (${elapsed}dk)</button>
        </div>`;
    }
  }

  c.innerHTML = `
    <div class="detail-head">
      <div class="detail-title">🏭 ${o.id}</div>
      <div class="detail-sub">
        <span class="status-pill ${isDone?'status-completed':'status-running'}">${isDone?'SEVK EDİLDİ':'ÜRETİMDE'}</span>
        ${isStarted ? `<span class="status-pill status-pending" style="margin-left:6px;">ÇALIŞMA AKTİF</span>`:''}
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <h4>Sipariş Bilgileri</h4>
        <div class="kv"><span class="k">Ürün</span><span class="v" style="text-align:right;">${escapeHtml(o.product)}</span></div>
        <div class="kv"><span class="k">Adet</span><span class="v">${o.qty.toLocaleString('tr-TR')}</span></div>
        <div class="kv"><span class="k">Açılış</span><span class="v">${formatDate(o.createdAt)}</span></div>
        ${isDone ? `<div class="kv"><span class="k">Sevk</span><span class="v">${formatDate(o.completedAt)}</span></div>` : `
          <div class="kv"><span class="k">Şu an</span><span class="v" style="color:var(--accent);">${escapeHtml(curStation?.name || '—')}</span></div>
        `}
      </div>
      <div class="detail-section">
        <h4>İlerleme</h4>
        <div class="order-progress" style="margin-bottom:12px;">
          ${STATIONS.map(st => {
            let pc = 'step-pill';
            if (isDone || o.currentStation > st.id) pc += ' done';
            else if (o.currentStation === st.id) pc += ' active';
            return `<div class="${pc}" title="${escapeHtml(st.name)}"></div>`;
          }).join('')}
        </div>
        ${STATIONS.map(st => {
          const passed = isDone || o.currentStation > st.id;
          const current = o.currentStation === st.id && !isDone;
          const color = passed ? 'var(--green)' : current ? 'var(--amber)' : 'var(--text-mute)';
          const icon = passed ? '✓' : current ? '●' : '○';
          return `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
            <span style="color:${color}">${icon} ${escapeHtml(st.name)}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="detail-section">
        <h4>Üretim Geçmişi</h4>
        ${logs.length === 0 ? '<div style="font-size:12px;color:var(--text-mute);padding:8px 0;">Henüz işlem yok</div>' :
        '<div class="history">' + logs.map(l => {
          const station = getStation(l.stationId);
          const user = getUser(l.by);
          const eventLabel = l.event === 'started' ? `${station?.name} - başladı` :
                             l.event === 'finished' ? `${station?.name} - tamamlandı` :
                             l.event === 'rewind' ? `${station?.name} - geri alındı` : l.event;
          const typeCls = l.event === 'finished' ? 'approve' : l.event === 'rewind' ? 'reject' : 'system';
          let duration = '';
          if (l.event === 'finished' && l.startedAt) {
            const mins = Math.floor((l.at - l.startedAt) / 60000);
            duration = ` (${mins}dk)`;
          }
          return `<div class="history-item ${typeCls}">
            <div class="history-time">${formatDate(l.at)}</div>
            <div class="history-text">${escapeHtml(eventLabel)}${duration} <span style="color:var(--text-mute)">— ${escapeHtml(user?.name || l.by)}</span></div>
          </div>`;
        }).join('') + '</div>'}
      </div>
      ${!canOperate && !isDone ? `<div style="font-size:11px;color:var(--text-mute);padding:8px;background:var(--panel-2);border-radius:4px;text-align:center;">Bu istasyonun operatörü değilsin. ${curStation?.name} operatörleri: ${getStationOperators(o.currentStation).map(id => getUser(id)?.name).join(', ') || 'atanmamış'}</div>` : ''}
    </div>
    ${actionBar}
  `;
}

function onGlobalSearch(query) {
  const results = document.getElementById('search-results');
  if (!results) return;
  const q = (query || '').trim().toLowerCase();
  if (q.length < 2) {
    results.style.display = 'none';
    results.innerHTML = '';
    return;
  }

  const matches = [];
  // 1. Talepler: ID, owner adı, form içeriği
  for (const inst of state.instances) {
    if (matches.length >= 20) break;
    const def = getDef(inst.defId);
    if (!def) continue;
    const owner = getUser(inst.ownerId);
    const ownerName = (owner?.name || '').toLowerCase();
    const formStr = Object.values(inst.form || {}).map(v => String(v || '')).join(' ').toLowerCase();
    if (inst.id.toLowerCase().includes(q) ||
        ownerName.includes(q) ||
        def.name.toLowerCase().includes(q) ||
        formStr.includes(q)) {
      matches.push({
        type: 'instance', inst, def, owner,
        title: `${def.icon || '📄'} ${def.name}`,
        sub: `${inst.id} • ${owner?.name || '?'} • ${
          inst.status === 'completed' ? 'Onaylandı' :
          inst.status === 'rejected'  ? 'Reddedildi' : 'Bekliyor'
        }`
      });
    }
  }
  // 2. Kullanıcılar
  for (const u of state.users) {
    if (matches.length >= 25) break;
    if (u.name.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)) {
      matches.push({
        type: 'user', user: u,
        title: `👤 ${u.name}`,
        sub: `${u.roles.join(' · ')} • ${u.id}`
      });
    }
  }
  // 3. Süreç tanımları (admin için yararlı)
  for (const d of state.definitions) {
    if (matches.length >= 30) break;
    if (d.name.toLowerCase().includes(q)) {
      matches.push({
        type: 'def', def: d,
        title: `${d.icon || '📄'} ${d.name}`,
        sub: `Süreç tanımı • ${d.active ? 'Aktif' : 'Pasif'}`
      });
    }
  }
  // 4. Üretim siparişleri
  for (const o of (state.orders || [])) {
    if (matches.length >= 35) break;
    if (o.id.toLowerCase().includes(q) ||
        (o.product || '').toLowerCase().includes(q)) {
      matches.push({
        type: 'order', order: o,
        title: `🏭 ${o.id}`,
        sub: `${o.product || '?'} • ${o.qty || 0} adet • ${o.status}`
      });
    }
  }

  if (matches.length === 0) {
    results.innerHTML = `<div class="search-result-empty">"${escapeHtml(query)}" için sonuç yok</div>`;
  } else {
    results.innerHTML = matches.slice(0, 12).map((m, idx) => `
      <div class="search-result-item" onclick="onSearchResultClick(${idx})" data-idx="${idx}">
        <div class="search-result-info">
          <div class="search-result-title">${escapeHtml(m.title)}</div>
          <div class="search-result-sub">${escapeHtml(m.sub)}</div>
        </div>
      </div>
    `).join('');
    // Geçici matches ref
    state._searchResults = matches;
  }
  results.style.display = 'block';
}

function onSearchResultClick(idx) {
  const m = state._searchResults?.[idx];
  if (!m) return;
  document.getElementById('global-search').value = '';
  document.getElementById('search-results').style.display = 'none';
  state._searchResults = null;

  if (m.type === 'instance') {
    state.currentTop = 'work';
    state.workTab = 'all';
    state.selected = { type: 'instance', id: m.inst.id };
    renderAll();
  } else if (m.type === 'user') {
    // Admin ise yönetim → kullanıcılar; değilse rol değiştirme
    const cu = getUser(state.currentUser);
    if (cu?.roles.includes('admin')) {
      state.currentTop = 'admin';
      state.adminTab = 'users';
      renderAll();
      // Düzenle paneli açmak istersen şu satırı aç:
      // setTimeout(() => openUserEditor(m.user.id), 100);
    } else {
      // Aktif kullanıcı olarak geç (rol değiştir)
      switchUser(m.user.id);
    }
  } else if (m.type === 'def') {
    state.currentTop = 'admin';
    state.adminTab = 'processes';
    state.designerProcessId = m.def.id;
    renderAll();
  } else if (m.type === 'order') {
    state.currentTop = 'production';
    state.prodTab = 'orders';
    state.selectedOrderId = m.order.id;
    renderAll();
  }
}

// Sayfa herhangi bir yerine tıklandığında search sonuçlarını kapat
document.addEventListener('click', (e) => {
  const hs = document.querySelector('.header-search');
  if (hs && !hs.contains(e.target)) {
    const results = document.getElementById('search-results');
    if (results) results.style.display = 'none';
  }
});

function renderAll() {
  renderHeader();
  renderTopTabs();
  renderView();
  // Mobil: view her render edildiğinde sidebar kapansın
  closeMobileSidebar();
}

// ============== MOBIL SIDEBAR ==============
function toggleMobileSidebar() {
  // Aktif modüle göre doğru sidebar'ı bul
  let sb = null;
  if (state.currentTop === 'work') sb = document.querySelector('.view-work .sidebar');
  else if (state.currentTop === 'calendar') sb = document.getElementById('cal-sidebar');
  else if (state.currentTop === 'production') sb = document.querySelector('.prod-sidebar');
  else if (state.currentTop === 'admin') sb = document.querySelector('.admin-sidebar');

  const overlay = document.getElementById('sidebar-overlay');
  if (!sb) return;

  const isOpen = sb.classList.contains('open');
  if (isOpen) {
    sb.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    sb.classList.add('open');
    overlay.classList.add('open');
  }
}

function closeMobileSidebar() {
  document.querySelectorAll('.sidebar, #cal-sidebar, .prod-sidebar, .admin-sidebar').forEach(sb => {
    sb.classList.remove('open');
  });
  const overlay = document.getElementById('sidebar-overlay');
  if (overlay) overlay.classList.remove('open');
}

// Mobil detay paneli açma (talep seçildiğinde)
function openMobileDetail() {
  const detail = document.querySelector('.view-work .detail');
  if (detail) detail.classList.add('open');
}
function closeMobileDetail() {
  const detail = document.querySelector('.view-work .detail');
  if (detail) detail.classList.remove('open');
}

// Sipariş seçimi - mobilde üretim detay panelini de açar
function selectOrder(orderId) {
  state.selectedOrderId = orderId;
  state.selectedStationIdx = null;
  renderAll();
  if (window.innerWidth <= 1024) {
    const detail = document.querySelector('.prod-detail');
    if (detail) detail.classList.add('open');
  }
}

// İstasyon seçimi - mobilde üretim detay panelini de açar
function selectStation(idx) {
  state.selectedStationIdx = idx;
  state.selectedOrderId = null;
  renderAll();
  if (window.innerWidth <= 1024) {
    const detail = document.querySelector('.prod-detail');
    if (detail) detail.classList.add('open');
  }
}

function closeMobileProdDetail() {
  const detail = document.querySelector('.prod-detail');
  if (detail) detail.classList.remove('open');
}

// Detay panel mobilde kapatma butonu için event
document.addEventListener('click', (e) => {
  // İş Akışları detay paneli
  const workDetail = e.target.closest('.view-work .detail');
  if (workDetail && window.innerWidth <= 768) {
    const rect = workDetail.getBoundingClientRect();
    if (e.clientY - rect.top < 44) {
      closeMobileDetail();
      e.stopPropagation();
    }
  }
  // Üretim detay paneli
  const prodDetail = e.target.closest('.prod-detail');
  if (prodDetail && window.innerWidth <= 768) {
    const rect = prodDetail.getBoundingClientRect();
    if (e.clientY - rect.top < 44) {
      closeMobileProdDetail();
      e.stopPropagation();
    }
  }
});

// ============== YARDIMCI ==============

function formatAge(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'şimdi';
  if (m < 60) return m + 'dk önce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'sa önce';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'g önce';
  return new Date(ts).toLocaleDateString('tr-TR');
}
function formatDate(ts) {
  return new Date(ts).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function notify(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2500);
  setTimeout(() => t.remove(), 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// SLA sayaçları canlı kalsın - dakikada bir görev/talep listesi yenilensin
// Aynı zamanda hatırlatma taraması da yapılsın
setInterval(() => {
  // Modal açık mı?
  const modalOpen = document.getElementById('modal')?.classList.contains('show');
  // Tasarımcıda mı?
  const inDesigner = state.designerProcessId !== null;
  // Bir input/textarea'da odak var mı?
  const tag = document.activeElement?.tagName;
  const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (modalOpen || inDesigner || isTyping) return;

  // Hatırlatma taraması (yeni tetiklenen varsa fired > 0)
  const fired = scanAndFireReminders();

  // Aktif view'a göre yenile
  if (state.currentTop === 'work') {
    renderWorkMain();
    const sidebar = document.querySelector('.sidebar');
    if (sidebar) sidebar.innerHTML = renderSidebarHTML();
    if (fired > 0) {
      renderHeader();
    }
  } else if (state.currentTop === 'calendar') {
    renderCalendarMain();
    if (fired > 0) renderHeader();
  }
}, 60000);
