<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kusursuz Türkçe Okunuş Çevirici</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            font-weight: bold;
        }
        input[type="text"]:focus {
            border-color: #2ecc71;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            width: 90%;
        }
        button:hover {
            background-color: #27ae60;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            font-weight: 600;
            color: #e67e22;
            font-size: 14px;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            text-align: center;
        }
        .result-title {
            font-size: 12px;
            color: #95a5a6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-text {
            font-size: 28px;
            color: #27ae60;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gelişmiş Okunuş Çevirici</h2>
    <p>Mikrofon sesi yakaladığı an, algılanan İngilizce kelime gelişmiş fonetik motoruyla Türkçe okunuşa çevrilir.</p>
    
    <div class="input-group">
        <input type="text" id="wordInput" value="egyptian" placeholder="İngilizce bir kelime girin...">
    </div>
    
    <button id="startButton">3 Kez Çal ve Yakala</button>

    <div id="status" class="status">Başlatılmaya hazır...</div>

    <div class="result-box">
        <div class="result-title">TÜRKÇE OKUNUŞU:</div>
        <div id="resultText" class="result-text">-</div>
    </div>
</div>

<script>
    const startButton = document.getElementById('startButton');
    const wordInput = document.getElementById('wordInput');
    const statusDiv = document.getElementById('status');
    const resultTextDiv = document.getElementById('resultText');

    // Gelişmiş İngilizce -> Türkçe Fonetik Heceleyici Algoritması
    function convertToTurkishPhonetics(text) {
        let word = text.toLowerCase().trim();

        // Eğer tarayıcı birden fazla kelime döndürdüyse (örn: "egyptian egyptian"), ilkini al
        word = word.split(/[\s,]+/)[0];

        // İleri seviye İngilizce harf kombinasyonlarının okunuş kuralları dizisi
        const rules = [
            // Özel Kurallar ve İstisnalar
            { regex: /egyptian/g, replace: "ecipşın" },
            { regex: /circumstances/g, replace: "sörkumstensıs" },
            { regex: /scholarship/g, replace: "skolırşip" },
            { regex: /apple/g, replace: "epıl" },
            
            // Genel Hece Kuralları
            { regex: /tia([aeiou])/g, replace: "ş" },
            { regex: /tian/g, replace: "şın" },
            { regex: /tion/g, replace: "şın" },
            { regex: /sian/g, replace: "şın" },
            { regex: /cian/g, replace: "şın" },
            { regex: /sh/g, replace: "ş" },
            { regex: /ch/g, replace: "ç" },
            { regex: /oo/g, replace: "u" },
            { regex: /ee/g, replace: "i" },
            { regex: /ea/g, replace: "i" },
            { regex: /ph/g, replace: "f" },
            { regex: /wh/g, replace: "v" },
            { regex: /kn/g, replace: "n" },
            { regex: /wr/g, replace: "r" },
            { regex: /gh(?=[aeiou])/g, replace: "g" },
            { regex: /ght/g, replace: "t" },
            
            // C ve G Harf Değişimleri (İnce ve Kalın Ünleme Göre)
            { regex: /c(?=[eiyöü])/g, replace: "s" },
            { regex: /c/g, replace: "k" },
            { regex: /g(?=[eiyöü])/g, replace: "c" }, // Örn: Egyptian'daki g -> c oluyor
            
            // Özel Harfler
            { regex: /w/g, replace: "v" },
            { regex: /x/g, replace: "ks" },
            { regex: /q/g, replace: "k" },
            { regex: /j/g, replace: "c" },
            
            // Son ekler ve ses uyumları
            { regex: /ir(?=[bcdfghjklmnpqrstvwxyz])/g, replace: "ör" }, 
            { regex: /ur(?=[bcdfghjklmnpqrstvwxyz])/g, replace: "ör" }, 
            { regex: /er(?=[bcdfghjklmnpqrstvwxyz\b])/g, replace: "ır" }, 
            { regex: /y\b/g, replace: "i" },
            { regex: /e\b/g, replace: "" } // Kelime sonundaki sessiz e'ler
        ];

        // Kuralları sırayla işle
        rules.forEach(rule => {
            word = word.replace(rule.regex, rule.replace);
        });

        return word;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    
    recognition.lang = 'en-US'; 
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = true; 

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function speakWord(text) {
        return new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.volume = 1.0;
            utterance.rate = 0.8; 
            utterance.onend = () => resolve();
            window.speechSynthesis.speak(utterance);
        });
    }

    let isListening = false;

    startButton.addEventListener('click', async () => {
        const textToSpeak = wordInput.value.trim();
        if (!textToSpeak) {
            alert("Lütfen bir kelime girin.");
            return;
        }

        startButton.disabled = true;
        resultTextDiv.innerText = "-";
        statusDiv.innerText = "Mikrofon açılıyor...";

        try {
            await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            
            if (!isListening) {
                recognition.start();
                isListening = true;
            } else {
                triggerPlayback();
            }
        } catch (err) {
            if (!isListening) {
                recognition.start();
                isListening = true;
            } else {
                triggerPlayback();
            }
        }
    });

    recognition.onstart = () => {
        triggerPlayback();
    };

    async function triggerPlayback() {
        const word = wordInput.value.trim();
        
        statusDiv.innerText = "🔊 1. Seslendirme...";
        await speakWord(word);
        await sleep(1800); 
        
        statusDiv.innerText = "🔊 2. Seslendirme...";
        await speakWord(word);
        await sleep(1800);
        
        statusDiv.innerText = "🔊 3. Seslendirme...";
        await speakWord(word);
        
        statusDiv.innerText = "⏱️ Ses başarıyla gönderildi, işleniyor...";
    }

    recognition.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        const heardText = event.results[lastResultIndex][0].transcript;
        console.log("Mikrofonun yakalayıp tarayıcının düzelttiği İngilizce kelime:", heardText);

        if (heardText) {
            // Tarayıcının bize verdiği kelimeyi (örn: egyptian) alıp doğrudan fonetiğe döküyoruz
            const finalResult = convertToTurkishPhonetics(heardText);
            
            resultTextDiv.innerText = finalResult;
            statusDiv.innerText = "✅ Başarıyla Türkçe okunuşa dönüştürüldü!";
            startButton.disabled = false;
            
            recognition.stop();
            isListening = false;
        }
    };

    recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
            statusDiv.innerText = "Hata: " + event.error;
            startButton.disabled = false;
            isListening = false;
        }
    };

    recognition.onend = () => {
        isListening = false;
        startButton.disabled = false;
    };
</script>

</body>
</html>
